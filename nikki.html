  body{background:var(--ai-fuka);color:var(--sumi);font-family:var(--mincho);-webkit-font-smoothing:antialiased}
  .desk{
    position:fixed;inset:0;display:flex;flex-direction:column;
    background:radial-gradient(120% 90% at 70% 0%, #1D3448 0%, var(--ai) 45%, var(--ai-fuka) 100%);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .noise::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }

  /* ── 見出し ── */
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 16px 10px;position:relative;z-index:3}
  .title{font-size:14px;letter-spacing:.42em;color:#D8D2BE;margin:0;font-weight:400;text-indent:.42em}
  .bar .grow{flex:1}
  .btn{font-family:var(--gothic);font-size:12px;letter-spacing:.12em;color:#CFC8B4;background:transparent;
       border:1px solid rgba(207,200,180,.35);border-radius:2px;padding:6px 11px;cursor:pointer;
       white-space:nowrap;flex:0 0 auto}
  .btn:hover{background:rgba(207,200,180,.12)}
  .btn:focus-visible{outline:2px solid var(--kishi);outline-offset:2px}
  label.btn{display:inline-block;line-height:1.25}
  .state{font-family:var(--gothic);font-size:11px;color:rgba(207,200,180,.6);letter-spacing:.1em;min-width:5em;text-align:right}

  /* ── 料紙 ── */
  .sheet{
    flex:1 1 auto;position:relative;margin:0 12px 12px;display:flex;
    background:linear-gradient(180deg,#EEEADE,var(--kishi));
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 30px rgba(0,0,0,.35);
    overflow:hidden;
  }
  /* 中央の綴じ（画面の広いときだけ） */
  @media (min-width:900px){
    .sheet::before,.sheet::after{content:"";position:absolute;top:0;bottom:0;pointer-events:none;z-index:3}
    .sheet::before{
      left:50%;width:64px;transform:translateX(-50%);
      background:linear-gradient(90deg,
        rgba(62,43,32,0) 0%,
        rgba(62,43,32,.035) 30%,
        rgba(62,43,32,.05) 47%,
        rgba(62,43,32,.07) 50%,
        rgba(62,43,32,.035) 53%,
        rgba(255,255,255,.22) 56%,
        rgba(62,43,32,.02) 72%,
        rgba(62,43,32,0) 100%);
    }
    .sheet::after{
      left:50%;width:1px;transform:translateX(-50%);
      background:rgba(62,43,32,.10);
    }
  }
  @media (min-width:900px){
    .sheet{margin:0 40px 16px}
  }
  @media (min-width:1400px){
    .sheet{margin:0 76px 18px}
  }
  /* 右の余白帯：朱印と柱 */
  .band{
    flex:0 0 68px;order:2;border-left:1px solid var(--rule);
    background:linear-gradient(90deg,rgba(0,0,0,.03),transparent);
    display:flex;flex-direction:column;align-items:center;
    padding:20px 0 14px;gap:10px;
  }
  .seal{
    width:56px;height:56px;border:2px solid var(--shu);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--shu);
    opacity:.85;transform:rotate(-4deg);flex:0 0 auto;
  }
  .seal span{writing-mode:vertical-rl;font-size:12px;line-height:1.32;letter-spacing:.04em;text-align:center}
  .tcy{text-combine-upright:all;-webkit-text-combine:horizontal;letter-spacing:0}
  .upr{text-orientation:upright;letter-spacing:.06em}
  .seal.stamp{animation:stamp .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes stamp{0%{transform:rotate(-4deg) scale(1.7);opacity:0}60%{opacity:.95}100%{transform:rotate(-4deg) scale(1);opacity:.85}}
  .hiduke{writing-mode:vertical-rl;font-size:16px;letter-spacing:.08em;color:var(--sumi);margin-top:4px}
  .youbi{writing-mode:vertical-rl;font-size:12px;letter-spacing:.2em;color:var(--usuzumi);margin-top:-2px}
  .band .fill{flex:1}
  .hashira{writing-mode:vertical-rl;font-size:11px;letter-spacing:.34em;color:var(--usuzumi);text-indent:.34em}
  .ji{font-family:var(--gothic);font-size:10px;color:#9C8574;letter-spacing:.06em;writing-mode:vertical-rl}

  .scroller{flex:1 1 auto;order:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .paper{
    height:100%;min-width:100%;writing-mode:vertical-rl;text-orientation:mixed;
    font-size:17px;line-height:var(--gyo);padding:30px 22px;
    white-space:pre-wrap;word-break:normal;line-break:strict;outline:none;caret-color:var(--shu);
  }
  .paper:empty::before{content:attr(data-placeholder);color:#B8A695}
  .paper::selection{background:rgba(178,58,46,.18)}

  /* ── 表紙 ── */
  .hyoushi{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 100% at 60% 10%,#20394E,#0C1723 80%);padding-bottom:min(18vh,120px);
    cursor:pointer;border:0;width:100%;font-family:var(--mincho);color:var(--sumi);
  }
  .hyoushi.gone{animation:fade .5s ease forwards}
  @keyframes fade{to{opacity:0;visibility:hidden}}
  .daisen{ /* 題簽 */
    position:relative;z-index:2;background:linear-gradient(180deg,#F1EDE1,var(--kishi));
    border:1px solid rgba(0,0,0,.15);width:min(84%,360px);padding:36px 26px 46px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.45);color:var(--sumi);
  }
  .daisen::after{content:"";position:absolute;inset:7px;border:1px solid rgba(62,43,32,.16);pointer-events:none}
  .daisen .dai{color:var(--sumi);-webkit-text-fill-color:var(--sumi);font-size:15px;
    letter-spacing:.26em;text-indent:.26em;white-space:nowrap}
  .daisen .dairow{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-bottom:24px}
  .daisen .fuku{color:var(--usuzumi);-webkit-text-fill-color:var(--usuzumi);font-size:12.5px;
    letter-spacing:.2em;text-indent:.2em}
  .daisen .nen{color:var(--sumi);-webkit-text-fill-color:var(--sumi);font-size:17px;letter-spacing:.12em;line-height:1.1;text-indent:.12em}
  .daisen .ki{color:var(--usuzumi);-webkit-text-fill-color:var(--usuzumi);font-size:13.5px;letter-spacing:.3em;margin-top:12px;text-indent:.3em}
  .daisen .in{
    position:absolute;bottom:18px;right:18px;width:36px;height:36px;border:1.5px solid var(--shu);
    color:var(--shu);font-size:12px;line-height:1.1;display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;letter-spacing:.08em;text-align:center;opacity:.85
  }
  .hiraku{position:absolute;bottom:34px;left:0;right:0;text-align:center;color:rgba(216,210,190,.6);
          font-family:var(--gothic);font-size:12px;letter-spacing:.3em;z-index:2}

  /* ── 目次 ── */
  .mokuji{position:fixed;inset:0;z-index:10;background:rgba(12,23,35,.6);display:none}
  .mokuji.open{display:block}
  .maki{
    position:absolute;inset:14px;background:linear-gradient(180deg,#EFEBDF,var(--kishi-kage));
    box-shadow:0 18px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;
  }
  .maki-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--rule)}
  .maki-bar h2{margin:0 4px 0 0;font-size:15px;letter-spacing:.3em;font-weight:400}
  .btn-dark{font-family:var(--gothic);font-size:12px;letter-spacing:.1em;background:transparent;
            border:1px solid var(--rule);color:var(--sumi);border-radius:2px;padding:6px 10px;cursor:pointer}
  .btn-dark:hover{background:rgba(62,43,32,.07)}
  .btn-dark:focus-visible,.tsuki button:focus-visible{outline:2px solid var(--shu);outline-offset:1px}
  .nav{padding:6px 9px;line-height:1}
  .maki-bar .grow{flex:1}
  .tsuki-ran{flex:1;display:flex;flex-direction:row-reverse;justify-content:flex-start;
             overflow-x:auto;padding:18px 16px;align-items:stretch}
  .tsuki{
    flex:0 0 auto;height:100%;writing-mode:vertical-rl;white-space:nowrap;overflow:hidden;
    background:transparent;border:0;border-left:1px solid var(--rule);padding:8px 18px;
    font-family:var(--mincho);font-size:21px;letter-spacing:.06em;color:var(--sumi);
    text-align:left;cursor:pointer;
  }
  .tsuki:last-child{border-left:0}
  .tsuki:hover{background:rgba(178,58,46,.06)}
  .tsuki.kara{color:#BFB0A0}
  .tsuki.on{background:rgba(178,58,46,.08)}
  .tsuki .tk{font-size:12px;letter-spacing:.1em;color:var(--usuzumi)}
  .tsuki.kara .tk{color:#C8BBAC}
  .kara-moji{margin:auto;writing-mode:vertical-rl;font-size:13px;line-height:30px;color:var(--usuzumi);letter-spacing:.1em}
  input[type=date]{font-family:var(--gothic);font-size:12px;padding:5px;border:1px solid var(--rule);
                   background:var(--kishi);color:var(--sumi);border-radius:2px}
  /* ── 錠 ── */
  .hyoushi.locked .daisen{display:none}
  .hyoushi.locked .jou{margin-top:0}
  .jou{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:26px;z-index:2}
  .jou.on{display:flex}
  .pw{
    font-family:var(--mincho);font-size:15px;letter-spacing:.16em;text-align:center;
    width:190px;padding:9px 10px;color:var(--sumi);
    background:rgba(233,229,216,.92);border:1px solid rgba(233,229,216,.5);border-radius:2px;
  }
  .pw:focus{outline:2px solid var(--shu);outline-offset:1px}
  .err{font-family:var(--gothic);font-size:12px;color:#E39A8E;letter-spacing:.1em;min-height:1em}
  .btn-cream{
    font-family:var(--gothic);font-size:12px;letter-spacing:.2em;color:#D8D2BE;background:transparent;
    border:1px solid rgba(216,210,190,.45);border-radius:2px;padding:8px 20px;cursor:pointer;
  }
  .btn-cream:hover{background:rgba(216,210,190,.14)}
  .dialog{position:fixed;inset:0;z-index:30;background:rgba(12,23,35,.68);display:none;
          align-items:center;justify-content:center;padding:20px}
  .dialog.on{display:flex}
  .dbox{background:linear-gradient(180deg,#F1EDE1,var(--kishi));padding:24px 22px 18px;
        width:min(92%,330px);box-shadow:0 16px 44px rgba(0,0,0,.5);color:var(--sumi)}
  .dbox h3{margin:0 0 16px;font-size:16px;font-weight:400;letter-spacing:.24em}
  .dbox .pw{width:100%;margin-bottom:10px;background:#fff;border:1px solid var(--rule);text-align:left}
  .dbox .note{font-family:var(--gothic);font-size:11px;line-height:1.7;color:var(--usuzumi);margin:6px 0 16px}
  .drow{display:flex;gap:8px;justify-content:flex-end}
  /* スマホ */
  @media (max-width:860px){
    .bar{gap:5px;padding:8px 10px 7px;flex-wrap:nowrap}
    .title{font-size:12.5px;letter-spacing:.18em;text-indent:.18em;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
    .state{font-size:10px;min-width:0;letter-spacing:.04em;flex:0 0 auto;
      max-width:5.4em;overflow:hidden;white-space:nowrap}
    .btn{font-size:11px;padding:6px 7px;letter-spacing:.04em}
    .sheet{margin:0 8px 8px}
    .band{flex:0 0 58px}
  }
  @media (max-width:400px){
    .state{display:none}
    .btn{padding:6px 6px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="desk noise">
  <div class="bar">
    <h1 class="title" id="barTitle">日記帖</h1>
    <span class="grow"></span>
    <span class="state" id="state">読み込み中</span>
    <button class="btn" id="export">書出</button>
    <label class="btn" for="importFile">読込</label>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button class="btn" id="syncBtn">同期</button>
    <button class="btn" id="openMokuji">目次</button>
  </div>

  <div class="sheet">
    <div class="scroller" id="scroller">
      <div class="paper" id="paper" contenteditable="plaintext-only" spellcheck="false" data-placeholder="今日のこと。"></div>
    </div>
    <div class="band">
      <div class="seal" id="seal"><span></span></div>
      <div class="hiduke" id="hiduke"></div>
      <div class="youbi" id="youbi"></div>
      <div class="fill"></div>
      <div class="hashira" id="hashira">日記帖</div>
      <div class="ji" id="ji"></div>
    </div>
  </div>
</div>

<div class="hyoushi noise" id="hyoushi" role="button" tabindex="0" aria-label="日記をひらく">
  <div class="daisen">
    <div class="dairow">
      <span class="dai" id="coverTitle">日記帖</span>
      <span class="fuku" id="coverSub">- その日暮らし -</span>
    </div>
    <div class="nen" id="coverYear">2026年</div>
    <div class="ki" id="coverEra">- 令和8年 -</div>
    <div class="in" id="coverSeal">沙帖</div>
  </div>
  <div class="jou" id="jou">
    <input type="password" class="pw" id="pw" placeholder="合言葉" autocomplete="current-password" enterkeyhint="go">
    <button class="btn-cream" id="unlock">ひらく</button>
    <div class="err" id="pwErr"></div>
  </div>
  <div class="hiraku" id="hiraku">ひらく</div>
</div>

<div class="dialog" id="dialog">
  <div class="dbox">
    <h3 id="dTitle">合言葉を決める</h3>
    <input type="password" class="pw" id="pw1" placeholder="合言葉" autocomplete="new-password">
    <input type="password" class="pw" id="pw2" placeholder="もう一度" autocomplete="new-password">
    <p class="note">日記そのものを合言葉で包みます。忘れると開けなくなり、こちらでも戻せません。先に控えを書き出しておいてください。</p>
    <div class="drow"><button class="btn-dark" id="dCancel">やめる</button><button class="btn-dark" id="dOk">決める</button></div>
  </div>
</div>

<div class="dialog" id="syncDlg">
  <div class="dbox" style="width:min(94%,380px)">
    <h3>べつの端末と揃える</h3>
    <p class="note" style="margin-top:-8px">GitHub の Gist をひとつ置場所にして、パソコンとスマホで同じ日記を見られるようにします。</p>
    <input class="pw" id="syToken" placeholder="トークン（ghp_… / github_pat_…）" autocomplete="off" spellcheck="false">
    <input class="pw" id="syGist" placeholder="Gist の ID" autocomplete="off" spellcheck="false">
    <p class="note" id="syMsg" style="min-height:2.4em"></p>
    <div class="drow" style="justify-content:space-between">
      <button class="btn-dark" id="syNew">置場所を作る</button>
      <span style="flex:1"></span>
      <button class="btn-dark" id="syPull">取り込む</button>
      <button class="btn-dark" id="syPush">送る</button>
    </div>
    <div class="drow" style="margin-top:8px"><button class="btn-dark" id="syClose">閉じる</button></div>
  </div>
</div>

<div class="mokuji" id="mokuji">
  <div class="maki">
    <div class="maki-bar">
      <button class="btn-dark nav" id="prevYear" aria-label="前の年">◀</button>
      <h2 id="mokujiYear">二〇二六年</h2>
      <button class="btn-dark nav" id="nextYear" aria-label="次の年">▶</button>
      <span class="grow"></span>
      <input type="date" id="picker" aria-label="日を選ぶ">
      <button class="btn-dark" id="today">今日</button>
      <button class="btn-dark" id="showCover">表紙</button>
      <button class="btn-dark" id="lockBtn">錠をかける</button>
      <button class="btn-dark" id="closeMokuji">閉じる</button>
    </div>
    <div class="tsuki-ran" id="tsukiRan"></div>
  </div>
</div>

<script>
const KEY="nikki:entries";
let entries={}, current=todayKey(), viewYear=new Date().getFullYear();
let timer=null, sealed=false;
const $=id=>document.getElementById(id);
const paper=$("paper"), seal=$("seal"), state=$("state");

function todayKey(d=new Date()){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function nengo(y){
  if(y>=2019) return "令和"+(y===2019?"元":y-2018)+"年";
  if(y>=1989) return "平成"+(y===1989?"元":y-1988)+"年";
  return "昭和"+(y-1925)+"年";
}
const WEEK=["日","月","火","水","木","金","土"];
function parts(key){ const [y,m,d]=key.split("-").map(Number); return {y,m,d,w:WEEK[new Date(y,m-1,d).getDay()]}; }

function paintPage(animate){
  const p=parts(current);
  const num=n=>`<span class="${String(n).length>2?"upr":"tcy"}">${n}</span>`;
  seal.firstElementChild.innerHTML=`<div>${num(p.m)}月</div><div>${num(p.d)}日</div>`;
  seal.style.visibility=(entries[current]||"").trim()?"visible":"hidden";
  if(animate){ seal.classList.remove("stamp"); void seal.offsetWidth; seal.classList.add("stamp"); }
  $("hiduke").innerHTML=`${num(p.m)}月${num(p.d)}日`;
  $("youbi").textContent=p.w+"曜日";
  $("hashira").innerHTML=`<span class="upr">${p.y}</span>年　日記帖`;
  $("barTitle").textContent =
    (window.matchMedia && window.matchMedia("(max-width:860px)").matches)
      ? "日記帖" : "日記帖　- その日暮らし -";
  $("coverYear").textContent=p.y+"年";
  $("coverEra").textContent="- "+nengo(p.y)+" -";
  const n=paper.innerText.replace(/\s/g,"").length;
  $("ji").innerHTML=n?`${num(n)}字`:"";
}

const store={
  async get(){
    try{ const v=localStorage.getItem(KEY); if(v!==null) return v; }catch(e){}
    if(window.storage){ try{ const r=await window.storage.get(KEY); return r?r.value:null; }catch(e){} }
    return null;
  },
  async set(v){
    let ok=false;
    try{ localStorage.setItem(KEY,v); ok=true; }catch(e){}
    if(window.storage){ try{ await window.storage.set(KEY,v); ok=true; }catch(e){} }
    if(!ok) throw new Error("no store");
  }
};
/* ── 合言葉（PBKDF2 + AES-GCM で日記そのものを包む） ── */
let pwKey=null, salt=null, locked=false;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derive(pw,saltBytes){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:saltBytes,iterations:150000,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function seal_(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},pwKey,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({v:2,salt:b64(salt),iv:b64(iv),data:b64(ct)});
}
async function unseal(box,key){
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function load(){
  const v=await store.get();
  let parsed=null;
  try{ parsed=v?JSON.parse(v):null; }catch(e){}
  if(parsed && parsed.v===2){           // 錠がかかっている
    locked=true; salt=unb64(parsed.salt);
    $("jou").classList.add("on"); $("hiraku").style.display="none";
    $("hyoushi").classList.add("locked");
    $("hyoushi").style.display="flex";
    setTimeout(()=>$("pw").focus(),300);
    state.textContent="錠あり";
    window.__box=parsed;
    return;
  }
  entries=parsed||{};
  openDay(current,false);
  state.textContent="自動保存";
}
async function persist(){
  clearTimeout(timer); timer=null;
  try{
    await store.set(pwKey?await seal_(entries):JSON.stringify(entries));
    state.textContent="保存しました";
    setTimeout(()=>{ if(state.textContent==="保存しました") state.textContent="自動保存"; },1600);
  }catch(e){ state.textContent="保存できません"; }
}
function queueSave(){
  const text=paper.innerText, wasEmpty=!(entries[current]||"").trim();
  if(text.trim()) entries[current]=text; else delete entries[current];
  if(wasEmpty&&text.trim()&&!sealed){ sealed=true; paintPage(true); }
  if(!text.trim()) sealed=false;
  paintPage(false);
  state.textContent="書いています";
  clearTimeout(timer); timer=setTimeout(persist,700);
}
function openDay(key,focus=true){
  current=key; viewYear=parts(key).y;
  paper.textContent=entries[key]||"";
  sealed=!!(entries[key]||"").trim();
  paintPage(false);
  $("scroller").scrollLeft=$("scroller").scrollWidth;
}

function renderMokuji(){
  $("mokujiYear").textContent=viewYear+"年";
  const ran=$("tsukiRan"); ran.innerHTML="";
  const days={};
  Object.keys(entries).forEach(k=>{ const p=parts(k); if(p.y===viewYear) (days[p.m]=days[p.m]||[]).push(k); });
  const now=parts(current);
  for(let m=1;m<=12;m++){
    const list=(days[m]||[]).sort();
    const b=document.createElement("button");
    b.className="tsuki"+(list.length?"":" kara")+(now.y===viewYear&&now.m===m?" on":"");
    b.innerHTML=`<span class="tcy">${m}</span>月`
      + (list.length?`<span class="tk">　<span class="tcy">${list.length}</span>日</span>`:'<span class="tk">　—</span>');
    b.onclick=()=>{                       // その月の最初のページへ
      openDay(list[0]||`${viewYear}-${String(m).padStart(2,"0")}-01`);
      closeMokuji();
    };
    ran.appendChild(b);
  }
}
function openMokuji(){ viewYear=parts(current).y; renderMokuji(); $("mokuji").classList.add("open"); }
function closeMokuji(){ $("mokuji").classList.remove("open"); }

paper.addEventListener("focus",()=>{           // 書きはじめの一字下げ
  if(paper.textContent) return;
  paper.textContent="　";
  const r=document.createRange(), sel=getSelection();
  r.selectNodeContents(paper); r.collapse(false);
  sel.removeAllRanges(); sel.addRange(r);
});
paper.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing||e.keyCode===229||e.shiftKey) return;
  e.preventDefault();                       // 改行のあとに一字下げ
  document.execCommand("insertText",false,"\n　");
});
paper.addEventListener("input",queueSave);
paper.addEventListener("paste",e=>{
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData("text");
  document.execCommand("insertText",false,t);
});
$("openMokuji").onclick=openMokuji;
$("closeMokuji").onclick=closeMokuji;
$("mokuji").onclick=e=>{ if(e.target===$("mokuji")) closeMokuji(); };
$("today").onclick=()=>{ openDay(todayKey()); closeMokuji(); };
$("picker").onchange=e=>{ if(e.target.value){ openDay(e.target.value); closeMokuji(); } };
$("prevYear").onclick=()=>{ viewYear--; renderMokuji(); };
$("nextYear").onclick=()=>{ viewYear++; renderMokuji(); };
$("showCover").onclick=()=>{ closeMokuji(); const c=$("hyoushi"); c.classList.remove("gone"); c.style.display="flex"; };
async function unlock(){
  const pw=$("pw").value;
  if(!pw) return;
  $("pwErr").textContent="ひらいています…";
  try{
    const key=await derive(pw,salt);
    entries=await unseal(window.__box,key);
    pwKey=key; locked=false;
    $("jou").classList.remove("on"); $("hyoushi").classList.remove("locked");
    $("pw").value=""; $("pwErr").textContent="";
    $("hiraku").style.display="";
    openDay(todayKey(),false);
    state.textContent="自動保存";
    $("lockBtn").textContent="錠をはずす";
    $("hyoushi").click();
  }catch(e){ $("pwErr").textContent="合言葉がちがいます"; $("pw").select(); }
}
$("unlock").onclick=unlock;
$("pw").onkeydown=e=>{ if(e.key==="Enter") unlock(); };
$("jou").onclick=e=>e.stopPropagation();

$("lockBtn").onclick=async ()=>{
  if(pwKey){                                   // 錠をはずす
    pwKey=null; salt=null;
    await persist();
    $("lockBtn").textContent="錠をかける";
    state.textContent="錠をはずしました";
    return;
  }
  $("pw1").value=""; $("pw2").value=""; $("dialog").classList.add("on"); $("pw1").focus();
};
$("dCancel").onclick=()=>$("dialog").classList.remove("on");
$("dOk").onclick=async ()=>{
  const a=$("pw1").value, b=$("pw2").value;
  if(a.length<4){ $("dTitle").textContent="四文字以上にしてください"; return; }
  if(a!==b){ $("dTitle").textContent="二つが揃っていません"; return; }
  salt=crypto.getRandomValues(new Uint8Array(16));
  pwKey=await derive(a,salt);
  await persist();
  $("dialog").classList.remove("on"); $("dTitle").textContent="合言葉を決める";
  $("lockBtn").textContent="錠をはずす";
  state.textContent="錠をかけました";
};

$("hyoushi").onkeydown=e=>{ if(locked) return; if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("hyoushi").click(); } };
$("hyoushi").onclick=()=>{ if(locked) return; const c=$("hyoushi"); c.classList.add("gone"); setTimeout(()=>{ c.style.display="none"; },480); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeMokuji(); });

// 離れるときは待たずに保存
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&timer) persist(); });
window.addEventListener("pagehide",()=>{ if(timer) persist(); });

// 控えの書き出しと読み込み
$("export").onclick=()=>{
  const blob=new Blob([JSON.stringify(entries,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="nikki-"+todayKey()+".json";

$("importFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const add=JSON.parse(await f.text());
    let n=0;
    for(const k in add){ if(/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof add[k]==="string"){
      if(entries[k] && entries[k]!==add[k]) entries[k]=add[k]+"\n\n　（控えより）"; else entries[k]=add[k];
      n++;
    }}
    await persist(); openDay(current,false); renderMokuji();
    state.textContent=n+"日を読み込みました";
  }catch(err){ state.textContent="読み込めません"; }
  e.target.value="";
};

$("coverSeal").textContent="沙帖";
load();

/* ================= べつの端末と揃える（GitHub Gist） ================= */
const SKEY = "zakki.sync";
const GH = "https://api.github.com";
const GFILE = "zakki.json";
let sy = {token:"", gist:"", at:0};
let syDirty = false, syBusy = false, syTimer = null;

function syLoad(){
  try{ sy = Object.assign(sy, JSON.parse(localStorage.getItem(SKEY) || "{}")); }catch(e){}
}
function sySave(){ try{ localStorage.setItem(SKEY, JSON.stringify(sy)); }catch(e){} }
const syOn = () => !!(sy.token && sy.gist);
function syMsg(t){ const el = $("syMsg"); if(el) el.textContent = t || ""; }
function syState(t){ state.textContent = t; }

async function ghFetch(url, opt){
  const o = Object.assign({headers:{}}, opt || {});
  o.headers = Object.assign({
    "Authorization": "Bearer " + sy.token,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  }, o.headers || {});
  return fetch(url, o);
}
async function ghGet(){
  const r = await ghFetch(`${GH}/gists/${sy.gist}`);
  if(r.status === 401) throw new Error("トークンがちがいます");
  if(r.status === 404) throw new Error("置場所が見つかりません");
  if(!r.ok) throw new Error("取り出せません（" + r.status + "）");
  const j = await r.json();
  const f = (j.files || {})[GFILE];
  if(!f) return null;
  let txt = f.content;
  if(f.truncated && f.raw_url) txt = await (await fetch(f.raw_url)).text();
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
async function ghPut(rec){
  const r = await ghFetch(`${GH}/gists/${sy.gist}`, {
    method:"PATCH",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({files:{[GFILE]:{content:JSON.stringify(rec)}}})
  });
  if(r.status === 401) throw new Error("トークンがちがいます");
  if(r.status === 403) throw new Error("回数制限です。少し待ってからもう一度");
  if(r.status === 404) throw new Error("置場所が見つかりません");
  if(!r.ok) throw new Error("送れません（" + r.status + "）");
}
async function ghNew(){
  const r = await ghFetch(`${GH}/gists`, {
    method:"POST",
    headers:{"content-type":"application/json"},
    body: JSON.stringify({description:"zakki", public:false,
      files:{[GFILE]:{content:JSON.stringify({at:0, body:"{}"})}}})
  });
  if(!r.ok) throw new Error("作れません（" + r.status + "）");
  return (await r.json()).id;
}

/* 取り込んだ中身を画面に反映する */
async function syApply(){
  const v = await store.get();
  let parsed = null;
  try{ parsed = v ? JSON.parse(v) : null; }catch(e){}
  if(parsed && parsed.v === 2){          /* 錠がかかっている */
    if(pwKey){
      try{
        salt = unb64(parsed.salt);
        entries = await unseal(parsed, pwKey);
        openDay(current, false);
        if($("mokuji").classList.contains("open")) renderMokuji();
        return;
      }catch(e){}
    }
    location.reload();
    return;
  }
  entries = parsed || {};
  openDay(current, false);
  if($("mokuji").classList.contains("open")) renderMokuji();
}

async function syPull(force){
  if(!syOn()) return false;
  const rec = await ghGet();
  if(!rec || !rec.body) return false;
  if(!force && !(rec.at > (sy.at || 0))) return false;
  await store.set(rec.body);
  sy.at = rec.at; sySave();
  syDirty = false;
  await syApply();
  return true;
}
async function syPush(loud){
  if(!syOn() || syBusy) return;
  syBusy = true;
  try{
    const body = await store.get();
    if(body === null){ syBusy = false; return; }
    const rec = await ghGet();
    if(rec && rec.at > (sy.at || 0) && !loud){
      syState("置場所に新しいものがあります");
      syBusy = false; return;              /* 勝手に上書きしない */
    }
    const at = Date.now();
    await ghPut({at, body});
    sy.at = at; sySave();
    syDirty = false;
    syState("揃えました");
    setTimeout(() => { if(state.textContent === "揃えました") state.textContent = "自動保存"; }, 1600);
  }catch(e){
    syState("揃えられません");
    if(loud) syMsg(e.message || String(e));
  }
  syBusy = false;
}
function syLater(){
  if(!syOn()) return;
  syDirty = true;
  clearTimeout(syTimer);
  syTimer = setTimeout(() => { if(syDirty) syPush(); }, 12000);
}
function syFlush(){
  if(!syOn() || !syDirty || syBusy) return;
  clearTimeout(syTimer);
  syPush();
}

/* 保存のたびに合図を送る */
const _set = store.set.bind(store);
store.set = async v => { await _set(v); syLater(); };

document.addEventListener("visibilitychange", () => { if(document.hidden) syFlush(); });
window.addEventListener("pagehide", syFlush);

/* ダイアログ */
$("syncBtn").onclick = () => {
  syLoad();
  $("syToken").value = sy.token || "";
  $("syGist").value = sy.gist || "";
  syMsg(syOn() ? "つながっています。" : "トークンと Gist の ID を入れてください。");
  $("syncDlg").classList.add("on");
};
$("syClose").onclick = () => $("syncDlg").classList.remove("on");
$("syncDlg").onclick = e => { if(e.target === $("syncDlg")) $("syncDlg").classList.remove("on"); };
function syGrab(){
  sy.token = $("syToken").value.trim();
  sy.gist  = $("syGist").value.trim();
  sySave();
}
$("syNew").onclick = async () => {
  syGrab();
  if(!sy.token) return syMsg("先にトークンを入れてください。");
  syMsg("作っています…");
  try{
    sy.gist = await ghNew(); sySave();
    $("syGist").value = sy.gist;
    syMsg("作りました。この ID をスマホ側にも入れてください。");
  }catch(e){ syMsg(e.message || String(e)); }
};
$("syPush").onclick = async () => {
  syGrab();
  if(!syOn()) return syMsg("トークンと Gist の ID が要ります。");
  syMsg("送っています…");
  await syPush(true);
  if(state.textContent === "揃えました") syMsg("送りました。");
};
$("syPull").onclick = async () => {
  syGrab();
  if(!syOn()) return syMsg("トークンと Gist の ID が要ります。");
  if(syDirty && !confirm("この端末に、まだ送っていない書きかけがあります。\n取り込むと消えます。よろしいですか？")) return;
  syMsg("取り込んでいます…");
  try{
    const ok = await syPull(true);
    syMsg(ok ? "取り込みました。" : "置場所がまだ空です。");
  }catch(e){ syMsg(e.message || String(e)); }
};

/* 開いたときに一度だけ取り込む */
syLoad();
if(syOn()){
  setTimeout(() => {
    syPull().then(ok => { if(ok) syState("取り込みました"); })
      .catch(() => syState("揃えられません"));
  }, 600);
}
