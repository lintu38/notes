<style>
  /* 見出し用の和文フォント。
     端末にインストール済みなら local() が使われます。
     フォントファイル（ttf / otf / woff2）をこの HTML と同じフォルダに置いた場合は
     下の url() のいずれかの名前にしておくと読み込まれます。 */
  @font-face{
    font-family:'UniLine';
    src:local('ユニバーサルライン DSP L'), local('UniversalLine DSP L'), local('UniversalLineDSP-L'),
        local('ユニバーサルライン DSP'), local('ユニバーサルライン'), local('UniversalLine'),
        url('./UniversalLine-DSP-L.woff2') format('woff2'),
        url('./UniversalLine-DSP-L.ttf') format('truetype'),
        url('./UniversalLine-DSP-L.otf') format('opentype');
    font-display:swap;
  }
  :root{
    --bg:#f7f4ef; --panel:#fffefd; --ink:#1f1a1c; --muted:#8b8285;
    --line:#e8e1df; --line2:#f3edec; --accent:#3d6fe0; --accent-soft:#eaf0fd;
    --brown:#54402e; --quote-bg:#f5f1f0;
    --fserif:"Yu Mincho","YuMincho","游明朝","游明朝体","Hiragino Mincho ProN","Hiragino Mincho Pro",
      "Noto Serif JP","Times New Roman",serif;
    --fdisp:'Montserrat','UniLine','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif;
    --radius:12px; --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 14px rgba(30,25,15,.05);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14.5px/1.75 var(--fserif);
    font-feature-settings:"palt" 1;}
  /* メイン画面はサイドバーと同じ書体に。メモ・引用など読ませる文章だけ明朝に戻す */
  .scroll{font-family:var(--fdisp)}
  .qc-body,.qc-memo,.dailybody,
  .dcard .qt,.dcard .mm,.rs-p,.lc-p{font-family:var(--fserif)}
  /* 本文を出す場所（編集中も表示も）に共通の書式を効かせる */
  /* メモ本文・Message Log・セクション見出しはサイドバーと同じ書体 */
  .body,.log-t,.sec-lb{font-family:var(--fdisp)}
  .body.dailybody{font-family:var(--fserif);font-weight:500}
  /* Memo・Quote・Read は入力中も表示も游明朝（見出しラベルは除く） */
  .qbox,.qbox *,.qcard,.qcard *{font-family:var(--fserif)}
  .qbox .body,.qcard .body,.qbox .mtitle,.qcard .mtitle,
  .qbox input,.qbox .qt,.qcard .qt,
  .qcard .qc-body,.qcard .qc-memo,.qcard .qc-ttl,.qcard .qc-cite{font-weight:400;color:#3c3638}
  /* 入力欄のプレースホルダーは本文と同じ淡さに */
  .qbox input::placeholder{color:#c4bcbe;opacity:1}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .app{display:flex;height:100vh;overflow:hidden}


  /* 暗証番号ロック */
  body.locked .app,body.locked #sideShow,body.locked #rsideShow{visibility:hidden}
  .lockwrap{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;
    align-items:center;justify-content:center}
  .lockwrap.on{display:flex}
  .lockbox{text-align:center;font-family:var(--fdisp)}
  .lock-t{font-size:26px;font-weight:600;color:var(--brown);letter-spacing:.12em;margin-bottom:6px}
  .lock-s{font-size:12.5px;color:var(--muted);margin-bottom:20px}
  .lock-in{width:150px;padding:12px 10px;font-size:26px;letter-spacing:.5em;text-align:center;
    border:1px solid var(--line);border-radius:11px;background:var(--panel);outline:none;
    color:var(--ink);font-family:var(--fdisp)}
  .lock-in:focus{border-color:var(--brown);box-shadow:0 0 0 3px #ece4da}
  .lock-e{height:18px;margin-top:12px;font-size:12px;color:#c0392b}
  .shake{animation:shk .38s}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
    40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  /* ゴシック側は標準の太さ、明朝側だけ一段太く（細く見えるため） */
  .ctitle,.tnote,.sub .t,.rsub .t,.row .tt,.rs-t{font-weight:400}
  .qc-body,.qc-memo,.dailybody,.rs-p,.dcard .qt{font-weight:500}
  .body,.log-t{font-weight:400}
  /* スクロールバーは普段は見えず、カーソルを重ねたときだけ薄く出す */
  .side,.rside,.scroll{scrollbar-width:thin;scrollbar-color:transparent transparent}
  .side:hover,.rside:hover,.scroll:hover{scrollbar-color:rgba(90,75,80,.22) transparent}
  .side::-webkit-scrollbar,.rside::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:9px;height:9px}
  .side::-webkit-scrollbar-track,.rside::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:transparent}
  .side::-webkit-scrollbar-thumb,.rside::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{
    background:transparent;border-radius:9px;border:3px solid transparent;background-clip:content-box}
  .side:hover::-webkit-scrollbar-thumb,.rside:hover::-webkit-scrollbar-thumb,.scroll:hover::-webkit-scrollbar-thumb{
    background:rgba(90,75,80,.20);background-clip:content-box}
  .side::-webkit-scrollbar-thumb:hover,.rside::-webkit-scrollbar-thumb:hover,.scroll::-webkit-scrollbar-thumb:hover{
    background:rgba(90,75,80,.38);background-clip:content-box}

  /* ---------- sidebar ---------- */
  .side{font-family:var(--fdisp);letter-spacing:.02em;color:var(--brown);
    width:236px;flex:0 0 236px;background:#d6bec6;border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto;
    position:relative;transition:none}
  .side.hide{display:none}
  .side-rz{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:20}
  .side-rz::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:transparent}
  .side-rz:hover::after,.side-rz.act::after{background:var(--accent)}
  .brand{font-weight:500;font-size:21px;padding:4px 4px 2px 8px;letter-spacing:.08em;
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand-sub{font-size:10px;letter-spacing:.06em;color:#9e6f7d;padding:0 8px 12px;
    font-family:var(--fdisp);line-height:1.5}
  .banner{height:82px;flex:0 0 82px;border-radius:0;margin:0 -10px 12px -1px;overflow:hidden;cursor:pointer;
    border:1px dashed #cbb0b8;border-left:0;border-right:0;display:flex;align-items:center;
    justify-content:center;color:#a08c92;font-size:11px;letter-spacing:.06em;position:relative;
    background:#00000008}
  .banner:hover{border-color:var(--brown);color:var(--brown)}
  .banner.has{border:0}
  .banner .bx{right:8px}
  .banner img{width:100%;height:100%;object-fit:cover;display:block}
  .banner .bx{position:absolute;top:4px;right:4px;width:19px;height:19px;border-radius:50%;
    background:rgba(255,255,255,.85);color:#6e6668;font-size:12px;line-height:19px;text-align:center;
    opacity:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .banner:hover .bx{opacity:1}
  .banner .bx:hover{background:#fff;color:#c0392b}
  .brand button{color:#9a8b8f;font-size:14px;padding:2px 7px;border-radius:7px;line-height:1}
  .brand button:hover{background:#cbb0b8;color:var(--ink)}
  /* 右サイドバー */
  .rside{width:262px;flex:0 0 262px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;padding:12px 10px;gap:8px;overflow-y:auto;position:relative}
  .rside-rz{position:absolute;top:0;left:0;width:8px;height:100%;cursor:col-resize;z-index:20}
  .rside-rz::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
  .rside-rz:hover::after,.rside-rz.act::after{background:var(--accent)}
  .rside.hide{display:none}
  .rs-h{display:flex;align-items:center;justify-content:space-between;
    font-family:var(--fdisp);font-size:12px;letter-spacing:.12em;color:var(--muted);
    font-weight:600;padding:2px 4px 0}
  .rs-h button{color:#b0a7a9;font-size:14px;padding:2px 7px;border-radius:7px;line-height:1}
  .rs-h button:hover{background:#f4f0ef;color:var(--ink)}
  .rside .cal{width:auto;flex:1 1 auto;border:0;padding:6px 2px 4px;background:none}
  .rs-cal{padding:8px 2px 6px;border-top:1px solid var(--line2)}
  .rs-callb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    letter-spacing:.08em;margin-bottom:5px}
  .rs-calbtn{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;
    padding:2px 7px}
  .rs-calbtn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .rs-calat{margin-left:auto;font-size:10px;color:#c4bcbe;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:52%}
  .rs-tabs{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .rs-tabs .seg{flex:1;min-width:0}
  .rs-tabs .seg button{flex:1 1 0;min-width:0;padding:4px 2px;font-size:11px;letter-spacing:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rs-memo.tall{min-height:340px}
  /* いちばん上（今日の曜日・今月）の見出しだけ目立たせる */
  .rs-memo.tall.rot > h3:first-of-type{color:#2f7f92;position:relative;
    padding-left:10px;margin-top:2px}
  .rs-memo.tall.rot > h3:first-of-type::before{content:"";position:absolute;left:0;top:.32em;
    width:3px;height:1em;border-radius:2px;background:#4a9fb3}
  .rs-memowrap{margin-top:20px}
  .rs-fmt{display:flex;justify-content:flex-end;margin-top:3px}
  .rs-fmt .fmtwrap{opacity:.85}
  .rs-memo.body{min-height:64px;font-size:12.5px;line-height:1.75;color:#4a4446;
    border:1px solid var(--line);border-radius:9px;background:#fdfbfa;
    padding:7px 6px 7px 10px;margin:0 -2px 0 -2px;outline:none}
  .rs-memo.body:hover{background:#fdfbfa}
  .rs-memo.body:focus{border-color:var(--line);box-shadow:none;background:#fff}
  .rs-memo:empty::before{content:attr(data-ph);color:#c4bcbe}
  .rs-ev.up{cursor:pointer;border-radius:6px}
  .rs-ev.up:hover{background:var(--accent-soft)}
  .rs-ev{display:flex;gap:7px;font-size:12px;color:#5f585a;padding:3px 2px;line-height:1.5}
  .rs-evt{flex:0 0 auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;
    padding-top:1px;white-space:nowrap}
  .rs-evs{flex:1;min-width:0;word-break:break-word}
  .rs-list{border-top:1px solid var(--line2);padding-top:8px}

  .rs-kind{font-size:9.5px;letter-spacing:.1em;border:1px solid var(--line);border-radius:20px;
    padding:1px 6px;color:#8b8285;flex:0 0 auto}
  .rs-d{font-size:10px;color:#b0a7a9;margin-top:4px;
    font-family:"SFMono-Regular",Consolas,monospace}
  .rs-empty{font-size:12px;color:var(--muted);text-align:center;padding:18px 0}
  #rsideShow{display:none;position:fixed;right:12px;top:12px;z-index:40;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:6px 10px;font-size:14px;box-shadow:var(--shadow);color:var(--brown);line-height:0}
  .calico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.35;
    stroke-linecap:round;stroke-linejoin:round}

  body.norside .topbar{padding-right:64px}
  .card.flash{animation:flash 1.5s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
  #sideShow{display:none;position:fixed;left:10px;top:12px;z-index:40;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:6px 11px;font-size:14px;color:#6e6668;box-shadow:var(--shadow)}
  #sideShow:hover{border-color:#cdc1c3}
  body.nosidebar #sideShow{display:block}
  body.nosidebar .topbar{padding-left:64px}
  .side-label{font-size:11px;color:#8a7358;padding:12px 8px 4px;letter-spacing:.08em;font-weight:600}
  .side-label.lbrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .side-label.lbrow button{color:#a58e78;font-size:11px;padding:2px 6px;border-radius:6px;line-height:1}
  .side-label.lbrow button:hover{background:#cbb0b8;color:var(--brown)}
  /* Status 編集パネル */
  .strow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .strow input[type=color]{width:24px;height:24px;padding:0;border:1px solid var(--line);
    border-radius:7px;background:none;cursor:pointer;flex:0 0 24px}
  .strow input[type=text]{flex:1 1 auto;min-width:0;width:100%;border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;background:var(--panel);font-size:12.5px;outline:none;
    color:var(--ink)}
  .strow input[type=text]:focus{border-color:var(--brown)}
  .strow .x{color:#c0b8ba;font-size:14px;padding:0 4px;flex:0 0 18px;width:18px;
    justify-content:center;display:flex}
  .strow .x:hover{color:#c0392b}
  .stadd{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;
    padding:5px 10px;width:100%;margin-top:2px}
  .stadd:hover{border-color:var(--brown);color:var(--brown)}
  .nav{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
    cursor:pointer;color:var(--brown);font-size:13.5px}
  .nav:hover{background:var(--bh,#cbb0b8)}
  .nav.on{background:var(--bo,var(--panel));color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
  .nav .ico{width:18px;text-align:center;flex:0 0 18px;font-size:14px}
  /* Tasks はカーソルを置いたときだけ、くすんだ赤系に */
  #navTasks:hover{background:#c48f95;color:#fff}
  #navTasks:hover .cnt{background:#a96f78;color:#fff}
  .nav.dragging{opacity:.4}
  .nav.dropn{box-shadow:inset 0 2px 0 var(--brown)}
  .nav.dropn-b{box-shadow:inset 0 -2px 0 var(--brown)}
  .nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:#cdb4bb;
    border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
  .nav.on .cnt{background:#cfb6bd;color:var(--muted)}
  .tagnav{display:flex;flex-wrap:wrap;gap:5px;padding:4px 8px 0}
  .tgear{font-style:normal;font-size:11px;opacity:.5;margin-left:2px;padding:0 1px}
  .tagnav button:hover .tgear{opacity:1}
  .tagnav button{font-size:11.5px;padding:0 9px;height:21px;line-height:1;border-radius:20px;
    background:#cfb6bd;color:#6b655c;display:inline-flex;align-items:center;white-space:nowrap}
  .tagnav button:hover{filter:brightness(.95)}
  .tagnav button.on{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
  .tagnav button.pin{font-weight:700}
  .pinico{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.5;
    stroke-linejoin:round;margin-right:4px;flex:0 0 auto}
  .pop .ic .pinico{width:12px;height:12px;margin:0}
  /* フォルダ */
  .fgrp{margin-bottom:1px}
  .frow{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;
    cursor:pointer;color:var(--brown);font-size:12.5px}
  .frow:hover{background:#cbb0b8}
  .fcar{font-size:8px;color:#a7a0a2;transition:transform .12s;width:10px}
  .fcar.open{transform:rotate(90deg)}
  .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;letter-spacing:.03em}
  .mico{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.25;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:0 0 auto}
  .nico{width:13.5px;height:13.5px;fill:none;stroke:currentColor;stroke-width:1.3;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
  .fico{width:12.5px;height:12.5px;fill:none;stroke:currentColor;stroke-width:1.3;
    stroke-linejoin:round;vertical-align:-1.5px;margin-right:6px;flex:0 0 auto}
  .fmenu{opacity:0;color:#a7a0a2;font-size:14px;padding:0 3px;border-radius:5px}
  .frow:hover .fmenu{opacity:1}
  .nav.sub{margin-left:14px}
  .nav.dropb{box-shadow:inset 0 2px 0 var(--accent)}
  .frow.dropf{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
  .nav[data-board]{cursor:grab}
  #boardList.dropr{outline:2px dashed #c9bfc2;outline-offset:-2px;border-radius:9px}
  .fempty{font-size:11px;color:#b2a9ab;padding:3px 8px 5px 24px}
  .side-foot{margin-top:auto;padding-top:12px;border-top:1px solid #c4a3ac;display:flex;gap:6px;flex-wrap:wrap}
  .updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:300;
    background:#2f2c28;color:#fff;border-radius:22px;padding:9px 14px;font-size:12.5px;
    font-family:var(--fdisp);display:flex;align-items:center;gap:10px;
    box-shadow:0 8px 26px rgba(30,25,15,.3)}
  .updbar button{background:#fff;color:#2f2c28;border-radius:16px;padding:5px 12px;
    font-size:12px;font-weight:600}
  .synctag{flex:1 1 100%;font-size:10.5px;color:#6b5a4a;opacity:0;transition:opacity .2s;
    font-family:var(--fdisp);line-height:1.5}

  .synctag.err{color:#8c3a52}
  .srow{margin-bottom:9px}
  .srow label{display:block;font-size:11px;color:#6e6668;margin-bottom:4px;letter-spacing:.03em}
  .srow input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;
    background:var(--panel);font-size:12.5px;outline:none;color:var(--ink)}
  .srow input:focus{border-color:var(--brown);box-shadow:0 0 0 2px #ece4da}
  .mini{font-size:11.5px;color:var(--muted);padding:5px 9px;border-radius:7px;border:1px solid #cdb4bb}
  .mini:hover{background:#cbb0b8;color:var(--ink)}

  /* ---------- main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;
    padding:0 22px;border-bottom:1px solid var(--line);background:var(--bg)}
  .title{font-family:var(--fdisp);color:var(--brown);font-size:18px;font-weight:300;letter-spacing:.05em;border:0;background:none;
    outline:none;min-width:60px;padding:2px 4px;border-radius:6px}
  .title:focus{background:var(--panel);box-shadow:0 0 0 2px var(--accent-soft)}
  .spacer{flex:1}
  #backupTag{font-size:11.5px;color:#b5711f;background:#fff3e2;border-radius:20px;
    padding:3px 10px;margin-right:8px;cursor:pointer;white-space:nowrap}
  #backupTag:hover{background:#ffe9cc}
  #fileTag{font-size:10.5px;color:#6e6668;width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;padding:2px 2px 0}
  #savedTag{font-size:11.5px;color:#7d9a80;opacity:0;transition:opacity .25s;
    margin-right:4px;white-space:nowrap}
  #savedTag.on{opacity:1}
  #savedTag.err{color:#c0392b;opacity:1}
  #lastSave{font-size:11px;color:#b3aaac;letter-spacing:.06em;margin-left:8px;

  .btn{padding:6px 12px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
  .btn:hover{border-color:#cdc5c7}
  .scroll{flex:1;overflow:auto;padding:20px 22px 90px}

  /* ---------- board ---------- */

  .cols.shelfcols .col{width:auto!important;flex:1 1 auto!important}

  .col{flex:0 0 288px;width:288px;display:flex;flex-direction:column;gap:10px;position:relative}

  .col-x:hover{background:#e8e5df;color:#c0392b}
  .col-rz{position:absolute;top:0;right:-9px;width:12px;height:100%;cursor:col-resize;z-index:5}

    color:var(--muted);font-size:13px}
  .addcol button:hover{background:var(--panel);color:var(--ink)}

  /* ---------- card ---------- */
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:11px 12px;position:relative}
  .card.drag{opacity:.4}
  .card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;

  .card-top{display:flex;align-items:flex-start;gap:8px}

  .card[draggable="true"]{cursor:default}
  .ck{appearance:none;width:16px;height:16px;flex:0 0 16px;margin-top:2px;border:1.5px solid #c6bcbe;

  .ck:checked{background:var(--accent);border-color:var(--accent)}
  .ck:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .ctitle{flex:1;min-width:0;outline:none;font-size:14px;word-break:break-word;padding:1px 2px;border-radius:5px}
  .ctitle:focus{background:#fdfbfa;box-shadow:0 0 0 2px var(--accent-soft)}
  .card.done .ctitle{text-decoration:line-through;color:var(--muted)}
  .card.done .ctitle *{text-decoration:inherit}
  .menu{opacity:0;color:#b6aeb0;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px}
  .card:hover .menu{opacity:1}
  .menu:hover{background:#f4f0ef;color:var(--ink)}
  /* memo body: 書き出しをタイトルと同じ位置に揃え、縦に広く取る */
  .body{color:#2a2426;font-size:13.5px;white-space:pre-wrap;outline:none;margin:7px 0 0 22px;
    padding:4px 5px;border-radius:7px;word-break:break-word;min-height:26px;line-height:1.7}
  .card.task .body{margin-left:24px}
  .card.note .body{min-height:112px}

    background:#fffefc;box-shadow:0 0 0 1.5px #ddd7cd}
  .qbox > .body:focus,.qbox > .mtitle:focus,.qbox .qm:focus{
    box-shadow:0 0 0 1.5px #b9b0a2}

  .body u{text-underline-offset:2px}
  /* 箇条書き・チェックリスト・引用 */
  .body ul,.qc-body ul,.qc-memo ul,.dailybody ul,.log-t ul,.dcard .qt ul,.dcard .mm ul,.rs-p ul,.body ol,.qc-body ol,.qc-memo ol,.dailybody ol,.log-t ol,.dcard .qt ol,.dcard .mm ol,.rs-p ol{margin:4px 0;padding-left:1.35em}
  .body li,.qc-body li,.qc-memo li,.dailybody li,.log-t li,.dcard .qt li,.dcard .mm li,.rs-p li{margin:1px 0}
  .body ul.ckl,.qc-body ul.ckl,.qc-memo ul.ckl,.dailybody ul.ckl,.log-t ul.ckl,.dcard .qt ul.ckl,.dcard .mm ul.ckl,.rs-p ul.ckl{list-style:none;padding-left:1.55em}
  .body ul.ckl > li,.qc-body ul.ckl > li,.qc-memo ul.ckl > li,.dailybody ul.ckl > li,.log-t ul.ckl > li,.dcard .qt ul.ckl > li,.dcard .mm ul.ckl > li,.rs-p ul.ckl > li{position:relative}
  .body ul.ckl > li::before,.qc-body ul.ckl > li::before,.qc-memo ul.ckl > li::before,.dailybody ul.ckl > li::before,.log-t ul.ckl > li::before,.dcard .qt ul.ckl > li::before,.dcard .mm ul.ckl > li::before,.rs-p ul.ckl > li::before{content:"";position:absolute;left:-1.5em;top:.45em;

    background:var(--panel);cursor:pointer}
  .body ul.ckl > li.dn::before,.qc-body ul.ckl > li.dn::before,.qc-memo ul.ckl > li.dn::before,.dailybody ul.ckl > li.dn::before,.log-t ul.ckl > li.dn::before,.dcard .qt ul.ckl > li.dn::before,.dcard .mm ul.ckl > li.dn::before,.rs-p ul.ckl > li.dn::before{content:"✓";border-color:var(--brown);background:var(--brown);
    color:#fff;font-size:9.5px;line-height:13px;text-align:center;font-family:var(--fdisp)}
  .body ul.ckl > li.dn,.qc-body ul.ckl > li.dn,.qc-memo ul.ckl > li.dn,.dailybody ul.ckl > li.dn,.log-t ul.ckl > li.dn,.dcard .qt ul.ckl > li.dn,.dcard .mm ul.ckl > li.dn,.rs-p ul.ckl > li.dn{color:#a49b9d;text-decoration:line-through;text-decoration-color:#d6cccd}
  .body ul.ckl > li.sk::before,.qc-body ul.ckl > li.sk::before,.qc-memo ul.ckl > li.sk::before,.dailybody ul.ckl > li.sk::before,.log-t ul.ckl > li.sk::before,.dcard .qt ul.ckl > li.sk::before,.dcard .mm ul.ckl > li.sk::before,.rs-p ul.ckl > li.sk::before{content:"✕";border-color:#cfc7c9;background:none;
    color:#b3a9ab;font-size:9.5px;line-height:11px;text-align:center;font-family:var(--fdisp)}
  .body ul.ckl > li.sk,.qc-body ul.ckl > li.sk,.qc-memo ul.ckl > li.sk,.dailybody ul.ckl > li.sk,.log-t ul.ckl > li.sk,.dcard .qt ul.ckl > li.sk,.dcard .mm ul.ckl > li.sk,.rs-p ul.ckl > li.sk{color:#b6adaf;text-decoration:line-through;

  .body ul.ckl > li.lidrag,.qc-memo ul.ckl > li.lidrag,.dailybody ul.ckl > li.lidrag{
    opacity:.45}
  .body blockquote,.qc-body blockquote,.qc-memo blockquote,.dailybody blockquote,.log-t blockquote,.dcard .qt blockquote,.dcard .mm blockquote,.rs-p blockquote{margin:6px 0;padding:2px 0 2px 12px;border-left:2.5px solid #ddd0d2;
    color:#5e5658}
  /* Memo 下の書式ボタン */
  .fmtb{font-size:11.5px;color:var(--muted);padding:4px 9px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);display:inline-flex;
    align-items:center;gap:5px;font-family:var(--fdisp)}
  .fmtb:hover{border-color:var(--brown);color:var(--brown)}
  .fmtwrap{display:inline-flex;gap:4px}
  /* Cards / Quotes / Read Log ページは全体を游明朝で */
  #view.serifpage,#view.serifpage *{font-family:var(--fserif)}
  .fmtico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.35;
    stroke-linecap:round;stroke-linejoin:round}
  /* memo / message log セクション */
  .sec{margin:9px 0 0 24px;border-top:1px solid var(--line2);padding-top:7px}
  .card.note .sec,.card.heading .sec{margin-left:22px}
  .sec-h{display:flex;align-items:center;gap:6px;color:#6e6668}
  .fold{width:16px;flex:0 0 16px;font-size:9px;color:#b3aea4;transition:transform .12s;padding:0}
  .fold.open{transform:rotate(90deg)}
  .sec-ico{font-size:11.5px}
  .sec-t{flex:1;min-width:0;font-size:12.5px;font-weight:700;letter-spacing:.03em;outline:none;

  .sec-t:focus{background:#fdfbfa;box-shadow:0 0 0 2px var(--accent-soft)}
  .sec-t:empty::before{content:attr(data-ph);color:#c4bcbe;font-weight:400}

    display:inline-flex;align-items:center;gap:5px}
  .lbico{width:13.5px;height:13.5px;fill:none;stroke:currentColor;stroke-width:1.3;
    stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;opacity:.85}
  .sec.bare{border-top:0;padding-top:0;margin-top:2px}
  .sec.noti .sec-h{margin-bottom:-4px}
  .card .sec.noti .body{margin-top:0}
  .meta.meta-b{margin-top:9px}
  .cdates{font-size:9.5px;color:#b6aeb0;margin:7px 0 0 22px;letter-spacing:.04em;
    font-family:"SFMono-Regular",Consolas,monospace;cursor:pointer;display:inline-block;
    padding:1px 4px;border-radius:5px}
  .cdates:hover{background:#f4f0ef;color:#6e6668}
  .card.note .meta.meta-b,.card.quote .meta.meta-b{margin-left:22px}

  /* Quote */

    flex:0 0 auto;white-space:nowrap;font-weight:600;

  .qc-body.qbg{background:var(--quote-bg);border:0;border-radius:11px;

  .qc-cite{text-align:right;font-size:12.5px;color:#6e6668;margin-top:16px;letter-spacing:.02em}

    margin-bottom:3px;word-break:break-word}
  .mtitle:hover{background:#fffefc}
  .mtitle:focus{background:#fffefc;box-shadow:0 0 0 1.5px #cfc8bd}
  .qc-sub{font-size:12px;color:#6e6668;margin-top:5px;letter-spacing:.02em}
  .rflags{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}

    display:inline-block;position:relative;background:var(--panel)}

    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  /* 再読は四角のチェックボックスで、間をあけてワイン色に */

  .rflag.sq:hover i{border-color:#8c3a52}
  .rflag.sq.on{color:#8c3a52}
  .rflag.sq.on i{background:#8c3a52;border-color:#8c3a52}
  .qbox select{border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:5px 4px;

  .card.read{background:#fbfaf9;border-color:#eae5e4}
  .card.book{background:#fdfcfa;border-color:#eae3df}
  .card.read .sec{margin-left:22px;border-top:0;padding-top:2px}
  .qc-ttl:empty::before,.mtitle:empty::before{content:attr(data-ph);color:#c4bcbe;font-weight:400}

  .qfoot .qreg{margin-left:auto}

  .qreg:hover{background:var(--brown);color:#fff}
  .cardtg{font-size:10.5px;padding:0 9px;height:20px;border-radius:20px;background:#f4f0ef;

  .cardtg.on:hover{background:#fbf2f4;color:#a05a72;border-color:#a05a72}
  .cdico{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round;flex:0 0 12px}
  /* Cards（ランダム表示） */
  .deck{max-width:640px;margin:10px auto 40px}
  .dcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:34px 34px 28px;
    box-shadow:0 2px 4px rgba(30,25,15,.05),0 14px 34px rgba(30,25,15,.09)}
  /* うしろにもう一枚重なっているように */
  .dcard::before,.dcard::after{content:"";position:absolute;inset:0;z-index:-1;
    border:0;border-radius:16px;filter:blur(.4px)}
  .dcard::before{background:#f8f4ee;
    transform:rotate(1.6deg) translate(4px,4px);
    box-shadow:0 6px 16px rgba(30,25,15,.06)}
  .dcard::after{background:#faf6f0;
    transform:rotate(-2.2deg) translate(-6px,8px);
    box-shadow:0 8px 20px rgba(30,25,15,.07)}
  .dcard .kind{font-size:10.5px;letter-spacing:.1em;color:#a7a0a2;font-weight:700;margin-bottom:14px}

  .dcard .ttl{font-size:16px;font-weight:600;margin-bottom:10px;line-height:1.6}
  .dcard .qcard{padding:0}
  .dcard .qc-body{font-size:15px;line-height:1.95}

  .dcard .mm{margin-top:16px;padding-top:13px;border-top:1px solid var(--line2);
    font-size:13px;color:#5f585a;white-space:pre-wrap;line-height:1.85}

    align-items:center;justify-content:center}

    margin:-14px -14px 4px 0}
  .dsrc b{cursor:pointer}
  .dsrc b:hover{text-decoration:underline}
  .dbtn{margin-top:20px;display:flex;gap:10px;justify-content:center;align-items:center}
  .dbtn .btn{padding:9px 22px;border-radius:10px;letter-spacing:.06em;
    font-family:var(--fdisp);font-size:12.5px}
  /* 時間計測 */
  .chip.timer{cursor:pointer;background:#f4eefb;color:#7b52c0;padding:0 9px;font-size:10px}
  .tmico{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
  .chip.tot .tmico{opacity:.7}
  .chip.timer:hover{background:#ece0f7}
  .chip.timer.on{background:#fdeeee;color:#c0392b;font-weight:700;font-size:11px}
  .chip.tot{cursor:pointer}
  .chip.done{background:#eef6ee;color:#3f8046;cursor:pointer}
  .pdfs{display:flex;flex-direction:column;gap:6px;margin-top:6px}

  .pdfnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pdfsz{color:var(--muted);font-size:11px;white-space:nowrap}
  .pdfrow .x{opacity:0;color:#c0b8ba;font-size:13px;padding:0 2px}
  .pdfrow:hover .x{opacity:1}

  .pdfbox iframe{width:100%;height:520px;border:0;display:block}
  .times{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .tlog{display:flex;align-items:center;gap:5px;font-size:12px;color:#5f585a;

  .trow.head .rz:hover::after,.trow.head .rz.act::after{background:var(--brown);top:0;bottom:0}
  .ttable{overflow:visible}
  /* 円グラフ */

  .repbtn{font-size:13px;line-height:1;padding:3px 0;border-radius:7px;text-align:center;width:100%}

  .repbtn.ok{color:#3f8046;font-weight:700}
  .repnone{color:#c9c1c3;text-align:center;font-size:12px}

  .cal{font-family:var(--fdisp);letter-spacing:.02em;background:#efeae2;border:1px solid #e3dbd3;border-radius:11px;padding:10px 12px 8px;width:250px;flex:0 0 250px}

  .wrow .tinput{flex:1 1 auto;min-width:0;width:auto;padding:6px 9px;font-size:13px}
  .pop .wrow .wx{width:24px;flex:0 0 24px;padding:0;justify-content:center;
    color:#c0b8ba;font-size:14px;background:none}
  .pop .wrow .wx:hover{color:#c0392b;background:#f7efef}
  .swatches{display:flex;gap:6px;padding:6px 10px 8px}
  .sw{width:19px;height:19px;border-radius:50%;border:1px solid rgba(0,0,0,.08);flex:0 0 19px}
  .sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
  /* カラー凡例（カテゴリ） */
  .cats{padding:2px}
  .cat{display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;border-radius:7px;font-size:13px}
  .cat:hover{background:#f5f1f0}
  .cat.on{background:var(--accent-soft);font-weight:700}
  .cat .tick{margin-left:auto;color:var(--accent);font-size:11px}
  .chip.cat2{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .chip.cat2 i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .tagwrap{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center}
  .chip.tag.ghost.hov{opacity:0;transition:opacity .12s}
  .tagwrap:hover .chip.tag.ghost.hov,
  .card:hover .chip.tag.ghost.hov,
  .rwrap:hover .chip.tag.ghost.hov{opacity:1}
  .chip.cat2.ghost,.chip.tag.ghost{background:#f4f0ef;color:#a7a0a2;transition:opacity .1s;
    padding:0 8px;height:20px}
  /* Status は最初から表示、Tag はカーソルを合わせたときだけ */
  .chip.tag.ghost{opacity:0}
  .card:hover .chip.tag.ghost,.rwrap:hover .chip.tag.ghost{opacity:1}
  .chip.cat2.ghost:hover{background:var(--accent-soft);color:var(--accent)}
  .chip.tag.ghost:hover{background:#e6e1e0;color:#5c5457}
  /* ボードの色 */
  .bdot{width:11px;height:11px;border-radius:3.5px;border:1px solid rgba(0,0,0,.1);
    flex:0 0 11px;cursor:pointer;background:#cdb4bb}
  .btn.dot{display:flex;align-items:center;gap:7px}
  .grp-h .bdot{width:9px;height:9px;border-radius:3px}
  .legend{display:flex;flex-wrap:wrap;gap:4px 8px;padding:2px 8px 6px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:#6b655c}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  /* date / repeat panel */
  .dpanel{padding:8px 10px 10px;width:286px}
  .dpanel h4{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
  .drow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .drow label{font-size:12.5px;color:#6e6668;width:52px;flex:0 0 52px}
  .drow input[type=date],.drow select,.drow input[type=number]{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12.5px;
    background:var(--panel);outline:none}
  .drow input:focus,.drow select:focus{border-color:var(--accent)}
  .drow input[type=number]{flex:0 0 54px}
  .drow.pgrow{gap:3px}
  .drow.pgrow label{width:auto;flex:0 0 auto;font-size:12.5px;color:#6e6668;margin:0}
  .drow.pgrow input[type=number]{flex:1 1 auto;min-width:0;width:100%;padding:5px 6px;
    text-align:center;font-variant-numeric:tabular-nums}
  .drow.pgrow .pgsep{color:#a9a0a2;font-size:12px;padding:0 3px}
  .allday{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#6e6668;
    margin:0 0 8px 60px;cursor:pointer;user-select:none}
  .allday input{width:14px;height:14px;accent-color:var(--brown);cursor:pointer}
  .drow input[type=password]{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel);font-size:17px;letter-spacing:.35em;
    text-align:center;outline:none;color:var(--ink)}
  .drow input[type=password]:focus{border-color:var(--brown);box-shadow:0 0 0 2px #ece4da}
  .drow input[type=time]{flex:0 0 92px;padding:5px 6px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel);font-size:12.5px}
  .drow input[type=time]:focus{border-color:var(--accent);outline:none}
  .quick{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 9px 60px}
  .quick button{font-size:11.5px;padding:3px 8px;border-radius:6px;background:#f4f0ef;color:#6e6668;width:auto}
  .quick button:hover{background:var(--accent-soft);color:var(--accent)}
  .wdays{display:flex;gap:4px;margin:0 0 8px 60px}
  .wdays button{width:26px;height:26px;padding:0;border-radius:50%;font-size:11.5px;
    background:#f4f0ef;color:#6e6668;display:flex;align-items:center;justify-content:center}
  .wdays button.on{background:var(--accent);color:#fff}
  .wdays button.sun{color:#c0392b}.wdays button.sat{color:#3d6fe0}
  .wdays button.on.sun,.wdays button.on.sat{color:#fff}
  .hint{font-size:11.5px;color:var(--muted);margin:0 0 8px 60px;line-height:1.5}
  .dfoot{display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--line2);padding-top:8px;margin-top:2px}
  .dfoot button{font-size:12px;padding:4px 9px;border-radius:7px;color:var(--muted);width:auto}
  .dfoot button:hover{background:#f5f1f0;color:var(--ink)}
  /* tag panel */
  .tpanel{padding:10px 12px;width:262px;max-width:88vw;box-sizing:border-box}
  .tlist{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .tlist .chip{display:flex;align-items:center;gap:5px}
  .tlist .chip b{cursor:pointer;color:#9aa2ae;font-weight:400}
  .tinput{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:14px;outline:none;background:var(--panel);color:var(--ink)}
  .tinrow{display:flex;gap:6px;align-items:center;margin:2px 0 4px;width:100%;min-width:0}
  .pop .tinadd{flex:0 0 auto;width:auto;border:1px solid var(--brown);color:var(--brown);
    border-radius:8px;padding:7px 12px;font-size:12.5px;white-space:nowrap;
    justify-content:center;text-align:center}
  .tinadd:hover{background:var(--brown);color:#fff}
  .swnew{width:19px;height:19px;border-radius:50%;border:1px dashed #b9b0b2;display:inline-flex;
    align-items:center;justify-content:center;font-size:11px;color:#8b8285;cursor:pointer;
    position:relative;overflow:hidden;flex:0 0 19px}
  .swnew input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0;border:0}
  .tinput:focus{border-color:var(--accent)}
  .tsug{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .pop .tsug button{font-size:11.5px;padding:0 9px;height:21px;line-height:1;border-radius:20px;
    background:#f4f0ef;color:#6b655c;width:auto;display:inline-flex;align-items:center}
  .pop .tsug button:hover{filter:brightness(.95)}
  .tlist .chip{height:22px;gap:6px}
  .tlist .dot{width:11px;height:11px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.12);flex:0 0 11px}
  .tswatch{display:flex;gap:6px;flex-wrap:wrap;padding:6px 2px 8px;border-top:1px solid var(--line2);margin-top:4px}
  .tswatch .sw{width:17px;height:17px;flex:0 0 17px}

  /* ---------- rich text toolbar ---------- */
  .rtbar{position:fixed;z-index:90;display:none;gap:2px;background:#2f2c28;border-radius:9px;
    padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.24);align-items:center}
  .rtbar button{color:#fff;font-size:13px;width:28px;height:26px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;padding:0}
  .rtbar button:hover{background:#4b463f}
  .rtbar .sep{width:1px;height:18px;background:#4b463f;margin:0 3px}
  .rtbar .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
  .rtbar button.w{width:auto;padding:0 8px;font-size:12px}
  /* 文字サイズ（選択範囲に適用） */
  .fs-s{font-size:12px}
  .fs-n{font-size:14.5px}
  .fs-l{font-size:19px;line-height:1.5}

  /* ---------- task page ---------- */
  .tools{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .search{border:1px solid var(--line);border-radius:9px;padding:7px 11px;width:240px;
    background:var(--panel);outline:none;font-size:13px}
  .search:focus{border-color:var(--brown);box-shadow:0 0 0 2px #ece4da}
  .clsel{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel);
    outline:none;font-size:13px;color:var(--ink);max-width:190px}
  .clsel:focus{border-color:var(--brown);box-shadow:0 0 0 2px #ece4da}
  .clsel.on{border-color:var(--brown);background:#fbf6ef}
  .seg{display:flex;background:#eae5e4;border-radius:9px;padding:2px}
  .seg button{padding:5px 12px;border-radius:7px;font-size:12.5px;color:#6e6668;white-space:nowrap}
  .seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
  .grp{margin-bottom:26px}
  .gsel{display:flex;align-items:center;gap:6px}
  .gsel label{font-size:11.5px;color:var(--muted)}
  .gsel select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;
    background:var(--panel);outline:none;color:#5f585a}
  .gsel select:focus{border-color:var(--brown)}
  .gdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
  .grp-h{display:flex;align-items:baseline;gap:9px;padding:0 0 9px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .grp-h b{font-size:14px;font-weight:600}
  .grp-h span{font-size:11.5px;color:var(--muted)}
  .rwrap{position:relative;border:1px solid var(--line);border-radius:11px;background:var(--panel);
    margin-bottom:8px;box-shadow:0 1px 1px rgba(30,25,15,.03)}
  .rwrap::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
    border-radius:0 3px 3px 0;background:var(--c,transparent)}
  .rwrap > .qribbon{top:-4px;right:14px}
  .rwrap > .qribbon.task{background:#c9a227}
  /* Action ページはカードを2枚ずつ並べる */
  .rowgrid{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px;align-items:start}
  .rowgrid .rwrap{margin-bottom:0}
  .rwrap:hover{border-color:#dcd8d0;box-shadow:var(--shadow)}
  .row{display:flex;align-items:flex-start;gap:9px;padding:10px 12px}
  .row .tw{flex:1;min-width:0}
  .row .bdline{font-size:11px;display:flex;gap:5px;margin-bottom:2px;cursor:pointer;
    color:var(--muted);letter-spacing:.02em}
  .row .bdline:hover{text-decoration:underline}
  .row .tline{display:flex;align-items:flex-start;gap:9px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
  .row .tline .ck{margin-top:3px}
  .row .tt{color:#1f1a1c;font-size:14px;word-break:break-word;flex:0 1 auto;min-width:0}
  .row .bdrow{display:flex;align-items:center;gap:16px;margin-bottom:2px}
  .row .bdrow .bdline{margin-bottom:0}
  .row .bdrow > .chip{flex:0 0 auto}
  /* 計測ボタンと合計時間はタイトル行の右端に */
  .row .tmwrap{margin-left:auto;padding-left:24px;display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .row .rdel{margin-left:auto;flex:0 0 auto;width:22px;height:20px;line-height:1;font-size:15px;
    color:#b6aeb0;border-radius:6px;opacity:0;transition:opacity .15s}
  .row .tmwrap + .rdel{margin-left:10px}
  .rwrap:hover .rdel{opacity:1}
  .row .rdel:hover{color:#a5555f;background:#f2eae9}
  .row.done .tt,.row.done .tt *{text-decoration:line-through;color:var(--muted)}
  .row .sm{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row .sm + .row-note{margin-top:7px}
  .row .sm2{margin-top:5px}
  .rgrip{width:14px;flex:0 0 14px;color:#d5cdcf;font-size:11px;text-align:center;padding-top:3px;
    cursor:grab;opacity:0;transition:opacity .12s}
  .rwrap:hover .rgrip{opacity:1}
  .rgrip:active{cursor:grabbing}
  .rwrap.rdrag{opacity:.4}
  .rwrap.rdrop{box-shadow:inset 0 2px 0 var(--brown)}
  .rwrap.rdrop-b{box-shadow:inset 0 -2px 0 var(--brown)}
  .caret{width:16px;flex:0 0 16px;color:#b3aea4;font-size:10px;text-align:center;padding-top:4px;
    transition:transform .12s;cursor:pointer}
  .caret.open{transform:rotate(90deg)}
  .caret.none{visibility:hidden}
  .rsubs{margin:0 0 8px 26px;display:flex;flex-direction:column;gap:5px;
    border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:#faf8f7}
  /* サブタスクが1つも無いときは枠を出さない */
  .rsubs.bare{border:0;background:none;padding:0 0 0 2px;margin-bottom:4px}
  .rsub{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#2a2426}
  .rsub .t{color:#2a2426;flex:1;outline:none;padding:0 2px;border-radius:4px;word-break:break-word}
  .rsub .t:focus{background:#fdfbfa}
  .rsub.done .t,.rsub.done .t *{text-decoration:line-through;color:var(--muted)}
  .rsub .x{opacity:0;color:#c0b8ba;font-size:13px;padding:0 3px}
  .rsub:hover .x{opacity:1}
  .rsubadd{font-size:12.5px;color:var(--muted);padding:2px 3px;border-radius:6px;text-align:left;
    opacity:0;align-self:flex-start}
  .rwrap:hover .rsubadd{opacity:1}
  .rsubadd:hover{color:var(--accent);background:var(--accent-soft)}
  .radds{display:flex;gap:10px;margin:2px 0 0 26px;opacity:0}
  .rwrap:hover .radds{opacity:1}
  .radds button{font-size:12.5px;color:var(--muted);padding:2px 5px;border-radius:6px}
  .radds button:hover{color:var(--accent);background:var(--accent-soft)}
  .ocadds{flex-wrap:wrap;align-items:center;gap:8px}
  .ocadds .raddlb{font-size:11px;color:#b0a7a9;letter-spacing:.04em}
  .ocadds button{border:1px dashed #ddd4d5;padding:3px 10px;border-radius:20px}
  /* タスク一覧の中のメモ / Message Log */
  .rwrap .sec{margin:6px 0 0 26px;max-width:620px}
  .rwrap .sec .body{margin:5px 0 0 0;min-height:44px}
  .rwrap .sec:last-child{padding-bottom:8px}
  .rsubinput{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;outline:none;
    width:100%;max-width:420px}
  .rsubinput:focus{border-color:var(--accent)}
  .scroll > .empty{color:var(--muted);text-align:center;padding:60px 0;font-size:13.5px}
  .bar{width:52px;height:4px;border-radius:4px;background:#e8e1df;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar i{display:block;height:100%;background:#6aa571}
  /* ===== スマホ・タブレット ===== */
  /* Tasks は明朝を使わず、全体と同じ書体で */
  body.app-task, body.app-task .qc-body, body.app-task .qc-memo, body.app-task .dailybody,
  body.app-task .body.dailybody, body.app-task .kidcite,
  body.app-task .dcard .qt, body.app-task .dcard .mm, body.app-task .rs-p, body.app-task .lc-p,
  body.app-task .qbox, body.app-task .qbox *, body.app-task .qcard, body.app-task .qcard *,
  body.app-task #view.serifpage, body.app-task #view.serifpage *,
  body.app-task .repnote.body{font-family:var(--fdisp)}
  body.app-task .body.dailybody{font-weight:400}
  @media (max-width: 860px){
    /* スマホのアドレスバーぶんを差し引いた実高さで */
    html,body{height:100%;overflow:hidden}
    .app{height:100dvh;min-height:100dvh}
    .side{position:fixed!important;left:0;top:0;bottom:0;z-index:120;
      width:84vw!important;max-width:330px;flex-basis:auto!important;
      display:flex!important;
      transform:translateX(-102%);transition:transform .22s ease;
      box-shadow:0 0 40px rgba(30,25,15,.28)}
    .side.hide{display:flex!important}
    body.mnav .side{transform:translateX(0)!important}
    body.mnav::after{content:"";position:fixed;inset:0;z-index:110;background:rgba(30,25,15,.35)}
    #sideShow{display:flex!important;align-items:center;justify-content:center;
      position:fixed;left:8px;top:9px;z-index:130;width:38px;height:38px;font-size:17px}
    body.nosidebar #sideShow{display:flex!important}
    .side-rz,.rside,.rside-rz,#rsideShow{display:none!important}
    .main{width:100%}
    .topbar{height:52px;flex:0 0 52px;padding-left:54px;padding-right:12px}
    .title{font-size:16px}
    .scroll{padding:14px 13px calc(120px + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    /* ボードは1列ずつ縦に */
    .cols{flex-direction:column;gap:22px}
    .col{flex:1 1 auto!important;width:auto!important;max-width:none}
    .col .rz,.colrz{display:none!important}
    /* Daily / Read Log は上下に */
    .dailywrap,.tlrow{flex-direction:column;align-items:stretch}
    .dailyside,.readrow > .cal,.cal{width:auto!important;flex:1 1 auto!important;max-width:none}
    .dailymain,.rdmain{max-width:none;width:auto}
    .dailymain{padding:14px 14px 18px;border-radius:12px}
    .dailylist{max-height:none}
    .qrand{flex:1 1 auto!important;width:auto!important}
    /* 表は横スクロール */
    .ttable,.dtable{display:block;overflow-x:auto;white-space:nowrap}
    .pie,.chartbox{flex:1 1 auto!important;width:auto!important;margin-bottom:12px}
    /* 入力・ボタンを大きく */
    .tools{gap:6px}
    .search{width:100%;font-size:16px;padding:9px 12px}
    .clsel,.gsel select{font-size:15px}
    .tlog{flex-wrap:wrap;gap:4px 6px;padding:6px 8px}
    .tlog input[type=date]{flex:1 1 100%;width:100%;font-size:12px}
    .tlog input[type=time]{flex:0 0 auto;width:auto}
    .tlog .dur{margin-left:auto}
    .tlog .x{opacity:1;flex:0 0 auto}
    .rtbar{max-width:calc(100vw - 12px);flex-wrap:wrap;justify-content:center}
    .rtbar button{width:30px;height:30px}
    .rtbar button.w{width:auto;padding:0 9px}
    .pop{max-width:calc(100vw - 16px);box-sizing:border-box}
    .tpanel{max-width:100%}
    .tpanel .tinput{min-width:0}
    .seg{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
    .seg button{padding:7px 9px;font-size:12.5px;white-space:nowrap;flex:0 0 auto}
    .nav{padding:11px 10px;font-size:15px}
    .chip{height:23px;min-height:23px;max-height:23px;font-size:11.5px;padding:0 9px}
    .card{padding:13px 14px}
    .ctitle,.row .tt{font-size:15px}
    .body,.log-t{font-size:15px}
    .dailybody{font-size:16px}
    .add,.rsubadd{padding:10px}
    .ck{width:18px;height:18px}
    /* ポップアップは画面内に収める */
    /* ポップアップは下から出るシート風に。引き出しより手前へ */
    .pop{z-index:200!important;position:fixed!important;
      left:50%!important;right:auto!important;transform:translateX(-50%);
      top:auto!important;bottom:14px!important;
      width:94vw;max-width:94vw;max-height:76vh;overflow:auto;
      box-shadow:0 -6px 40px rgba(30,25,15,.3)}
    .dpanel{width:auto!important;max-width:none}
    .pop button{font-size:14.5px;padding:10px 12px}
    .pop .srow input,.pop .drow input,.pop .strow input{font-size:16px}
    .deck{max-width:none}
    .dcard{padding:22px 20px 20px}
    .dcard::before,.dcard::after{display:none}
    .side-foot{gap:6px}
    .mini{padding:8px 11px;font-size:12.5px}
    /* 右サイドは使わない */
    body.norside .topbar{padding-right:12px}
  }
  @media (max-width: 860px){
    /* はみ出し対策 */
    .scroll,.scroll *{max-width:100%}
    .scroll img{max-width:100%!important;height:auto!important}
    .card,.colitem,.rwrap,.qcard,.qbox,.dcard,.dailymain{width:auto!important;
      max-width:100%;box-sizing:border-box}
    .drop,.dailycards .drop,.cols,.col{min-width:0}
    .card,.rwrap,.sec,.subs,.rsubs,.meta,.sm,.bdrow,.tline{flex-wrap:wrap;min-width:0}
    .row .tmwrap{margin-left:0;padding-left:0;margin-top:4px}
    .row .rdel{opacity:1}
    .qbox{padding:0 4px}
    .qbox .qt{margin:0 0 6px 0;padding:12px 12px}
    .qcard{padding:2px 4px 6px}
    .card.chat .qc-body,.card.chat .airep,.card.chat .repnote.body{max-width:94%}
    .qc-body.qbg{margin:10px 0 0 0;padding:13px 12px}
    .body{margin-left:0!important}
    .card.task .body,.card .sec .body{margin-left:0}
    .subs,.rsubs{margin-left:0!important}
    .thead,.tnote{margin-left:0!important}
    .ttable .trow{white-space:normal}
    .lc,.lcard{max-width:100%}
    .dailyside{margin-bottom:14px}
    .daily-h{padding-bottom:8px;margin-bottom:10px}
    pre,code{white-space:pre-wrap;word-break:break-word}
    .scroll{word-break:break-word;overflow-wrap:anywhere}
    /* Daily Memo の入力まわり */
    .daily-h{flex-wrap:wrap;align-items:center;gap:8px;row-gap:8px;
      padding-bottom:10px;margin-bottom:12px}
    .daily-h b{font-size:17px;flex:0 0 auto}
    .daily-h > .btn{margin-left:0!important;flex:0 0 auto}
    .daily-h .wx{flex:1 1 100%;margin-left:0;justify-content:flex-start;flex-wrap:wrap}
    .dailybody{min-height:120px;padding:2px 0;font-size:16px;line-height:1.95}
    .dailymain > .qfoot{flex-wrap:wrap;gap:8px;margin-top:10px}
    .fmtwrap{flex-wrap:wrap;gap:6px}
    .imgadd,.fmtb{padding:7px 12px;font-size:12.5px}
    .dailycards{margin-top:14px;padding-top:12px}
    .dailycards .add{width:100%}
    .dl-item{padding:9px 10px}
    /* ボタンの文字が折り返さないように */
    .qfoot{flex-wrap:wrap;gap:8px;align-items:center}
    .imgadd,.fmtb,.qreg,.btn,.add,.rsubadd,.stadd{white-space:nowrap;flex:0 0 auto}
    .qreg{margin-left:auto;padding:7px 18px}
    .fmtwrap{display:inline-flex;flex:0 0 auto}
    /* カレンダー → 入力欄 → これまでのメモ の順に */
    .dailyside{display:contents}
    .dailywrap > .cal,.dailyside > .cal{order:1;margin-bottom:12px}
    .dailymain{order:2}
    .dailylist{order:3;margin-top:14px;max-height:42vh;overflow-y:auto;padding:8px 5px}
    /* 横にはみ出さない */
    .main,.scroll{max-width:100vw;overflow-x:hidden!important}
    .ttable{overflow-x:auto!important;overflow-y:hidden}
    .dailywrap > *,.dailymain,.card,.qcard,.colitem,.rwrap,.sec,.qbox{min-width:0}
    /* No. ・日付・種類 の行 */
    .qc-h{letter-spacing:.03em;font-size:10.5px;gap:8px;align-items:flex-start}
    .qc-h > span:first-child{overflow-wrap:anywhere;line-height:1.6}
    .qc-act{margin-top:-2px}
    .qc-ttl{font-size:15.5px;margin-top:9px}
    /* Read のチェック */
    .rflags{gap:9px 14px;margin:9px 0 4px}
    .rflag{font-size:13px}
    .rflag.sq{margin-left:0;padding-right:0}
    /* 計測ボタン */
    .card .meta.meta2{margin-left:0;margin-top:6px}
    .qcard,.qbox{padding-left:2px;padding-right:2px}
    /* 表は1件ずつのカード表示に（横スクロール不要） */
    .rowgrid{grid-template-columns:1fr;gap:10px}
    .ocwrap{flex-direction:column}
    .onecard{flex:1 1 auto!important;width:auto!important;max-width:none}
    .ocside{flex:1 1 auto!important;width:auto!important}
    /* Bookshelf は1列に */
    .cols.shelfcols .drop{columns:1!important}
    .cols.shelfcols .col{width:auto!important}
    /* 上のボタンが重ならないように */
    .topbar{height:auto!important;min-height:52px;flex:0 0 auto!important;flex-wrap:wrap;
      padding-top:6px;padding-bottom:8px;align-items:center;row-gap:6px}
    #topActions{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:2px}
    #topActions .btn{padding:6px 11px;font-size:12.5px}
    .title{flex:1 1 auto;min-width:0}
    /* 本のカードの中身 */
    .brow-star{flex-wrap:wrap;gap:8px}
    .bstat-row{gap:6px}
    .brows{flex-wrap:wrap}
    .brows .bck{flex:0 0 auto}
    .brows input[type=text]{flex:1 1 120px}
    .tlog{flex-wrap:wrap;gap:6px}
    .tlog input[type=date]{flex:1 1 120px}
    .tlog input[type=time]{flex:0 0 84px}
    .pinwrap{flex-direction:column}
    .pincolm{width:100%}
    .ttable{overflow:visible!important;white-space:normal}
    .ttable .trow{min-width:0!important;display:flex!important;flex-wrap:wrap;
      gap:3px 10px;align-items:baseline;padding:11px 13px;white-space:normal}
    .ttable .trow.head{display:none!important}
    .ttable .trow > span:empty{display:none}
    .ttable .trow .dt{flex:0 0 100%;font-size:11px;color:var(--muted);margin-bottom:2px}
    .ttable .trow .nm{flex:0 1 auto;font-size:14.5px;color:var(--ink);
      overflow:visible;text-overflow:clip}
    .ttable .trow .bd{flex:0 0 auto;font-size:12.5px}
    .ttable .trow .tm{font-size:12px;color:var(--muted)}
    .ttable .trow .d{margin-left:auto;font-size:13.5px;text-align:right;flex:0 0 auto}
    .ttable .trow .x{opacity:1;margin-left:6px}
    .ttable .trow.sub{gap:6px 10px}
    .ttable .trow.sub > span{grid-column:auto!important}
    .ttable .trow.sub .bsum{margin-left:0}
    .dtable{display:block;overflow-x:auto}
    .dtable table,.dtable thead,.dtable tbody{min-width:640px}
    /* グラフ */
    .pie{gap:14px}
    .pie svg{width:112px;height:112px;flex:0 0 112px}
    .pie .lg{font-size:12px}
    .chartbox h5,.pie h5{font-size:11.5px}
    .sum{flex-wrap:wrap;gap:10px 16px;font-size:12.5px}
    .sum b{font-size:17px}
    .daysum{margin-top:-4px}
    .ds-lb{letter-spacing:.02em}
  }
  @media (max-width: 520px){
    .scroll{padding:12px 10px 120px}
    .tools{flex-direction:column;align-items:stretch}
    .tools .seg{width:100%;justify-content:center}
    .daily-h{flex-wrap:wrap;gap:6px}
    .daily-h b{font-size:17px}
    .wx button{width:31px;height:31px}
  }

  /* ---------- One Step パネル ---------- */
  #navTimer .nico.paw{fill:var(--brown);stroke:none;width:15px;height:13px}
  #navTimer:hover .nico.paw{fill:var(--ink)}
  #navTimer.on,#navTimer.live{background:var(--bo,var(--panel));color:var(--ink);
    font-weight:500;box-shadow:var(--shadow)}
  #navTimer.on .ico,#navTimer.on .nico{stroke:none;color:inherit}
  .timer-panel{position:fixed;top:0;right:0;width:432px;max-width:100vw;height:100vh;
    background:#FAF6EF;border-left:1px solid var(--line);
    box-shadow:-12px 0 32px -18px rgba(30,25,15,.35);
    z-index:900;display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
  .timer-panel.open{transform:translateX(0)}
  .timer-panel-head{display:flex;align-items:center;justify-content:space-between;
    padding:11px 14px;border-bottom:1px solid #E7DFD2;
    font-family:var(--fdisp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:#A79B8D}
  .timer-head-btns{display:flex;align-items:center;gap:2px}
  .timer-reset-w{color:#A79B8D;font-size:15px;line-height:1;padding:3px 7px;border-radius:6px}
  .timer-reset-w:hover{background:#F3EDE2;color:var(--ink)}
  .timer-close{color:#A79B8D;font-size:20px;line-height:1;padding:0 6px;border-radius:6px}
  .timer-close:hover{background:#F3EDE2;color:var(--ink)}
  .timer-panel iframe{flex:1;width:100%;border:0}
  .timer-rz{position:absolute;top:0;left:0;width:8px;height:100%;cursor:col-resize;z-index:20}
  .timer-rz::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
  .timer-rz:hover::after,.timer-rz.act::after{background:var(--accent)}
  .timer-panel.rz{transition:none}
  .timer-panel.rz iframe{pointer-events:none}   /* iframe がドラッグを吸わないように */
  /* running indicator on the sidebar item */
  .tm-badge{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;
    letter-spacing:.02em}
  .tm-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;
    animation:tmPulse 1.6s ease-in-out infinite}
  .tm-badge.working{background:#cbe6ec;color:#26707f}
  .tm-badge.ready{background:#e6ddcb;color:#8a6c3f}
  .tm-badge.break{background:#ded7d4;color:#7a6f6b}
  .tm-badge.break::before{animation:none;opacity:.55}
  @keyframes tmPulse{0%,100%{opacity:1}50%{opacity:.25}}
  #navTimer.live{background:var(--bo,var(--panel));box-shadow:var(--shadow)}
  @media (max-width:560px){.timer-panel{width:100vw}}

  /* ---------- Daily Discoveries ---------- */
  .card.learn .body{background:#f9f2f3}
  .card.learn .body:hover,.card.learn .body:focus{background:#f4e9eb}
  .card.learn .qbox{padding:0 2px}
  .card.learn .qbox > .body{background:#f9f2f3;box-shadow:0 0 0 1.5px #ebdee0}
  .card.learn .qbox > .body:focus{box-shadow:0 0 0 1.5px #dcc5ca}
  /* 登録済みのメモ：点線は出さず、うすいピンクの枠だけ */
  .card.learn .qcard{padding:2px 2px 6px}
  .card.learn .qc-body{border-top:0;margin-top:10px;background:#f9f2f3;
    border-radius:10px;padding:12px 14px}
  .lgrid{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:14px;align-items:start}
  .lgrid .colitem{width:auto;margin:0}
  .ltitle{font-family:var(--fdisp);font-size:13px;font-weight:700;color:#7a5560;
    letter-spacing:.03em;margin:4px 0 6px;word-break:break-word}
  .lrand{width:560px}
  .lrand h5{text-align:center;margin:2px 0 10px;font-family:var(--fserif);font-weight:600}
  .qrand .lbig{padding:26px 24px 22px}
  /* Today's one の文字は Quotes と同じ（游明朝・大きめ） */
  .qrand .lbig .body,.qrand .lbig .qc-body{font-family:var(--fserif);font-weight:500;
    font-size:14.5px!important;line-height:1.95!important}
  .qrand .lbig .ltitle{font-family:var(--fserif);font-size:14.5px;margin-bottom:8px}
  .lrand .dbtn{margin-top:14px;text-align:center}
  @media (max-width:1400px){ .lgrid{grid-template-columns:repeat(3, minmax(0, 1fr))} }
  @media (max-width:1080px){ .lgrid{grid-template-columns:repeat(2, minmax(0, 1fr))} }
  @media (max-width:720px){ .lgrid{grid-template-columns:1fr} .lrand{width:auto} }


  /* ---------- ページの線の上を歩く犬 ---------- */
  .dogwalk{position:relative;height:0;overflow:visible;pointer-events:none;z-index:6}
  .walker{position:absolute;left:0;top:0;width:34px;height:34px;
    margin-left:-17px;margin-top:-17px;pointer-events:auto;cursor:pointer;
    transition:transform .25s linear}
  /* ふきだしは One Step と同じ書体・同じ色づかい */
  .dogsay{position:absolute;left:0;top:0;transform:translate(-50%,-100%) scale(.8);
    background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:5px 11px;font-family:'Comfortaa','Zen Kaku Gothic New',cursive;
    font-size:11px;font-weight:400;line-height:1.5;color:#7C6247;white-space:nowrap;
    text-align:center;pointer-events:none;
    opacity:0;z-index:9;
    transition:opacity .45s ease, transform .45s cubic-bezier(.2,1.6,.4,1)}
  .dogsay.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
  .dogsay::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;
    transform:translateX(-50%) rotate(-45deg);background:#fff;
    border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
  .walker svg{width:100%;height:100%;overflow:visible;display:block}
  .dog-body{fill:#C9A87C}
  .dog-dark{fill:#A6845C}
  .dog-light{fill:#EBDCC4}
  .dog-nose{fill:#5C4632}
  .walker .bob{animation:dogBob .52s ease-in-out infinite;transform-origin:17px 24px}
  .walker .leg-a{animation:legA .52s ease-in-out infinite}
  .walker .leg-b{animation:legB .52s ease-in-out infinite}
  .walker .tail{animation:tailWag .42s ease-in-out infinite;transform-origin:6px 15px}
  .walker .pose{transition:transform .35s ease}
  .walker.still .bob,.walker.still .leg-a,.walker.still .leg-b{animation:none}
  .walker.sit .bob,.walker.sit .leg-a,.walker.sit .leg-b{animation:none}
  .walker.sit .pose{transform-box:view-box;transform-origin:24px 26px;transform:rotate(-20deg)}
  .walker.sit rect[x="8.5"],.walker.sit rect[x="11.5"]{
    transform-box:fill-box;transform-origin:50% 0;transform:translateY(2px) rotate(-72deg)}
  .walker.sit rect[x="11.5"]{fill:#A6845C}
  .walker.sit.coat-beige rect[x="11.5"]{fill:#A98B5F}
  .walker.sit.coat-black rect[x="11.5"]{fill:#332C25}
  .walker.sit.coat-brown rect[x="11.5"]{fill:#6E5339}
  .walker.sit .tail{animation-duration:.75s}
  .walker.lie .bob,.walker.lie .leg-a,.walker.lie .leg-b{animation:none}
  .walker.lie .pose{transform-box:view-box;transform:translateY(6.5px)}
  .walker.lie .leg-a,.walker.lie .leg-b{
    transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.34)}
  .walker.lie .tail{animation-duration:1.2s}
  .walker.sleep .bob,.walker.sleep .leg-a,.walker.sleep .leg-b,.walker.sleep .tail{animation:none}
  .walker.sleep .pose{transform-box:view-box;transform:translateY(6.5px)}
  .walker.sleep .leg-a,.walker.sleep .leg-b{
    transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.34)}
  .walker.sleep circle.dog-nose:last-of-type{
    transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(.22)}
  @keyframes dogBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
  @keyframes legA{0%,100%{transform:translateX(1.6px)}50%{transform:translateX(-1.6px)}}
  @keyframes legB{0%,100%{transform:translateX(-1.6px)}50%{transform:translateX(1.6px)}}
  @keyframes tailWag{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
  /* 子犬 */
  .walker.pup{width:20px;height:20px;margin-left:-10px;margin-top:-10px;opacity:.94;
    animation:pupJoin .6s cubic-bezier(.2,1.4,.35,1)}
  .walker.pup.p2{width:18px;height:18px;margin-left:-9px;margin-top:-9px}
  .walker.pup.p3{width:16px;height:16px;margin-left:-8px;margin-top:-8px}
  .walker.pup.coat-beige .dog-body{fill:#C6A97F}
  .walker.pup.coat-beige .dog-dark{fill:#A98B5F}
  .walker.pup.coat-beige .dog-light{fill:#E2D0B2}
  .walker.pup.coat-black .dog-body{fill:#4C4239}
  .walker.pup.coat-black .dog-dark{fill:#332C25}
  .walker.pup.coat-black .dog-light{fill:#7A6E62}
  .walker.pup.coat-brown .dog-body{fill:#8A6C4F}
  .walker.pup.coat-brown .dog-dark{fill:#6E5339}
  .walker.pup.coat-brown .dog-light{fill:#C7AC87}
  .walker.pup.leave{opacity:0;transition:opacity .9s ease}
  @keyframes pupJoin{0%{opacity:0}100%{opacity:.94}}
  @media (prefers-reduced-motion: reduce){
    .walker .bob,.walker .leg-a,.walker .leg-b,.walker .tail{animation:none}
    .walker.pup{animation:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span id="brandName">Notes</span><button id="sideTgl" title="サイドバーを隠す">«</button></div>
    <div class="brand-sub" id="brandSub"></div>
    <div class="banner" id="banner" title="クリックで画像を選ぶ"></div>
    <input type="file" id="bannerFile" accept="image/*" hidden>
    <input type="file" id="imgFile" accept="image/*" hidden>
    <input type="file" id="bcovFile" accept="image/*" hidden>
    <input type="file" id="pdfFile" accept="application/pdf" hidden>
    <input type="file" id="icsFile" accept=".ics,text/calendar" hidden>
    <div class="worknav" id="workNav" title="Work の時間を計る">
      <button class="workbtn" id="workBtn"><svg class="nico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></svg>
        <span class="wl" id="workLb">Work</span><span class="wt" id="workEl"></span></button>
    </div>
    <div class="nav" id="navTimer" title="One Step を開く"><span class="ico"><svg class="nico paw" viewBox="0 0 40 34"><ellipse cx="20" cy="25" rx="8.6" ry="7"/><ellipse cx="9.5" cy="14.5" rx="4" ry="5.2" transform="rotate(-18 9.5 14.5)"/><ellipse cx="16.5" cy="8" rx="3.7" ry="5"/><ellipse cx="24.5" cy="8" rx="3.7" ry="5"/><ellipse cx="31" cy="14.5" rx="4" ry="5.2" transform="rotate(18 31 14.5)"/></svg></span><span>One Step</span><span class="cnt tm-badge" id="timerBadge" hidden></span></div>
    <div id="navList">
    <div class="nav" id="navSearch" data-nav="search" draggable="true"><span class="ico"><svg class="nico" viewBox="0 0 16 16"><circle cx="7.2" cy="7.2" r="4.6"/><path d="M10.6 10.6l3.2 3.2"/></svg></span><span>Search</span></div>
    <div class="nav" id="navTasks" data-nav="tasks" draggable="true"><span class="ico"><svg class="nico" viewBox="0 0 16 16"><circle cx="10.2" cy="2.9" r="1.5"/><path d="M4.2 14.2l2.1-3.4 1.6-1.1-1-3.1-2.4 1.5-1 2.1"/><path d="M6.9 6.6l2.6-1.3 1.6 2.4 2.4.9"/><path d="M11.6 13.9l-1.4-3.1-2.3-1.3"/></svg></span><span id="navTasksLb">Tasks</span><span class="cnt" id="cntAll">0</span></div>
    <div class="nav" id="navPin" data-nav="pin" draggable="true"><span class="ico"><svg class="nico" viewBox="0 0 16 16"><path d="M9.6 1.9l4.5 4.5-1.6.5-1 1-.4 3.1-4.7-4.7 3.1-.4 1-1z"/><path d="M6.4 6.3L2.2 13.8l7.5-4.2"/></svg></span><span>Pin Memo</span><span class="cnt" id="cntPin">0</span></div>
    <div class="nav" id="navLearn" data-nav="learn" draggable="true"><span class="ico"><svg class="nico" viewBox="0 0 16 16"><path d="M2.6 13.4V11l7.6-7.6 2.4 2.4L5 13.4z"/><path d="M9.4 4.2l2.4 2.4"/><path d="M2.6 13.4h10.8"/></svg></span><span>D Discoveries</span><span class="cnt" id="cntLearn">0</span></div>
    <div class="nav" id="navTimes" data-nav="times" draggable="true"><span class="ico"><svg class="nico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.6"/></svg></span><span id="navTimesLb">Time Log</span><span class="cnt" id="cntTime"></span></div>
    <div class="nav" id="navDone" data-nav="done" draggable="true"><span class="ico"><svg class="nico" viewBox="0 0 16 16"><path d="M2.6 8.4l3.3 3.3 7.5-7.6"/></svg></span><span id="navDoneLb">Done Task</span><span class="cnt" id="cntDone">0</span></div>
    <div class="nav" id="navRep" data-nav="replog" draggable="true"><span class="ico"><svg class="nico" viewBox="0 0 16 16"><path d="M2.4 4.2h6.4M2.4 8h9.6M2.4 11.8h4.8"/><path d="M11.4 3.2v2M14 6.9v2.2M9.4 10.7v2.2"/></svg></span><span>Timeline</span></div>
    <div class="nav" id="navRead" data-nav="read" draggable="true"><span class="ico"><svg class="nico" viewBox="0 0 16 16"><path d="M2.6 3.1h4.1c.9 0 1.3.5 1.3 1.2v8.6c0-.6-.5-1-1.3-1H2.6z"/><path d="M13.4 3.1H9.3c-.9 0-1.3.5-1.3 1.2v8.6c0-.6.5-1 1.3-1h4.1z"/></svg></span><span>Read Memo</span><span class="cnt" id="cntRead">0</span></div>
    <div class="nav" id="navQuote" data-nav="quote" draggable="true"><span class="ico">❝</span><span>Quotes</span><span class="cnt" id="cntQuote">0</span></div>
    <div class="nav" id="navCards" data-nav="cards" draggable="true"><span class="ico"><svg class="nico" viewBox="0 0 16 16"><rect x="5" y="2.4" width="8.6" height="10.4" rx="1.6"/><path d="M10.4 13.6H4a1.6 1.6 0 0 1-1.6-1.6V5"/></svg></span><span>Cards</span><span class="cnt" id="cntCards">0</span></div>
    </div>
    <div class="side-label" id="pinLabel" style="display:none">Pinned</div>
    <div id="pinList"></div>
    <div class="tagnav" id="pinTags"></div>
    <div class="side-label">Board</div>
    <div id="boardList"></div>
    <div class="nav" id="addBoard" style="color:var(--muted)"><span class="ico">＋</span><span>New Board</span></div>
    <div class="nav" id="addFolder" style="color:var(--muted)"><span class="ico">＋</span><span>New Folder</span></div>
    <div class="side-label lbrow" id="tagLabel" style="display:none"><span>Tag</span>
      <button id="tagEdit" title="Tag を編集">✎</button></div>
    <div class="tagnav" id="tagNav"></div>
    <div class="side-label lbrow"><span>Status</span>
      <button id="stEdit" title="Status を編集">✎</button></div>

function nextDate(d, r){

      if(n === 1) return iso(dt);

function wavURL(sm, sr){
  const n = sm.length, buf = new ArrayBuffer(44 + n * 2), d = new DataView(buf);
  const w = (o, s) => { for(let i = 0; i < s.length; i++) d.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); d.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt ');
  d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
  d.setUint32(24, sr, true); d.setUint32(28, sr * 2, true);
  d.setUint16(32, 2, true); d.setUint16(34, 16, true);
  w(36, 'data'); d.setUint32(40, n * 2, true);
  for(let i = 0; i < n; i++){
    const v = Math.max(-1, Math.min(1, sm[i]));

  const sr = 22050, n = sr, sm = new Float32Array(n);

function makeChime(){
  const sr = 22050, sec = 3.0, n = Math.floor(sr * sec), sm = new Float32Array(n);
  const sc = [1568.0, 1760.0, 2093.0, 2349.3, 2637.0];
  for(let k = 0; k < 7; k++){
    const f = sc[Math.floor(Math.random() * sc.length)];
    const st = Math.floor(Math.random() * 0.9 * sr);
    const dec = 1.4 + Math.random(), vol = 0.16 + Math.random() * 0.1;
    for(let i = st; i < n; i++){
      const t = (i - st) / sr;
      sm[i] += Math.sin(2 * Math.PI * f * t) * vol * Math.exp(-t / (dec / 3));

  for(let i = 0; i < n; i++) mx = Math.max(mx, Math.abs(sm[i]));

  return wavURL(sm, sr);
}

/* 完了時: 繰り返しなら次回へ送る。なければ done にする */
function setDone(cid, checked){
  const f = findCard(cid); if(!f) return;
  tickPlay(checked);
  const k = f.card;
  touch(k);

  /* 繰り返しタスク: 今回の分は完了として残し、次回分を新しく作る */
  if(checked && k.repeat && k.repeat.unit){
    k.rep0 = k.rep0 || k.id;                        /* 繰り返しの系列の印 */
    const nk = JSON.parse(JSON.stringify(k));
    nk.id = uid();
    nk.rep0 = k.rep0;
    nk.done = false; delete nk.doneAt;
    nk.when = '';                                   // 「いつやる？」を既定に戻す
    (nk.subs || []).forEach(s => { s.id = uid(); s.done = false; delete s.doneAt; });
    (nk.logs || []).forEach(g => g.id = uid());
    delete nk.times; delete nk.timer;                // 時間ログは今回の分に残す
    nk.created = today(); nk.updated = today();
    nk.doneCount = (k.doneCount || 0) + 1;
    if(nk.memoReg){ nk.memoNo = nextNo('memoNo'); nk.memoDate = today(); }
    if(nk.quote && nk.quote.registered){ nk.quote.no = nextQuoteNo(); nk.quote.date = today(); }
    if(nk.read && nk.read.registered){
      nk.read.no = Math.max(0, ...allCards().map(x => +((x.card.read && x.card.read.no) || 0))) + 1;
      nk.read.date = today();
    }
    /* 日付を次回へ（基準は開始日、開始〜期限の日数はそのまま） */
    const anchor = nk.start || nk.due || today();
    let nx = nextDate(anchor, nk.repeat), guard = 0;
    while(nx <= today() && guard++ < 800) nx = nextDate(nx, nk.repeat);
    if(nk.start){
      const span = nk.due ? diffDays(nk.start, nk.due) : null;
      nk.start = nx;
      if(span !== null) nk.due = addDays(nx, span);
    } else if(nk.due) nk.due = nx;

    /* 今回の分は完了記録として残す（繰り返しは外す） */
    if(k.timer) stopTimer(k);
    k.done = true;
    k.doneAt = today();
    k.doneCount = (k.doneCount || 0) + 1;
    delete k.repeat;

    f.col.cards.splice(f.idx, 0, nk);               // 次回分を同じ位置に差し込む
    save(); render();
    return;
  }

  k.done = checked;
  if(checked){ k.doneAt = today(); if(k.timer) stopTimer(k); }
  else delete k.doneAt;
  save(); render();
}

/* 今日: 期限が今日以前、または開始日が今日以前（＝もう着手できる） */
function isToday(k){
  if(k.done) return false;
  const t = today();
  return (!!k.due && k.due <= t) || (!!k.start && k.start <= t);
}
/* 作成日・更新日 */
function touch(x){
  const k = typeof x === 'string' ? findCard(x)?.card : x;
  if(!k) return;
  k.created ||= today();
  k.updated = today();
}

/* 期限までの残り日数の表示 */
function leftLabel(due){
  const d = diffDays(today(), due);
  if(d === 0) return '今日まで';
  return d > 0 ? `あと${d}日` : `${-d}日超過`;
}
const notStarted = k => !k.done && k.start && k.start > today();
function isOver(d){ return d < today(); }
/* 今日以前が期限なら赤 */
const dueHot = d => !!d && d <= today();
const fmtHM = t => (t || '').slice(0, 5);
/* 日付＋時刻（時刻がなければ日付だけ） */
function fmtDT(d, t){ return fmtDue(d) + (t ? ' ' + fmtHM(t) : ''); }
function fmtDue(d){
  if(d === today()) return '今日';
  if(d === todayPlus(1)) return '明日';
  if(d === todayPlus(-1)) return '昨日';
  const [y, m, dd] = d.split('-');
  return `${(+y !== new Date().getFullYear()) ? y + '-' : ''}${m}-${dd}`;
}

/* ---- 本体の保存先 ----
   localStorage は 1 サイト 5MB までで、画像を貼ると簡単に届いてしまう。
   届いた瞬間から保存が失敗し、書いたものが消える。
   そこで本命を IndexedDB に置き、localStorage は控えとして使う。       */
let bootRaw = null, idbBad = false, lsFull = false;
const SKEY_IDB = () => hkey('state');
async function idbPutState(json){
  const db = await idb();
  if(!db) throw new Error('IndexedDB が使えません');
  await new Promise((res, rej) => {
    const tx = db.transaction('s', 'readwrite');
    tx.objectStore('s').put(json, SKEY_IDB());
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error || new Error('保存できません'));
    tx.onabort = () => rej(tx.error || new Error('保存が中断されました'));
  });
}
async function idbGetState(){
  try{
    const db = await idb(); if(!db) return null;
    return await new Promise(res => {
      const q = db.transaction('s', 'readonly').objectStore('s').get(SKEY_IDB());
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  }catch(e){ return null; }
}
/* 取り込みや復元のときは、こちらを通す */
function putState(json){
  bootRaw = json;
  try{ localStorage.setItem(KEY, json); }catch(e){ lsFull = true; }
  idbPutState(json).catch(() => {});
}

    const blank = o => !o
      || (!plain(o.text || '').trim() && !(o.author || '').trim() && !(o.source || '').trim()
      && !(o.page || '').trim() && !plain(o.memo || '').trim() && !(o.media || '').trim()
      && !(o.flags || []).length);
    S.boards.forEach(b => (b.cols || []).forEach(c => c.cards.forEach(k => {
      if(k.type !== 'quote' && blank(k.quote)) delete k.quote;
      if(k.type !== 'read' && blank(k.read)) delete k.read;
    })));
    S.emptyQFix2 = true;
  }
  /* Read の「買った」を「購入した」に（一度だけ） */
  if(!S.rflagFix){
    S.boards.forEach(b => (b.cols || []).forEach(c => c.cards.forEach(k => {
      if(k.read && Array.isArray(k.read.flags))
        k.read.flags = k.read.flags.map(f => f === '買った' ? '購入した' : f);
    })));
    S.rflagFix = true;
  }
  /* ボードカラーのグリーンを黄緑寄りのくすんだ色に（一度だけ） */
  if(!S.greenFix){
    S.boards.forEach(b => { if(b.color === '#4f8f57') b.color = '#84a05a'; });
    S.greenFix = true;
  }
  /* メモカードのタイトルを Memo のタイトル欄へ移す（一度だけ） */
  if(!S.noteTitleFix){
    S.boards.forEach(b => b.cols.forEach(c => c.cards.forEach(k => {
      if(k.type === 'note' && plain(k.title).trim() && !(k.bodyTitle || '').trim()){
        k.bodyTitle = plain(k.title).trim();
        k.title = '';
      }
    })));
    S.noteTitleFix = true;
  }
  /* 作成日がないカードを一度だけ補完する */
  if(!S.createdFix){
    S.boards.forEach(b => b.cols.forEach(c => c.cards.forEach(k => {
      k.created ||= k.start || k.doneAt || today();
      k.updated ||= k.created;
    })));
    S.createdFix = true;
  }
  /* 完了済みで日付がないものを一度だけ補完する */
  if(!S.doneAtFix){
    let changed = false;
    S.boards.forEach(b => b.cols.forEach(c => c.cards.forEach(k => {
      if(k.type === 'task'){
        if(k.done && !k.doneAt){ k.doneAt = today(); changed = true; }
        (k.subs || []).forEach(s => { if(s.done && !s.doneAt){ s.doneAt = k.doneAt || today(); changed = true; } });
      }
    })));
    S.doneAtFix = true;
    if(changed) save();
  }
  /* 既存データにもプリセットのボードを一度だけ追加する */
  if(!S.presetBoards){
    PRESET_BOARDS.forEach(([n, c]) => {
      if(!S.boards.some(b => (b.name || '').trim() === n))
        S.boards.push({id:uid(), name:n, color:c, cols:[
          {id:uid(), title:'ToDo', w:288, cards:[]},
          {id:uid(), title:'進行中', w:288, cards:[]},
          {id:uid(), title:'完了', w:288, cards:[]},
        ]});
    });
    S.presetBoards = true;
    save();
  }
}
let savedT;
/* 入力欄から離れた直後の再描画で、クリックが消えないようにする */
let clickGuard = 0;
const guardSel = 'input.ck, .chip, button, label, select, [data-toggle], [data-cal], [data-menu]';
document.addEventListener('mousedown', e => {
  if(e.target.closest(guardSel)) clickGuard = Date.now();
}, true);
document.addEventListener('touchstart', e => {
  if(e.target.closest(guardSel)) clickGuard = Date.now();
}, {capture:true, passive:true});
function reRender(){
  if(Date.now() - clickGuard < 400){ setTimeout(() => render(), 260); return; }
  render();
}
function save(){
  try{
    const json = JSON.stringify(S);
    bootRaw = json;
    /* 本命：IndexedDB（容量に余裕がある） */
    idbPutState(json).then(() => { idbBad = false; markSaved(); })
      .catch(e => { idbBad = true; saveAlarm(String(e.message || e)); });
    /* 控え：localStorage。入らなくても止めない */
    try{
      localStorage.setItem(KEY, json);
      lsFull = (localStorage.getItem(KEY) !== json);
    }catch(e){ lsFull = true; }
    scheduleBackup();
    syncLater();
    const tag = document.getElementById('savedTag');
    if(tag){
      if(tag.classList.contains('err')){
        tag.classList.remove('err');
        tag.textContent = '✓ 保存しました';
      }
      tag.classList.add('on');
      clearTimeout(savedT);
      savedT = setTimeout(() => tag.classList.remove('on'), 1400);
    }
  }catch(e){
    const tag = document.getElementById('savedTag');
    if(tag){ tag.textContent = '⚠ 保存できません（容量オーバー）'; tag.classList.add('on', 'err'); }
    if(!save.warned){
      save.warned = true;
      alert('ブラウザの保存容量がいっぱいのため、保存できませんでした。\n\n'
        + '画像を多く入れると容量を使います。左下の Export でファイルに書き出したうえで、\n'
        + '不要な画像やカードを減らしてください。');
    }
  }
}

/* HTML本文の簡易サニタイズ */
function clean(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  d.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n => n.remove());
  d.querySelectorAll('img').forEach(n => {
    const src = n.getAttribute('src') || '';
    if(!/^(data:image\/|https?:)/i.test(src)) n.remove();
  });
  d.querySelectorAll('a').forEach(n => {
    const href = n.getAttribute('href') || '';
    if(!/^https?:/i.test(href)) n.removeAttribute('href');
    else { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener'); }
  });
  d.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
    if(/^on/i.test(a.name) || (a.name === 'href' && /javascript:/i.test(a.value))) n.removeAttribute(a.name);
  }));
  return d.innerHTML;
}
const plain = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent || ''; };

/* ボードを移動する（folderId が空ならフォルダの外、beforeId の直前に差し込む） */
function moveBoard(id, folderId, beforeId){
  const i = S.boards.findIndex(b => b.id === id); if(i < 0) return;
  const [b] = S.boards.splice(i, 1);
  if(folderId) b.folder = folderId; else delete b.folder;
  const j = beforeId ? S.boards.findIndex(x => x.id === beforeId) : -1;
  if(j >= 0) S.boards.splice(j, 0, b); else S.boards.push(b);
  dragBoard = null; save(); render();
}

const NAVKEYS = APP === 'task'
  ? ['search', 'tasks', 'replog', 'done', 'times']
  : ['search', 'tasks', 'pin', 'learn', 'read', 'times', 'quote', 'cards'];
const NAVALL = ['search','tasks','times','done','read','quote','cards','pin','learn'];
let dragNav = null;
/* サイドバー上部メニューの並び替え */
function renderNavOrder(){
  const box = document.getElementById('navList');
  if(!box) return;
  /* このアプリで使わないメニューは隠す */
  NAVALL.forEach(k => {
    const el = box.querySelector(`[data-nav="${k}"]`);
    if(el) el.style.display = NAVKEYS.includes(k) ? '' : 'none';
  });
  /* 並びを一度だけ既定に揃える */
  if(APP === 'note' && !S.navFix3){ S.navOrder = NAVKEYS.slice(); S.navFix3 = true; }
  if(APP === 'task' && !S.navRep2){        /* Timeline は Tasks の下に */
    S.navOrder = (S.navOrder || []).filter(k => k !== 'replog');
    const i = S.navOrder.indexOf('tasks');
    if(i >= 0) S.navOrder.splice(i + 1, 0, 'replog'); else S.navOrder.push('replog');
    S.navRep2 = true;
  }
  if(APP === 'note' && !S.navLearn1){     /* D Discoveries は Pin Memo の下に */
    S.navOrder = (S.navOrder || []).filter(k => k !== 'learn');
    const i2 = S.navOrder.indexOf('pin');
    if(i2 >= 0) S.navOrder.splice(i2 + 1, 0, 'learn'); else S.navOrder.push('learn');
    S.navLearn1 = true;
  }
  S.navOrder = (S.navOrder || []).filter(k => NAVKEYS.includes(k));
  NAVKEYS.forEach(k => { if(!S.navOrder.includes(k)) S.navOrder.push(k); });
  S.navOrder.forEach(k => {
    const el = box.querySelector(`[data-nav="${k}"]`);
    if(el) box.appendChild(el);
  });
  box.querySelectorAll('[data-nav]').forEach(el => {
    const key = el.dataset.nav;
    el.ondragstart = ev => {
      dragNav = key;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', key);
      ev.stopPropagation();
      setTimeout(() => el.classList.add('dragging'), 0);
    };
    el.ondragend = () => { dragNav = null; renderNavOrder(); };
    el.ondragover = ev => {
      if(!dragNav || dragNav === key) return;
      ev.preventDefault(); ev.stopPropagation();
      const r = el.getBoundingClientRect();
      const after = ev.clientY > r.top + r.height / 2;
      el.classList.toggle('dropn', !after);
      el.classList.toggle('dropn-b', after);
    };
    el.ondragleave = () => el.classList.remove('dropn', 'dropn-b');
    el.ondrop = ev => {
      ev.preventDefault(); ev.stopPropagation();
      el.classList.remove('dropn', 'dropn-b');
      const src = dragNav || ev.dataTransfer.getData('text/plain');
      dragNav = null;
      if(!src || src === key || !NAVKEYS.includes(src)) return;
      const r = el.getBoundingClientRect();
      const after = ev.clientY > r.top + r.height / 2;
      const o = S.navOrder.filter(x => x !== src);
      const at = o.indexOf(key);
      o.splice(after ? at + 1 : at, 0, src);
      S.navOrder = o;
      save(); renderNavOrder();
    };
  });
}

    .map(([c, n]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join('');

function selectTag(t){

  wireResize(v, b); wireColDnD(v, b); wireCards(v); wireDnD(v);
