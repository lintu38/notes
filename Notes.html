/* 列の並び替え */
let dragCol = null;
function wireColDnD(root, b){
  root.querySelectorAll('.col').forEach(colEl => {
    const id = colEl.dataset.col;
    const head = colEl.querySelector('[data-colhead]');
    if(!head) return;
    head.draggable = true;
    head.ondragstart = ev => {
      if(ev.target.closest('input, button')){ ev.preventDefault(); return false; }
      dragCol = id;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', 'col:' + id);
      setTimeout(() => colEl.classList.add('coldrag'), 0);
    };
    head.ondragend = () => {
      dragCol = null;
      document.querySelectorAll('.coldrag,.colover').forEach(e => e.classList.remove('coldrag', 'colover'));
    };
    colEl.ondragover = ev => {
      if(!dragCol || dragCol === id) return;
      ev.preventDefault(); colEl.classList.add('colover');
    };
    colEl.ondragleave = () => colEl.classList.remove('colover');
    colEl.ondrop = ev => {
      if(!dragCol || dragCol === id) return;
      ev.preventDefault(); ev.stopPropagation();
      colEl.classList.remove('colover');
      const i = b.cols.findIndex(c => c.id === dragCol);
      const [col] = b.cols.splice(i, 1);
      let j = b.cols.findIndex(c => c.id === id);
      const r = colEl.getBoundingClientRect();
      if(ev.clientX > r.left + r.width / 2) j++;
      b.cols.splice(Math.max(0, j), 0, col);
      dragCol = null; save(); render();
    };
  });
}

/* ---------------- テンプレート（Tasks のみ） ---------------- */
function tplBox(c){
  if(APP !== 'task') return '';
  const L = (c.cards || []).filter(k => k.tpl);
  L.forEach(k => { if(k.cardFold === undefined) k.cardFold = true; });
  const open = !!c.tplOpen;
  return `<div class="tplbox ${open ? 'open' : ''}">
    <div class="tpl-h" data-tplfold="${c.id}">
      <button class="fold ${open ? 'open' : ''}">▶</button>
      <span class="tpl-lb">Template</span>
      <span class="tpl-n">${L.length || ''}</span>
      <button class="tpl-add" data-tpladd="${c.id}" title="テンプレートを作る">＋</button>
    </div>
    ${open ? `<div class="tpl-body">
      ${L.length ? L.map(k => `<div class="tplitem">
          ${cardHTML(k)}
          <button class="tpl-use" data-tpluse="${c.id}|${k.id}">このテンプレートから作る</button>
        </div>`).join('')
        : `<div class="tpl-empty">まだありません。＋ で作るか、カードの「⋯」から「テンプレートにする」を選びます。</div>`}
    </div>` : ''}

}

/* 列幅ドラッグ */
function wireResize(root, b){
  root.querySelectorAll('[data-rz]').forEach(h => h.onmousedown = ev => {
    ev.preventDefault();
    const col = b.cols.find(c => c.id === h.dataset.rz);
    const el = h.closest('.col'), x0 = ev.clientX, w0 = col.w || 288;
    h.classList.add('act'); document.body.style.cursor = 'col-resize';
    const move = e => {
      const w = Math.min(720, Math.max(190, Math.round(w0 + e.clientX - x0)));
      col.w = w; el.style.width = w + 'px'; el.style.flexBasis = w + 'px';
    };
    const up = () => {
      document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
      h.classList.remove('act'); document.body.style.cursor = ''; save();
    };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });
}

function cardHTML(k){
  const done = k.type === 'task' && k.done;
  /* まだ始まらないタスクは、はじめから畳んでおく（開閉したらその状態を覚える）*/
  const cFold = k.cardFold === undefined
    ? (APP === 'task' && k.type === 'task' && notStarted(k)) : !!k.cardFold;
  const cls = ['card', k.type, k.learn ? 'learn' : '', done ? 'done' : '', cFold ? 'fold1' : '',
    k.type === 'task' && notStarted(k) ? 'pending' : '',
    (k.chat && k.chat.length) ? 'chat' : ''].join(' ');
  const style = k.color ? `style="--c:${k.color}"` : '';
  const showHead = k.headOn || plain(k.head).trim();
  const showNote = k.noteOn || plain(k.note).trim();
  let inner = (k.type === 'task' && showHead)
    ? `<div class="thead" contenteditable="true" data-head="${k.id}" data-ph="見出し…">${clean(k.head)}</div>` : '';
  if(k.type === 'task'){
    const bc = APP === 'task' ? ((findCard(k.id) || {}).board || {}).color : '';
    inner += `<span class="qribbon task" title="Action"${bc ? ` style="background:${bc}"` : ''}></span>`;
  }
  if(k.type === 'quote') inner += `<span class="qribbon" title="Quote"></span>`;
  inner += `<div class="card-top">
    ${APP === 'task' && k.type !== 'heading'
      ? `<span class="caret cfold ${cFold ? '' : 'open'}" data-cfold="${k.id}"
          title="${cFold ? '開く' : 'たたむ'}">▶</span>` : ''}
    <span class="grip" draggable="true" data-grip="${k.id}">⠿</span>
    ${k.type === 'task' ? `<input type="checkbox" class="ck" data-done="${k.id}" ${k.done?'checked':''}>` : ''}
    ${(k.type === 'quote' || k.type === 'note' || k.type === 'read') ? '<div style="flex:1"></div>'
      : `<div class="ctitle" contenteditable="true" data-title="${k.id}">${clean(k.title)}</div>`}
    ${actTgl(k)}
    ${(k.type === 'note' || k.type === 'task') ? cardTgl('memo', k, k.memoCard)
      : k.type === 'quote' ? cardTgl('quote', k, k.quote && k.quote.card)
      : k.type === 'read' ? cardTgl('read', k, k.read && k.read.card) : ''}
    ${k.type === 'book' ? `<button class="pkmini ${pickOn(k)?'on':''}" data-bpick="${k.id}"
      title="ランダム選書候補">${PICKICO}</button>` : pinTgl(k)}
    <button class="menu" data-menu="${k.id}">⋯</button></div>`;

  /* タイトルのすぐ下: 説明・注意事項 */
  if(k.type === 'task' && showNote)
    inner += `<div class="tnote" contenteditable="true" data-note="${k.id}"
      data-ph="説明・注意事項…">${clean(k.note)}</div>`;

  /* 選択ボタン列 */
  const chips = [];
  const dattr = `data-date="${k.id}" style="cursor:pointer"`;
  const isTask = k.type === 'task';
  if(isTask) chips.push(whenChip(k));
  if(isTask || k.color) chips.push(catChip(k));
  if(k.type === 'task'){
    const subs = k.subs || [];
    chips.push(dateChip(k));
    if(k.start) chips.push(`<span class="chip start" title="開始日" ${dattr}>▶ ${fmtDT(k.start, k.startT)}</span>`);
    if(k.due) chips.push(`<span class="chip due ${dueHot(k.due)&&!k.done?'over':''}" title="期限" ${dattr}>🏁 ${fmtDT(k.due, k.dueT)}</span>`);
    if(k.due && !k.done) chips.push(`<span class="chip left ${dueHot(k.due)?'over':''}">${leftLabel(k.due)}</span>`);
    if(k.repeat && k.repeat.unit) chips.push(`<span class="chip rep" ${dattr}>🔁 ${esc(repLabel(k.repeat))}</span>`);
    chips.push(tagChips(k));
    if(subs.length) chips.push(`<span class="chip prog">${subs.filter(s => s.done).length}/${subs.length}</span>`);
    if(k.doneAt) chips.push(`<span class="chip done" data-donedate="${k.id}" style="cursor:pointer" title="完了日">✓ ${fmtDue(k.doneAt)}</span>`);
  }
  inner += citeLine(k);
  if(chips.filter(Boolean).length) inner += `<div class="meta">${chips.join('')}</div>`;
  if(canTime(k) && k.type !== 'book')
    inner += `<div class="meta meta2${k.type === 'read' ? ' right' : ''}">${timerChip(k)}</div>`;

  if(k.type === 'quote') inner += quoteSection(k, true);
  if(k.type === 'read') inner += readSection(k, true) + (onPage(k) ? timeSection(k) : '') + pdfSection(k);
  if(k.type === 'book') inner += bookSection(k, true) + (onPage(k) ? timeSection(k) : '') + pdfSection(k);
  if(k.type === 'quote') inner += pdfSection(k);

  if(k.type === 'note') inner += k.memoReg ? memoCardHTML(k) : `<div class="qbox">
    <div class="body" contenteditable="true" data-body="${k.id}">${clean(k.body)}</div>
    <div class="qfoot"><button class="imgadd" data-imgadd="body|${k.id}">＋ 画像</button>${fmtBar()}
      <button class="qreg" data-mreg="${k.id}">Add</button></div></div>`;
  /* メモカードはカード自体のタイトルがあるので、Memo カード内のタイトルは出さない */

  if(k.type === 'task'){
    const subs = k.subs || [];
    if(subs.length) inner += `<div class="subs">${subs.map(s => `
      <div class="subwrap">
        ${(s.headOn || plain(s.head).trim()) ? `<div class="thead sub-head" contenteditable="true"
          data-shead="${k.id}|${s.id}" data-ph="見出し…">${clean(s.head)}</div>` : ''}
        <div class="sub ${s.done?'done':''}">
          <span class="sgrip" draggable="true" data-sgrip="${k.id}|${s.id}" title="ドラッグで並び替え">⠿</span>
          <input type="checkbox" class="ck" data-sdone="${k.id}|${s.id}" ${s.done?'checked':''}>
          <div class="t" contenteditable="true" data-stitle="${k.id}|${s.id}">${clean(s.title)}</div>
          ${s.done ? `<span class="chip sdate" data-sdate="${k.id}|${s.id}" title="完了日（クリックで変更）">✓ ${s.doneAt?fmtDue(s.doneAt):'日付なし'}</span>` : ''}
          <button class="submenu" data-submenu="${k.id}|${s.id}" title="見出し・説明">⋯</button>

        </div>
        ${(s.noteOn || plain(s.note).trim()) ? `<div class="tnote sub-note" contenteditable="true"
          data-snote="${k.id}|${s.id}" data-ph="説明・注意事項…">${clean(s.note)}</div>` : ''}
      </div>`).join('')}</div>`;
    inner += `<button class="subadd" data-subadd="${k.id}">＋ サブタスク</button>`;
    inner += memoSection(k) + quoteSection(k) + readSection(k) + bookSection(k) + logSection(k)
      + timeSection(k) + pdfSection(k);
  }
  if(k.type === 'note') inner += quoteSection(k) + readSection(k)
    + (onPage(k) ? timeSection(k) : '') + pdfSection(k);
  inner += replyHTML(k);
  inner += linkSection(k);
  if(!isTask && k.type !== 'heading' && k.type !== 'book'){
    inner += `<div class="meta meta-b">${tagChips(k)}</div>`;
  }
  return `<div class="${cls}" ${style} data-card="${k.id}">${inner}</div>`;
}

  const t = (plain(k.title).trim() || (k.bodyTitle || '').trim()
    || plain(k.body || '').trim().split('\n')[0].trim() || '').slice(0, 40);
  const nk = {id:uid(), type:kind, title:kind === 'task' ? t : '', body:'', color:k.color || '',

    links:[k.id], created:today(), updated:today()};
  if(kind === 'note'){ nk.hasMemo = true; nk.bodyTitle = t; nk.day = k.day || today(); }

  const pid = k.parent || (k.type === 'book' ? k.id : '');
  let at = f.idx;
  if(pid){

function citeLine(k){

function parentMeta(k){
  if(!k.parent) return {author:'', source:''};
  const pf = findCard(k.parent);
  const P = pf && pf.card;
  if(!P) return {author:'', source:''};
  const B = P.book, R = P.read;
  let author = '', source = '';
  if(B){ author = (B.author || '').trim(); source = (B.title || '').trim(); }
  else if(R){ author = (R.author || '').trim(); source = (R.source || '').trim(); }
  if(!source) source = plain(P.title).trim();

}

/* 名前を変えたら、すべてのログの From / To も付け替える */
function renameContact(oldName, newName){
  if(!oldName) return;
  allCards().forEach(x => (x.card.logs || []).forEach(g => {
    if(g.from === oldName) g.from = newName;
    if(Array.isArray(g.to)) g.to = newName
      ? g.to.map(x => x === oldName ? newName : x) : g.to.filter(x => x !== oldName);
    else if(g.to === oldName) g.to = newName;
    if(g.who === oldName) g.who = newName;
  }));
}
const toArr = g => Array.isArray(g.to) ? g.to : (g.to ? [g.to] : []);
const ME = 'M';
const newLog = () => {
  S.contacts ||= [];
  if(!S.contacts.includes(ME)) S.contacts.unshift(ME);
  return {id:uid(), date:today(), from:ME, to:[ME], text:''};
};
function toMenu(rect, cid, lid){
  const k = findCard(cid)?.card; if(!k) return;
  const g = (k.logs || []).find(x => x.id === lid); if(!g) return;
  S.contacts ||= [];
  const cur = toArr(g);
  const p = popup(Math.max(12, rect.left - 30), rect.bottom + 6, `<div class="dpanel" style="width:210px">
    <h4>To（いくつでも）</h4>
    ${S.contacts.length ? S.contacts.map((c, ci) => `<label class="pkck" data-torow="${ci}">
      <span class="tgrip" draggable="true" data-tdrag="${ci}" title="ドラッグで並び替え">⠿</span>
      <input type="checkbox" data-to="${esc(c)}" ${cur.includes(c) ? 'checked' : ''}>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(c)}</span>
      <button class="dmini" data-toed="${esc(c)}" title="名前を直す">✎</button></label>`).join('')
      : '<div class="hint">まだ名前がありません</div>'}
    <div class="dfoot"><button id="toNew">＋ 名前を追加</button><button id="toOk">OK</button></div>
  </div>`);
  const sync = () => {
    g.to = [...p.querySelectorAll('[data-to]')].filter(c => c.checked).map(c => c.dataset.to);
    touch(k); save();
  };
  p.querySelectorAll('[data-to]').forEach(c => c.onchange = sync);
  p.querySelectorAll('[data-toed]').forEach(b => b.onclick = ev => {
    ev.preventDefault(); ev.stopPropagation();
    const old = b.dataset.toed;
    const n = (prompt('名前を修正（空にすると一覧から削除）', old) || '').trim();
    if(n === old) return;
    const i = S.contacts.indexOf(old);
    if(!n){ if(i >= 0) S.contacts.splice(i, 1); renameContact(old, ''); }
    else { if(i >= 0) S.contacts[i] = n; renameContact(old, n); }
    save(); p.remove(); render();
  });
  /* 並び替え */
  let dragI = null;
  p.querySelectorAll('[data-tdrag]').forEach(gp => {
    gp.ondragstart = ev => { dragI = +gp.dataset.tdrag; ev.dataTransfer.effectAllowed = 'move';
      try{ ev.dataTransfer.setData('text/plain', ''); }catch(_){} };
    gp.ondragend = () => { dragI = null;
      p.querySelectorAll('[data-torow]').forEach(r => r.classList.remove('tdrop')); };
  });
  p.querySelectorAll('[data-torow]').forEach(row => {
    row.ondragover = ev => { if(dragI === null) return; ev.preventDefault(); row.classList.add('tdrop'); };
    row.ondragleave = () => row.classList.remove('tdrop');
    row.ondrop = ev => {
      if(dragI === null) return;
      ev.preventDefault();
      const to = +row.dataset.torow, from = dragI;
      dragI = null;
      if(from === to) return;
      const arr = S.contacts;
      arr.splice(to, 0, arr.splice(from, 1)[0]);
      save(); p.remove(); toMenu(rect, cid, lid); render();
    };
  });
  p.querySelector('#toNew').onclick = () => {
    const n = (prompt('名前') || '').trim();
    if(!n) return;
    if(!S.contacts.includes(n)) S.contacts.push(n);
    g.to = [...toArr(g), n];
    touch(k); save(); p.remove(); render();
  };
  p.querySelector('#toOk').onclick = () => { p.remove(); render(); };
}

      if(!dragSub) return;

      const k = findCard(dragSub.cid)?.card; if(!k) return;

/* サブタスク追加（ボード・タスク一覧の両方で使う） */
function subAdd(btn){
  const cid = btn.dataset.subadd;
  const inp = document.createElement('input');
  inp.className = btn.classList.contains('rsubadd') ? 'rsubinput' : 'subinput';
  inp.placeholder = 'サブタスク（Enterで続けて追加）';
  btn.replaceWith(inp); inp.focus();
  let closed = false;
  const commit = keep => {
    if(closed) return; closed = true;
    const t = inp.value.trim();
    if(t){
      const k = findCard(cid).card;
      touch(k);
      (k.subs ||= []).push({id:uid(), title:esc(t), done:false});
      folded[cid] = false;
      save();
    }
    render();
    if(keep && t) document.querySelector(`[data-subadd="${cid}"]`)?.click();
  };
  inp.onkeydown = e => {
    if(e.key === 'Enter'){ e.preventDefault(); commit(true); }
    if(e.key === 'Escape'){ closed = true; render(); }
  };
  inp.onblur = () => commit(false);
}

let rtEl = null;
function saveBody(el){
  const html = clean(el.innerHTML).replace(/^(<br>)+$/, '');
  const ds = el.dataset;
  touch(ds.qtext || ds.qmemo || ds.body || ds.title ||
        (ds.logtext || ds.stitle || ds.tstitle || ds.cturn || '').split('|')[0]);
  if(ds.qtext || ds.qmemo){
    const k = findCard(ds.qtext || ds.qmemo)?.card; if(!k) return;
    (k.quote ||= {})[ds.qtext ? 'text' : 'memo'] = html;
    save(); return;
  }
  if(ds.cturn){
    const i = ds.cturn.lastIndexOf('|');
    const f = findCard(ds.cturn.slice(0, i)); if(!f) return;
    const n = +ds.cturn.slice(i + 1);
    const cv = f.card.chat || [];
    if(!cv[n]) return;
    /* 末尾の空行は残さない */
    cv[n].text = html.replace(/(?:\s|<br\s*\/?>|<div><br\s*\/?><\/div>|<p><br\s*\/?><\/p>)+$/gi, '');
    touch(f.card); save(); return;
  }
  if(ds.tabmemo){
    S.tabMemo ||= {};
    if(plain(html).trim() || html.includes('<img')) S.tabMemo[ds.tabmemo] = html;
    else delete S.tabMemo[ds.tabmemo];
    save(); return;
  }
  if(ds.calmemo){
    S.dayMemo ||= {};
    if(plain(html).trim() || html.includes('<img')) S.dayMemo[ds.calmemo] = html;
    else delete S.dayMemo[ds.calmemo];
    save(); return;
  }
  if(ds.daily){
    const b = board(view.id);
    if(b){ (b.days ||= {})[ds.daily] = html; save(); }
    return;
  }
  if(ds.shead || ds.snote){
    const [cid, sid] = (ds.shead || ds.snote).split('|');
    const s = findCard(cid)?.card.subs?.find(x => x.id === sid); if(!s) return;
    s[ds.shead ? 'head' : 'note'] = html;
    touch(cid); save(); return;
  }
  if(ds.head){
    const f = findCard(ds.head); if(!f) return;
    f.card.head = html; touch(f.card);
    save(); return;
  }
  if(ds.note){
    const f = findCard(ds.note); if(!f) return;
    f.card.note = html; touch(f.card);
    save(); return;
  }
  if(ds.rmemo){
    const k = findCard(ds.rmemo)?.card; if(!k) return;
    (k.read ||= {}).memo = html;
    save(); return;
  }
  if(ds.body){
    const f = findCard(ds.body); if(!f) return;
    f.card.body = html; f.card.hasMemo = true;
  } else if(ds.logtext){
    const [cid, lid] = ds.logtext.split('|');
    const g = findCard(cid)?.card.logs?.find(x => x.id === lid); if(!g) return;
    g.text = html;
  } else if(ds.title){
    const f = findCard(ds.title); if(!f) return;
    f.card.title = html;
  } else if(ds.stitle || ds.tstitle){
    const [cid, sid] = (ds.stitle || ds.tstitle).split('|');
    const s = findCard(cid)?.card.subs?.find(x => x.id === sid); if(!s) return;
    s.title = html;
  }
  save();
}

/* 選択（またはカーソル）のある行が入っている UL / BLOCKQUOTE */
function upTo(node, tag, root){
  let n = node && node.nodeType === 3 ? node.parentNode : node;
  while(n && n !== root){ if(n.nodeName === tag) return n; n = n.parentNode; }
  return null;
}
function applyFmt(kind, el){
  if(!el) return;
  el.focus();
  const sel = window.getSelection();
  if(!sel.rangeCount || !el.contains(sel.anchorNode)){
    const r = document.createRange();
    r.selectNodeContents(el); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  }
  document.execCommand('styleWithCSS', false, false);
  if(kind === 'h3' || kind === 'h4'){
    const cur = upTo(sel.anchorNode, kind.toUpperCase(), el);
    document.execCommand('formatBlock', false, cur ? 'div' : kind);
    saveBody(el);
    return;
  }
  if(kind === 'quote'){
    const bq = upTo(sel.anchorNode, 'BLOCKQUOTE', el);
    document.execCommand('formatBlock', false, bq ? 'div' : 'blockquote');
  } else {
    const ul = upTo(sel.anchorNode, 'UL', el);
    const want = kind === 'check';
    if(ul){
      if(ul.classList.contains('ckl') === want) document.execCommand('insertUnorderedList');
      else ul.classList.toggle('ckl', want);
    } else {
      document.execCommand('insertUnorderedList');
      const nu = upTo(window.getSelection().anchorNode, 'UL', el);
      if(nu && want) nu.classList.add('ckl');
    }
  }
  saveBody(el);
}
/* 書式ボタンを配線する（クリックしても選択が消えないように） */
function wireFmt(root){
  root.querySelectorAll('[data-fmt]').forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => {
      const box = b.closest('.qbox, .dailymain, .card, .dwrap, .rs-memowrap') || document;
      /* 直前にさわっていた入力欄があればそこへ。なければ枠内の最後の本文欄へ */
      let ed = (lastRich && box.contains(lastRich)) ? lastRich : null;
      if(!ed){
        const eds = box.querySelectorAll('[data-body],[data-daily],[data-rmemo],[data-qmemo],[data-qtext],[data-calmemo],[data-tabmemo],[data-cturn]');
        ed = eds[eds.length - 1];
      }
      applyFmt(b.dataset.fmt, ed);
      if(b.dataset.fmt === 'check' && ed){
        const u = upTo(window.getSelection().anchorNode, 'UL', ed);
        if(u && !u.classList.contains('ckl')){ u.classList.add('ckl'); saveBody(ed); }
      }
    };
  });
}
let lastRich = null;   // 直前に編集していたリッチテキスト欄
let ckMoved = 0;       // チェックを並べ替えた時刻
function wireRich(el){
  el.dataset.rich = '1';
  let t;   // 入力中も自動保存
  el.addEventListener('focus', () => { lastRich = el; });
  el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => saveBody(el), 400); });
  el.onmouseup = () => setTimeout(() => showRT(el), 0);
  el.addEventListener('touchend', () => setTimeout(() => showRT(el), 80));
  el.onkeyup = e => { if(e.shiftKey || e.key === 'Escape') setTimeout(() => showRT(el), 0); };
  el.onpaste = e => {
    const dt = e.clipboardData || window.clipboardData;
    let file = [...(dt.files || [])].find(f => f.type.startsWith('image/'));
    if(!file){
      const it = [...(dt.items || [])].find(i => i.kind === 'file' && (i.type || '').startsWith('image/'));
      if(it) file = it.getAsFile();
    }
    if(file){ e.preventDefault(); insertImage(file, el); return; }
    const txt = (dt.getData('text/plain') || '').trim();
    if(/^https?:\/\/\S+$/i.test(txt)){          // URL はリンクカードに
      e.preventDefault();
      document.execCommand('insertHTML', false, urlCardHTML(txt) + '<br>');
      saveBody(el);
      return;
    }
    e.preventDefault();                          // それ以外は書式なしテキスト
    document.execCommand('insertText', false, (dt.getData('text/plain') || ''));
  };
  el.ondragover = e => {
    if(dragImg && dragImgEl === el){
      e.preventDefault(); e.stopPropagation();
      try{ e.dataTransfer.dropEffect = 'move'; }catch(_){}
      return;
    }
    if(e.dataTransfer.types.includes('Files')) e.preventDefault();
  };
  el.ondrop = e => {
    if(dragImg && dragImgEl === el){
      e.preventDefault(); e.stopPropagation();
      const im = dragImg; dragImg = dragImgEl = null;
      const r = caretFromPoint(e.clientX, e.clientY);
      if(r && el.contains(r.startContainer)){
        const mk = document.createElement('span');
        r.insertNode(mk);
        mk.parentNode.insertBefore(im, mk);
        mk.remove();
        el.normalize();
        saveBody(el); hideImgHandle(); render();
      }
      return;
    }
    const file = [...(e.dataTransfer.files || [])].find(f => f.type.startsWith('image/'));
    if(file){ e.preventDefault(); insertImage(file, el); }
  };
  el.addEventListener('dragstart', e => {
    const im = e.target;
    if(im && im.tagName === 'IMG' && !im.classList.contains('ufav') && el.contains(im)){
      dragImg = im; dragImgEl = el;
      try{ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); }catch(_){}
      e.stopPropagation();
      ihDrag = false; hideImgHandle();
    }
  });
  el.addEventListener('dragend', () => { dragImg = dragImgEl = null; });
  el.addEventListener('mouseover', e => {
    if(e.target.tagName === 'IMG' && !e.target.classList.contains('ufav')) showImgHandle(e.target, el);
  });
  el.addEventListener('mouseleave', () => setTimeout(() => {
    if(!ihDrag && !document.getElementById('imgHandle')?.matches(':hover')) hideImgHandle();
  }, 120));
  /* チェックの四角：押すだけで切り替え、つかんで動かすと並べ替え */
  el.addEventListener('mousedown', e => {
    const li = e.target.closest('ul.ckl > li');
    if(!li || !el.contains(li)) return;
    const r = li.getBoundingClientRect();
    if(e.clientX >= r.left) return;          /* 四角の部分だけ */
    e.preventDefault();                      /* 編集状態にしない */
    const y0 = e.clientY;
    let moved = false;
    const onMove = ev => {
      if(!moved && Math.abs(ev.clientY - y0) < 5) return;
      if(!moved){ moved = true; li.classList.add('lidrag'); }
      const items = [...el.querySelectorAll('ul.ckl > li')].filter(x => x !== li);
      const t = items.find(x => {
        const b = x.getBoundingClientRect();
        return ev.clientY >= b.top && ev.clientY <= b.bottom;
      });
      if(t){
        const b = t.getBoundingClientRect();
        const after = ev.clientY > b.top + b.height / 2;
        t.parentNode.insertBefore(li, after ? t.nextSibling : t);
      }
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      li.classList.remove('lidrag');
      if(moved){ ckMoved = Date.now(); saveBody(el); }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  el.addEventListener('click', e => {
    const li = e.target.closest('ul.ckl > li');
    if(li && el.contains(li)){
      const r = li.getBoundingClientRect();
      if(e.clientX < r.left){
        e.preventDefault();
        if(Date.now() - ckMoved < 300) return;   /* 並べ替えた直後は切り替えない */
        if(li.classList.contains('dn')){ li.classList.remove('dn'); li.classList.add('sk'); }
        else if(li.classList.contains('sk')){ li.classList.remove('sk'); }
        else { li.classList.add('dn'); tickPlay(true); }
        saveBody(el); return;
      }
    }
    if(e.target.tagName === 'IMG' && !e.target.classList.contains('ufav')){
      e.preventDefault(); showImgHandle(e.target, el); imgMenu(e.target, el);
    }
    const a = e.target.closest('a.ulink');
    if(a && a.href){ e.preventDefault(); window.open(a.href, '_blank', 'noopener'); }
  });
}

function popup(x, y, html){
  document.querySelectorAll('.pop').forEach(p => p.remove());
  const p = document.createElement('div');
  p.className = 'pop'; p.innerHTML = html;
  document.body.appendChild(p);
  p.style.left = Math.max(8, Math.min(x, innerWidth - p.offsetWidth - 8)) + 'px';
  p.style.top = Math.max(8, Math.min(y, innerHeight - p.offsetHeight - 8)) + 'px';
  setTimeout(() => document.addEventListener('mousedown', function h(ev){
    if(!p.contains(ev.target)){ p.remove(); document.removeEventListener('mousedown', h); }
  }), 0);
  return p;
}

  p.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {

    if(a === 'tags'){ p.remove(); return tagMenu(rr, cid); }
    if(a === 'link'){ p.remove(); return linkMenu(rr, cid); }
    if(a === 'head'){
      if(k.headOn || plain(k.head).trim()){ delete k.headOn; k.head = ''; }
      else k.headOn = true;
    }
    if(a === 'note'){
      if(k.noteOn || plain(k.note).trim()){ delete k.noteOn; k.note = ''; }
      else k.noteOn = true;
    }
    if(a === 'linkmemo'){ p.remove(); return makeLinked(cid, 'note'); }
    if(a === 'body'){ k.hasMemo = true; if(k.fold) k.fold.memo = false; }
    if(a === 'log'){
      k.logs = [newLog()];
      (k.fold ||= {}).log = false;
    }
    if(a === 'quote'){
      k.quote = {text:'', author:'', source:'', page:'', memo:'', card:false};
      if(k.fold) k.fold.quote = false;
    }
    if(a === 'read'){
      k.read = {author:'', source:'', media:'', memo:'', card:false};
      if(k.fold) k.fold.read = false;
    }
    if(a === 'pdf'){ p.remove(); return pdfAdd(cid); }
    if(a === 'page'){ p.remove(); view = {type:'card', id:cid}; return render(); }
    if(a === 'ai'){ p.remove(); return aiPick(cid, r); }
    if(a === 'tpl'){
      if(k.tpl){ delete k.tpl; delete k.cardFold; }
      else { k.tpl = true; k.cardFold = true; }
      const f2 = findCard(cid);
      if(k.tpl && f2) f2.col.tplOpen = true;
    }
    if(a === 'tonote') k.type = 'note';
    if(a === 'totask'){ k.type = 'task'; k.done = false; k.subs ||= []; }
    if(a === 'dup') f.col.cards.splice(f.idx + 1, 0,
      {...JSON.parse(JSON.stringify(k)), id:uid(), subs:(k.subs||[]).map(s => ({...s, id:uid()}))});
    if(a === 'del'){
      const nm = plain(k.title).trim() || plain(k.bodyTitle || '').trim() || '無題';
      const sub = (k.subs || []).length;
      if(!confirm(`「${nm}」を削除しますか？${sub ? `\n（サブタスク ${sub} 件も一緒に消えます）` : ''}`)){
        p.remove(); return;
      }
      f.col.cards.splice(f.idx, 1);
    }
    save(); p.remove(); render();
    if(a === 'body') document.querySelector(`[data-body="${cid}"]`)?.focus();
    if(a === 'log') document.querySelector(`[data-logtext^="${cid}|"]`)?.focus();
    if(a === 'quote') document.querySelector(`[data-qtext="${cid}"]`)?.focus();
    if(a === 'head') document.querySelector(`[data-head="${cid}"]`)?.focus();
    if(a === 'note') document.querySelector(`[data-note="${cid}"]`)?.focus();
    if(a === 'read') document.querySelector(`[data-rf^="author|${cid}"]`)?.focus();
  });
}

function dateMenu(rect, cid){
  const k = findCard(cid)?.card; if(!k) return;
  k.repeat ||= {unit:'', n:1, days:[]};
  k.repeat.days ||= [];
  const isWeek = k.repeat.unit === 'week';
  const allday = k.allday !== false;
  const p = popup(rect.left - 30, rect.bottom + 6, `<div class="dpanel">
    <h4>日付</h4>
    <label class="allday"><input type="checkbox" id="dAllday" ${allday ? 'checked' : ''}><span>終日</span></label>
    <div class="drow"><label>開始日</label><input type="date" id="dStart" value="${k.start || ''}">
      ${allday ? '' : `<input type="time" id="dStartT" value="${k.startT || ''}">`}</div>
    <div class="quick"><button data-qs="0">今日</button><button data-qs="1">明日</button>
      <button data-qs="7">来週</button><button data-qs="x">なし</button></div>
    <div class="drow"><label>期限</label><input type="date" id="dDue" value="${k.due || ''}">
      ${allday ? '' : `<input type="time" id="dDueT" value="${k.dueT || ''}">`}</div>
    <div class="quick"><button data-qd="0">今日</button><button data-qd="1">明日</button>
      <button data-qd="7">来週</button><button data-qd="x">なし</button></div>
    <h4 style="margin-top:10px">繰り返し</h4>
    <div class="drow"><label>周期</label>
      <select id="rUnit">${REPEATS.map(([v, l]) =>
        `<option value="${v}" ${k.repeat.unit===v?'selected':''}>${l}</option>`).join('')}</select>
      <input type="number" id="rN" min="1" max="99" value="${k.repeat.n || 1}"
        ${['','weekday'].includes(k.repeat.unit) ? 'disabled' : ''}>
    </div>
    ${isWeek ? `<div class="wdays">${WD.map((l, i) =>
      `<button data-wd="${i}" class="${k.repeat.days.includes(i)?'on':''} ${i===0?'sun':''} ${i===6?'sat':''}">${l}</button>`).join('')}</div>` : ''}
    <div class="hint">
      ${k.repeat.unit
        ? `完了すると次回（${esc(repLabel(k.repeat))}）へ自動で送られます<br>基準は開始日です`
        : '完了したら閉じるだけ'}
      ${isWeek && !k.repeat.days.length ? '<br>曜日を選ばない場合は同じ曜日で繰り返します' : ''}
      ${k.doneCount ? `<br>これまで ${k.doneCount} 回完了` : ''}</div>
    <h4 style="margin-top:12px">完了日</h4>
    <div class="drow"><label>完了日</label><input type="date" id="dDone" value="${k.doneAt || ''}"></div>
    <div class="hint">チェックを入れた日が自動で入ります${k.doneCount ? `（通算 ${k.doneCount} 回）` : ''}</div>
    <div class="dfoot"><button id="dClear">すべてクリア</button><button id="dClose">OK</button></div>
  </div>`);

  const upd = () => { touch(k); save(); render(); };
  const $ = id => p.querySelector('#' + id);
  const reopen = () => { p.remove(); dateMenu(rect, cid); };
  $('dStart').onchange = e => { k.start = e.target.value; upd(); };
  $('dDue').onchange = e => { k.due = e.target.value; upd(); };
  $('dAllday').onchange = e => {
    if(e.target.checked){ k.allday = true; delete k.startT; delete k.dueT; }
    else {
      k.allday = false;
      if(!k.start && !k.due) k.start = today();
      k.startT ||= '09:00';
    }
    save(); reopen(); render();
  };
  if($('dStartT')) $('dStartT').onchange = e => {
    if(e.target.value) k.startT = e.target.value; else delete k.startT; upd(); };
  if($('dDueT')) $('dDueT').onchange = e => {
    if(e.target.value) k.dueT = e.target.value; else delete k.dueT; upd(); };
  $('dDone').onchange = e => { if(e.target.value) k.doneAt = e.target.value; else delete k.doneAt; upd(); };
  p.querySelectorAll('[data-qs]').forEach(b => b.onclick = () => {
    k.start = b.dataset.qs === 'x' ? '' : todayPlus(+b.dataset.qs); $('dStart').value = k.start; upd(); });
  p.querySelectorAll('[data-qd]').forEach(b => b.onclick = () => {
    k.due = b.dataset.qd === 'x' ? '' : todayPlus(+b.dataset.qd); $('dDue').value = k.due; upd(); });
  p.querySelectorAll('[data-wd]').forEach(b => b.onclick = () => {
    const i = +b.dataset.wd, d = k.repeat.days;
    k.repeat.days = d.includes(i) ? d.filter(x => x !== i) : [...d, i].sort();
    save(); reopen(); render();
  });
  $('rUnit').onchange = e => {
    k.repeat.unit = e.target.value;
    if(k.repeat.unit === 'week' && !k.repeat.days.length && (k.start || k.due))
      k.repeat.days = [parse(k.start || k.due).getDay()];
    if(k.repeat.unit && !k.start && !k.due) k.start = today();
    save(); reopen(); render();
  };
  $('rN').onchange = e => { k.repeat.n = Math.max(1, +e.target.value || 1); upd(); };
  $('dClear').onclick = () => {
    k.start = ''; k.due = ''; delete k.doneAt;
    delete k.startT; delete k.dueT; delete k.allday;
    k.repeat = {unit:'', n:1, days:[]}; p.remove(); upd();
  };
  $('dClose').onclick = () => p.remove();
}

/* 「いつやる？」の項目そのものを編集する */
function whenEdit(rect){
  const list = whenList().map(x => [...x]);
  const draw = () => {
    document.querySelectorAll('.pop').forEach(x => x.remove());
    const p = popup(Math.max(12, rect.left - 40), rect.bottom + 6, `
      <div class="dpanel" style="width:280px">
        <h4>「いつやる？」の項目</h4>
        <div class="hint" style="margin:-2px 0 8px">名前と色を変えられます。
          いちばん上は、まだ選んでいないときの表示です。</div>
        ${list.map(([v, n, c], i) => `<div class="wrow">
          <input type="color" value="${c}" data-c="${i}"${v ? '' : ' disabled'}>
          <input class="tinput" value="${esc(n)}" data-n="${i}">
          ${v ? `<button class="wx" data-x="${i}" title="この項目を消す">×</button>`
              : '<span class="wx"></span>'}
        </div>`).join('')}
        <div class="dfoot" style="gap:6px">
          <button id="wAdd">＋ 追加</button>
          <button id="wDef">既定に戻す</button>
          <button id="wOK">閉じる</button>
        </div>
      </div>`);
    const commit = () => {
      p.querySelectorAll('[data-n]').forEach(el =>
        list[+el.dataset.n][1] = el.value.trim() || '（無題）');
      p.querySelectorAll('[data-c]').forEach(el => list[+el.dataset.c][2] = el.value);
      S.whens = list.map(x => [...x]);
      save();
    };
    p.querySelectorAll('input').forEach(el => el.onchange = commit);
    p.querySelectorAll('[data-x]').forEach(b => b.onclick = () => {
      commit();
      const v = list[+b.dataset.x][0];
      const used = allCards().filter(x => (x.card.when || '') === v).length;
      if(used && !confirm(used + ' 件のメモで使われています。消すと未設定に戻ります。よろしいですか？')) return;
      allCards().forEach(x => { if((x.card.when || '') === v) delete x.card.when; });
      list.splice(+b.dataset.x, 1);
      S.whens = list.map(y => [...y]); save(); draw(); render();
    });
    p.querySelector('#wAdd').onclick = () => {
      commit();
      list.push(['w' + uid(), '新しい項目', '#8b8285']);
      S.whens = list.map(y => [...y]); save(); draw();
    };
    p.querySelector('#wDef').onclick = () => {
      if(!confirm('もとの4つに戻しますか？\n（メモにつけた選択はそのまま残ります）')) return;
      delete S.whens; save();
      document.querySelectorAll('.pop').forEach(x => x.remove());
      render();
    };
    p.querySelector('#wOK').onclick = () => { commit(); p.remove(); render(); };
  };
  draw();
}

  if(k.quote && k.quote.registered && k.quote.date) return k.quote.date;
  if(k.read && k.read.registered && k.read.date) return k.read.date;
  return k.created || '';
}

    <button class="stadd" id="tgAdd">＋ 追加</button>
    <div class="hint" style="margin-top:8px">名前を書き換えると、使っているメモすべてで変わります。<br>
      × を押すとメモから外れます（メモ自体は消えません）。</div>
    <div class="dfoot"><button id="tgClose">閉じる</button></div>
  </div>`);
  const reopen = () => { p.remove(); tagEditor(rect); };
  p.querySelectorAll('[data-tgc]').forEach(el => el.onchange = () => {
    const t = L[+el.dataset.tgc];
    addPalette(el.value);
    S.tagColors[t] = el.value.toLowerCase();
    save(); render();
  });
  p.querySelectorAll('[data-tgn]').forEach(el => {
    el.onkeydown = e => { if(e.key === 'Enter') el.blur(); };
    el.onchange = () => {
      const t = L[+el.dataset.tgn];
      const nt = el.value.trim().replace(/^#/, '');
      if(!nt || nt === t){ el.value = t; return; }
      allCards().forEach(x => {
        const a2 = x.card.tags || [];
        if(a2.includes(t)) x.card.tags = [...new Set(a2.map(z => z === t ? nt : z))];
      });
      if(S.tagColors[t]){ S.tagColors[nt] = S.tagColors[t]; delete S.tagColors[t]; }
      S.pinnedTags = S.pinnedTags.map(z => z === t ? nt : z);
      if(tagFilter === t) tagFilter = nt;
      save(); render(); reopen();
    };
  });
  p.querySelectorAll('[data-tgp]').forEach(el => el.onclick = () => {
    const t = L[+el.dataset.tgp];
    S.pinnedTags = S.pinnedTags.includes(t)
      ? S.pinnedTags.filter(z => z !== t) : [...S.pinnedTags, t];
    save(); render(); reopen();
  });
  p.querySelectorAll('[data-tgd]').forEach(el => el.onclick = () => {
    const t = L[+el.dataset.tgd];
    if(!confirm(`#${t} を ${used(t)} 件のメモから外しますか？\n（メモ自体は消えません）`)) return;
    allCards().forEach(x => {
      if((x.card.tags || []).includes(t)) x.card.tags = x.card.tags.filter(z => z !== t);
    });
    delete S.tagColors[t];
    S.pinnedTags = S.pinnedTags.filter(z => z !== t);
    if(tagFilter === t) tagFilter = '';
    save(); render(); reopen();
  });
  p.querySelector('#tgAdd').onclick = () => {
    const v = prompt('新しいタグ名');
    if(v === null) return;
    const nt = v.trim().replace(/^#/, '');
    if(!nt) return;
    if(L.includes(nt)){ alert('すでにあります'); return; }
    S.tagColors[nt] ||= TAGC_DEF[L.length % TAGC_DEF.length];
    S.pinnedTags = [...new Set([...S.pinnedTags, nt])];   // 一覧に残るようピン留めしておく
    save(); render(); reopen();
  };
  p.querySelector('#tgClose').onclick = () => p.remove();
}

/* ---------------- drag & drop ---------------- */
let dragId = null, dragSub = null;
function wireDnD(root){
  root.querySelectorAll('.card[data-card]').forEach(card => {
    card.draggable = true;
    card.ondragstart = ev => {
      /* 文字を編集中・ボタン上からは並び替えを始めない */
      if(ev.target.closest('[contenteditable], input, textarea, select, button, a, .rflag, .chip')){
        ev.preventDefault(); return false;
      }
      dragId = card.dataset.card;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', dragId);
      setTimeout(() => card.classList.add('drag'), 0);
    };
    card.ondragend = () => { dragId = null;
      document.querySelectorAll('.drag').forEach(e => e.classList.remove('drag')); };
  });
  root.querySelectorAll('[data-grip]').forEach(g => {
    const card = g.closest('.card');
    g.ondragstart = ev => {
      ev.stopPropagation();
      dragId = g.dataset.grip;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', dragId);
      ev.dataTransfer.setDragImage(card, 20, 16);
      setTimeout(() => card.classList.add('drag'), 0);
    };
    g.ondragend = () => { dragId = null; document.querySelectorAll('.drag').forEach(e => e.classList.remove('drag')); };
  });
  root.querySelectorAll('[data-drop]').forEach(z => {
    z.ondragover = ev => { if(dragCol || dragSub) return; ev.preventDefault(); z.classList.add('over'); };
    z.ondragleave = () => z.classList.remove('over');
    z.ondrop = ev => {
      if(dragCol || dragSub) return;
      ev.preventDefault(); ev.stopPropagation(); z.classList.remove('over');
      const id = dragId || ev.dataTransfer.getData('text/plain');
      const f = findCard(id); if(!f) return;
      const target = board(view.id).cols.find(c => c.id === z.dataset.drop);
      let idx = target.cards.length;
      const els = [...z.querySelectorAll('.card')].filter(e => e.dataset.card !== id);
      for(const el of els){
        const r = el.getBoundingClientRect();
        if(ev.clientY < r.top + r.height / 2){
          idx = target.cards.findIndex(c => c.id === el.dataset.card); break;
        }
      }
      f.col.cards.splice(f.idx, 1);
      if(f.col === target && f.idx < idx) idx--;
      target.cards.splice(Math.max(0, idx), 0, f.card);
      save(); render();
    };
  });
}

/* ---------------- task page ---------------- */
function renderTasks(){
  const t = document.getElementById('pageTitle');
  t.value = filter === 'now' ? '今日必ず' : filter === 'today' ? '今日'
    : filter === 'done' ? `${TASKLB}｜完了` : TASKLB;
  t.disabled = true; t.oninput = null; t.style.color = '';

  let items = filter === 'done'
    ? allTasks().filter(i => i.card.done)
    : allTasks().filter(i => !i.card.done);
  if(filter === 'now') items = items.filter(i => i.card.when === 'now');
  if(filter === 'today') items = items.filter(i => isToday(i.card));
  if(filter === 'due') items = items.filter(i => i.card.due && !i.card.done);
  if(q){
    const s = q.toLowerCase();
    items = items.filter(i => {
      const k = i.card;
      const Q = k.quote || {};
      const R = k.read || {};
      const hay = [plain(k.title), k.bodyTitle, plain(k.body), plain(k.note), plain(k.head), plain(Q.text), Q.author, Q.source, plain(Q.memo),
        R.author, R.source, R.media, (R.flags || []).join(' '), plain(R.memo),
        ...(k.subs || []).map(x => [plain(x.title), plain(x.head), plain(x.note)].join(' ')),
        ...(k.logs || []).map(g => [g.from, ...(Array.isArray(g.to) ? g.to : [g.to]), g.who]
          .filter(Boolean).join(' ') + ' ' + plain(g.text)),
        ...(k.tags || []).map(x => '#' + x)].join(' ').toLowerCase();
      return hay.includes(s);
    });
  }
  const anyOpen = items.some(i => !folded[i.card.id]);
  document.getElementById('topActions').innerHTML =
    `<button class="btn" id="foldAll">${anyOpen ? 'すべて折りたたむ' : 'すべて展開'}</button>`;

  const key = c => (c.due ? c.due + ' ' + (c.dueT || '99:99')
                          : c.start ? c.start + ' ' + (c.startT || '99:99') : '9999-99-99');
  /* 並び順：手動で入れ替えたもの → 「いつやる？」→ 日付 */
  const wrank = c => { const i = ['now', 'maybe', 'later'].indexOf(c.when || ''); return i < 0 ? 3 : i; };
  const tord = c => (typeof c.tord === 'number' ? c.tord : 1e9);
  if(filter === 'done')
    items.sort((a, b) => (b.card.doneAt || '').localeCompare(a.card.doneAt || ''));
  else
    items.sort((a, b) => tord(a.card) - tord(b.card)
      || wrank(a.card) - wrank(b.card)
      || key(a.card).localeCompare(key(b.card)));

  /* --- グループ分け（ボード / Status / いつやる / 期限） --- */
  if(filter === 'open') filter = 'all';
  const gb = filter === 'done' ? 'none'
    : (S.groupBy || (filter === 'today' || filter === 'now' ? 'due' : 'board'));
  const DUE_SECT = ['⚠️ 期限切れ', '★ 今日が期限', '▶ 明日以降', '期限なし'];
  function gInfo(it){
    const k = it.card;
    if(gb === 'status'){
      const n = k.color ? catName(k.color) : '';
      return {name:n || 'Status なし', color:k.color || '', ord:CATS().findIndex(c => c[0] === (k.color||'')) };
    }
    if(gb === 'when'){
      const [v, n, c] = whenOf(k.when);
      return {name:n, color:v ? c : '', ord:whenList().findIndex(x => x[0] === (k.when || ''))};
    }
    if(gb === 'due'){
      const d = k.due;
      const n = !d ? DUE_SECT[3] : d < today() ? DUE_SECT[0] : d === today() ? DUE_SECT[1] : DUE_SECT[2];
      return {name:n, color:'', ord:DUE_SECT.indexOf(n)};
    }
    if(gb === 'none') return {name:'', color:'', ord:0};
    return {name:'▦ ' + it.board.name, color:it.board.color || '',
      ord:S.boards.findIndex(x => x.id === it.board.id)};
  }
  const groups = [];
  for(const it of items){
    const g0 = gInfo(it);
    let g = groups.find(x => x.name === g0.name);
    if(!g) groups.push(g = {...g0, rows:[]});
    g.rows.push(it);
  }
  groups.sort((x, y) => x.ord - y.ord);

  document.getElementById('view').innerHTML = `
    <div class="tools">
      <input class="search" id="q" placeholder="Task・Tag（#名前）を検索…" value="${esc(q)}">
      <div class="seg">
        ${[['all','すべて'],['today','今日'],['now','今日必ず'],['due','期限あり'],['done','完了']]
          .map(([k, l]) => `<button data-f="${k}" class="${filter===k?'on':''}">${l}</button>`).join('')}
      </div>
      <span style="color:var(--muted);font-size:12.5px">${items.length} 件</span>
      <span class="gsel"><label>Group</label>
        <select id="gBy">${[['board','Board'],['status','Status'],['when','いつやる'],['due','期限'],['none','まとめない']]
          .map(([v, l]) => `<option value="${v}" ${gb===v?'selected':''}>${l}</option>`).join('')}</select></span>
      ${filter==='today' ? `<span style="color:var(--muted);font-size:12px">期限が今日まで、または開始日が今日以前</span>` : ''}
      ${filter==='now' ? `<span style="color:var(--muted);font-size:12px">「いつやる？」が今日必ずのタスク</span>` : ''}
    </div>
    ${groups.length ? groups.map((g, gi) => `
      <div class="grp">
        ${g.name ? `<div class="grp-h">
          <b>${g.color ? `<i class="gdot" style="background:${g.color}"></i>` : ''}${esc(g.name.replace('▦ ',''))}</b>
          <span>${g.rows.length} 件</span></div>` : ''}
        ${APP === 'note'
          ? `<div class="rowgrid">${g.rows.map(it => rowHTML(it, gi)).join('')}</div>`
          : g.rows.map(it => rowHTML(it, gi)).join('')}
      </div>`).join('') : `<div class="empty">${
        filter==='done' ? '完了したものはまだありません' :
        filter==='now' ? '「今日必ず」のタスクはありません 🎉' :
        filter==='today' ? '今日やるタスクはありません 🎉' :
        '該当するタスクはありません'}</div>`}`;

  const qi = document.getElementById('q');
  wireSearchInput(qi, (val, p) => { q = val; renderTasks();
    const n = document.getElementById('q'); if(n){ n.focus(); n.setSelectionRange(p, p); } });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  document.getElementById('gBy').onchange = e => { S.groupBy = e.target.value; save(); renderTasks(); };
  document.getElementById('foldAll').onclick = () => {
    items.forEach(i => folded[i.card.id] = anyOpen); renderTasks();
  };

  wireRows(document.getElementById('view'));
  wireRowDnD(document.getElementById('view'));
}

/* タスク一覧の手動並び替え */
let dragRow = null, dragRowG = null;
function wireRowDnD(v){
  v.querySelectorAll('[data-rgrip]').forEach(g => {
    g.ondragstart = ev => {
      const [id, gi] = g.dataset.rgrip.split('|');
      dragRow = id; dragRowG = gi;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', id);
      ev.stopPropagation();
      g.closest('.rwrap')?.classList.add('rdrag');
    };
    g.ondragend = () => {
      dragRow = dragRowG = null;
      v.querySelectorAll('.rwrap').forEach(x => x.classList.remove('rdrag', 'rdrop', 'rdrop-b'));
    };
  });
  v.querySelectorAll('.rwrap[data-rowid]').forEach(el => {
    el.ondragover = ev => {
      if(!dragRow || el.dataset.grp !== dragRowG || el.dataset.rowid === dragRow) return;
      ev.preventDefault(); ev.stopPropagation();
      const r = el.getBoundingClientRect(), after = ev.clientY > r.top + r.height / 2;
      el.classList.toggle('rdrop', !after);
      el.classList.toggle('rdrop-b', after);
    };
    el.ondragleave = () => el.classList.remove('rdrop', 'rdrop-b');
    el.ondrop = ev => {
      ev.preventDefault(); ev.stopPropagation();
      el.classList.remove('rdrop', 'rdrop-b');
      const src = dragRow;
      dragRow = dragRowG = null;
      if(!src || src === el.dataset.rowid) return;
      const ids = [...el.closest('.grp').querySelectorAll('.rwrap[data-rowid]')]
        .map(x => x.dataset.rowid).filter(x => x !== src);
      const r = el.getBoundingClientRect(), after = ev.clientY > r.top + r.height / 2;
      const at = ids.indexOf(el.dataset.rowid);
      ids.splice(after ? at + 1 : at, 0, src);
      ids.forEach((id, i) => { const f = findCard(id); if(f) f.card.tord = i * 10; });
      save(); renderTasks();
    };
  });
}

/* タスク行（タスク一覧・Done で共通） */
function wireRows(v){
  v.querySelectorAll('[data-tdone]').forEach(el => el.onchange = () => setDone(el.dataset.tdone, el.checked));
  v.querySelectorAll('[data-date]').forEach(el =>
    el.onclick = () => dateMenu(el.getBoundingClientRect(), el.dataset.date));
  v.querySelectorAll('[data-tagc]').forEach(el => el.onclick = e => {
    const ed = e.target.closest('[data-tagedit]');
    if(ed){ e.stopPropagation(); return tagMenu(ed.getBoundingClientRect(), ed.dataset.tagedit); }
    selectTag(el.dataset.tagc);
  });
  v.querySelectorAll('[data-tsdone]').forEach(el => el.onchange = () => {
    const [cid, sid] = el.dataset.tsdone.split('|');
    setSubDone(cid, sid, el.checked); });
  v.querySelectorAll('[data-tstitle]').forEach(el => {
    wireRich(el);
    el.onblur = () => {
      const [cid, sid] = el.dataset.tstitle.split('|');
      const k = findCard(cid).card;
      if(!el.innerText.trim()) k.subs = k.subs.filter(x => x.id !== sid);
      else saveBody(el);
      save(); hideRT(); reRender();
    };
    el.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } };
  });
  v.querySelectorAll('[data-menu]').forEach(el => el.onclick = e => cardMenu(e, el.dataset.menu));
  v.querySelectorAll('[data-tsdel]').forEach(el => el.onclick = () => {
    const [cid, sid] = el.dataset.tsdel.split('|');
    const k = findCard(cid).card;
    const s2 = (k.subs || []).find(x => x.id === sid);
    const nm = plain(s2 ? s2.title : '').trim();
    if(nm && !confirm(`サブタスク「${nm}」を削除しますか？`)) return;
    k.subs = k.subs.filter(x => x.id !== sid); save(); render(); });
  v.querySelectorAll('[data-subadd]').forEach(el => el.onclick = () => subAdd(el));
  v.querySelectorAll('[data-secadd]').forEach(el => el.onclick = () => {
    const [which, cid] = el.dataset.secadd.split('|');
    const k = findCard(cid).card;
    if(which === 'memo'){ k.hasMemo = true; if(k.fold) k.fold.memo = false; }
    else if(which === 'quote'){
      k.quote = {text:'', author:'', source:'', page:'', memo:'', card:false};
      if(k.fold) k.fold.quote = false;
    }
    else if(which === 'pdf'){ pdfAdd(cid); return; }
    else { k.logs = [newLog()]; (k.fold ||= {}).log = false; }
    save(); render();
    document.querySelector({memo:`[data-body="${cid}"]`, quote:`[data-qtext="${cid}"]`}[which]
      || `[data-logtext^="${cid}|"]`)?.focus();
  });
  wireCards(v);   // メモ / Message Log セクションを一覧内でも操作できるように
  v.querySelectorAll('[data-toggle]').forEach(el => el.onclick = () => {
    folded[el.dataset.toggle] = !folded[el.dataset.toggle];
    if(view.type === 'done') renderDone(); else renderTasks(); });
  v.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
    view = {type:'board', id:el.dataset.goto}; render(); });
}

const PIEC = ['#3d6fe0', '#4f8f57', '#d98324', '#7b52c0', '#c9899a', '#c9a227', '#5b6577', '#c0392b'];
let timeSel = null;      // 表示中の日（null = 今日）
let timeWork = false;    // Work タブ
let timeAll = false;     // すべての記録を表示
let pieRange = 'day';    // day | week | month | year
let calMonth = null;     // 'YYYY-MM'

/* ボード別に合計する */
function byBoard(list){
  const m = [];
  list.forEach(i => {
    /* Notes では本のタイトルごとにまとめる（Book メモ・親から継いだ Read も拾う）*/
    const note = APP === 'note';
    let ttl = '';
    if(note){
      const k = i.card;
      ttl = (k.book ? (k.book.title || '') : (readMeta(k).source || '')).trim()
        || (k.read ? (k.read.source || '').trim() : '')
        || plain(k.title).trim();
    }
    const id = note ? (ttl || '—') : i.board.id;
    const nm = note ? (ttl || '無題') : i.board.name;
    let g = m.find(x => x.id === id);
    if(!g) m.push(g = {id, name:nm, color:note ? '' : (i.board.color || ''), sec:0});
    g.sec += i.e.sec || 0;
  });
  m.forEach((g, n) => g.color = g.color || PIEC[n % PIEC.length]);
  return m.sort((a, b) => b.sec - a.sec);
}
/* ドーナツ円グラフ（依存なしのSVG） */
function donut(data, size){
  const total = data.reduce((a, d) => a + d.sec, 0);
  const r = size / 2, ir = r * 0.6, cx = r, cy = r;
  if(!total) return '';
  if(data.length === 1) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${(r+ir)/2}" fill="none"
      stroke="${data[0].color}" stroke-width="${r-ir}"><title>${esc(data[0].name)}</title></circle></svg>`;
  let a0 = -Math.PI / 2;
  const arcs = data.map(d => {
    const a1 = a0 + 2 * Math.PI * d.sec / total;
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const P = (a, rad) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
    const path = `M${P(a0, r)}A${r} ${r} 0 ${big} 1 ${P(a1, r)}L${P(a1, ir)}A${ir} ${ir} 0 ${big} 0 ${P(a0, ir)}Z`;
    a0 = a1;
    return `<path d="${path}" fill="${d.color}"><title>${esc(d.name)} ${fmtDur(d.sec)}</title></path>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}
/* 期間の判定とラベル */
function inRange(date, sel, range){
  if(!date) return false;
  if(range === 'day') return date === sel;
  if(range === 'month') return date.slice(0, 7) === sel.slice(0, 7);
  if(range === 'year') return date.slice(0, 4) === sel.slice(0, 4);
  const s = iso(weekStart(parse(sel)));
  return date >= s && date <= addDays(s, 6);
}
function rangeLabel(sel, range){
  const [y, m, d] = sel.split('-');
  if(range === 'day') return `${+m}/${+d}（${WD[parse(sel).getDay()]}）`;
  if(range === 'month') return `${y}年${+m}月`;
  if(range === 'year') return `${y}年`;
  const s = iso(weekStart(parse(sel))), e = addDays(s, 6);
  return `${+s.slice(5,7)}/${+s.slice(8)} 〜 ${+e.slice(5,7)}/${+e.slice(8)}`;
}
/* 積み上げ棒グラフ用のデータ */
function barCols(all, sel, range){
  let keys = [];
  if(range === 'year'){
    const y = sel.slice(0, 4);
    for(let m = 1; m <= 12; m++){
      const k = `${y}-${pad2(m)}`;
      keys.push({label:`${m}`, pick:d => (d || '').slice(0, 7) === k});
    }
  } else {
    let days = [];
    if(range === 'month'){
      const [y, m] = sel.split('-').map(Number);
      const last = new Date(y, m, 0).getDate();
      for(let i = 1; i <= last; i++) days.push(`${sel.slice(0,7)}-${pad2(i)}`);
    } else if(range === 'week'){
      const s = iso(weekStart(parse(sel)));
      for(let i = 0; i < 7; i++) days.push(addDays(s, i));
    } else {
      for(let i = 6; i >= 0; i--) days.push(addDays(sel, -i));
    }
    keys = days.map(dd => ({label:String(+dd.slice(8)), day:dd, pick:d => d === dd}));
  }
  const rowsIn = all.filter(i => keys.some(k => k.pick(i.e.date)));
  const boards = byBoard(rowsIn);
  const cols = keys.map(k => {
    const rows = all.filter(i => k.pick(i.e.date));
    const gs = byBoard(rows);          /* まとめ方は円グラフと同じ */
    const parts = boards.map(b => ({
      color:b.color, name:b.name,
      sec:(gs.find(x => x.id === b.id) || {sec:0}).sec,
    })).filter(p => p.sec);
    return {label:k.label, day:k.day, parts, total:parts.reduce((a, p) => a + p.sec, 0)};
  });
  return {cols, boards};
}
const axisLabel = v => !v ? '0' : (v % 3600 ? `${Math.round(v/60)}分` : `${v/3600}h`);
/* 積み上げ棒グラフ */
function barChart(cols, sel){
  const n = cols.length;
  const max = Math.max(1, ...cols.map(c => c.total));
  const step = max <= 1800 ? 600 : max <= 3600 ? 900 : max <= 4*3600 ? 3600 : Math.ceil(max/4/3600)*3600;
  const top = Math.ceil(max / step) * step;
  const padL = 54, padR = 10, padT = 16, padB = 26;
  const bw = n > 20 ? 14 : n > 10 ? 22 : 30, gap = n > 20 ? 6 : 12;
  const W = Math.max(560, padL + padR + n * (bw + gap));
  const H = 216, innerH = H - padT - padB;
  const X = i => padL + i * (bw + gap) + gap / 2;
  let grid = '';
  for(let v = 0; v <= top; v += step){
    const y = padT + innerH - (v / top) * innerH;
    grid += `<line x1="${padL-4}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eeeae9"/>
      <text x="${padL-8}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#a7a0a2">${axisLabel(v)}</text>`;
  }
  const bars = cols.map((c, i) => {
    let y = padT + innerH, s = '';
    c.parts.forEach(p => {
      const h = (p.sec / top) * innerH; y -= h;
      s += `<rect x="${X(i)}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(1,h).toFixed(1)}"
        fill="${p.color}" rx="2"><title>${esc(p.name)} ${fmtDur(p.sec)}</title></rect>`;
    });
    const isSel = c.day && c.day === sel;
    s += `<text x="${X(i)+bw/2}" y="${H-8}" text-anchor="middle" font-size="10"
      fill="${isSel?'var(--accent)':'#8b8285'}" font-weight="${isSel?'700':'400'}">${esc(c.label)}</text>`;
    if(c.total) s += `<text x="${X(i)+bw/2}" y="${(y-5).toFixed(1)}" text-anchor="middle"
      font-size="9" fill="#a7a0a2">${fmtDur(c.total)}</text>`;
    if(c.day) s = `<g style="cursor:pointer" data-barday="${c.day}">${s}</g>`;
    return s;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet"
    style="max-width:${W}px">${grid}${bars}</svg>`;
}
/* カレンダー（marks: {日付: ツールチップ}／allLabel: すべて表示ボタンの文言） */
/* ---------------- 日本の祝日 ---------------- */
const holCache = {};
function jpHolidays(y){
  if(holCache[y]) return holCache[y];
  const H = {};
  const set = (m, d, n) => { if(d >= 1) H[`${y}-${pad2(m)}-${pad2(d)}`] = n; };
  /* ○月の第 n 月曜 */
  const nthMon = (m, n) => {
    const first = new Date(y, m - 1, 1).getDay();
    return 1 + ((8 - first) % 7) + (n - 1) * 7;
  };
  set(1, 1, '元日');
  set(1, nthMon(1, 2), '成人の日');
  set(2, 11, '建国記念の日');
  if(y >= 2020) set(2, 23, '天皇誕生日');
  /* 春分・秋分（1980〜2099 の近似式） */
  set(3, Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), '春分の日');
  set(4, 29, y >= 2007 ? '昭和の日' : 'みどりの日');
  set(5, 3, '憲法記念日');
  set(5, 4, y >= 2007 ? 'みどりの日' : '国民の休日');
  set(5, 5, 'こどもの日');
  if(y >= 2003) set(7, nthMon(7, 3), '海の日'); else set(7, 20, '海の日');
  if(y >= 2016) set(8, 11, '山の日');
  set(9, nthMon(9, 3), '敬老の日');
  set(9, Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), '秋分の日');
  set(10, nthMon(10, 2), y >= 2020 ? 'スポーツの日' : '体育の日');
  set(11, 3, '文化の日');
  set(11, 23, '勤労感謝の日');
  if(y <= 2018) set(12, 23, '天皇誕生日');
  /* 国民の休日（前後を祝日に挟まれた平日） */
  Object.keys(H).slice().forEach(k => {
    const d2 = addDays(k, 2);
    if(H[d2] && !H[addDays(k, 1)] && parse(addDays(k, 1)).getDay() !== 0)
      H[addDays(k, 1)] = '国民の休日';
  });
  /* 振替休日（日曜と重なったら次の平日） */
  Object.keys(H).slice().forEach(k => {
    if(parse(k).getDay() !== 0) return;
    let n2 = addDays(k, 1);
    while(H[n2]) n2 = addDays(n2, 1);
    H[n2] = '振替休日';
  });
  return holCache[y] = H;
}
const holName = d => d ? (jpHolidays(+d.slice(0, 4))[d] || '') : '';

function calendarHTML(marks, sel, cm, allOn, allLabel){
  const [y, m] = cm.split('-').map(Number);
  const lead = new Date(y, m - 1, 1).getDay(), last = new Date(y, m, 0).getDate();
  let cells = '';
  for(let i = 0; i < lead; i++) cells += `<span class="cd out"></span>`;
  for(let dd = 1; dd <= last; dd++){
    const key = `${cm}-${pad2(dd)}`;
    const wd = (lead + dd - 1) % 7;
    const hn = holName(key);
    const cls = hn || wd === 0 ? 'sun' : wd === 6 ? 'sat' : '';
    cells += `<button class="cd ${cls} ${key===sel?'sel':''} ${key===today()?'tdy':''}" data-cal="${key}"
      title="${hn ? esc(hn) + (marks[key] ? ' ・ ' : '') : ''}${marks[key] ? esc(marks[key]) : (hn ? '' : 'なし')}"
      >${dd}${marks[key]?'<i></i>':''}</button>`;
  }
  return `<div class="cal">
    <div class="cal-h"><button data-cm="-1">‹</button><b>${y}年${m}月</b><button data-cm="1">›</button></div>
    <div class="cal-w">${WD.map((x, i) =>
      `<span class="${i===0?'sun':i===6?'sat':''}">${x}</span>`).join('')}</div>
    <div class="cal-g">${cells}</div>
    <div class="cal-f"><button data-cal="${today()}">今日</button>
      ${allLabel ? `<button id="calAll" class="${allOn?'on':''}">${allLabel}</button>` : ''}</div>
  </div>`;
}

const timeListOf = cid => cid === 'work'

function delTime(cid, eid){

  const k = findCard(cid)?.card; if(!k) return;

function timeEdit(rect, cid, eid){
  const list = timeListOf(cid);
  const e = list.find(x => x.id === eid); if(!e) return;
  const mins = Math.round((e.sec || 0) / 60);
  const p = popup(Math.max(20, rect.left - 40), rect.bottom + 6, `<div class="dpanel" style="width:252px">
    <h4>記録を編集</h4>
    <div class="drow"><label>日にち</label><input type="date" id="teD" value="${e.date || ''}"></div>
    <div class="drow"><label>開始</label><input type="time" id="teS" value="${e.start || ''}"></div>
    <div class="drow"><label>終了</label><input type="time" id="teE" value="${e.end || ''}"></div>
    <div class="drow"><label>合計(分)</label><input type="number" id="teM" min="0" step="1" value="${mins}"></div>
    <div class="hint">開始・終了を変えると合計を計算します。<br>合計だけを直接入れることもできます。</div>
    <div class="dfoot"><button id="teDel" style="color:#c0392b">削除</button>
      <button id="teOK">OK</button></div>
  </div>`);
  const $ = id => p.querySelector('#' + id);
  const calc = () => {
    const s = $('teS').value, t = $('teE').value;
    if(!s || !t) return;
    const [sh, sm] = s.split(':').map(Number), [eh, em] = t.split(':').map(Number);
    let d = (eh * 60 + em) - (sh * 60 + sm);
    if(d < 0) d += 24 * 60;
    $('teM').value = d;
  };
  $('teS').onchange = calc;
  $('teE').onchange = calc;
  $('teDel').onclick = () => {
    if(!confirm('この記録を削除しますか？')) return;
    delTime(cid, eid);
    save(); p.remove(); render();
  };
  $('teOK').onclick = () => {
    e.date = $('teD').value || e.date;
    e.start = $('teS').value;
    e.end = $('teE').value;
    e.sec = Math.max(0, Math.round((+$('teM').value || 0) * 60));
    if(cid !== 'work') touch(cid);
    save(); p.remove(); render();
  };
}

/* ---------------- Daily Memo（日付ごとのメモ） ---------------- */
let dailySel = null, dailyMonth = null;
let dailyAll = false, dailyBack = 'today';
/* 何日前を見るか */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* 2026-08-13 → Aug 13（年が違えば Aug 13, 2025） */
function enDate(d){
  if(!d) return '';
  const [y, m, dd] = d.split('-').map(Number);
  const now = new Date().getFullYear();
  return `${MON[m - 1]} ${dd}${y !== now ? ', ' + y : ''}`;
}
const BACKS = () => [
  ['today', (dailySel || today()) === today() ? 'Today' : enDate(dailySel || today())],
  ['w','Last week'], ['m','Last month'], ['y','Last year'],
];
function backDate(base, kind){
  const d = parse(base);
  if(kind === 'w') d.setDate(d.getDate() - 7);
  else if(kind === 'm') d.setMonth(d.getMonth() - 1);
  else if(kind === 'y') d.setFullYear(d.getFullYear() - 1);
  return iso(d);
}
/* その日に書いたメモを、すべてのボードから集める */
const cardsOn = day => allCards().filter(x => {
  const k = x.card;
  if(k.type === 'heading') return false;
  const d = k.day || noteDate(k) || k.created || '';
  return d === day;
});
function renderDaily(b){
  b.days ||= {};
  const sel = dailySel || today();
  dailyMonth ||= sel.slice(0, 7);
  const marks = {};
  Object.entries(b.days).forEach(([dd, v]) => {
    const t = plain(v).trim();
    if(t) marks[dd] = t.slice(0, 40);
  });
  (b.cols && b.cols[0] ? b.cols[0].cards : []).forEach(k => {
    if(k.day) marks[k.day] = (marks[k.day] || '') || `${plain(k.title).trim() || 'カード'}`;
  });
  /* カードは1つの列にまとめ、日付で振り分ける */
  if(!b.cols || !b.cols.length) b.cols = [{id:uid(), title:'Daily', w:288, cards:[]}];
  const col = b.cols[0];
  const dayCards = col.cards.filter(k => (k.day || '') === sel
    && !(k.type === 'task' && k.done) && !k.parent);
  const cardDays = new Set(col.cards.map(k => k.day).filter(Boolean));
  const allDays = [...new Set([
    ...Object.keys(b.days).filter(dd => plain(b.days[dd]).trim() || (b.days[dd] || '').includes('<img')),
    ...cardDays])].sort((x, y) => y.localeCompare(x));
  const recent = allDays.slice(0, 14);

  document.getElementById('view').innerHTML = `
    <div class="dailywrap">
      <div class="dailyside">
        ${calendarHTML(marks, sel, dailyMonth, false, '')}
        ${pinListHTML(b.id)}
      </div>
      <div class="dailymain">
        ${dailyAll ? '' : `<div class="tools" style="margin-bottom:12px">
          <div class="seg">${BACKS().map(([v, n]) =>
            `<button data-back="${v}" class="${dailyBack===v?'on':''}">${n}</button>`).join('')}</div>
        </div>`}
        ${dailyAll ? `
        <div class="daily-h">
          <b>All</b><span>すべての記録</span>
          <button class="btn" id="dailyOne" style="margin-left:auto;padding:4px 12px;font-size:12px">今日へ</button>
        </div>
        ${allDays.length ? allDays.map(dd => `
          <div class="dayblock">
            <div class="db-h"><b>${dd}</b><span>${WD[parse(dd).getDay()]}曜</span>
              ${dd === today() ? '<span class="dl-today">今日</span>' : ''}
              ${weatherHTML(b, dd)}
              <button class="btn db-open" data-cal="${dd}">開く</button></div>
            ${plain(b.days[dd] || '').trim() || (b.days[dd] || '').includes('<img')
              ? `<div class="body dailybody" contenteditable="true" data-daily="${dd}"
                   data-ph="今日のこと…">${clean(b.days[dd] || '')}</div>` : ''}
            ${col.cards.filter(k => (k.day || '') === dd && !(k.type === 'task' && k.done)).length
              ? `<div class="dailycards"><div class="drop">${col.cards
                  .filter(k => (k.day || '') === dd && !(k.type === 'task' && k.done))
                  .map(cardHTML).join('')}</div></div>` : ''}
          </div>`).join('') : `<div class="empty">まだ記録がありません</div>`}
        ` : dailyBack !== 'today' ? (() => {
          const bd = backDate(sel, dailyBack);
          const L = cardsOn(bd);
          return `
        <div class="daily-h">
          <b>${bd}</b><span>${WD[parse(bd).getDay()]}曜</span>
          ${weatherHTML(b, bd)}
          <button class="btn" id="dailyAllBtn" style="margin-left:auto;padding:4px 12px;font-size:12px">All</button>
          <button class="btn" id="dailyToday" style="padding:4px 12px;font-size:12px">今日へ</button>
        </div>
        ${L.length ? `<div class="dailycards"><div class="drop">${
          L.map(x => cardHTML(x.card)).join('')}</div></div>`
          : `<div class="empty">この日に書いたメモはありません</div>`}`;
        })() : `
        <div class="daily-h">
          <b>${sel}</b><span>${WD[parse(sel).getDay()]}曜</span>
          ${sel === today() ? '<span class="dl-today">今日</span>' : ''}
          ${weatherHTML(b, sel)}
          <button class="btn" id="dailyAllBtn" style="margin-left:auto;padding:4px 12px;font-size:12px">All</button>
          <button class="btn" id="dailyToday" style="padding:4px 12px;font-size:12px">今日へ</button>
        </div>
        <div class="dailycards">
          <button class="add" data-add="${col.id}" style="margin-bottom:10px">＋ New</button>
          <div class="drop" data-drop="${col.id}">${dayCards.map(cardHTML).join('')}</div>
        </div>
        `}
      </div>
    </div>`;

  const v = document.getElementById('view');
  v.querySelectorAll('[data-cal]').forEach(el => el.onclick = () => {
    dailySel = el.dataset.cal; dailyMonth = dailySel.slice(0, 7);
    dailyAll = false; dailyBack = 'today'; renderDaily(b); });
  v.querySelectorAll('[data-cm]').forEach(el => el.onclick = () => {
    const [y, m] = dailyMonth.split('-').map(Number);
    const dd = new Date(y, m - 1 + (+el.dataset.cm), 1);
    dailyMonth = `${dd.getFullYear()}-${pad2(dd.getMonth()+1)}`; renderDaily(b); });
  v.querySelectorAll('[data-wx]').forEach(el => el.onclick = () => {
    const [k, dd] = el.dataset.wx.split('|');
    const cur = wxOf(b, dd);
    const i = cur.indexOf(k);
    if(i >= 0) cur.splice(i, 1); else cur.push(k);
    if(!cur.length) delete b.weather[dd];
    save(); el.classList.toggle('on', i < 0);
  });
  const dt = document.getElementById('dailyToday');
  if(dt) dt.onclick = () => {
    dailySel = today(); dailyMonth = dailySel.slice(0, 7); dailyBack = 'today'; renderDaily(b);
  };
  v.querySelectorAll('[data-back]').forEach(el => el.onclick = () => {
    dailyBack = el.dataset.back; renderDaily(b);
  });
  const da = document.getElementById('dailyAllBtn');
  if(da) da.onclick = () => { dailyAll = true; renderDaily(b); };
  const d1 = document.getElementById('dailyOne');
  if(d1) d1.onclick = () => {
    dailyAll = false; dailySel = today(); dailyMonth = dailySel.slice(0, 7); renderDaily(b);
  };
  v.querySelectorAll('[data-daily]').forEach(ed => {
    wireRich(ed);
    ed.onblur = () => { saveBody(ed); hideRT(); };
  });
  v.querySelectorAll('[data-add]').forEach(el => el.onclick = e => addMenu(e, el.dataset.add));
  wireCards(v); wireDnD(v);
}

/* ---------------- PDF 添付 ---------------- */
const PDF_LIMIT = 3 * 1024 * 1024;      /* これ以下はアプリの中に保存 */
const hasPdf = k => Array.isArray(k.pdfs) && k.pdfs.length > 0;
const fmtSize = n => n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + ' MB'
  : Math.max(1, Math.round(n / 1024)) + ' KB';
const PDFICO = '<svg class="lbico" viewBox="0 0 16 16"><path d="M3.4 1.9h6l3.2 3.2v9a.9.9 0 0 1-.9.9H3.4a.9.9 0 0 1-.9-.9V2.8a.9.9 0 0 1 .9-.9z"/><path d="M9.2 2v3.2h3.3"/><path d="M5.4 9.4h5.2M5.4 11.6h3.4"/></svg>';

  const L = k.pdfs;

      <div class="pdfrow">
        <span class="pdfnm" title="${esc(f.name)}">${esc(f.name)}</span>
        <span class="pdfsz">${f.size ? fmtSize(f.size) : ''}${f.link ? '・リンク' : ''}</span>
        <button class="dmini" data-pdfview="${k.id}|${f.id}">${f.open ? '閉じる' : '中を見る'}</button>
        <button class="dmini" data-pdfopen="${k.id}|${f.id}">別の窓で開く</button>

      </div>
      ${f.open ? `<div class="pdfbox"><iframe data-pdfframe="${k.id}|${f.id}" title="${esc(f.name)}"></iframe></div>` : ''}
    `).join('')}</div>
      <button class="logadd" data-pdfadd="${k.id}">＋ PDF を追加</button>` : ''}
  </div>`;

/* PDF の中身を取り出す（埋め込み or 記憶しておいた場所から）*/
async function pdfURL(k, f){
  if(f.data) return f.data;
  const hd = await loadH('pdf:' + f.id);
  if(!hd) return '';
  if(!(await ensurePerm(hd))) return '';
  try{
    const file = await hd.getFile();
    return URL.createObjectURL(file);
  }catch(e){ return ''; }
}
async function pdfAdd(cid){
  const k = findCard(cid)?.card; if(!k) return;
  k.pdfs ||= [];
  const id = uid();
  if(window.showOpenFilePicker){
    let hd;
    try{
      [hd] = await window.showOpenFilePicker({multiple:false,
        types:[{description:'PDF', accept:{'application/pdf':['.pdf']}}]});
    }catch(e){ return; }
    const file = await hd.getFile();
    if(file.size <= PDF_LIMIT){
      const r = new FileReader();
      r.onload = () => {
        k.pdfs.push({id, name:file.name, size:file.size, data:r.result});
        (k.fold ||= {}).pdf = false;
        touch(k); save(); render();
      };
      r.readAsDataURL(file);
    } else {
      if(!confirm(`「${file.name}」は ${fmtSize(file.size)} と大きいので、`
        + 'アプリの中には入れずに「場所を覚えておく」形にします。\n'
        + '（このパソコンでだけ開けます。スマホでは見られません）')) return;
      await keepH('pdf:' + id, hd);
      k.pdfs.push({id, name:file.name, size:file.size, link:true});
      (k.fold ||= {}).pdf = false;
      touch(k); save(); render();
    }
    return;
  }
  /* ファイル選択だけの端末（スマホなど）*/
  pendingPdf = cid;
  document.getElementById('pdfFile').click();
}
let pendingPdf = null;
function pdfFromInput(file){
  const k = findCard(pendingPdf)?.card; pendingPdf = null;
  if(!k || !file) return;
  if(file.size > PDF_LIMIT){
    alert(`この端末では ${fmtSize(PDF_LIMIT)} までの PDF を入れられます。\n`
      + `（${file.name} は ${fmtSize(file.size)}）`);
    return;
  }
  k.pdfs ||= [];
  const r = new FileReader();
  r.onload = () => {
    k.pdfs.push({id:uid(), name:file.name, size:file.size, data:r.result});
    (k.fold ||= {}).pdf = false;
    touch(k); save(); render();
  };
  r.readAsDataURL(file);
}

/* ---------------- Quote / Read の一覧ページ ---------------- */
let readSel = null, readAll = true, readMonth = null, qRandId = null;
let colFilter = {quote:{author:'', source:''}, read:{author:'', source:''}};
function renderCollection(kind){
  const t = document.getElementById('pageTitle');
  t.disabled = true; t.oninput = null; t.style.color = '';
  document.getElementById('topActions').innerHTML = '';

  const nonEmpty = o => !!o && !!(plain(o.text || '').trim() || (o.author || '').trim()
    || (o.source || '').trim() || plain(o.memo || '').trim() || (o.media || '').trim()
    || (o.flags || []).length);
  const okRead = x => hasRead(x.card) && nonEmpty(x.card.read);
  const okQuote = x => hasQuote(x.card) && nonEmpty(x.card.quote);
  /* Read Memo には Quote メモも並べる */
  const kdOf = x => x.kd || kind;
  const objOf = x => kdOf(x) === 'quote' ? x.card.quote : x.card.read;
  const dOf = x => (objOf(x).date) || x.card.created || '';
  let all = (kind === 'quote'
    ? allCards().filter(okQuote)
    : allCards().filter(x => okRead(x) || okQuote(x)))
    .map(x => ({...x, kd: kind === 'quote' ? 'quote' : (okRead(x) ? 'read' : 'quote')}));
  if(q){
    const s = q.toLowerCase();
    all = all.filter(x => {
      const k = x.card, o = objOf(x);
      return [plain(o.text), o.author, o.source, o.media, plain(o.memo),
        plain(k.title), x.board.name, (o.flags || []).join(' ')]
        .join(' ').toLowerCase().includes(s);
    });
  }

  /* 著者・出典での絞り込み */
  const cf = colFilter[kind];
  const metaOf = x => kdOf(x) === 'quote' ? quoteMeta(x.card) : readMeta(x.card);
  const authors = [...new Set(all.map(x => metaOf(x).author).filter(Boolean))].sort();
  const sources = [...new Set(all.map(x => metaOf(x).source).filter(Boolean))].sort();
  if(cf.author) all = all.filter(x => metaOf(x).author === cf.author);
  if(cf.source) all = all.filter(x => metaOf(x).source === cf.source);

  /* Read Log は日付で絞り込める */
  let items = all.slice(), cal = '';
  if(kind === 'read'){
    const sel = readSel || today();
    readMonth ||= sel.slice(0, 7);
    const marks = {};
    all.forEach(x => { const dd = dOf(x); if(dd) marks[dd] = ((+(marks[dd] || '0').replace('件','')) + 1) + '件'; });
    cal = calendarHTML(marks, sel, readMonth, readAll, 'すべて表示');
    if(!readAll) items = all.filter(x => dOf(x) === sel);
    t.value = readAll ? 'Read Memo' : `Read Memo ｜${sel}`;
  } else {
    t.value = 'Quotes';
  }
  items.sort((a, b) => dOf(b).localeCompare(dOf(a)));

  /* Quotes は左にランダム1枚 */
  let rand = '';
  if(kind === 'quote' && items.length){
    let cur = items.find(x => x.card.id === qRandId);
    if(!cur){ cur = items[Math.floor(Math.random() * items.length)]; qRandId = cur.card.id; }
    rand = `<div class="qrand">
      <h5>This one for you</h5>
      <div class="dcard">
        <div class="dcard-h">${actTgl(cur.card)}${
          cardTgl('quote', cur.card, cur.card.quote && cur.card.quote.card)}${pinTgl(cur.card)}</div>
        ${quoteCardHTML(cur.card)}
      </div>
      <div class="dsrc" style="margin-top:10px">
        <span style="${cur.board.color?`color:${cur.board.color}`:''}">▦</span>
        <b data-goto="${cur.board.id}">${esc(cur.board.name)}</b>
      </div>
      <div class="dbtn" style="margin-top:12px">
        <button class="btn" id="qRandNext">Next Quote</button>
      </div>
    </div>`;
  }

  document.getElementById('view').innerHTML = `
    <div class="tools">
      <input class="search" id="q" placeholder="${kind === 'quote' ? '引用文・著者・出典' : '本のタイトル・著者・感想'}で検索…" value="${esc(q)}">
      <span class="gsel"><label>著者</label>
        <select id="fAuthor"><option value="">すべて</option>
          ${authors.map(a2 => `<option ${cf.author===a2?'selected':''}>${esc(a2)}</option>`).join('')}</select></span>
      <span class="gsel"><label>出典</label>
        <select id="fSource"><option value="">すべて</option>
          ${sources.map(s2 => `<option ${cf.source===s2?'selected':''}>${esc(s2)}</option>`).join('')}</select></span>
      <span style="color:var(--muted);font-size:12.5px">${items.length} 件</span>
      ${cf.author || cf.source ? `<button class="btn" id="fClear" style="padding:4px 10px;font-size:12px">絞り込みを解除</button>` : ''}
    </div>
    ${rand ? `${rand}<div class="qlist">${listHTML(items, kind)}</div>`
      : cal ? `<div class="tlrow readrow">${cal}
          <div class="rdmain">${listHTML(items, kind)}</div></div>`
      : listHTML(items, kind)}`;

  const qi = document.getElementById('q');
  wireSearchInput(qi, (val, p) => { q = val; renderCollection(kind);
    const n = document.getElementById('q'); if(n){ n.focus(); n.setSelectionRange(p, p); } });
  const v = document.getElementById('view');
  v.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    readSel = b.dataset.cal; readMonth = readSel.slice(0, 7); readAll = false; renderCollection(kind); });
  v.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => {
    const [y, m] = readMonth.split('-').map(Number);
    const dd = new Date(y, m - 1 + (+b.dataset.cm), 1);
    readMonth = `${dd.getFullYear()}-${pad2(dd.getMonth()+1)}`; renderCollection(kind); });
  const ca = document.getElementById('calAll');
  if(ca) ca.onclick = () => { readAll = !readAll; renderCollection(kind); };
  const fa = document.getElementById('fAuthor'), fs2 = document.getElementById('fSource');
  if(fa) fa.onchange = e => { cf.author = e.target.value; qRandId = null; renderCollection(kind); };
  if(fs2) fs2.onchange = e => { cf.source = e.target.value; qRandId = null; renderCollection(kind); };
  const fc = document.getElementById('fClear');
  if(fc) fc.onclick = () => { cf.author = ''; cf.source = ''; qRandId = null; renderCollection(kind); };
  const rn = document.getElementById('qRandNext');
  if(rn) rn.onclick = () => {
    if(items.length > 1){
      let n; do { n = items[Math.floor(Math.random() * items.length)]; } while(n.card.id === qRandId);
      qRandId = n.card.id;
    }
    renderCollection(kind);
  };
  wireCards(v);
  v.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
    view = {type:'board', id:el.dataset.goto}; render(); });
}
function listHTML(items, kind){
  if(!items.length) return `<div class="empty">${kind === 'quote' ? 'Quote' : 'Read'} はまだありません<br>
    <span style="font-size:12px">ボードの「＋ New」から作れます</span></div>`;
  return `<div class="colwrap ${kind === 'quote' ? 'gallery' : ''}">${items.map(x => {
    const k = x.card;
    const kd = x.kd || kind;
    return `<div class="card ${kd} colitem">
      <div class="col-src">
        <span data-goto="${x.board.id}" style="cursor:pointer">
          <span style="${x.board.color?`color:${x.board.color}`:''}">▦</span> ${esc(x.board.name)}</span>
        ${plain(k.title).trim() ? `<span>／ ${esc(plain(k.title).trim())}</span>` : ''}
        <span style="margin-left:auto">${cardTgl(kd, k,
          kd === 'quote' ? (k.quote && k.quote.card) : (k.read && k.read.card))}</span>
      </div>
      ${citeLine(k)}
      ${canTime(k) ? `<div class="meta meta2">${timerChip(k)}</div>` : ''}
      ${kd === 'quote' ? quoteSection(k, true) : readSection(k, true)}
    </div>`;
  }).join('')}</div>`;
}

/* 検索欄: 日本語変換中は再描画しない */
function wireSearchInput(el, onChange){
  let composing = false, timer = null;
  const fire = () => {
    clearTimeout(timer);
    timer = setTimeout(() => onChange(el.value, el.selectionStart), 200);
  };
  el.addEventListener('compositionstart', () => { composing = true; clearTimeout(timer); });
  el.addEventListener('compositionend', () => { composing = false; fire(); });
  el.addEventListener('input', () => { if(!composing) fire(); });

let searchQ = '', searchAuthor = '', searchSource = '';

let randId = null;
function randPool(){
  return allCards().filter(x => {
    const k = x.card;
    if(k.type === 'book' || k.type === 'heading') return false;   /* 本そのものは除く */
    return cardHay(k).trim().length > 0;
  });
}
function pickRand(){
  const pool = randPool();
  if(!pool.length){ randId = null; return; }
  let id = randId, n = 0;
  while(n++ < 12){
    const c = pool[Math.floor(Math.random() * pool.length)].card.id;
    if(pool.length === 1 || c !== randId){ id = c; break; }
  }
  randId = id;
}
function randBoxHTML(){
  if(!randId || !findCard(randId)) pickRand();

function cardHay(k){
  const Q = k.quote || {}, R = k.read || {};
  return [plain(k.title), k.bodyTitle, plain(k.body), plain(k.note), plain(k.head),
    ...(k.subs || []).map(s => [plain(s.title), plain(s.head), plain(s.note)].join(' ')),
    ...(k.tags || []).map(t => '#' + t),
    plain(Q.text), Q.author, Q.source, plain(Q.memo),
    R.author, R.source, R.media, plain(R.memo), (R.flags || []).join(' '),
    ...(k.logs || []).map(g => [g.from, ...(Array.isArray(g.to) ? g.to : [g.to]), g.who]
          .filter(Boolean).join(' ') + ' ' + plain(g.text)),
  ].filter(Boolean).join(' ').toLowerCase();
}
function excerpt(text, s, len){
  const t = (text || '').replace(/\s+/g, ' ').trim();
  const i = t.toLowerCase().indexOf(s);
  if(i < 0) return esc(t.slice(0, len));
  const from = Math.max(0, i - 24), to = Math.min(t.length, i + s.length + len);
  return (from ? '…' : '') + esc(t.slice(from, i)) +
    `<mark>${esc(t.slice(i, i + s.length))}</mark>` + esc(t.slice(i + s.length, to)) + (to < t.length ? '…' : '');
}
