      const src = dragBoard || ev.dataTransfer.getData('text/plain');
      const tgt = board(id);
      if(src && src !== id) moveBoard(src, tgt.folder || '', id);
    };
  });
  list.querySelectorAll('[data-fopen]').forEach(el => {
    const fid = el.dataset.fopen;
    el.onclick = e => {
      if(e.target.closest('[data-fmenu]')) return;
      const f = S.folders.find(x => x.id === fid);
      f.open = f.open === false; save(); renderSide();
    };
    el.oncontextmenu = e => { e.preventDefault(); folderMenu(e.clientX, e.clientY, fid); };
    el.ondragover = ev => { if(!dragBoard) return; ev.preventDefault(); ev.stopPropagation(); el.classList.add('dropf'); };
    el.ondragleave = () => el.classList.remove('dropf');
    el.ondrop = ev => {
      ev.preventDefault(); ev.stopPropagation();
      const src = dragBoard || ev.dataTransfer.getData('text/plain');

      if(src) moveBoard(src, fid, '');
    };
  });
  list.querySelectorAll('[data-fmenu]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const r = el.getBoundingClientRect();
    folderMenu(r.left - 120, r.bottom + 4, el.dataset.fmenu);
  });
  /* フォルダの外（＝ルート）に落とす */
  list.ondragover = ev => { if(!dragBoard) return; ev.preventDefault(); list.classList.add('dropr'); };
  list.ondragleave = () => list.classList.remove('dropr');
  list.ondrop = ev => {
    ev.preventDefault(); list.classList.remove('dropr');
    const src = dragBoard || ev.dataTransfer.getData('text/plain');
    if(src) moveBoard(src, '', '');
  };

  document.getElementById('navTasks').classList.toggle('on', view.type === 'tasks');
  document.getElementById('navTimes').classList.toggle('on', view.type === 'times');
  document.getElementById('navCards').classList.toggle('on', view.type === 'cards');
  document.getElementById('navSearch').classList.toggle('on', view.type === 'search');
  document.getElementById('navQuote').classList.toggle('on', view.type === 'quote');
  document.getElementById('navRead').classList.toggle('on', view.type === 'read');
  const nQ = allCards().filter(x => hasQuote(x.card)).length;
  const nR = allCards().filter(x => hasRead(x.card)).length;
  const qb2 = document.getElementById('cntQuote'), rb2 = document.getElementById('cntRead');

  rb2.textContent = nR; rb2.style.display = nR ? '' : 'none';
  document.getElementById('navDone').classList.toggle('on', view.type === 'done');
  const nD = allTasks().filter(t => t.card.done).length;
  const db = document.getElementById('cntDone');
  db.textContent = nD; db.style.display = nD ? '' : 'none';
  const nC = deck().length;
  const cb = document.getElementById('cntCards');
  cb.textContent = nC; cb.style.display = nC ? '' : 'none';
  const run = runningCard();
  const ct = document.getElementById('cntTime');
  ct.textContent = run ? '計測中' : '';
  ct.style.display = run ? '' : 'none';
  ct.style.background = '#fdeeee'; ct.style.color = '#c0392b';
  const nT = allTasks().filter(t => isToday(t.card)).length;
  const badge = document.getElementById('cntAll');
  badge.textContent = nT; badge.style.display = nT ? '' : 'none';

  S.pinnedTags ||= [];
  const tags = allTags();
  document.getElementById('tagLabel').style.display = tags.length ? '' : 'none';
  const tn = document.getElementById('tagNav');
  tn.innerHTML = tags.map(t => {
    const c = tagColor(t);
    const pin = S.pinnedTags.includes(t);
    return `<button data-tag="${esc(t)}" class="${tagFilter===t?'on':''} ${pin?'pin':''}"
      style="background:${c}1a;color:${c}">${pin?PINSMALL:''}#${esc(t)}</button>`;
  }).join('');
  tn.querySelectorAll('[data-tag]').forEach(el => {
    el.onclick = () => selectTag(el.dataset.tag);
    el.oncontextmenu = e => { e.preventDefault(); tagColorMenu(e.clientX, e.clientY, el.dataset.tag); };
  });
  const bt = document.getElementById('backupTag');
  const gap = S.lastExport ? diffDays(S.lastExport, today()) : null;
  if(gap === null || gap >= 7){
    bt.textContent = gap === null ? '⚠ まだ書き出していません' : `⚠ 最後の書き出しから ${gap} 日`;
    bt.style.display = '';
  } else bt.style.display = 'none';
  bt.onclick = () => document.getElementById('expBtn').click();
  document.getElementById('legend').innerHTML = CATS().filter(c => c[0])
    .map(([c, n]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join('');
}
function selectTag(t){
  tagFilter = tagFilter === t ? '' : t;
  if(tagFilter && view.type !== 'board') view = {type:'board', id:S.boards[0]?.id};
  render();
}

/* ---------------- board ---------------- */
function renderBoard(){
  const b = board(view.id);
  if(!b){ view = {type:'tasks'}; return render(); }
  const t = document.getElementById('pageTitle');
  t.value = b.name; t.disabled = false;
  t.style.color = '';
  t.oninput = e => { b.name = e.target.value; save(); renderSide(); };
  document.getElementById('topActions').innerHTML =
    tagFilter ? `<button class="btn" id="clrTag">🏷 #${esc(tagFilter)} を解除</button>` : '';
  const ct = document.getElementById('clrTag');
  if(ct) ct.onclick = () => { tagFilter = ''; render(); };

  if(b.daily) return renderDaily(b);
  /* 完了したタスクは Done Task ページだけに表示する */
  const match = k => (!tagFilter || (k.tags || []).includes(tagFilter))
    && !(k.type === 'task' && k.done);
  const v = document.getElementById('view');
  v.innerHTML = `<div class="cols">${b.cols.map(c => {
    const w = c.w || 288;
    return `<div class="col" data-col="${c.id}" style="width:${w}px;flex-basis:${w}px">
      <div class="col-head" data-colhead="${c.id}">
        <span class="col-grip" title="ドラッグで列を移動">⠿</span>
        <input class="col-title" value="${esc(c.title)}" data-ct="${c.id}" spellcheck="false">
        <button class="col-x" data-cx="${c.id}" title="列を削除">×</button>
      </div>
      <div class="drop" data-drop="${c.id}">${c.cards.filter(match).map(cardHTML).join('')}</div>
      <button class="add" data-add="${c.id}">＋ New</button>
      <div class="col-rz" data-rz="${c.id}" title="ドラッグで幅を変更"></div>
    </div>`;
  }).join('')}
    <div class="addcol"><button id="newCol">＋ 列を追加</button></div></div>`;

  v.querySelectorAll('[data-ct]').forEach(el => el.oninput = e => {
    b.cols.find(c => c.id === el.dataset.ct).title = e.target.value; save(); });
  v.querySelectorAll('[data-cx]').forEach(el => el.onclick = () => {
    const c = b.cols.find(x => x.id === el.dataset.cx);
    if(c.cards.length && !confirm('カードごと削除します。よろしいですか？')) return;
    b.cols = b.cols.filter(x => x.id !== c.id); save(); render();
  });
  v.querySelectorAll('[data-add]').forEach(el => el.onclick = e => addMenu(e, el.dataset.add));
  document.getElementById('newCol').onclick = () => {
    b.cols.push({id:uid(), title:'新しい列', w:288, cards:[]}); save(); render();
  };
  wireResize(v, b); wireColDnD(v, b); wireCards(v); wireDnD(v);
}

/* 列の並び替え */
let dragCol = null;
function wireColDnD(root, b){
  root.querySelectorAll('.col').forEach(colEl => {
    const id = colEl.dataset.col;
    const head = colEl.querySelector('[data-colhead]');
    if(!head) return;
    head.draggable = true;
    head.ondragstart = ev => {
      if(ev.target.closest('input, button')){ ev.preventDefault(); return false; }
      dragCol = id;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', 'col:' + id);
      setTimeout(() => colEl.classList.add('coldrag'), 0);
    };
    head.ondragend = () => {
      dragCol = null;
      document.querySelectorAll('.coldrag,.colover').forEach(e => e.classList.remove('coldrag', 'colover'));
    };
    colEl.ondragover = ev => {
      if(!dragCol || dragCol === id) return;
      ev.preventDefault(); colEl.classList.add('colover');
    };
    colEl.ondragleave = () => colEl.classList.remove('colover');
    colEl.ondrop = ev => {
      if(!dragCol || dragCol === id) return;
      ev.preventDefault(); ev.stopPropagation();
      colEl.classList.remove('colover');
      const i = b.cols.findIndex(c => c.id === dragCol);
      const [col] = b.cols.splice(i, 1);
      let j = b.cols.findIndex(c => c.id === id);
      const r = colEl.getBoundingClientRect();
      if(ev.clientX > r.left + r.width / 2) j++;
      b.cols.splice(Math.max(0, j), 0, col);
      dragCol = null; save(); render();
    };
  });
}

/* 列幅ドラッグ */
function wireResize(root, b){
  root.querySelectorAll('[data-rz]').forEach(h => h.onmousedown = ev => {
    ev.preventDefault();
    const col = b.cols.find(c => c.id === h.dataset.rz);
    const el = h.closest('.col'), x0 = ev.clientX, w0 = col.w || 288;
    h.classList.add('act'); document.body.style.cursor = 'col-resize';
    const move = e => {
      const w = Math.min(720, Math.max(190, Math.round(w0 + e.clientX - x0)));
      col.w = w; el.style.width = w + 'px'; el.style.flexBasis = w + 'px';
    };
    const up = () => {
      document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
      h.classList.remove('act'); document.body.style.cursor = ''; save();
    };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });
}

function cardHTML(k){
  const done = k.type === 'task' && k.done;
  const cls = ['card', k.type, done ? 'done' : '', k.type === 'task' && notStarted(k) ? 'pending' : ''].join(' ');
  const style = k.color ? `style="--c:${k.color}"` : '';
  const showHead = k.headOn || plain(k.head).trim();
  const showNote = k.noteOn || plain(k.note).trim();
  let inner = (k.type === 'task' && showHead)
    ? `<div class="thead" contenteditable="true" data-head="${k.id}" data-ph="見出し…">${clean(k.head)}</div>` : '';
  inner += `<div class="card-top">
    <span class="grip" draggable="true" data-grip="${k.id}">⠿</span>
    ${k.type === 'task' ? `<input type="checkbox" class="ck" data-done="${k.id}" ${k.done?'checked':''}>` : ''}
    ${(k.type === 'quote' || k.type === 'note' || k.type === 'read') ? '<div style="flex:1"></div>'
      : `<div class="ctitle" contenteditable="true" data-title="${k.id}">${clean(k.title)}</div>`}
    ${k.type === 'note' ? cardTgl('memo', k, k.memoCard)
      : k.type === 'quote' ? cardTgl('quote', k, k.quote && k.quote.card)
      : k.type === 'read' ? cardTgl('read', k, k.read && k.read.card) : ''}
    <button class="menu" data-menu="${k.id}">⋯</button></div>`;

  /* タイトルのすぐ下: 説明・注意事項 */
  if(k.type === 'task' && showNote)
    inner += `<div class="tnote" contenteditable="true" data-note="${k.id}"
      data-ph="説明・注意事項…">${clean(k.note)}</div>`;

  /* 選択ボタン列 */
  const chips = [];
  const dattr = `data-date="${k.id}" style="cursor:pointer"`;
  const isTask = k.type === 'task';
  if(isTask) chips.push(whenChip(k));
  if(isTask || k.color) chips.push(catChip(k));
  if(k.type === 'task'){
    const subs = k.subs || [];
    chips.push(dateChip(k));
    if(k.start) chips.push(`<span class="chip start" title="開始日" ${dattr}>▶ ${fmtDT(k.start, k.startT)}</span>`);
    if(k.due) chips.push(`<span class="chip due ${dueHot(k.due)&&!k.done?'over':''}" title="期限" ${dattr}>🏁 ${fmtDT(k.due, k.dueT)}</span>`);
    if(k.due && !k.done) chips.push(`<span class="chip left ${dueHot(k.due)?'over':''}">${leftLabel(k.due)}</span>`);
    if(k.repeat && k.repeat.unit) chips.push(`<span class="chip rep" ${dattr}>🔁 ${esc(repLabel(k.repeat))}</span>`);
    chips.push(tagChips(k));
    if(subs.length) chips.push(`<span class="chip prog">${subs.filter(s => s.done).length}/${subs.length}</span>`);
    if(k.doneAt) chips.push(`<span class="chip done" data-donedate="${k.id}" style="cursor:pointer" title="完了日">✓ ${fmtDue(k.doneAt)}</span>`);
  }
  if(chips.filter(Boolean).length) inner += `<div class="meta">${chips.join('')}</div>`;
  if(isTask || k.type === 'read') inner += `<div class="meta meta2">${timerChip(k)}</div>`;

  if(k.type === 'quote') inner += quoteSection(k, true);
  if(k.type === 'read') inner += readSection(k, true);

  if(k.type === 'note') inner += k.memoReg ? memoCardHTML(k) : `<div class="qbox">
    <div class="mtitle" contenteditable="plaintext-only" data-btitle="${k.id}" data-ph="タイトル">${esc(k.bodyTitle || '')}</div>
    <div class="body" contenteditable="true" data-body="${k.id}">${clean(k.body)}</div>
    <div class="qfoot"><button class="imgadd" data-imgadd="body|${k.id}">＋ 画像</button>${fmtBar()}
      <button class="qreg" data-mreg="${k.id}">Add</button></div></div>`;
  /* メモカードはカード自体のタイトルがあるので、Memo カード内のタイトルは出さない */

  if(k.type === 'task'){
    const subs = k.subs || [];
    if(subs.length) inner += `<div class="subs">${subs.map(s => `
      <div class="subwrap">
        ${(s.headOn || plain(s.head).trim()) ? `<div class="thead sub-head" contenteditable="true"
          data-shead="${k.id}|${s.id}" data-ph="見出し…">${clean(s.head)}</div>` : ''}
        <div class="sub ${s.done?'done':''}">
          <span class="sgrip" draggable="true" data-sgrip="${k.id}|${s.id}" title="ドラッグで並び替え">⠿</span>
          <input type="checkbox" class="ck" data-sdone="${k.id}|${s.id}" ${s.done?'checked':''}>
          <div class="t" contenteditable="true" data-stitle="${k.id}|${s.id}">${clean(s.title)}</div>
          ${s.done ? `<span class="chip sdate" data-sdate="${k.id}|${s.id}" title="完了日（クリックで変更）">✓ ${s.doneAt?fmtDue(s.doneAt):'日付なし'}</span>` : ''}
          <button class="submenu" data-submenu="${k.id}|${s.id}" title="見出し・説明">⋯</button>
          <button class="x" data-sdel="${k.id}|${s.id}">×</button>
        </div>
        ${(s.noteOn || plain(s.note).trim()) ? `<div class="tnote sub-note" contenteditable="true"
          data-snote="${k.id}|${s.id}" data-ph="説明・注意事項…">${clean(s.note)}</div>` : ''}
      </div>`).join('')}</div>`;
    inner += `<button class="subadd" data-subadd="${k.id}">＋ サブタスク</button>`;
    inner += memoSection(k) + quoteSection(k) + readSection(k) + logSection(k) + timeSection(k);
  }
  if(k.type === 'note') inner += quoteSection(k) + readSection(k);
  inner += linkSection(k);
  if(!isTask && k.type !== 'heading'){
    inner += `<div class="meta meta-b">${tagChips(k)}</div>`;
  }
  return `<div class="${cls}" ${style} data-card="${k.id}">${inner}</div>`;
}

const hasMemo = k => !!(k.hasMemo || k.body || k.bodyTitle);
const hasLog = k => Array.isArray(k.logs);
const hasTime = k => !!(k.timer || (k.times && k.times.length));
const hasQuote = k => !!k.quote;
const cardTgl = (which, k, on) =>
  `<button class="cardtg ${on?'on':''}" data-cardtg="${which}|${k.id}"
    title="Cards（ランダム表示）に入れる"><svg class="cdico" viewBox="0 0 16 16"><rect x="5" y="2.2" width="8.8" height="10.6" rx="1.6"/><path d="M10.6 13.8H4a1.6 1.6 0 0 1-1.6-1.6V4.8"/></svg>Card</button>`;

function quoteSection(k, fixed){
  if(!hasQuote(k)) return '';
  const open = fixed || !(k.fold && k.fold.quote);
  const Q = k.quote;
  return `<div class="sec ${fixed?'bare':''}">
    ${fixed ? '' : `<div class="sec-h">
      <button class="fold ${open?'open':''}" data-fold="quote|${k.id}">▶</button>
      <span class="sec-lb">Quote</span>
      <div class="sec-t"></div>
      ${cardTgl('quote', k, Q.card)}
      <button class="sec-x" data-secdel="quote|${k.id}" title="Quote を削除">×</button>
    </div>`}
    ${!open ? '' : Q.registered ? quoteCardHTML(k) : `<div class="qbox">
      <div class="body qt" contenteditable="true" data-qtext="${k.id}"
        data-ph="引用文…">${clean(Q.text)}</div>
      <label>著者（任意）</label><input data-qf="author|${k.id}" list="dlAuthors" value="${esc(Q.author||'')}" placeholder="例）夏目漱石">
      <label>出典（任意）</label><input data-qf="source|${k.id}" list="dlSources" value="${esc(Q.source||'')}" placeholder="例）こころ">
      <label>ページ（任意）</label><input data-qf="page|${k.id}" value="${esc(Q.page||'')}" placeholder="例）42">
      <label>Memo</label>
      <div class="body qm" contenteditable="true" data-qmemo="${k.id}" data-ph="補足メモ">${clean(Q.memo)}</div>
      <div class="qfoot"><button class="imgadd" data-imgadd="qmemo|${k.id}">＋ 画像</button>${fmtBar()}

/* 登録済みの表示 */
const nextQuoteNo = () => Math.max(0, ...allCards().map(x => +(x.card.quote?.no || 0))) + 1;
function quoteCardHTML(k){
  const Q = k.quote;
  const src = (Q.source || '').trim();
  const srcQ = src ? (/^[『「《]/.test(src) ? src : `『${src}』`) : '';
  const cite = [Q.author, srcQ].filter(Boolean).join('') + (Q.page ? `, p.${Q.page}` : '');
  return `<div class="qcard">
    <div class="qc-h">
      <span>No. ${String(Q.no || 1).padStart(3, '0')}　・　<b class="ndate" data-ndate="quote|${k.id}"

      <span class="qc-act">
        <button data-qedit="${k.id}" title="編集する">✎</button>
      </span>
    </div>
    <div class="qc-body qbg">${clean(Q.text) || '<span style="color:#c4bcbe">（本文なし）</span>'}</div>
    ${cite ? `<div class="qc-cite">— ${esc(cite)}</div>` : ''}
    ${plain(Q.memo).trim() ? `<div class="qc-memo"><label>Memo</label>${clean(Q.memo)}</div>` : ''}

}

function timerChip(k){
  const tot = totalSec(k);
  const run = !!k.timer;
  return `<span class="chip timer ${run?'on':''}" data-timer="${k.id}" title="${run?'計測を止める':'計測を開始'}">
    ${run ? `■ <span data-elapsed="${k.id}">${fmtClock(runSec(k))}</span>` : `<svg class="tmico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.4V8l2.5 1.6"/></svg>`}</span>
    ${tot || run ? `<span class="chip tot" data-timeopen="${k.id}" title="Time Log を開く"><svg class="tmico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.4V8l2.5 1.6"/></svg> <span data-runtot="${k.id}">${fmtDur(tot + runSec(k))}</span></span>` : ''}`;
}

function timeSection(k){
  if(!hasTime(k)) return '';
  const open = !(k.fold && k.fold.time);
  const times = k.times || [];
  return `<div class="sec">
    <div class="sec-h">
      <button class="fold ${open?'open':''}" data-fold="time|${k.id}">▶</button>
      <span class="sec-lb"><svg class="lbico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.4V8l2.5 1.6"/></svg> Time Log</span>
      <div class="sec-t"></div>
      <span class="sec-n">${fmtDur(totalSec(k))}${times.length ? ` / ${times.length}件` : ''}</span>
      <button class="sec-x" data-secdel="time|${k.id}" title="Time Log を削除">×</button>
    </div>
    ${open ? `<div class="times">
      ${k.timer ? `<div class="tlog run">
        <input type="date" value="${k.timer.date}" disabled>
        <input type="time" value="${k.timer.start}" disabled>–<span style="color:#c0392b">計測中</span>
        <span class="dur" data-elapsed="${k.id}">${fmtClock(runSec(k))}</span></div>` : ''}
      ${times.slice().reverse().map(e => `<div class="tlog">
        <input type="date" value="${e.date || ''}" data-tmdate="${k.id}|${e.id}">
        <input type="time" value="${e.start || ''}" data-tmstart="${k.id}|${e.id}">–<input type="time" value="${e.end || ''}" data-tmend="${k.id}|${e.id}">

function memoSection(k){

      <div class="body" contenteditable="true" data-body="${k.id}">${clean(k.body)}</div>
      <div class="qfoot"><button class="imgadd" data-imgadd="body|${k.id}">＋ 画像</button>${fmtBar()}
        <button class="qreg" data-mreg="${k.id}">Add</button></div>
    </div>`}

/* 登録済み Memo の表示 */

function logSection(k){

/* ---------------- shared card interactions ---------------- */
function wireCards(root){
  wireFmt(root);
  root.querySelectorAll('[data-done]').forEach(el => el.onchange = () => setDone(el.dataset.done, el.checked));
  root.querySelectorAll('[data-date]').forEach(el =>
    el.onclick = () => dateMenu(el.getBoundingClientRect(), el.dataset.date));
  root.querySelectorAll('[data-tagc]').forEach(el => el.onclick = () => selectTag(el.dataset.tagc));
  root.querySelectorAll('[data-tagedit]').forEach(el => {
    el.onclick = () => tagMenu(el.getBoundingClientRect(), el.dataset.tagedit);
    el.oncontextmenu = e => {
      const t = el.textContent.trim().replace(/^#/, '');
      if(!t || t.startsWith('＋')) return;
      e.preventDefault();
      tagColorMenu(e.clientX, e.clientY, t);
    };
  });
  root.querySelectorAll('[data-status]').forEach(el =>
    el.onclick = () => statusMenu(el.getBoundingClientRect(), el.dataset.status));
  root.querySelectorAll('[data-imgadd]').forEach(el => {
    el.onmousedown = e => e.preventDefault();
    el.onclick = () => {
      const [kind, id] = el.dataset.imgadd.split('|');
      const sel = kind === 'daily' ? `[data-daily="${id}"]` : `[data-${kind}="${id}"]`;
      pendingImg = document.querySelector(sel);
      if(pendingImg) document.getElementById('imgFile').click();
    };
  });
  root.querySelectorAll('[data-jumpcard]').forEach(el => el.onclick = e => {
    if(e.target.closest('[data-unlink]')) return;
    const f = findCard(el.dataset.jumpcard); if(!f) return;
    if(f.board.daily && f.card.day){ dailySel = f.card.day; dailyMonth = f.card.day.slice(0, 7); }
    view = {type:'board', id:f.board.id}; render();
    setTimeout(() => {
      const c = document.querySelector(`[data-card="${f.card.id}"]`);
      if(c){ c.scrollIntoView({block:'center', behavior:'smooth'});
        c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1600); }
    }, 30);
  });
  root.querySelectorAll('[data-unlink]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const [from, to] = el.dataset.unlink.split('|');
    const k = findCard(from).card;
    k.links = (k.links || []).filter(x => x !== to);
    save(); render();
  });
  root.querySelectorAll('[data-cdate]').forEach(el =>
    el.onclick = () => createdMenu(el.getBoundingClientRect(), el.dataset.cdate));
  root.querySelectorAll('[data-ndate]').forEach(el => el.onclick = () => {
    const [kind, cid] = el.dataset.ndate.split('|');
    ndateMenu(el.getBoundingClientRect(), kind, cid);
  });
  root.querySelectorAll('[data-when]').forEach(el =>
    el.onclick = () => whenMenu(el.getBoundingClientRect(), el.dataset.when));
  root.querySelectorAll('[data-title]').forEach(el => {
    wireRich(el);
    el.onblur = () => { saveBody(el); hideRT(); renderSide(); };
    el.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } };
  });
  root.querySelectorAll('[data-body],[data-logtext],[data-qtext],[data-qmemo],[data-rmemo],[data-note],[data-head],[data-shead],[data-snote]').forEach(el => {
    wireRich(el);
    el.onblur = () => { saveBody(el); hideRT(); render(); };
  });
  root.querySelectorAll('[data-rf]').forEach(el => {
    const [f, cid] = el.dataset.rf.split('|');
    const set = () => { const k = findCard(cid).card; (k.read ||= {})[f] = el.value; touch(k); save(); };
    el.oninput = set;
    el.onchange = () => { set(); refreshDatalists(); };
  });
  root.querySelectorAll('[data-rflag]').forEach(el => {
    el.onmousedown = e => e.preventDefault();
    el.onclick = () => {
      const [cid, f] = el.dataset.rflag.split('|');
      const R = findCard(cid).card.read;
      R.flags = (R.flags || []).includes(f) ? R.flags.filter(x => x !== f) : [...(R.flags || []), f];
      touch(cid); save(); render();
    };
  });
  root.querySelectorAll('[data-rreread]').forEach(el => {
    el.onmousedown = e => e.preventDefault();
    el.onclick = () => {
      const R = findCard(el.dataset.rreread).card.read;
      if(R.reread) delete R.reread; else R.reread = true;
      touch(el.dataset.rreread); save(); render();
    };
  });
  root.querySelectorAll('[data-rreg]').forEach(el => el.onclick = () => {
    const k = findCard(el.dataset.rreg).card;
    k.read.registered = true;
    k.read.no ||= Math.max(0, ...allCards().map(x => +((x.card.read && x.card.read.no) || 0))) + 1;
    k.read.date ||= k.day || today();
    touch(k); save(); render();
  });
  root.querySelectorAll('[data-redit]').forEach(el => el.onclick = () => {
    findCard(el.dataset.redit).card.read.registered = false; save(); render();
  });
  root.querySelectorAll('[data-qf]').forEach(el => el.oninput = () => {
    const [f, cid] = el.dataset.qf.split('|');
    const k = findCard(cid).card; (k.quote ||= {})[f] = el.value; touch(k); save();
  });
  root.querySelectorAll('[data-qreg],[data-mreg],[data-rreg],[data-cardtg],[data-medit],[data-qedit],[data-redit]')
    .forEach(el => el.onmousedown = e => e.preventDefault());   // 入力欄からフォーカスを奪わない
  root.querySelectorAll('[data-qreg]').forEach(el => el.onclick = () => {
    const k = findCard(el.dataset.qreg).card;
    k.quote.registered = true;
    k.quote.no ||= nextQuoteNo();
    k.quote.date ||= k.day || today();
    save(); render();
  });
  root.querySelectorAll('[data-qedit]').forEach(el => el.onclick = () => {
    findCard(el.dataset.qedit).card.quote.registered = false; save(); render();
  });
  root.querySelectorAll('[data-mreg]').forEach(el => el.onclick = () => {
    const k = findCard(el.dataset.mreg).card;
    k.memoReg = true;
    k.memoNo ||= nextNo('memoNo');
    k.memoDate ||= k.day || today();
    touch(k); save(); render();
  });
  root.querySelectorAll('[data-medit]').forEach(el => el.onclick = () => {
    findCard(el.dataset.medit).card.memoReg = false; save(); render();
  });
  /* メモ / Message Log セクション */
  root.querySelectorAll('[data-fold]').forEach(el => el.onclick = () => {
    const [which, cid] = el.dataset.fold.split('|');
    const k = findCard(cid).card;
    k.fold = {memo:false, log:false, ...(k.fold || {})};
    k.fold[which] = !k.fold[which];
    save(); render();
  });
  root.querySelectorAll('[data-btitle]').forEach(el => {
    el.onblur = () => { findCard(el.dataset.btitle).card.bodyTitle = el.innerText.trim(); save(); render(); };
    el.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } };
  });
  root.querySelectorAll('[data-secdel]').forEach(el => el.onclick = () => {
    const [which, cid] = el.dataset.secdel.split('|');
    const k = findCard(cid).card;
    if(which === 'memo'){
      if(plain(k.body).trim() && !confirm('Memo を削除しますか？')) return;
      k.hasMemo = false; k.body = ''; k.bodyTitle = '';
    } else if(which === 'log'){
      if((k.logs || []).length && !confirm('Message Log を削除しますか？')) return;
      delete k.logs;
    } else if(which === 'quote'){
      if(plain(k.quote.text).trim() && !confirm('Quote を削除しますか？')) return;
      delete k.quote;
    } else if(which === 'read'){
      if((k.read.source || plain(k.read.memo).trim()) && !confirm('Read を削除しますか？')) return;
      delete k.read;
    } else {
      if((k.times || []).length && !confirm('Time Log をすべて削除しますか？')) return;
      delete k.times; delete k.timer;
    }
    save(); render();
  });
  root.querySelectorAll('[data-logadd]').forEach(el => el.onclick = () => {
    const k = findCard(el.dataset.logadd).card;
    const last = (k.logs || [])[k.logs.length - 1];
    k.logs.push({id:uid(), date:today(), who:last ? last.who : '', text:''});
    save(); render();
    const all = document.querySelectorAll(`[data-logtext^="${k.id}|"]`);
    all[all.length - 1]?.focus();
  });
  root.querySelectorAll('[data-logdate]').forEach(el => el.onchange = () => {
    const [cid, lid] = el.dataset.logdate.split('|');
    findCard(cid).card.logs.find(g => g.id === lid).date = el.value; save();
  });
  root.querySelectorAll('[data-logwho]').forEach(el => el.onchange = () => {
    const [cid, lid] = el.dataset.logwho.split('|');
    const g = findCard(cid).card.logs.find(x => x.id === lid);
    if(el.value === '__new'){
      const n = (prompt('相手の名前') || '').trim();
      if(n){ if(!S.contacts.includes(n)) S.contacts.push(n); g.who = n; }
    } else g.who = el.value;
    save(); render();
  });
  /* 時間計測 */
  root.querySelectorAll('[data-timer]').forEach(el => el.onclick = () => toggleTimer(el.dataset.timer));
  root.querySelectorAll('[data-timeopen]').forEach(el => el.onclick = () => {
    const k = findCard(el.dataset.timeopen).card;
    k.fold = {memo:false, log:false, time:false, ...(k.fold || {})};
    k.fold.time = false; save(); render();
  });
  root.querySelectorAll('[data-timeadd]').forEach(el => el.onclick = () => {
    const k = findCard(el.dataset.timeadd).card;
    const last = (k.times || [])[k.times.length - 1];
    const start = last ? last.end : '09:00';
    const endMin = (hm2min(start) + 30) % 1440;
    const e = {id:uid(), date:today(), start, end:`${pad2(endMin / 60 | 0)}:${pad2(endMin % 60)}`};
    e.sec = spanSec(e);
    (k.times ||= []).push(e); save(); render();
  });
  root.querySelectorAll('[data-tmdate]').forEach(el => el.onchange = () => {
    const [cid, eid] = el.dataset.tmdate.split('|');
    findCard(cid).card.times.find(x => x.id === eid).date = el.value; save(); render();
  });
  root.querySelectorAll('[data-tmstart],[data-tmend]').forEach(el => el.onchange = () => {
    const key = el.dataset.tmstart ? 'tmstart' : 'tmend';
    const [cid, eid] = el.dataset[key].split('|');
    const e = findCard(cid).card.times.find(x => x.id === eid);
    e[key === 'tmstart' ? 'start' : 'end'] = el.value;
    e.sec = spanSec(e); save(); render();
  });
  root.querySelectorAll('[data-tmdel]').forEach(el => el.onclick = () => {
    const [cid, eid] = el.dataset.tmdel.split('|');
    const k = findCard(cid).card;
    k.times = k.times.filter(x => x.id !== eid); save(); render();
  });
  root.querySelectorAll('[data-logdel]').forEach(el => el.onclick = () => {
    const [cid, lid] = el.dataset.logdel.split('|');
    const k = findCard(cid).card;
    const g = k.logs.find(x => x.id === lid);
    if(plain(g.text).trim() && !confirm('このログを削除しますか？')) return;
    k.logs = k.logs.filter(x => x.id !== lid); save(); render();
  });
  root.querySelectorAll('[data-sdone]').forEach(el => el.onchange = () => {
    const [cid, sid] = el.dataset.sdone.split('|');
    setSubDone(cid, sid, el.checked);
  });
  /* サブタスクの並び替え */
  root.querySelectorAll('[data-sgrip]').forEach(g => {
    const wrap = g.closest('.subwrap');
    g.ondragstart = ev => {
      ev.stopPropagation();
      const [cid, sid] = g.dataset.sgrip.split('|');
      dragSub = {cid, sid};
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', 'sub:' + sid);
      if(ev.dataTransfer.setDragImage) ev.dataTransfer.setDragImage(wrap, 14, 10);
      setTimeout(() => wrap.classList.add('drag'), 0);
    };
    g.ondragend = () => {
      dragSub = null;
      document.querySelectorAll('.subwrap.drag').forEach(e => e.classList.remove('drag'));
      document.querySelectorAll('.subs.over,.rsubs.over').forEach(e => e.classList.remove('over'));
    };
  });
  root.querySelectorAll('.subs,.rsubs').forEach(box => {
    box.ondragover = ev => { if(!dragSub) return; ev.preventDefault(); ev.stopPropagation(); box.classList.add('over'); };
    box.ondragleave = () => box.classList.remove('over');
    box.ondrop = ev => {
      if(!dragSub) return;
      ev.preventDefault(); ev.stopPropagation(); box.classList.remove('over');
      const k = findCard(dragSub.cid)?.card; if(!k) return;
      const wraps = [...box.querySelectorAll('.subwrap')];
      let idx = k.subs.length;
      for(const wEl of wraps){
        const gg = wEl.querySelector('[data-sgrip]');
        if(!gg) continue;
        const sid = gg.dataset.sgrip.split('|')[1];
        if(sid === dragSub.sid) continue;
        const r = wEl.getBoundingClientRect();
        if(ev.clientY < r.top + r.height / 2){ idx = k.subs.findIndex(s => s.id === sid); break; }
      }
      const from = k.subs.findIndex(s => s.id === dragSub.sid);
      if(from < 0){ dragSub = null; return; }
      const [s] = k.subs.splice(from, 1);
      if(from < idx) idx--;
      k.subs.splice(Math.max(0, idx), 0, s);
      dragSub = null; touch(k); save(); render();
    };
  });
  root.querySelectorAll('[data-submenu]').forEach(el => el.onclick = () => {
    const [cid, sid] = el.dataset.submenu.split('|');
    subMenu(el.getBoundingClientRect(), cid, sid);
  });
  root.querySelectorAll('[data-sdate]').forEach(el => el.onclick = () => {
    const [cid, sid] = el.dataset.sdate.split('|');
    subDateMenu(el.getBoundingClientRect(), cid, sid);
  });
  root.querySelectorAll('[data-donedate]').forEach(el => el.onclick = () => {
    const k = findCard(el.dataset.donedate).card;
    const r = el.getBoundingClientRect();
    const p = popup(r.left - 30, r.bottom + 6, `<div class="dpanel" style="width:200px">
      <h4>完了日</h4>
      <div class="drow"><label>日付</label><input type="date" id="dnD" value="${k.doneAt || ''}"></div></div>`);
    p.querySelector('#dnD').onchange = e => {
      if(e.target.value) k.doneAt = e.target.value; else delete k.doneAt;
      save(); render();
    };
  });
  root.querySelectorAll('[data-stitle]').forEach(el => {
    wireRich(el);
    el.onblur = () => {
      const [cid, sid] = el.dataset.stitle.split('|');
      const k = findCard(cid).card;
      if(!el.innerText.trim()) k.subs = k.subs.filter(x => x.id !== sid);
      else saveBody(el);
      save(); hideRT(); render();
    };
    el.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } };
  });
  root.querySelectorAll('[data-sdel]').forEach(el => el.onclick = () => {
    const [cid, sid] = el.dataset.sdel.split('|');
    const k = findCard(cid).card; k.subs = k.subs.filter(x => x.id !== sid); save(); render();
  });
  root.querySelectorAll('[data-subadd]').forEach(el => el.onclick = () => subAdd(el));
  root.querySelectorAll('[data-menu]').forEach(el => el.onclick = e => cardMenu(e, el.dataset.menu));
}

/* サブタスク追加（ボード・タスク一覧の両方で使う） */
function subAdd(btn){
  const cid = btn.dataset.subadd;
  const inp = document.createElement('input');
  inp.className = btn.classList.contains('rsubadd') ? 'rsubinput' : 'subinput';
  inp.placeholder = 'サブタスク（Enterで続けて追加）';
  btn.replaceWith(inp); inp.focus();
  let closed = false;
  const commit = keep => {
    if(closed) return; closed = true;
    const t = inp.value.trim();
    if(t){
      const k = findCard(cid).card;
      touch(k);
      (k.subs ||= []).push({id:uid(), title:esc(t), done:false});
      folded[cid] = false;
      save();
    }
    render();
    if(keep && t) document.querySelector(`[data-subadd="${cid}"]`)?.click();
  };
  inp.onkeydown = e => {
    if(e.key === 'Enter'){ e.preventDefault(); commit(true); }
    if(e.key === 'Escape'){ closed = true; render(); }
  };
  inp.onblur = () => commit(false);
}

/* ---------------- rich text ---------------- */
let rtEl = null;
function saveBody(el){
  const html = clean(el.innerHTML).replace(/^(<br>)+$/, '');
  const ds = el.dataset;
  touch(ds.qtext || ds.qmemo || ds.body || ds.title ||
        (ds.logtext || ds.stitle || ds.tstitle || '').split('|')[0]);
  if(ds.qtext || ds.qmemo){
    const k = findCard(ds.qtext || ds.qmemo)?.card; if(!k) return;
    (k.quote ||= {})[ds.qtext ? 'text' : 'memo'] = html;
    save(); return;
  }
  if(ds.daily){
    const b = board(view.id);
    if(b){ (b.days ||= {})[ds.daily] = html; save(); }
    return;
  }
  if(ds.shead || ds.snote){
    const [cid, sid] = (ds.shead || ds.snote).split('|');
    const s = findCard(cid)?.card.subs?.find(x => x.id === sid); if(!s) return;
    s[ds.shead ? 'head' : 'note'] = html;
    touch(cid); save(); return;
  }
  if(ds.head){
    const f = findCard(ds.head); if(!f) return;
    f.card.head = html; touch(f.card);
    save(); return;
  }
  if(ds.note){
    const f = findCard(ds.note); if(!f) return;
    f.card.note = html; touch(f.card);
    save(); return;
  }
  if(ds.rmemo){
    const k = findCard(ds.rmemo)?.card; if(!k) return;
    (k.read ||= {}).memo = html;
    save(); return;
  }
  if(ds.body){
    const f = findCard(ds.body); if(!f) return;
    f.card.body = html; f.card.hasMemo = true;
  } else if(ds.logtext){
    const [cid, lid] = ds.logtext.split('|');
    const g = findCard(cid)?.card.logs?.find(x => x.id === lid); if(!g) return;
    g.text = html;
  } else if(ds.title){
    const f = findCard(ds.title); if(!f) return;
    f.card.title = html;
  } else if(ds.stitle || ds.tstitle){
    const [cid, sid] = (ds.stitle || ds.tstitle).split('|');
    const s = findCard(cid)?.card.subs?.find(x => x.id === sid); if(!s) return;
    s.title = html;
  }
  save();
}

const FMTICO = {

  quote: '<svg class="fmtico" viewBox="0 0 16 16"><path d="M2.6 3.4v9.2"/><path d="M6.4 5.4h7.2M6.4 8h7.2M6.4 10.6h4.6"/></svg>',
};

  <button class="fmtb" data-fmt="quote" title="引用">${FMTICO.quote}</button></span>`;
/* 選択（またはカーソル）のある行が入っている UL / BLOCKQUOTE */
function upTo(node, tag, root){
  let n = node && node.nodeType === 3 ? node.parentNode : node;
  while(n && n !== root){ if(n.nodeName === tag) return n; n = n.parentNode; }
  return null;
}
function applyFmt(kind, el){
  if(!el) return;
  el.focus();
  const sel = window.getSelection();
  if(!sel.rangeCount || !el.contains(sel.anchorNode)){
    const r = document.createRange();
    r.selectNodeContents(el); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  }
  document.execCommand('styleWithCSS', false, false);
  if(kind === 'quote'){
    const bq = upTo(sel.anchorNode, 'BLOCKQUOTE', el);
    document.execCommand('formatBlock', false, bq ? 'div' : 'blockquote');
  } else {
    const ul = upTo(sel.anchorNode, 'UL', el);
    const want = kind === 'check';
    if(ul){
      if(ul.classList.contains('ckl') === want) document.execCommand('insertUnorderedList');
      else ul.classList.toggle('ckl', want);
    } else {
      document.execCommand('insertUnorderedList');
      const nu = upTo(window.getSelection().anchorNode, 'UL', el);
      if(nu && want) nu.classList.add('ckl');
    }
  }
  saveBody(el);
}
/* 書式ボタンを配線する（クリックしても選択が消えないように） */
function wireFmt(root){
  root.querySelectorAll('[data-fmt]').forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => {
      const box = b.closest('.qbox, .dailymain, .card, .dwrap') || document;
      /* 直前にさわっていた入力欄があればそこへ。なければ枠内の最後の本文欄へ */
      let ed = (lastRich && box.contains(lastRich)) ? lastRich : null;
      if(!ed){
        const eds = box.querySelectorAll('[data-body],[data-daily],[data-rmemo],[data-qmemo],[data-qtext]');
        ed = eds[eds.length - 1];
      }
      applyFmt(b.dataset.fmt, ed);
    };
  });
}
let lastRich = null;   // 直前に編集していたリッチテキスト欄
function wireRich(el){
  let t;   // 入力中も自動保存
  el.addEventListener('focus', () => { lastRich = el; });
  el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => saveBody(el), 400); });
  el.onmouseup = () => setTimeout(() => showRT(el), 0);
  el.onkeyup = e => { if(e.shiftKey || e.key === 'Escape') setTimeout(() => showRT(el), 0); };
  el.onpaste = e => {
    const dt = e.clipboardData || window.clipboardData;
    let file = [...(dt.files || [])].find(f => f.type.startsWith('image/'));
    if(!file){
      const it = [...(dt.items || [])].find(i => i.kind === 'file' && (i.type || '').startsWith('image/'));
      if(it) file = it.getAsFile();
    }
    if(file){ e.preventDefault(); insertImage(file, el); return; }
    const txt = (dt.getData('text/plain') || '').trim();
    if(/^https?:\/\/\S+$/i.test(txt)){          // URL はリンクカードに
      e.preventDefault();
      document.execCommand('insertHTML', false, urlCardHTML(txt) + '<br>');
      saveBody(el);
      return;
    }
    e.preventDefault();                          // それ以外は書式なしテキスト
    document.execCommand('insertText', false, (dt.getData('text/plain') || ''));
  };
  el.ondragover = e => { if(e.dataTransfer.types.includes('Files')) e.preventDefault(); };
  el.ondrop = e => {
    const file = [...(e.dataTransfer.files || [])].find(f => f.type.startsWith('image/'));
    if(file){ e.preventDefault(); insertImage(file, el); }
  };
  el.addEventListener('mouseover', e => {
    if(e.target.tagName === 'IMG' && !e.target.classList.contains('ufav')) showImgHandle(e.target, el);
  });
  el.addEventListener('mouseleave', () => setTimeout(() => {
    if(!ihDrag && !document.getElementById('imgHandle')?.matches(':hover')) hideImgHandle();
  }, 120));
  el.addEventListener('click', e => {
    const li = e.target.closest('ul.ckl > li');
    if(li && el.contains(li)){
      const r = li.getBoundingClientRect();
      if(e.clientX < r.left){ e.preventDefault(); li.classList.toggle('dn'); saveBody(el); return; }
    }
    if(e.target.tagName === 'IMG' && !e.target.classList.contains('ufav')){
      e.preventDefault(); showImgHandle(e.target, el); imgMenu(e.target, el);
    }
    const a = e.target.closest('a.ulink');
    if(a && a.href){ e.preventDefault(); window.open(a.href, '_blank', 'noopener'); }
  });
}

/* ---------------- popovers ---------------- */
function popup(x, y, html){
  document.querySelectorAll('.pop').forEach(p => p.remove());
  const p = document.createElement('div');
  p.className = 'pop'; p.innerHTML = html;
  document.body.appendChild(p);
  p.style.left = Math.max(8, Math.min(x, innerWidth - p.offsetWidth - 8)) + 'px';
  p.style.top = Math.max(8, Math.min(y, innerHeight - p.offsetHeight - 8)) + 'px';
  setTimeout(() => document.addEventListener('mousedown', function h(ev){
    if(!p.contains(ev.target)){ p.remove(); document.removeEventListener('mousedown', h); }
  }), 0);
  return p;
}

    <h4 style="margin-top:10px">繰り返し</h4>
    <div class="drow"><label>周期</label>
      <select id="rUnit">${REPEATS.map(([v, l]) =>
        `<option value="${v}" ${k.repeat.unit===v?'selected':''}>${l}</option>`).join('')}</select>
      <input type="number" id="rN" min="1" max="99" value="${k.repeat.n || 1}"
        ${['','weekday'].includes(k.repeat.unit) ? 'disabled' : ''}>
    </div>
    ${isWeek ? `<div class="wdays">${WD.map((l, i) =>
      `<button data-wd="${i}" class="${k.repeat.days.includes(i)?'on':''} ${i===0?'sun':''} ${i===6?'sat':''}">${l}</button>`).join('')}</div>` : ''}
    <div class="hint">
      ${k.repeat.unit
        ? `完了すると次回（${esc(repLabel(k.repeat))}）へ自動で送られます<br>基準は開始日です`
        : '完了したら閉じるだけ'}
      ${isWeek && !k.repeat.days.length ? '<br>曜日を選ばない場合は同じ曜日で繰り返します' : ''}
      ${k.doneCount ? `<br>これまで ${k.doneCount} 回完了` : ''}</div>
    <h4 style="margin-top:12px">完了日</h4>
    <div class="drow"><label>完了日</label><input type="date" id="dDone" value="${k.doneAt || ''}"></div>
    <div class="hint">チェックを入れた日が自動で入ります${k.doneCount ? `（通算 ${k.doneCount} 回）` : ''}</div>
    <div class="dfoot"><button id="dClear">すべてクリア</button><button id="dClose">OK</button></div>
  </div>`);

  const upd = () => { touch(k); save(); render(); };
  const $ = id => p.querySelector('#' + id);
  const reopen = () => { p.remove(); dateMenu(rect, cid); };
  $('dStart').onchange = e => { k.start = e.target.value; upd(); };
  $('dDue').onchange = e => { k.due = e.target.value; upd(); };
  $('dAllday').onchange = e => {
    if(e.target.checked){ k.allday = true; delete k.startT; delete k.dueT; }
    else {
      k.allday = false;
      if(!k.start && !k.due) k.start = today();
      k.startT ||= '09:00';
    }
    save(); reopen(); render();
  };
  if($('dStartT')) $('dStartT').onchange = e => {
    if(e.target.value) k.startT = e.target.value; else delete k.startT; upd(); };
  if($('dDueT')) $('dDueT').onchange = e => {
    if(e.target.value) k.dueT = e.target.value; else delete k.dueT; upd(); };
  $('dDone').onchange = e => { if(e.target.value) k.doneAt = e.target.value; else delete k.doneAt; upd(); };
  p.querySelectorAll('[data-qs]').forEach(b => b.onclick = () => {
    k.start = b.dataset.qs === 'x' ? '' : todayPlus(+b.dataset.qs); $('dStart').value = k.start; upd(); });
  p.querySelectorAll('[data-qd]').forEach(b => b.onclick = () => {
    k.due = b.dataset.qd === 'x' ? '' : todayPlus(+b.dataset.qd); $('dDue').value = k.due; upd(); });
  p.querySelectorAll('[data-wd]').forEach(b => b.onclick = () => {
    const i = +b.dataset.wd, d = k.repeat.days;
    k.repeat.days = d.includes(i) ? d.filter(x => x !== i) : [...d, i].sort();
    save(); reopen(); render();
  });
  $('rUnit').onchange = e => {
    k.repeat.unit = e.target.value;
    if(k.repeat.unit === 'week' && !k.repeat.days.length && (k.start || k.due))
      k.repeat.days = [parse(k.start || k.due).getDay()];
    if(k.repeat.unit && !k.start && !k.due) k.start = today();
    save(); reopen(); render();
  };
  $('rN').onchange = e => { k.repeat.n = Math.max(1, +e.target.value || 1); upd(); };
  $('dClear').onclick = () => {
    k.start = ''; k.due = ''; delete k.doneAt;
    delete k.startT; delete k.dueT; delete k.allday;
    k.repeat = {unit:'', n:1, days:[]}; p.remove(); upd();
  };
  $('dClose').onclick = () => p.remove();
}

function noteDate(k){
  if(k.memoReg && k.memoDate) return k.memoDate;
  if(k.quote && k.quote.registered && k.quote.date) return k.quote.date;
  if(k.read && k.read.registered && k.read.date) return k.read.date;
  return k.created || '';
}
function ndateMenu(rect, kind, cid){

    L[i].c = nc; save(); render();

    if(!confirm(`「${L[i].n}」を削除しますか？${n ? `\n（${n} 件のタスクで使われています）` : ''}`)) return;

/* ---------------- drag & drop ---------------- */
let dragId = null, dragSub = null;
function wireDnD(root){
  root.querySelectorAll('.card[data-card]').forEach(card => {
    card.draggable = true;
    card.ondragstart = ev => {
      /* 文字を編集中・ボタン上からは並び替えを始めない */
      if(ev.target.closest('[contenteditable], input, textarea, select, button, a, .rflag, .chip')){
        ev.preventDefault(); return false;
      }
      dragId = card.dataset.card;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', dragId);
      setTimeout(() => card.classList.add('drag'), 0);
    };
    card.ondragend = () => { dragId = null;
      document.querySelectorAll('.drag').forEach(e => e.classList.remove('drag')); };
  });
  root.querySelectorAll('[data-grip]').forEach(g => {
    const card = g.closest('.card');
    g.ondragstart = ev => {
      ev.stopPropagation();
      dragId = g.dataset.grip;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', dragId);
      ev.dataTransfer.setDragImage(card, 20, 16);
      setTimeout(() => card.classList.add('drag'), 0);
    };
    g.ondragend = () => { dragId = null; document.querySelectorAll('.drag').forEach(e => e.classList.remove('drag')); };
  });
  root.querySelectorAll('[data-drop]').forEach(z => {
    z.ondragover = ev => { if(dragCol || dragSub) return; ev.preventDefault(); z.classList.add('over'); };
    z.ondragleave = () => z.classList.remove('over');
    z.ondrop = ev => {
      if(dragCol || dragSub) return;
      ev.preventDefault(); ev.stopPropagation(); z.classList.remove('over');
      const id = dragId || ev.dataTransfer.getData('text/plain');
      const f = findCard(id); if(!f) return;
      const target = board(view.id).cols.find(c => c.id === z.dataset.drop);
      let idx = target.cards.length;
      const els = [...z.querySelectorAll('.card')].filter(e => e.dataset.card !== id);
      for(const el of els){
        const r = el.getBoundingClientRect();
        if(ev.clientY < r.top + r.height / 2){
          idx = target.cards.findIndex(c => c.id === el.dataset.card); break;
        }
      }
      f.col.cards.splice(f.idx, 1);
      if(f.col === target && f.idx < idx) idx--;
      target.cards.splice(Math.max(0, idx), 0, f.card);
      save(); render();
    };
  });
}

/* ---------------- task page ---------------- */
function renderTasks(){
  const t = document.getElementById('pageTitle');
  t.value = filter === 'now' ? '今日必ず' : filter === 'today' ? '今日' : 'Tasks';
  t.disabled = true; t.oninput = null; t.style.color = '';

  let items = allTasks().filter(i => !i.card.done);   // 完了分は Done Task ページへ
  if(filter === 'now') items = items.filter(i => i.card.when === 'now');
  if(filter === 'today') items = items.filter(i => isToday(i.card));
  if(filter === 'due') items = items.filter(i => i.card.due && !i.card.done);
  if(q){
    const s = q.toLowerCase();
    items = items.filter(i => {
      const k = i.card;
      const Q = k.quote || {};
      const R = k.read || {};
      const hay = [plain(k.title), k.bodyTitle, plain(k.body), plain(k.note), plain(k.head), plain(Q.text), Q.author, Q.source, plain(Q.memo),
        R.author, R.source, R.media, (R.flags || []).join(' '), plain(R.memo),
        ...(k.subs || []).map(x => [plain(x.title), plain(x.head), plain(x.note)].join(' ')),
        ...(k.logs || []).map(g => (g.who || '') + ' ' + plain(g.text)),
        ...(k.tags || []).map(x => '#' + x)].join(' ').toLowerCase();
      return hay.includes(s);
    });
  }
  const anyOpen = items.some(i => !folded[i.card.id]);
  document.getElementById('topActions').innerHTML =
    `<button class="btn" id="foldAll">${anyOpen ? 'すべて折りたたむ' : 'すべて展開'}</button>`;

  const key = c => (c.due ? c.due + ' ' + (c.dueT || '99:99')
                          : c.start ? c.start + ' ' + (c.startT || '99:99') : '9999-99-99');
  /* 並び順：手動で入れ替えたもの → 「いつやる？」→ 日付 */
  const wrank = c => { const i = ['now', 'maybe', 'later'].indexOf(c.when || ''); return i < 0 ? 3 : i; };
  const tord = c => (typeof c.tord === 'number' ? c.tord : 1e9);
  items.sort((a, b) => tord(a.card) - tord(b.card)
    || wrank(a.card) - wrank(b.card)
    || key(a.card).localeCompare(key(b.card)));

  /* --- グループ分け（ボード / Status / いつやる / 期限） --- */
  if(filter === 'open' || filter === 'done') filter = 'today';
  const gb = S.groupBy || (filter === 'today' || filter === 'now' ? 'due' : 'board');
  const DUE_SECT = ['⚠️ 期限切れ', '★ 今日が期限', '▶ 明日以降', '期限なし'];
  function gInfo(it){
    const k = it.card;
    if(gb === 'status'){
      const n = k.color ? catName(k.color) : '';
      return {name:n || 'Status なし', color:k.color || '', ord:CATS().findIndex(c => c[0] === (k.color||'')) };
    }
    if(gb === 'when'){
      const [v, n, c] = whenOf(k.when);
      return {name:n, color:v ? c : '', ord:WHENS.findIndex(x => x[0] === (k.when || ''))};
    }
    if(gb === 'due'){
      const d = k.due;
      const n = !d ? DUE_SECT[3] : d < today() ? DUE_SECT[0] : d === today() ? DUE_SECT[1] : DUE_SECT[2];
      return {name:n, color:'', ord:DUE_SECT.indexOf(n)};
    }
    if(gb === 'none') return {name:'', color:'', ord:0};
    return {name:'▦ ' + it.board.name, color:it.board.color || '',
      ord:S.boards.findIndex(x => x.id === it.board.id)};
  }
  const groups = [];
  for(const it of items){
    const g0 = gInfo(it);
    let g = groups.find(x => x.name === g0.name);
    if(!g) groups.push(g = {...g0, rows:[]});
    g.rows.push(it);
  }
  groups.sort((x, y) => x.ord - y.ord);

  document.getElementById('view').innerHTML = `
    <div class="tools">
      <input class="search" id="q" placeholder="Task・Tag（#名前）を検索…" value="${esc(q)}">
      <div class="seg">
        ${[['now','今日必ず'],['today','今日'],['all','すべて'],['due','期限あり']]
          .map(([k, l]) => `<button data-f="${k}" class="${filter===k?'on':''}">${l}</button>`).join('')}
      </div>
      <span style="color:var(--muted);font-size:12.5px">${items.length} 件</span>
      <span class="gsel"><label>Group</label>
        <select id="gBy">${[['board','Board'],['status','Status'],['when','いつやる'],['due','期限'],['none','まとめない']]
          .map(([v, l]) => `<option value="${v}" ${gb===v?'selected':''}>${l}</option>`).join('')}</select></span>
      ${filter==='today' ? `<span style="color:var(--muted);font-size:12px">期限が今日まで、または開始日が今日以前</span>` : ''}
      ${filter==='now' ? `<span style="color:var(--muted);font-size:12px">「いつやる？」が今日必ずのタスク</span>` : ''}
    </div>
    ${groups.length ? groups.map((g, gi) => `
      <div class="grp">
        ${g.name ? `<div class="grp-h">
          <b>${g.color ? `<i class="gdot" style="background:${g.color}"></i>` : ''}${esc(g.name.replace('▦ ',''))}</b>
          <span>${g.rows.length} 件</span></div>` : ''}
        ${g.rows.map(it => rowHTML(it, gi)).join('')}
      </div>`).join('') : `<div class="empty">${
        filter==='now' ? '「今日必ず」のタスクはありません 🎉' :
        filter==='today' ? '今日やるタスクはありません 🎉' :
        '該当するタスクはありません'}</div>`}`;

  const qi = document.getElementById('q');
  wireSearchInput(qi, (val, p) => { q = val; renderTasks();
    const n = document.getElementById('q'); if(n){ n.focus(); n.setSelectionRange(p, p); } });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  document.getElementById('gBy').onchange = e => { S.groupBy = e.target.value; save(); renderTasks(); };

/* タスク一覧の手動並び替え */
let dragRow = null, dragRowG = null;
function wireRowDnD(v){
  v.querySelectorAll('[data-rgrip]').forEach(g => {
    g.ondragstart = ev => {
      const [id, gi] = g.dataset.rgrip.split('|');
      dragRow = id; dragRowG = gi;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', id);
      ev.stopPropagation();
      g.closest('.rwrap')?.classList.add('rdrag');
    };
    g.ondragend = () => {
      dragRow = dragRowG = null;
      v.querySelectorAll('.rwrap').forEach(x => x.classList.remove('rdrag', 'rdrop', 'rdrop-b'));
    };
  });
  v.querySelectorAll('.rwrap[data-rowid]').forEach(el => {
    el.ondragover = ev => {
      if(!dragRow || el.dataset.grp !== dragRowG || el.dataset.rowid === dragRow) return;
      ev.preventDefault(); ev.stopPropagation();
      const r = el.getBoundingClientRect(), after = ev.clientY > r.top + r.height / 2;
      el.classList.toggle('rdrop', !after);
      el.classList.toggle('rdrop-b', after);
    };
    el.ondragleave = () => el.classList.remove('rdrop', 'rdrop-b');
    el.ondrop = ev => {
      ev.preventDefault(); ev.stopPropagation();
      el.classList.remove('rdrop', 'rdrop-b');
      const src = dragRow;
      dragRow = dragRowG = null;
      if(!src || src === el.dataset.rowid) return;
      const ids = [...el.closest('.grp').querySelectorAll('.rwrap[data-rowid]')]
        .map(x => x.dataset.rowid).filter(x => x !== src);
      const r = el.getBoundingClientRect(), after = ev.clientY > r.top + r.height / 2;
      const at = ids.indexOf(el.dataset.rowid);
      ids.splice(after ? at + 1 : at, 0, src);
      ids.forEach((id, i) => { const f = findCard(id); if(f) f.card.tord = i * 10; });
      save(); renderTasks();
    };
  });
}

  v.querySelectorAll('[data-tstitle]').forEach(el => {

      const [cid, sid] = el.dataset.tstitle.split('|');

      if(!el.innerText.trim()) k.subs = k.subs.filter(x => x.id !== sid);

      || `[data-logtext^="${cid}|"]`)?.focus();

  wireCards(v);   // メモ / Message Log セクションを一覧内でも操作できるように
  v.querySelectorAll('[data-toggle]').forEach(el => el.onclick = () => {
    folded[el.dataset.toggle] = !folded[el.dataset.toggle];

  v.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
    view = {type:'board', id:el.dataset.goto}; render(); });
}

/* ---------------- 時間ログ ---------------- */
const PIEC = ['#3d6fe0', '#4f8f57', '#d98324', '#7b52c0', '#c9899a', '#c9a227', '#5b6577', '#c0392b'];
let timeSel = null;      // 表示中の日（null = 今日）
let timeAll = false;     // すべての記録を表示
let pieRange = 'day';    // day | week | month | year

/* ボード別に合計する */
function byBoard(list){
  const m = [];
  list.forEach(i => {
    let g = m.find(x => x.id === i.board.id);
    if(!g) m.push(g = {id:i.board.id, name:i.board.name, color:i.board.color || '', sec:0});
    g.sec += i.e.sec || 0;
  });
  m.forEach((g, n) => g.color = g.color || PIEC[n % PIEC.length]);
  return m.sort((a, b) => b.sec - a.sec);
}
/* ドーナツ円グラフ（依存なしのSVG） */
function donut(data, size){
  const total = data.reduce((a, d) => a + d.sec, 0);
  const r = size / 2, ir = r * 0.6, cx = r, cy = r;
  if(!total) return '';
  if(data.length === 1) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${(r+ir)/2}" fill="none"
      stroke="${data[0].color}" stroke-width="${r-ir}"><title>${esc(data[0].name)}</title></circle></svg>`;
  let a0 = -Math.PI / 2;
  const arcs = data.map(d => {
    const a1 = a0 + 2 * Math.PI * d.sec / total;
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const P = (a, rad) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
    const path = `M${P(a0, r)}A${r} ${r} 0 ${big} 1 ${P(a1, r)}L${P(a1, ir)}A${ir} ${ir} 0 ${big} 0 ${P(a0, ir)}Z`;
    a0 = a1;
    return `<path d="${path}" fill="${d.color}"><title>${esc(d.name)} ${fmtDur(d.sec)}</title></path>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}
/* 期間の判定とラベル */
function inRange(date, sel, range){
  if(!date) return false;
  if(range === 'day') return date === sel;
  if(range === 'month') return date.slice(0, 7) === sel.slice(0, 7);
  if(range === 'year') return date.slice(0, 4) === sel.slice(0, 4);
  const s = iso(weekStart(parse(sel)));
  return date >= s && date <= addDays(s, 6);
}
function rangeLabel(sel, range){
  const [y, m, d] = sel.split('-');
  if(range === 'day') return `${+m}/${+d}（${WD[parse(sel).getDay()]}）`;
  if(range === 'month') return `${y}年${+m}月`;
  if(range === 'year') return `${y}年`;
  const s = iso(weekStart(parse(sel))), e = addDays(s, 6);
  return `${+s.slice(5,7)}/${+s.slice(8)} 〜 ${+e.slice(5,7)}/${+e.slice(8)}`;
}
/* 積み上げ棒グラフ用のデータ */
function barCols(all, sel, range){
  let keys = [];
  if(range === 'year'){
    const y = sel.slice(0, 4);
    for(let m = 1; m <= 12; m++){
      const k = `${y}-${pad2(m)}`;
      keys.push({label:`${m}`, pick:d => (d || '').slice(0, 7) === k});
    }
  } else {
    let days = [];
    if(range === 'month'){
      const [y, m] = sel.split('-').map(Number);
      const last = new Date(y, m, 0).getDate();
      for(let i = 1; i <= last; i++) days.push(`${sel.slice(0,7)}-${pad2(i)}`);
    } else if(range === 'week'){
      const s = iso(weekStart(parse(sel)));
      for(let i = 0; i < 7; i++) days.push(addDays(s, i));
    } else {
      for(let i = 6; i >= 0; i--) days.push(addDays(sel, -i));
    }
    keys = days.map(dd => ({label:String(+dd.slice(8)), day:dd, pick:d => d === dd}));
  }
  const rowsIn = all.filter(i => keys.some(k => k.pick(i.e.date)));
  const boards = byBoard(rowsIn);
  const cols = keys.map(k => {
    const rows = all.filter(i => k.pick(i.e.date));
    const parts = boards.map(b => ({
      color:b.color, name:b.name,
      sec:rows.filter(r => r.board.id === b.id).reduce((a, r) => a + (r.e.sec || 0), 0),
    })).filter(p => p.sec);
    return {label:k.label, day:k.day, parts, total:parts.reduce((a, p) => a + p.sec, 0)};
  });
  return {cols, boards};
}
const axisLabel = v => !v ? '0' : (v % 3600 ? `${Math.round(v/60)}分` : `${v/3600}h`);
/* 積み上げ棒グラフ */
function barChart(cols, sel){
  const n = cols.length;
  const max = Math.max(1, ...cols.map(c => c.total));
  const step = max <= 1800 ? 600 : max <= 3600 ? 900 : max <= 4*3600 ? 3600 : Math.ceil(max/4/3600)*3600;
  const top = Math.ceil(max / step) * step;
  const padL = 54, padR = 10, padT = 16, padB = 26;
  const bw = n > 20 ? 14 : n > 10 ? 22 : 30, gap = n > 20 ? 6 : 12;
  const W = Math.max(560, padL + padR + n * (bw + gap));
  const H = 216, innerH = H - padT - padB;
  const X = i => padL + i * (bw + gap) + gap / 2;
  let grid = '';
  for(let v = 0; v <= top; v += step){
    const y = padT + innerH - (v / top) * innerH;
    grid += `<line x1="${padL-4}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eeeae9"/>
      <text x="${padL-8}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#a7a0a2">${axisLabel(v)}</text>`;
  }
  const bars = cols.map((c, i) => {
    let y = padT + innerH, s = '';
    c.parts.forEach(p => {
      const h = (p.sec / top) * innerH; y -= h;
      s += `<rect x="${X(i)}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(1,h).toFixed(1)}"
        fill="${p.color}" rx="2"><title>${esc(p.name)} ${fmtDur(p.sec)}</title></rect>`;
    });
    const isSel = c.day && c.day === sel;
    s += `<text x="${X(i)+bw/2}" y="${H-8}" text-anchor="middle" font-size="10"
      fill="${isSel?'var(--accent)':'#8b8285'}" font-weight="${isSel?'700':'400'}">${esc(c.label)}</text>`;
    if(c.total) s += `<text x="${X(i)+bw/2}" y="${(y-5).toFixed(1)}" text-anchor="middle"
      font-size="9" fill="#a7a0a2">${fmtDur(c.total)}</text>`;
    if(c.day) s = `<g style="cursor:pointer" data-barday="${c.day}">${s}</g>`;
    return s;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet"
    style="max-width:${W}px">${grid}${bars}</svg>`;
}
/* カレンダー（marks: {日付: ツールチップ}／allLabel: すべて表示ボタンの文言） */
/* ---------------- 日本の祝日 ---------------- */
const holCache = {};
function jpHolidays(y){
  if(holCache[y]) return holCache[y];
  const H = {};
  const set = (m, d, n) => { if(d >= 1) H[`${y}-${pad2(m)}-${pad2(d)}`] = n; };
  /* ○月の第 n 月曜 */
  const nthMon = (m, n) => {
    const first = new Date(y, m - 1, 1).getDay();
    return 1 + ((8 - first) % 7) + (n - 1) * 7;
  };
  set(1, 1, '元日');
  set(1, nthMon(1, 2), '成人の日');
  set(2, 11, '建国記念の日');
  if(y >= 2020) set(2, 23, '天皇誕生日');
  /* 春分・秋分（1980〜2099 の近似式） */
  set(3, Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), '春分の日');
  set(4, 29, y >= 2007 ? '昭和の日' : 'みどりの日');
  set(5, 3, '憲法記念日');
  set(5, 4, y >= 2007 ? 'みどりの日' : '国民の休日');
  set(5, 5, 'こどもの日');
  if(y >= 2003) set(7, nthMon(7, 3), '海の日'); else set(7, 20, '海の日');
  if(y >= 2016) set(8, 11, '山の日');
  set(9, nthMon(9, 3), '敬老の日');
  set(9, Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), '秋分の日');
  set(10, nthMon(10, 2), y >= 2020 ? 'スポーツの日' : '体育の日');
  set(11, 3, '文化の日');
  set(11, 23, '勤労感謝の日');
  if(y <= 2018) set(12, 23, '天皇誕生日');
  /* 国民の休日（前後を祝日に挟まれた平日） */
  Object.keys(H).slice().forEach(k => {
    const d2 = addDays(k, 2);
    if(H[d2] && !H[addDays(k, 1)] && parse(addDays(k, 1)).getDay() !== 0)
      H[addDays(k, 1)] = '国民の休日';
  });
  /* 振替休日（日曜と重なったら次の平日） */
  Object.keys(H).slice().forEach(k => {
    if(parse(k).getDay() !== 0) return;
    let n2 = addDays(k, 1);
    while(H[n2]) n2 = addDays(n2, 1);
    H[n2] = '振替休日';
  });
  return holCache[y] = H;
}
const holName = d => d ? (jpHolidays(+d.slice(0, 4))[d] || '') : '';

function calendarHTML(marks, sel, cm, allOn, allLabel){
  const [y, m] = cm.split('-').map(Number);
  const lead = new Date(y, m - 1, 1).getDay(), last = new Date(y, m, 0).getDate();
  let cells = '';
  for(let i = 0; i < lead; i++) cells += `<span class="cd out"></span>`;
  for(let dd = 1; dd <= last; dd++){
    const key = `${cm}-${pad2(dd)}`;
    const wd = (lead + dd - 1) % 7;
    const hn = holName(key);
    const cls = hn || wd === 0 ? 'sun' : wd === 6 ? 'sat' : '';
    cells += `<button class="cd ${cls} ${key===sel?'sel':''} ${key===today()?'tdy':''}" data-cal="${key}"
      title="${hn ? esc(hn) + (marks[key] ? ' ・ ' : '') : ''}${marks[key] ? esc(marks[key]) : (hn ? '' : 'なし')}"
      >${dd}${marks[key]?'<i></i>':''}</button>`;
  }
  return `<div class="cal">
    <div class="cal-h"><button data-cm="-1">‹</button><b>${y}年${m}月</b><button data-cm="1">›</button></div>
    <div class="cal-w">${WD.map((x, i) =>
      `<span class="${i===0?'sun':i===6?'sat':''}">${x}</span>`).join('')}</div>
    <div class="cal-g">${cells}</div>
    <div class="cal-f"><button data-cal="${today()}">今日</button>
      ${allLabel ? `<button id="calAll" class="${allOn?'on':''}">${allLabel}</button>` : ''}</div>
  </div>`;
}

    dailySel = el.dataset.cal; dailyMonth = dailySel.slice(0, 7); dailyAll = false; renderDaily(b); });
  v.querySelectorAll('[data-cm]').forEach(el => el.onclick = () => {
    const [y, m] = dailyMonth.split('-').map(Number);
    const dd = new Date(y, m - 1 + (+el.dataset.cm), 1);
    dailyMonth = `${dd.getFullYear()}-${pad2(dd.getMonth()+1)}`; renderDaily(b); });
  v.querySelectorAll('[data-wx]').forEach(el => el.onclick = () => {

  const dt = document.getElementById('dailyToday');
  if(dt) dt.onclick = () => { dailySel = today(); dailyMonth = dailySel.slice(0, 7); renderDaily(b); };
  const da = document.getElementById('dailyAllBtn');
  if(da) da.onclick = () => { dailyAll = true; renderDaily(b); };
  const d1 = document.getElementById('dailyOne');

    dailyAll = false; dailySel = today(); dailyMonth = dailySel.slice(0, 7); renderDaily(b);

    wireRich(ed);
    ed.onblur = () => { saveBody(ed); hideRT(); };

/* 検索欄: 日本語変換中は再描画しない */
function wireSearchInput(el, onChange){
  let composing = false, timer = null;
  const fire = () => {
    clearTimeout(timer);
    timer = setTimeout(() => onChange(el.value, el.selectionStart), 200);
  };
  el.addEventListener('compositionstart', () => { composing = true; clearTimeout(timer); });
  el.addEventListener('compositionend', () => { composing = false; fire(); });
  el.addEventListener('input', () => { if(!composing) fire(); });
  el.addEventListener('keydown', e => { if(e.key === 'Enter' && !composing){ clearTimeout(timer); onChange(el.value, el.selectionStart); } });
}

/* ---------------- Search（横断検索） ---------------- */
let searchQ = '', searchAuthor = '', searchSource = '';
function cardHay(k){
  const Q = k.quote || {}, R = k.read || {};
  return [plain(k.title), k.bodyTitle, plain(k.body), plain(k.note), plain(k.head),
    ...(k.subs || []).map(s => [plain(s.title), plain(s.head), plain(s.note)].join(' ')),
    ...(k.tags || []).map(t => '#' + t),
    plain(Q.text), Q.author, Q.source, plain(Q.memo),
    R.author, R.source, R.media, plain(R.memo), (R.flags || []).join(' '),
    ...(k.logs || []).map(g => (g.who || '') + ' ' + plain(g.text)),
  ].filter(Boolean).join(' ').toLowerCase();
}
function excerpt(text, s, len){
  const t = (text || '').replace(/\s+/g, ' ').trim();
  const i = t.toLowerCase().indexOf(s);
  if(i < 0) return esc(t.slice(0, len));
  const from = Math.max(0, i - 24), to = Math.min(t.length, i + s.length + len);
  return (from ? '…' : '') + esc(t.slice(from, i)) +
    `<mark>${esc(t.slice(i, i + s.length))}</mark>` + esc(t.slice(i + s.length, to)) + (to < t.length ? '…' : '');
}
function renderSearch(){
  const t = document.getElementById('pageTitle');
  t.value = 'Search'; t.disabled = true; t.oninput = null; t.style.color = '';
  document.getElementById('topActions').innerHTML = '';
  const s = searchQ.trim().toLowerCase();
  const authors = usedList('author'), sources = usedList('source');
  const aOf = k => [(k.quote && k.quote.author) || '', (k.read && k.read.author) || ''].map(v => v.trim());
  const sOf = k => [(k.quote && k.quote.source) || '', (k.read && k.read.source) || ''].map(v => v.trim());
  const active = s || searchAuthor || searchSource;

  let cards = [], days = [];
  if(active){
    cards = allCards().filter(x => !s || cardHay(x.card).includes(s));
    if(searchAuthor) cards = cards.filter(x => aOf(x.card).includes(searchAuthor));
    if(searchSource) cards = cards.filter(x => sOf(x.card).includes(searchSource));
    if(s && !searchAuthor && !searchSource){
      S.boards.filter(b => b.daily).forEach(b => {
        Object.entries(b.days || {}).forEach(([dd, v]) => {
          if(plain(v).toLowerCase().includes(s)) days.push({board:b, date:dd, text:plain(v)});
        });
      });
    }
    days.sort((a, b) => b.date.localeCompare(a.date));
  }

  document.getElementById('view').innerHTML = `
    <div class="searchbox">
      <input id="sq" class="bigsearch" placeholder="すべてのメモ・タスク・引用・本から探す…" value="${esc(searchQ)}">
      <div class="sfilters">
        <span class="gsel"><label>著者</label>
          <select id="sAuthor"><option value="">すべて</option>
            ${authors.map(a2 => `<option ${searchAuthor===a2?'selected':''}>${esc(a2)}</option>`).join('')}</select></span>
        <span class="gsel"><label>出典</label>
          <select id="sSource"><option value="">すべて</option>
            ${sources.map(s2 => `<option ${searchSource===s2?'selected':''}>${esc(s2)}</option>`).join('')}</select></span>
        ${searchAuthor || searchSource || searchQ ? `<button class="btn" id="sClear"
          style="padding:4px 12px;font-size:12px">条件をクリア</button>` : ''}
        ${active ? `<span class="shits">${cards.length + days.length} 件</span>` : ''}
      </div>
    </div>
    ${!active ? `<div class="empty">タイトル・本文・Memo・Quote・Read・Message Log・サブタスク・タグ、<br>
      Daily Memo の本文まで、すべてを対象に探します</div>`
    : (cards.length + days.length) ? `
      ${days.length ? `<div class="sgrp"><div class="sgrp-h">Daily Memo</div>
        ${days.map(dy => `<div class="sday" data-openday="${dy.board.id}|${dy.date}">
          <b>${dy.date} ${WD[parse(dy.date).getDay()]}</b>
          <span>${excerpt(dy.text, s, 120)}</span></div>`).join('')}</div>` : ''}
      ${cards.length ? `<div class="sgrp"><div class="sgrp-h">カード</div>
        <div class="colwrap">${cards.map(x => `<div class="card ${x.card.type} colitem">
          <div class="col-src">
            <span data-goto="${x.board.id}" style="cursor:pointer">
              <span style="${x.board.color?`color:${x.board.color}`:''}">▦</span> ${esc(x.board.name)}</span>
            <span>／ ${esc(x.col.title)}</span>
            ${x.card.day ? `<span>／ ${x.card.day}</span>` : ''}
          </div>
          ${cardBodyHTML(x.card)}
        </div>`).join('')}</div></div>` : ''}`
    : `<div class="empty">みつかりませんでした</div>`}`;

  const si = document.getElementById('sq');
  wireSearchInput(si, (val, p) => {
    searchQ = val;
    renderSearch();
    const n = document.getElementById('sq'); if(n){ n.focus(); n.setSelectionRange(p, p); }
  });
  si.focus();
  si.setSelectionRange(si.value.length, si.value.length);
  const sa = document.getElementById('sAuthor'), ss = document.getElementById('sSource');
  if(sa) sa.onchange = e => { searchAuthor = e.target.value; renderSearch(); };
  if(ss) ss.onchange = e => { searchSource = e.target.value; renderSearch(); };
  const sc = document.getElementById('sClear');
  if(sc) sc.onclick = () => { searchQ = ''; searchAuthor = ''; searchSource = ''; renderSearch(); };
  const v = document.getElementById('view');
  wireCards(v);
  v.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
    view = {type:'board', id:el.dataset.goto}; render(); });
  v.querySelectorAll('[data-openday]').forEach(el => el.onclick = () => {
    const [bid, dd] = el.dataset.openday.split('|');
    dailySel = dd; dailyMonth = dd.slice(0, 7);
    view = {type:'board', id:bid}; render();
  });
}
/* カード本体（カード枠は呼び出し側で用意する） */
function cardBodyHTML(k){
  const html = cardHTML(k);
  return html.replace(/^<div class="[^"]*"[^>]*>/, '').replace(/<\/div>$/, '');
}

/* 貼り付けた画像は縮小して埋め込む（保存容量を抑えるため） */
function insertImage(file, el){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1200;
      let { width: w, height: hh } = img;
      if(w > max){ hh = Math.round(hh * max / w); w = max; }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = hh;
      cv.getContext('2d').drawImage(img, 0, 0, w, hh);
      const url = cv.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.82);
      el.focus();
      document.execCommand('insertHTML', false, `<img src="${url}" style="width:60%"><br>`);
      /* 画像の下（次の行）にカーソルを置く */
      const imgs = el.querySelectorAll('img');
      const last = imgs[imgs.length - 1];
      if(last){
        const r2 = document.createRange();
        let after = last.nextSibling;
        if(!after || after.nodeName === 'BR'){
          const holder = document.createTextNode('');
          last.parentNode.insertBefore(holder, after ? after.nextSibling : null);
          after = holder;
        }
        r2.setStart(after, 0); r2.collapse(true);
        const s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(r2);
      }
      saveBody(el);
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* 画像の右下をドラッグしてサイズ変更 */
let ihImg = null, ihEl = null, ihDrag = false;
function imgHandle(){
  let hd = document.getElementById('imgHandle');
  if(hd) return hd;
  hd = document.createElement('div');
  hd.id = 'imgHandle';
  hd.title = 'ドラッグでサイズ変更';
  document.body.appendChild(hd);
  hd.onmousedown = ev => {
    if(!ihImg) return;
    ev.preventDefault(); ev.stopPropagation();
    ihDrag = true;
    document.body.style.cursor = 'nwse-resize';
    const box = ihImg.parentElement.getBoundingClientRect();
    const left = ihImg.getBoundingClientRect().left;
    const move = e => {
      const wpx = Math.max(40, e.clientX - left);
      const pct = Math.max(10, Math.min(100, Math.round(wpx / box.width * 100)));
      ihImg.style.width = pct + '%';
      placeHandle();
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      ihDrag = false; document.body.style.cursor = '';
      if(ihEl) saveBody(ihEl);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
  return hd;
}
function placeHandle(){
  const hd = imgHandle();
  if(!ihImg){ hd.style.display = 'none'; return; }
  const r = ihImg.getBoundingClientRect();
  hd.style.left = (r.right - 8) + 'px';
  hd.style.top = (r.bottom - 8) + 'px';
  hd.style.display = 'block';
}
function showImgHandle(img, el){ ihImg = img; ihEl = el; placeHandle(); }
function hideImgHandle(){ if(ihDrag) return; ihImg = null; ihEl = null; placeHandle(); }
document.addEventListener('scroll', () => { if(!ihDrag) hideImgHandle(); }, true);

const LINKICON = '<svg class="mico" viewBox="0 0 16 16"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.9.3l2-2a2.6 2.6 0 0 0-3.7-3.7l-1.1 1.1"/><path d="M9.4 6.6a2.6 2.6 0 0 0-3.9-.3l-2 2a2.6 2.6 0 0 0 3.7 3.7l1.1-1.1"/></svg>';
function cardLabel(k){
  const t = plain(k.title).trim() || (k.bodyTitle || '').trim()
    || (k.read && k.read.source ? `『${k.read.source}』` : '')
    || (k.quote && plain(k.quote.text).trim().slice(0, 20))
    || plain(k.body).trim().slice(0, 20);
  return t || '無題';
}
const linksOf = k => (k.links || []).map(id => findCard(id)).filter(Boolean);
const backlinksOf = k => allCards().filter(x => (x.card.links || []).includes(k.id));
function linkKind(k){
  if(k.type === 'quote' || (hasQuote(k) && !hasMemo(k))) return 'Quote';
  if(k.type === 'read' || hasRead(k)) return 'Read';
  if(k.type === 'task') return 'Task';
  return 'Memo';
}
function linkPreviewText(k, kind){
  if(kind === 'Quote') return plain(k.quote && k.quote.text);
  if(kind === 'Read'){
    const R = k.read || {};
    const head = [R.author, R.source ? `『${R.source}』` : ''].filter(Boolean).join(' ');
    return [head, plain(R.memo)].filter(x => (x || '').trim()).join('\n');
  }
  if(kind === 'Task'){
    const subs = (k.subs || []).map(s => '・' + plain(s.title)).join('\n');
    return [plain(k.note), plain(k.body), subs].filter(x => (x || '').trim()).join('\n');
  }
  return plain(k.body);
}
function linkCardHTML(f, back, ownerId){
  const k = f.card, kind = linkKind(k);

}
function linkSection(k){
  const outs = linksOf(k), backs = backlinksOf(k);
  if(!outs.length && !backs.length) return '';
  return `<div class="linkbox">
    ${outs.length ? `<div class="lk-h">${LINKICON} リンク</div>
      <div class="lgrid">${outs.map(f => linkCardHTML(f, false, k.id)).join('')}</div>` : ''}
    ${backs.length ? `<div class="lk-h back">← リンク元</div>

      out.push({key:k.id + ':memo', kind:'memo', ...x});

      out.push({key:k.id + ':quote', kind:'quote', ...x});
    if(k.read && k.read.card && ((k.read.source || '').trim() || plain(k.read.memo).trim()))
      out.push({key:k.id + ':read', kind:'read', ...x});
  }
  return out;
