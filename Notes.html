<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 見出し用の和文フォント。
     端末にインストール済みなら local() が使われます。
     フォントファイル（ttf / otf / woff2）をこの HTML と同じフォルダに置いた場合は
     下の url() のいずれかの名前にしておくと読み込まれます。 */
  @font-face{
    font-family:'UniLine';
    src:local('ユニバーサルライン DSP L'), local('UniversalLine DSP L'), local('UniversalLineDSP-L'),
        local('ユニバーサルライン DSP'), local('ユニバーサルライン'), local('UniversalLine'),
        url('./UniversalLine-DSP-L.woff2') format('woff2'),
        url('./UniversalLine-DSP-L.ttf') format('truetype'),
        url('./UniversalLine-DSP-L.otf') format('opentype');
    font-display:swap;
  }
  :root{
    --bg:#f7f4ef; --panel:#fffefd; --ink:#1f1a1c; --muted:#8b8285;
    --line:#e8e1df; --line2:#f3edec; --accent:#3d6fe0; --accent-soft:#eaf0fd;
    --brown:#54402e; --quote-bg:#f5f1f0;
    --fserif:"Yu Mincho","YuMincho","游明朝","游明朝体","Hiragino Mincho ProN","Hiragino Mincho Pro",
      "Noto Serif JP","Times New Roman",serif;
    --fdisp:'Montserrat','UniLine','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif;
    --radius:12px; --shadow:0 1px 2px rgba(30,25,15,.06),0 4px 14px rgba(30,25,15,.05);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14.5px/1.75 var(--fserif);
    font-feature-settings:"palt" 1;}
  /* メイン画面はサイドバーと同じ書体に。メモ・引用など読ませる文章だけ明朝に戻す */
  .scroll{font-family:var(--fdisp)}
  .qc-body,.qc-memo,.dailybody,
  .dcard .qt,.dcard .mm,.rs-p,.lc-p{font-family:var(--fserif)}
  /* メモ本文・Message Log・セクション見出しはサイドバーと同じ書体 */
  .body,.log-t,.sec-lb{font-family:var(--fdisp)}
  .body.dailybody{font-family:var(--fserif);font-weight:500}
  /* Memo・Quote・Read は入力中も表示も游明朝（見出しラベルは除く） */
  .qbox,.qbox *,.qcard,.qcard *{font-family:var(--fserif)}
  .qbox .body,.qcard .body,.qbox .mtitle,.qcard .mtitle,
  .qbox input,.qbox .qt,.qcard .qt,
  .qcard .qc-body,.qcard .qc-memo,.qcard .qc-ttl,.qcard .qc-cite{font-weight:400;color:#3c3638}
  /* 入力欄のプレースホルダーは本文と同じ淡さに */
  .qbox input::placeholder{color:#c4bcbe;opacity:1}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .app{display:flex;height:100vh;overflow:hidden}
  /* 暗証番号ロック */
  body.locked .app,body.locked #sideShow,body.locked #rsideShow{visibility:hidden}
  .lockwrap{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;
    align-items:center;justify-content:center}
  .lockwrap.on{display:flex}
  .lockbox{text-align:center;font-family:var(--fdisp)}
  .lock-t{font-size:26px;font-weight:600;color:var(--brown);letter-spacing:.12em;margin-bottom:6px}
  .lock-s{font-size:12.5px;color:var(--muted);margin-bottom:20px}
  .lock-in{width:150px;padding:12px 10px;font-size:26px;letter-spacing:.5em;text-align:center;
    border:1px solid var(--line);border-radius:11px;background:var(--panel);outline:none;
    color:var(--ink);font-family:var(--fdisp)}
  .lock-in:focus{border-color:var(--brown);box-shadow:0 0 0 3px #ece4da}
  .lock-e{height:18px;margin-top:12px;font-size:12px;color:#c0392b}
  .shake{animation:shk .38s}
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}
    40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  /* ゴシック側は標準の太さ、明朝側だけ一段太く（細く見えるため） */
  .ctitle,.tnote,.sub .t,.rsub .t,.row .tt,.rs-t{font-weight:400}
  .qc-body,.qc-memo,.dailybody,.rs-p,.dcard .qt{font-weight:500}
  .body,.log-t{font-weight:400}
  /* スクロールバーは普段は見えず、カーソルを重ねたときだけ薄く出す */
  .side,.rside,.scroll{scrollbar-width:thin;scrollbar-color:transparent transparent}
  .side:hover,.rside:hover,.scroll:hover{scrollbar-color:rgba(90,75,80,.22) transparent}
  .side::-webkit-scrollbar,.rside::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:9px;height:9px}
  .side::-webkit-scrollbar-track,.rside::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:transparent}
  .side::-webkit-scrollbar-thumb,.rside::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{
    background:transparent;border-radius:9px;border:3px solid transparent;background-clip:content-box}
  .side:hover::-webkit-scrollbar-thumb,.rside:hover::-webkit-scrollbar-thumb,.scroll:hover::-webkit-scrollbar-thumb{
    background:rgba(90,75,80,.20);background-clip:content-box}
  .side::-webkit-scrollbar-thumb:hover,.rside::-webkit-scrollbar-thumb:hover,.scroll::-webkit-scrollbar-thumb:hover{
    background:rgba(90,75,80,.38);background-clip:content-box}

  /* ---------- sidebar ---------- */
  .side{font-family:var(--fdisp);letter-spacing:.02em;color:var(--brown);
    width:236px;flex:0 0 236px;background:#d6bec6;border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto;
    position:relative;transition:none}
  .side.hide{display:none}
  .side-rz{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:20}
  .side-rz::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:transparent}
  .side-rz:hover::after,.side-rz.act::after{background:var(--accent)}
  .brand{font-weight:500;font-size:21px;padding:4px 4px 14px 8px;letter-spacing:.08em;
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .banner{height:82px;flex:0 0 82px;border-radius:0;margin:0 -10px 12px -1px;overflow:hidden;cursor:pointer;
    border:1px dashed #cbb0b8;border-left:0;border-right:0;display:flex;align-items:center;
    justify-content:center;color:#a08c92;font-size:11px;letter-spacing:.06em;position:relative;
    background:#00000008}
  .banner:hover{border-color:var(--brown);color:var(--brown)}
  .banner.has{border:0}
  .banner .bx{right:8px}
  .banner img{width:100%;height:100%;object-fit:cover;display:block}
  .banner .bx{position:absolute;top:4px;right:4px;width:19px;height:19px;border-radius:50%;
    background:rgba(255,255,255,.85);color:#6e6668;font-size:12px;line-height:19px;text-align:center;
    opacity:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .banner:hover .bx{opacity:1}
  .banner .bx:hover{background:#fff;color:#c0392b}
  .brand button{color:#9a8b8f;font-size:14px;padding:2px 7px;border-radius:7px;line-height:1}
  .brand button:hover{background:#cbb0b8;color:var(--ink)}
  /* 右サイドバー */
  .rside{width:262px;flex:0 0 262px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;padding:12px 10px;gap:8px;overflow-y:auto;position:relative}
  .rside-rz{position:absolute;top:0;left:0;width:8px;height:100%;cursor:col-resize;z-index:20}
  .rside-rz::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
  .rside-rz:hover::after,.rside-rz.act::after{background:var(--accent)}
  .rside.hide{display:none}
  .rs-h{display:flex;align-items:center;justify-content:space-between;
    font-family:var(--fdisp);font-size:12px;letter-spacing:.12em;color:var(--muted);
    font-weight:600;padding:2px 4px 0}
  .rs-h button{color:#b0a7a9;font-size:14px;padding:2px 7px;border-radius:7px;line-height:1}
  .rs-h button:hover{background:#f4f0ef;color:var(--ink)}
  .rside .cal{width:auto;flex:1 1 auto;border:0;padding:6px 2px 4px;background:none}
  .rs-list{border-top:1px solid var(--line2);padding-top:8px}
  .rs-lb{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:7px;padding:0 2px}
  .rs-item{padding:8px 9px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;
    cursor:pointer;background:var(--panel)}
  .rs-item:hover{border-color:#cdc1c3;box-shadow:var(--shadow)}
  .rs-t{font-size:13px;line-height:1.5;word-break:break-word;margin-bottom:3px;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rs-p{font-size:12px;line-height:1.65;color:#5f585a;word-break:break-word;margin-bottom:5px;
    white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .rs-m{font-size:10.5px;color:var(--muted);display:flex;gap:5px;align-items:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rs-kind{font-size:9.5px;letter-spacing:.1em;border:1px solid var(--line);border-radius:20px;
    padding:1px 6px;color:#8b8285;flex:0 0 auto}
  .rs-d{font-size:10px;color:#b0a7a9;margin-top:4px;
    font-family:"SFMono-Regular",Consolas,monospace}
  .rs-empty{font-size:12px;color:var(--muted);text-align:center;padding:18px 0}
  #rsideShow{display:none;position:fixed;right:12px;top:12px;z-index:40;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:6px 10px;font-size:14px;box-shadow:var(--shadow);color:var(--brown);line-height:0}
  .calico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.35;
    stroke-linecap:round;stroke-linejoin:round}
  #rsideShow:hover{color:var(--ink);border-color:var(--line2)}
  body.norside #rsideShow{display:block}
  body.norside .topbar{padding-right:64px}
  .card.flash{animation:flash 1.5s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
  #sideShow{display:none;position:fixed;left:10px;top:12px;z-index:40;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:6px 11px;font-size:14px;color:#6e6668;box-shadow:var(--shadow)}
  #sideShow:hover{border-color:#cdc1c3}
  body.nosidebar #sideShow{display:block}
  body.nosidebar .topbar{padding-left:64px}
  .side-label{font-size:11px;color:#8a7358;padding:12px 8px 4px;letter-spacing:.08em;font-weight:600}
  .side-label.lbrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .side-label.lbrow button{color:#a58e78;font-size:11px;padding:2px 6px;border-radius:6px;line-height:1}
  .side-label.lbrow button:hover{background:#cbb0b8;color:var(--brown)}
  /* Status 編集パネル */
  .strow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .strow input[type=color]{width:24px;height:24px;padding:0;border:1px solid var(--line);
    border-radius:7px;background:none;cursor:pointer;flex:0 0 24px}
  .strow input[type=text]{flex:1 1 auto;min-width:0;width:100%;border:1px solid var(--line);
    border-radius:7px;padding:6px 8px;background:var(--panel);font-size:12.5px;outline:none;
    color:var(--ink)}
  .strow input[type=text]:focus{border-color:var(--brown)}
  .strow .x{color:#c0b8ba;font-size:14px;padding:0 4px;flex:0 0 18px;width:18px;
    justify-content:center;display:flex}
  .strow .x:hover{color:#c0392b}
  .stadd{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;
    padding:5px 10px;width:100%;margin-top:2px}
  .stadd:hover{border-color:var(--brown);color:var(--brown)}
  .nav{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
    cursor:pointer;color:var(--brown);font-size:13.5px}
  .nav:hover{background:var(--bh,#cbb0b8)}
  .nav.on{background:var(--bo,var(--panel));color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
  .nav .ico{width:18px;text-align:center;flex:0 0 18px;font-size:14px}
  /* Tasks はカーソルを置いたときだけ、くすんだ赤系に */
  #navTasks:hover{background:#c48f95;color:#fff}
  #navTasks:hover .cnt{background:#a96f78;color:#fff}
  .nav.dragging{opacity:.4}
  .nav.dropn{box-shadow:inset 0 2px 0 var(--brown)}
  .nav.dropn-b{box-shadow:inset 0 -2px 0 var(--brown)}
  .nav .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:#cdb4bb;
    border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
  .nav.on .cnt{background:#cfb6bd;color:var(--muted)}
  .tagnav{display:flex;flex-wrap:wrap;gap:5px;padding:4px 8px 0}
  .tagnav button{font-size:11.5px;padding:0 9px;height:21px;line-height:1;border-radius:20px;
    background:#cfb6bd;color:#6b655c;display:inline-flex;align-items:center;white-space:nowrap}
  .tagnav button:hover{filter:brightness(.95)}
  .tagnav button.on{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
  .tagnav button.pin{font-weight:700}
  .pinico{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.5;
    stroke-linejoin:round;margin-right:4px;flex:0 0 auto}
  .pop .ic .pinico{width:12px;height:12px;margin:0}
  /* フォルダ */
  .fgrp{margin-bottom:1px}
  .frow{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;
    cursor:pointer;color:var(--brown);font-size:12.5px}
  .frow:hover{background:#cbb0b8}
  .fcar{font-size:8px;color:#a7a0a2;transition:transform .12s;width:10px}
  .fcar.open{transform:rotate(90deg)}
  .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;letter-spacing:.03em}
  .mico{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.25;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:0 0 auto}
  .nico{width:13.5px;height:13.5px;fill:none;stroke:currentColor;stroke-width:1.3;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
  .fico{width:12.5px;height:12.5px;fill:none;stroke:currentColor;stroke-width:1.3;
    stroke-linejoin:round;vertical-align:-1.5px;margin-right:6px;flex:0 0 auto}
  .fmenu{opacity:0;color:#a7a0a2;font-size:14px;padding:0 3px;border-radius:5px}
  .frow:hover .fmenu{opacity:1}
  .nav.sub{margin-left:14px}
  .nav.dropb{box-shadow:inset 0 2px 0 var(--accent)}
  .frow.dropf{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
  .nav[data-board]{cursor:grab}
  #boardList.dropr{outline:2px dashed #c9bfc2;outline-offset:-2px;border-radius:9px}
  .fempty{font-size:11px;color:#b2a9ab;padding:3px 8px 5px 24px}
  .side-foot{margin-top:auto;padding-top:12px;border-top:1px solid #c4a3ac;display:flex;gap:6px;flex-wrap:wrap}
  .synctag{flex:1 1 100%;font-size:10.5px;color:#6b5a4a;opacity:0;transition:opacity .2s;
    font-family:var(--fdisp);line-height:1.5}
  .synctag.on{opacity:1}
  .synctag.err{color:#8c3a52}
  .srow{margin-bottom:9px}
  .srow label{display:block;font-size:11px;color:#6e6668;margin-bottom:4px;letter-spacing:.03em}
  .srow input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 9px;
    background:var(--panel);font-size:12.5px;outline:none;color:var(--ink)}
  .srow input:focus{border-color:var(--brown);box-shadow:0 0 0 2px #ece4da}
  .mini{font-size:11.5px;color:var(--muted);padding:5px 9px;border-radius:7px;border:1px solid #cdb4bb}
  .mini:hover{background:#cbb0b8;color:var(--ink)}

  /* ---------- main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;
    padding:0 22px;border-bottom:1px solid var(--line);background:var(--bg)}
  .title{font-family:var(--fdisp);color:var(--brown);font-size:18px;font-weight:300;letter-spacing:.05em;border:0;background:none;
    outline:none;min-width:60px;padding:2px 4px;border-radius:6px}
  .title:focus{background:var(--panel);box-shadow:0 0 0 2px var(--accent-soft)}
  .spacer{flex:1}
  #backupTag{font-size:11.5px;color:#b5711f;background:#fff3e2;border-radius:20px;
    padding:3px 10px;margin-right:8px;cursor:pointer;white-space:nowrap}
  #backupTag:hover{background:#ffe9cc}
  #fileTag{font-size:10.5px;color:#6e6668;width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;padding:2px 2px 0}
  #savedTag{font-size:11.5px;color:#7d9a80;opacity:0;transition:opacity .25s;
    margin-right:4px;white-space:nowrap}
  #savedTag.on{opacity:1}
  #savedTag.err{color:#c0392b;opacity:1}
  .btn{padding:6px 12px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--panel)}
  .btn:hover{border-color:#cdc5c7}
  .scroll{flex:1;overflow:auto;padding:20px 22px 90px}

  /* ---------- board ---------- */
  .cols{display:flex;gap:16px;align-items:flex-start;min-height:200px}
  .col{flex:0 0 288px;width:288px;display:flex;flex-direction:column;gap:10px;position:relative}
  .col-head{display:flex;align-items:center;gap:5px;padding:5px 8px;cursor:grab;border-radius:9px;
    background:#ece8e1;border:0}
  .col-head:hover{background:#e5e0d7}
  .col-grip{color:#c9c1c3;font-size:12px;opacity:0;user-select:none}
  .col-head:hover .col-grip{opacity:1}
  .col.coldrag{opacity:.45}
  .col.colover{outline:2px dashed var(--brown);outline-offset:6px;border-radius:12px}
  .col-title{font-family:var(--fdisp);font-size:15px;font-weight:500;color:#5f585a;letter-spacing:.05em;
    border:0;background:none;outline:none;padding:3px 5px;border-radius:6px;flex:1;min-width:0}
  .col-title:focus{background:var(--panel);box-shadow:0 0 0 2px var(--accent-soft)}
  .col-x{opacity:0;color:var(--muted);font-size:15px;padding:0 4px;border-radius:5px}
  .col:hover .col-x{opacity:1}
  .col-x:hover{background:#e8e5df;color:#c0392b}
  .col-rz{position:absolute;top:0;right:-9px;width:12px;height:100%;cursor:col-resize;z-index:5}
  .col-rz::after{content:"";position:absolute;left:5px;top:26px;bottom:6px;width:2px;
    border-radius:2px;background:transparent}
  .col-rz:hover::after,.col-rz.act::after{background:var(--accent)}
  .drop{display:flex;flex-direction:column;gap:10px;min-height:56px;border-radius:12px;padding:2px}
  .drop.over{background:#eae5e4;outline:2px dashed #cdc5c7;outline-offset:-2px}
  .addcol{flex:0 0 148px;padding-top:26px}
  .addcol button{width:100%;padding:12px;border:1px dashed #d7cfd0;border-radius:12px;
    color:var(--muted);font-size:13px}
  .addcol button:hover{background:var(--panel);color:var(--ink)}

  /* ---------- card ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:11px 12px;position:relative}
  .card.drag{opacity:.4}
  .card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;
    border-radius:0 3px 3px 0;background:var(--c,transparent)}
  .card-top{display:flex;align-items:flex-start;gap:8px}
  .card.task .card-top{padding-bottom:7px;border-bottom:1px solid var(--line2)}
  .grip{cursor:grab;color:#c9c1c3;font-size:13px;line-height:1.2;padding-top:2px;user-select:none;
    opacity:.35;width:14px;flex:0 0 14px;text-align:center}
  .card:hover .grip{opacity:1}
  .card[draggable="true"]{cursor:default}
  .ck{appearance:none;width:16px;height:16px;flex:0 0 16px;margin-top:2px;border:1.5px solid #c6bcbe;
    border-radius:5px;cursor:pointer;background:var(--panel);position:relative}
  .ck:checked{background:var(--accent);border-color:var(--accent)}
  .ck:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .ctitle{flex:1;min-width:0;outline:none;font-size:14px;word-break:break-word;padding:1px 2px;border-radius:5px}
  .ctitle:focus{background:#fdfbfa;box-shadow:0 0 0 2px var(--accent-soft)}
  .card.done .ctitle{text-decoration:line-through;color:var(--muted)}
  .card.done .ctitle *{text-decoration:inherit}
  .menu{opacity:0;color:#b6aeb0;font-size:15px;line-height:1;padding:2px 4px;border-radius:6px}
  .card:hover .menu{opacity:1}
  .menu:hover{background:#f4f0ef;color:var(--ink)}
  /* memo body: 書き出しをタイトルと同じ位置に揃え、縦に広く取る */
  .body{color:#2a2426;font-size:13.5px;white-space:pre-wrap;outline:none;margin:7px 0 0 22px;
    padding:4px 5px;border-radius:7px;word-break:break-word;min-height:26px;line-height:1.7}
  .card.task .body{margin-left:24px}
  .card.note .body{min-height:112px}
  .body:hover{background:#fdfbfa}
  .body:focus{background:#fdfbfa;box-shadow:0 0 0 2px var(--accent-soft)}
  .body:empty::before{content:"メモを書く…";color:#c4bcbe}
  .body u{text-underline-offset:2px}
  /* 箇条書き・チェックリスト・引用 */
  .body ul,.body ol{margin:4px 0;padding-left:1.35em}
  .body li{margin:1px 0}
  .body ul.ckl{list-style:none;padding-left:1.55em}
  .body ul.ckl > li{position:relative}
  .body ul.ckl > li::before{content:"";position:absolute;left:-1.5em;top:.45em;
    width:13px;height:13px;border:1.4px solid #c3b9bb;border-radius:4px;
    background:var(--panel);cursor:pointer}
  .body ul.ckl > li.dn::before{content:"✓";border-color:var(--brown);background:var(--brown);
    color:#fff;font-size:9.5px;line-height:13px;text-align:center;font-family:var(--fdisp)}
  .body ul.ckl > li.dn{color:#a49b9d;text-decoration:line-through;text-decoration-color:#d6cccd}
  .body blockquote{margin:6px 0;padding:2px 0 2px 12px;border-left:2.5px solid #ddd0d2;
    color:#5e5658}
  /* Memo 下の書式ボタン */
  .fmtb{font-size:11.5px;color:var(--muted);padding:4px 9px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);display:inline-flex;
    align-items:center;gap:5px;font-family:var(--fdisp)}
  .fmtb:hover{border-color:var(--brown);color:var(--brown)}
  .fmtwrap{display:inline-flex;gap:4px}
  /* Cards / Quotes / Read Log ページは全体を游明朝で */
  #view.serifpage,#view.serifpage *{font-family:var(--fserif)}
  .fmtico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.35;
    stroke-linecap:round;stroke-linejoin:round}
  /* memo / message log セクション */
  .sec{margin:9px 0 0 24px;border-top:1px solid var(--line2);padding-top:7px}
  .card.note .sec,.card.heading .sec{margin-left:22px}
  .sec-h{display:flex;align-items:center;gap:6px;color:#6e6668}
  .fold{width:16px;flex:0 0 16px;font-size:9px;color:#b3aea4;transition:transform .12s;padding:0}
  .fold.open{transform:rotate(90deg)}
  .sec-ico{font-size:11.5px}
  .sec-t{flex:1;min-width:0;font-size:12.5px;font-weight:700;letter-spacing:.03em;outline:none;
    padding:1px 4px;border-radius:5px;word-break:break-word}
  .sec-t:focus{background:#fdfbfa;box-shadow:0 0 0 2px var(--accent-soft)}
  .sec-t:empty::before{content:attr(data-ph);color:#c4bcbe;font-weight:400}
  .sec-lb{font-size:12.5px;letter-spacing:.06em;color:#6b6264;font-weight:600;flex:0 0 auto;
    display:inline-flex;align-items:center;gap:5px}
  .lbico{width:13.5px;height:13.5px;fill:none;stroke:currentColor;stroke-width:1.3;
    stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;opacity:.85}
  .sec.bare{border-top:0;padding-top:0;margin-top:2px}
  .sec.noti .sec-h{margin-bottom:-4px}
  .card .sec.noti .body{margin-top:0}
  .meta.meta-b{margin-top:9px}
  .cdates{font-size:9.5px;color:#b6aeb0;margin:7px 0 0 22px;letter-spacing:.04em;
    font-family:"SFMono-Regular",Consolas,monospace;cursor:pointer;display:inline-block;
    padding:1px 4px;border-radius:5px}
  .cdates:hover{background:#f4f0ef;color:#6e6668}
  .card.note .meta.meta-b,.card.quote .meta.meta-b{margin-left:22px}
  .card-top .cardtg{flex:0 0 auto}
  .sec-n{font-size:11px;color:var(--muted)}
  .sec-x{opacity:0;color:#c0b8ba;font-size:14px;padding:0 3px;border-radius:5px}
  .sec:hover .sec-x{opacity:1}
  .sec-x:hover{background:#f4f0ef;color:#c0392b}
  .card .sec .body{margin:5px 0 0 0;min-height:56px}
  .logs{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .log{border:1px solid var(--line);border-radius:9px;background:#fdfbfa;padding:7px 8px}
  .log-h{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .log-h input[type=date]{border:0;background:none;font-size:11.5px;color:#6e6668;outline:none;
    padding:1px 2px;border-radius:5px;width:auto}
  .log-h input[type=date]:hover,.log-h select:hover{background:#f4f0ef}
  .log-h select{border:0;background:none;font-size:11.5px;color:#4a4446;outline:none;
    padding:1px 3px;border-radius:5px;max-width:46%}
  .log-x{margin-left:auto;opacity:0;color:#c0b8ba;font-size:13px;padding:0 3px}
  .log:hover .log-x{opacity:1}
  .log-t{font-size:13px;line-height:1.7;white-space:pre-wrap;outline:none;padding:3px 4px;
    border-radius:6px;min-height:24px;word-break:break-word;color:#2a2426}
  .log-t:hover{background:#f6f4f0}
  .log-t:focus{background:var(--panel);box-shadow:0 0 0 2px var(--accent-soft)}
  .log-t:empty::before{content:"メッセージを貼り付け…";color:#c4bcbe}
  .logadd{font-size:12.5px;color:var(--muted);padding:3px 4px;border-radius:6px;margin-top:5px;text-align:left}
  .logadd:hover{color:var(--accent);background:var(--accent-soft)}
  /* Quote */
  .body[data-ph]:empty::before{content:attr(data-ph);color:#c4bcbe}
  .qbox{margin-top:7px;display:flex;flex-direction:column;padding:0 10px}
  .qbox > .body{margin:2px 0 0 0;padding:4px 5px}
  .qbox > .mtitle{padding:4px 5px}
  .qbox .qt{min-height:92px;border:0;border-radius:11px;padding:12px 14px 12px 15px;
    background:var(--quote-bg);margin:0 -4px 2px -10px;font-size:14.5px;line-height:1.95}
  .qbox .qt:hover{filter:brightness(.985)}
  .qbox .qt:focus{box-shadow:0 0 0 2px #e2ded4}
  .qbox label{font-size:11px;color:var(--muted);margin:9px 0 3px;letter-spacing:.03em}
  .qbox input{border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:5px 4px;
    font-size:13px;outline:none;background:none;width:100%}
  .qbox input:hover{background:#fdfbfa}
  .qbox input:focus{border-bottom-color:var(--accent);background:#fdfbfa}
  .qbox .qm{min-height:58px;border:0;border-top:1px dashed #ded4d2;border-radius:0;
    padding:8px 4px;background:none;margin:0;font-size:13px}
  .qbox .qm:hover{background:#fdfbfa}
  /* 登録済み Quote カード */
  .qcard{background:none;border:0;border-radius:0;box-shadow:none;padding:2px 10px 6px;margin-top:6px}
  .ndate{font-weight:400;cursor:pointer;border-radius:5px;padding:1px 3px}
  .ndate:hover{background:#f4f0ef;color:var(--ink)}
  .qc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:11.5px;letter-spacing:.12em;color:#a7a0a2;
    font-family:"SFMono-Regular",Consolas,"Courier New",monospace}
  .qc-act{display:flex;gap:9px;align-items:center;flex:0 0 auto}
  .qc-act button{color:#b0a7a9;font-size:13px;padding:2px 5px;border-radius:6px;line-height:1}
  .qc-act button:hover{background:#f3efee;color:var(--ink)}
  .stamp{border:1px solid #bd7b7f;color:#bd7b7f;border-radius:6px;font-size:11px;
    padding:3px 5px;line-height:1;display:inline-block;transform:rotate(-5deg);
    font-family:"Yu Mincho",serif}
  .qc-body{border-top:1px dashed #ded4d2;margin-top:8px;padding-top:14px;
    font-size:14.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
  /* 背景だけ外へ広げ、文字の開始位置は下の Memo と揃える */
  .qc-body.qbg{background:var(--quote-bg);border:0;border-radius:11px;
    margin:10px -4px 0 -10px;padding:13px 14px 13px 10px}

  .mtitle:focus{background:#fdfbfa;box-shadow:0 0 0 2px var(--accent-soft)}

  .rflags{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}

    display:inline-block;position:relative;background:var(--panel)}
  .rflag:hover i{border-color:var(--brown)}
  .rflag.on{color:var(--brown);font-weight:700}
  .rflag.on i{background:var(--brown);border-color:var(--brown)}
  .rflag.on i::after{content:"";position:absolute;left:4.6px;top:1.4px;width:3.6px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  /* 再読は四角のチェックボックスで、間をあけてワイン色に */
  .rflag.sq{margin-left:auto;padding-right:6px}
  .rflag.sq i{border-radius:4px}
  .rflag.sq:hover i{border-color:#8c3a52}
  .rflag.sq.on{color:#8c3a52}
  .rflag.sq.on i{background:#8c3a52;border-color:#8c3a52}
  .qbox select{border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:5px 4px;
    font-size:13px;outline:none;background:none;width:100%;color:#5f585a}
  .qbox select:focus{border-bottom-color:var(--accent);background:#fdfbfa}
  .card.read{background:#fbfaf9;border-color:#eae5e4}
  .card.read .sec{margin-left:22px;border-top:0;padding-top:2px}
  .qc-ttl:empty::before,.mtitle:empty::before{content:attr(data-ph);color:#c4bcbe;font-weight:400}
  .qfoot{display:flex;align-items:center;gap:10px;margin-top:9px}
  .qfoot .qreg{margin-top:0}
  .imgadd{font-size:11.5px;color:var(--muted);padding:4px 10px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel)}
  .imgadd:hover{border-color:var(--brown);color:var(--brown)}
  .qfoot .qreg{margin-left:auto}
  .qreg{margin-top:9px;align-self:flex-end;font-size:12.5px;padding:5px 18px;border-radius:9px;
    border:1px solid var(--brown);color:var(--brown);background:var(--panel);letter-spacing:.06em}
  .qreg:hover{background:var(--brown);color:#fff}
  .cardtg{font-size:10.5px;padding:0 9px;height:20px;border-radius:20px;background:#f4f0ef;
    color:#a7a0a2;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .cardtg:hover{background:#eae5e4;color:#8b8285}
  .cardtg{border:1.5px solid transparent}
  .cardtg.on{background:none;color:#b06a80;font-weight:600;border-color:#b06a80}
  .cardtg.on:hover{background:#fbf2f4;color:#a05a72;border-color:#a05a72}
  .cdico{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round;flex:0 0 12px}
  /* Cards（ランダム表示） */
  .deck{max-width:640px;margin:10px auto 40px}
  .dcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:34px 34px 28px;
    box-shadow:0 2px 4px rgba(30,25,15,.05),0 14px 34px rgba(30,25,15,.09)}
  /* うしろにもう一枚重なっているように */
  .dcard::before,.dcard::after{content:"";position:absolute;inset:0;z-index:-1;
    border:0;border-radius:16px;filter:blur(.4px)}
  .dcard::before{background:#f8f4ee;
    transform:rotate(1.6deg) translate(4px,4px);
    box-shadow:0 6px 16px rgba(30,25,15,.06)}
  .dcard::after{background:#faf6f0;
    transform:rotate(-2.2deg) translate(-6px,8px);
    box-shadow:0 8px 20px rgba(30,25,15,.07)}
  .dcard .kind{font-size:10.5px;letter-spacing:.1em;color:#a7a0a2;font-weight:700;margin-bottom:14px}
  .dcard .qt{font-size:17px;line-height:2.1;white-space:pre-wrap;word-break:break-word}
  .dcard .ttl{font-size:16px;font-weight:600;margin-bottom:10px;line-height:1.6}
  .dcard .qcard{padding:0}
  .dcard .qc-body{font-size:15px;line-height:1.95}
  .dcard .at{margin-top:18px;font-size:12.5px;color:#6e6668;text-align:right}
  .dcard .mm{margin-top:16px;padding-top:13px;border-top:1px solid var(--line2);
    font-size:13px;color:#5f585a;white-space:pre-wrap;line-height:1.85}
  .dsrc{margin-top:14px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;
    align-items:center;justify-content:center}
  .dcard-h{display:flex;justify-content:flex-end;margin:-14px -14px 4px 0}
  .dsrc b{cursor:pointer}
  .dsrc b:hover{text-decoration:underline}
  .dbtn{margin-top:20px;display:flex;gap:10px;justify-content:center;align-items:center}
  .dbtn .btn{padding:9px 22px;border-radius:10px;letter-spacing:.06em;
    font-family:var(--fdisp);font-size:12.5px}
  /* 時間計測 */
  .chip.timer{cursor:pointer;background:#f4eefb;color:#7b52c0;padding:0 9px;font-size:10px}
  .tmico{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
  .chip.tot .tmico{opacity:.7}
  .chip.timer:hover{background:#ece0f7}
  .chip.timer.on{background:#fdeeee;color:#c0392b;font-weight:700;font-size:11px}
  .chip.tot{cursor:pointer}
  .chip.done{background:#eef6ee;color:#3f8046;cursor:pointer}
  .times{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .tlog{display:flex;align-items:center;gap:5px;font-size:12px;color:#5f585a;
    border:1px solid var(--line);border-radius:8px;background:#fdfbfa;padding:4px 7px}
  .tlog input{border:0;background:none;outline:none;font-size:12px;color:#5f585a;
    padding:1px 2px;border-radius:5px;width:auto;font-family:inherit}
  .tlog input:hover{background:#f4f0ef}
  .tlog .dur{margin-left:auto;font-weight:700;color:#4a4446;white-space:nowrap}
  .tlog .x{opacity:0;color:#c0b8ba;padding:0 2px;font-size:13px}
  .tlog:hover .x{opacity:1}
  .tlog.run{background:#fff6f6;border-color:#f3d9d9}
  .day-h{display:flex;align-items:baseline;gap:10px;padding:0 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .day-h b{font-size:14px}
  .day-h span{font-size:11.5px;color:var(--muted)}
  .day-h .tot{margin-left:auto;font-size:12.5px;font-weight:700;color:#4a4446}
  .ttable{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}
  .trow{display:grid;grid-template-columns:var(--tc);
    align-items:center;gap:10px;padding:8px 12px;font-size:13px;border-top:1px solid var(--line2)}
  .trow.head span{position:relative}
  .trow.head span{padding-right:2px}
  .trow.head .rz{position:absolute;top:-8px;bottom:-8px;right:-9px;width:16px;cursor:col-resize;z-index:3}
  .trow.head .rz::after{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;
    border-radius:2px;background:#ddd4d5}
  .trow.head .rz:hover::after,.trow.head .rz.act::after{background:var(--brown);top:0;bottom:0}
  .ttable{overflow:visible}
  /* 円グラフ */
  .pie{display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:14px 18px;margin-bottom:16px}
  .pie h5{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
  .pie .lg{display:flex;flex-direction:column;gap:5px;font-size:12.5px;min-width:0}
  .pie .lg div{display:flex;align-items:center;gap:8px}
  .pie .lg i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
  .pie .lg b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:400}
  .pie .lg small{color:var(--muted);width:38px;text-align:right}
  .pie .nodata{color:var(--muted);font-size:13px}
  .bsum{display:inline-flex;align-items:center;gap:5px;margin-left:10px}
  .bsum i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .trow:first-child{border-top:0}
  .trow:hover{background:#fdfbfa}
  .trow.head{background:#f6f2f1;border-top:0;font-size:11px;color:var(--muted);
    letter-spacing:.06em;font-weight:700;padding:7px 12px}
  .trow .nm{min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .bd{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  .trow .tm{color:#5f585a;font-size:12.5px;font-variant-numeric:tabular-nums}
  .trow .d{font-weight:400;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  .trow .dt{font-size:12.5px;color:#5f585a;white-space:nowrap}
  .trow .x{opacity:0;color:#c0b8ba;padding:0 3px}
  .trow:hover .x{opacity:1}
  .trow.sub{background:#fbf8f7;font-size:12px;color:var(--muted)}
  .repbtn{font-size:13px;line-height:1;padding:3px 0;border-radius:7px;text-align:center;width:100%}
  .repbtn:hover{background:#f4f0ef}
  .repbtn.ok{color:#3f8046;font-weight:700}
  .repnone{color:#c9c1c3;text-align:center;font-size:12px}
  /* Time Log: カレンダー & グラフ */
  .tlrow{display:flex;gap:16px;align-items:stretch;margin-bottom:16px;flex-wrap:wrap}
  .cal{font-family:var(--fdisp);letter-spacing:.02em;background:#efeae2;border:1px solid #e3dbd3;border-radius:11px;padding:10px 12px 8px;width:250px;flex:0 0 250px}
  .cd.sun,.cal-w .sun{color:#c0504a}
  .cd.sat,.cal-w .sat{color:#4a72b8}
  .cd.sun:hover,.cd.sat:hover{background:#e5ded5}

  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .cal-h b{font-size:13px}
  .cal-h button{width:24px;height:24px;border-radius:6px;color:var(--muted);font-size:14px}
  .cal-h button:hover{background:#f4f0ef;color:var(--ink)}
  .cal-w{display:grid;grid-template-columns:repeat(7,1fr);font-size:10px;color:var(--muted);text-align:center;margin-bottom:2px}
  .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
  .cd{height:28px;border-radius:7px;font-size:12px;color:#5f585a;position:relative;
    display:flex;align-items:center;justify-content:center}
  .cd:hover{background:#e5ded5}
  .cd.out{visibility:hidden}
  .cd.tdy{font-weight:700;color:var(--accent);background:#e2d9cd}
  .cd.tdy.sun{color:#c0504a}
  .cd.tdy.sat{color:#4a72b8}
  .cd.tdy:hover{background:#dbd0c2}
  .cd.sel{background:#dcd2c6;color:#3c3638;font-weight:700;border-radius:7px}
  .cd.sel:hover{background:#d3c8ba}
  .cd.sel.sun{color:#c0504a}
  .cd.sel.sat{color:#4a72b8}
  .cd i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:#7b52c0}
  .cd.sel i{background:var(--brown)}
  .cal-f{display:flex;gap:6px;margin-top:7px;border-top:1px solid var(--line2);padding-top:7px}
  .cal-f button{font-size:11.5px;color:var(--muted);padding:3px 8px;border-radius:7px;border:1px solid var(--line)}
  .cal-f button:hover{background:#f5f1f0;color:var(--ink)}
  .cal-f button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:14px 16px 6px;margin-bottom:16px;overflow-x:auto}
  .chartbox h5{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
  .chartbox g[data-barday]:hover rect{opacity:.82}
  /* Daily Memo */
  .dailywrap{display:flex;gap:20px;align-items:flex-start}
  .dailyside{flex:0 0 320px;width:320px}
  .dailyside .cal{width:auto;flex:1 1 auto;border:1px solid var(--line);border-radius:11px;
    padding:12px 14px 10px}
  .dailyside .cd{height:36px;font-size:13px}
  .dailyside .cal-w{font-size:11px}
  .dailyside .cal-h b{font-size:14px}
  /* Daily ページ：今日は丸く、くすんだピンクの背景 */

    width:36px;justify-self:center}
  .dailyside .cd.tdy.sun,.readrow .cd.tdy.sun{color:#8c3a44}
  .dailyside .cd.tdy.sat,.readrow .cd.tdy.sat{color:#2f4d80}
  .dailyside .cd.tdy:hover,.readrow .cd.tdy:hover{background:#cda3b1}
  /* Read Log は Daily Memo と同じ幅に */

  .readrow .cd{height:36px;font-size:13px}
  .readrow .cal-w{font-size:11px}
  .readrow .cal-h b{font-size:14px}
  .rdmain{flex:1;min-width:0;max-width:820px}

    font-family:var(--fdisp)}

  .dl-item:hover{background:#fdfbfa}
  .dl-item.on{background:var(--accent-soft)}
  .dl-item b{display:block;font-size:11.5px;color:#5f585a;font-weight:600;
    font-variant-numeric:tabular-nums;margin-bottom:2px}
  .dl-item b span{color:var(--muted);font-weight:400;margin-left:3px}
  .dl-p{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .dl-empty{font-size:11.5px;color:var(--muted);padding:8px 9px}
  .dailymain{flex:1;min-width:0;max-width:820px;background:var(--panel);border:1px solid var(--line);

  .daily-h{display:flex;align-items:baseline;gap:10px;padding-bottom:12px;
    border-bottom:1px dashed #ded4d2;margin-bottom:14px;font-family:var(--fdisp)}
  .daily-h b{font-size:19px;font-weight:600;color:var(--brown);letter-spacing:.06em}
  .daily-h span{font-size:12px;color:var(--muted)}
  .dl-today{background:var(--accent-soft);color:var(--accent);border-radius:20px;
    padding:2px 9px;font-size:10.5px;font-weight:700}
  /* 天気（複数選択可） */
  .wx{display:flex;align-items:center;gap:2px;margin-left:4px}
  .wx button{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;
    justify-content:center;color:#bdb4b6;padding:0}
  .wx button:hover{background:#efe9e7;color:#8b8285}
  .wx button.on{background:#fbf4ea;color:#b98a3c}
  .wx button.on.wx-rain,.wx button.on.wx-snow{color:#5b86c9;background:#eef3fb}
  .wx button.on.wx-cloud,.wx button.on.wx-wind{color:#7e8892;background:#f0f2f4}
  .wxico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.35;
    stroke-linecap:round;stroke-linejoin:round}
  .dailybody{margin:0;padding:2px;min-height:87px;font-size:14.5px;line-height:2;background:none;color:#2a2426}
  .dailycards{margin-top:16px;border-top:1px dashed #ded4d2;padding-top:14px}
  /* All（タイムライン） */
  .dayblock{padding:0 0 20px;margin-bottom:20px;border-bottom:1px dashed #e6dcda}
  .dayblock:last-child{border-bottom:0}
  .db-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:var(--fdisp)}
  .db-h b{font-size:15px;font-weight:600;color:var(--brown);letter-spacing:.05em}
  .db-h span{font-size:11.5px;color:var(--muted)}
  .db-open{margin-left:auto;padding:3px 10px;font-size:11.5px}

  .dayblock .dailycards{margin-top:10px;border-top:0;padding-top:0}
  .dailycards .drop{display:flex;flex-direction:column;gap:10px}
  .dailycards .card{max-width:100%}
  .dailycards .add{margin-top:10px}
  .dailybody:hover{background:none}
  .dailybody:focus{background:none;box-shadow:none}
  /* 本文中の画像と URL カード */

    max-width:100%;height:auto;border-radius:8px;display:block;margin:7px 0;cursor:pointer}
  .body img:hover,.dailybody img:hover{outline:2px solid #e8ded3;outline-offset:2px}
  #imgHandle{display:none;position:fixed;width:16px;height:16px;border-radius:4px;
    background:var(--panel);border:1.5px solid var(--brown);cursor:nwse-resize;z-index:70;
    box-shadow:0 1px 4px rgba(0,0,0,.18)}
  #imgHandle::after{content:"";position:absolute;left:3px;top:3px;width:8px;height:8px;
    border-right:2px solid var(--brown);border-bottom:2px solid var(--brown);opacity:.7}
  .ulink{display:inline-flex;align-items:center;gap:9px;max-width:100%;margin:5px 0;

  .uinfo{display:flex;flex-direction:column;min-width:0;line-height:1.35}
  .uinfo b{font-size:12px;color:#4e4749}
  .uinfo small{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px}
  /* カードのリンク */
  .linkbox{margin:11px 0 0 24px;border-top:1px dashed #ded4d2;padding-top:9px}
  .card.note .linkbox,.card.quote .linkbox,.card.read .linkbox,.card.heading .linkbox{margin-left:22px}
  .lk-h{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.12em;color:#a7a0a2;
    font-weight:700;margin:2px 0 6px;font-family:var(--fdisp)}

  .lk-h .mico{width:11px;height:11px}
  .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:8px}
  .lcard{border:1px solid var(--line);border-left:3px solid #cdc1c3;border-radius:9px;

  .lc-h{display:flex;align-items:center;gap:6px;margin-bottom:3px}

  .lc-kind.quote{color:#7b52c0;border-color:#e2d6f2}
  .lc-kind.read{color:#4f8f57;border-color:#d6e6d8}
  .lc-kind.task{color:#3d6fe0;border-color:#d8e2f8}

  .lc-t{font-size:12px;font-weight:600;line-height:1.45;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lc-p{font-size:11px;line-height:1.6;color:#6e6668;margin-top:3px;white-space:pre-wrap;
    word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .lc-b{font-size:9.5px;color:#b0a7a9;margin-top:5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
  /* Search */
  .searchbox{max-width:760px;margin-bottom:20px}
  .bigsearch{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 13px;
    font-size:14.5px;background:var(--panel);outline:none;font-family:inherit;letter-spacing:.02em}
  .bigsearch:focus{border-color:var(--brown);box-shadow:0 0 0 3px #e8ded3}
  .shits{font-size:12px;color:var(--muted)}
  .sfilters{display:flex;align-items:center;gap:12px;margin:10px 2px 0;flex-wrap:wrap}
  .sgrp{margin-bottom:26px}
  .sgrp-h{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;
    font-family:var(--fdisp);border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:12px;
    max-width:760px}
  .sday{max-width:760px;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:11px 14px;margin-bottom:10px;cursor:pointer}
  .sday:hover{border-color:#cdc1c3;box-shadow:var(--shadow)}
  .sday b{display:block;font-size:12px;color:#5f585a;margin-bottom:4px;font-variant-numeric:tabular-nums}
  .sday span{font-size:13px;line-height:1.7;color:#4e4749}
  mark{background:#fdf0c9;color:inherit;border-radius:3px;padding:0 2px}
  /* Quote / Read の一覧 */
  .colwrap{display:flex;flex-direction:column;gap:14px;max-width:760px}
  .qrand{flex:0 0 450px;width:450px}
  .qrand h5{margin:0 0 8px;font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:700;
    font-family:var(--fdisp)}
  .qrand .dcard{padding:30px 28px 26px}
  .qrand .dcard .qt{font-size:14.5px!important;line-height:1.95!important}
  .qrand .dcard .at{font-size:12.5px;margin-top:18px}
  .qrand .dcard .mm{font-size:13.5px;margin-top:16px;padding-top:13px}
  .qrand .dsrc{font-size:11px}
  .qrand .dbtn .btn{padding:6px 14px;font-size:12px}
  .colwrap.gallery{display:block;max-width:none;columns:330px;column-gap:14px}
  .colwrap.gallery .colitem{break-inside:avoid;margin:0 0 14px;display:inline-block;width:100%}
  .colitem{padding:12px 14px 14px}
  .col-src{font-size:11px;color:var(--muted);display:flex;gap:6px;margin-bottom:4px;
    align-items:center;white-space:nowrap}
  .col-src > span:not([style]){overflow:hidden;text-overflow:ellipsis}
  .col-src span[data-goto]:hover{text-decoration:underline}
  .colitem .sec.bare{margin-left:0}
  /* Done Task テーブル */
  .trow > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dtable{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .dtable th{background:#f6f2f1;font-size:11px;color:var(--muted);letter-spacing:.06em;
    font-weight:700;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);
    position:relative}
  .dtable th .crz{position:absolute;top:0;bottom:0;right:-6px;width:12px;cursor:col-resize;z-index:3}
  .dtable th .crz::after{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:transparent}
  .dtable th .crz:hover::after,.dtable th .crz.act::after{background:var(--accent)}
  .dtable td{padding:9px 12px;font-size:13px;border-top:1px solid var(--line2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
  .dtable tbody tr:first-child td{border-top:0}
  .dtable tr.dr:hover td{background:#fdfbfa}
  .dtable tr.dr.op td{background:#fbf8f7}
  .dtable td.dt{color:#5f585a;font-variant-numeric:tabular-nums}
  .dtable td.bd{color:var(--muted)}
  .dtable td.dim{color:#8b8285}
  .dtable .sublead{color:#b0a7a9;margin-right:5px}
  .dtable td.act{text-align:right;overflow:visible}
  .openbtn{font-size:11.5px;padding:3px 13px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:#6e6668;letter-spacing:.04em}
  .openbtn:hover{border-color:var(--accent);color:var(--accent)}
  .openbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .dtable td.detail{padding:0;background:#fdfbfa;white-space:normal}
  .dwrap{padding:12px 16px 16px 34px}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .dck{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#5f585a;cursor:pointer}
  .dwrap .sec{margin-left:0}
  .dwrap .sec .body{margin-left:0}
  .dwrap .rsubs{margin:0 0 10px 0}
  .sum{display:flex;gap:16px;align-items:baseline;margin-bottom:16px;font-size:13px;color:#5f585a}
  .sum b{font-size:20px;color:var(--ink);font-weight:400}
  .daysum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:-8px 0 16px;
    font-size:12.5px;color:#5f585a}
  .ds-lb{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .ds-i{display:inline-flex;align-items:center;gap:6px;background:var(--panel);
    border:1px solid var(--line);border-radius:20px;padding:3px 11px}
  .ds-i i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .ds-i b{font-weight:400;color:var(--ink)}
  .card.note{background:#fffdfb;border-color:#efe4e2}
  .card.quote{background:#fbf9f8;border-color:#eae3e1}
  .card.quote .sec{margin-left:22px;border-top:0;padding-top:2px}
  .meta.meta2{margin-top:5px}
  .card.note .meta.meta2,.card.quote .meta.meta2{margin-left:22px}
  .card.note .body:hover,.card.note .body:focus{background:#fffaf8}
  .card.heading{background:none;border:0;box-shadow:none;padding:14px 4px 2px}
  .card.heading .ctitle{font-family:var(--fdisp);font-size:16px;font-weight:500;letter-spacing:.05em;
    color:#5f585a}

  /* subtasks */
  .subs{margin:8px 0 0 24px;display:flex;flex-direction:column;gap:3px;
    border:1px solid var(--line2);border-radius:9px;padding:7px 9px;background:#faf8f7}
  .sub{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:#2a2426}
  .sub .ck{width:14px;height:14px;flex-basis:14px;border-radius:4px;margin-top:2px}
  .sub .ck:checked::after{left:3.6px;top:.5px;width:3.5px;height:8px}
  .sub .t{color:#2a2426;flex:1;outline:none;padding:0 2px;border-radius:4px;word-break:break-word}
  .sub .t:focus{background:#fdfbfa}
  .sub.done .t,.sub.done .t *{text-decoration:line-through;color:var(--muted)}
  .sgrip{cursor:grab;color:#c9c1c3;font-size:11px;line-height:1.2;padding-top:3px;
    user-select:none;opacity:0;width:12px;flex:0 0 12px;text-align:center}
  .sub:hover .sgrip,.rsub:hover .sgrip{opacity:.6}
  .sgrip:hover{opacity:1!important}
  .subwrap.drag{opacity:.4}
  .subs.over,.rsubs.over{background:#00000008;outline:1px dashed #cdc1c3;outline-offset:-1px}
  .sub .x,.sub .submenu{opacity:0;color:#c0b8ba;font-size:13px;padding:0 3px;flex:0 0 auto}
  .sub:hover .x,.sub:hover .submenu{opacity:1}
  .sub .submenu:hover,.rsub .submenu:hover{color:var(--ink)}
  .rsub .submenu{opacity:0;color:#c0b8ba;font-size:13px;padding:0 3px;flex:0 0 auto}
  .rsub:hover .submenu{opacity:1}
  .subadd{margin:5px 0 0 24px;font-size:12.5px;color:var(--muted);padding:2px 3px;border-radius:6px;text-align:left}
  .subadd:hover{color:var(--accent);background:var(--accent-soft)}
  .subinput{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;outline:none;
    margin:4px 0 0 24px;width:calc(100% - 24px)}
  .subinput:focus{border-color:var(--accent)}

  /* タスクの見出し */
  .thead{font-family:var(--fdisp);font-size:13.5px;font-weight:500;color:#2a2426;line-height:1.85;letter-spacing:.03em;
    padding:3px 5px;margin:0 0 4px 24px;border-radius:7px;outline:none;word-break:break-word}
  .thead:hover{background:#fdfaf2}
  .thead:focus{background:#fdfaf2;box-shadow:0 0 0 2px var(--accent-soft)}
  .thead:empty::before{content:attr(data-ph);color:#c4bcbe;font-weight:400}
  .row-head{margin-left:0}
  .subwrap{display:flex;flex-direction:column}
  .sub-head{margin:3px 0 2px 0;font-size:13px}

  .sub-note{margin:1px 0 3px 21px;font-size:12px}


  /* タスクの説明・注意事項 */
  .tnote{margin:5px 0 0 24px;padding:3px 5px;border-radius:7px;font-size:12.5px;line-height:1.85;
    color:#5f585a;white-space:pre-wrap;word-break:break-word;outline:none;min-height:0}
  .tnote:hover{background:#fdfaf2}
  .tnote:focus{background:#fdfaf2;box-shadow:0 0 0 2px var(--accent-soft)}
  .tnote:empty::before{content:attr(data-ph);color:#c4bcbe}
  .row-note{margin-left:0;margin-top:4px}

  .meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 24px;align-items:center}
  .card.note .meta,.card.heading .meta{margin-left:22px}
  .chip{font-size:11px;padding:0 8px;height:20px;min-height:20px;max-height:20px;line-height:1;
    border-radius:20px;background:#f4f0ef;color:#6b655c;display:inline-flex;align-items:center;
    white-space:nowrap;box-sizing:border-box;flex:0 0 auto;align-self:center;overflow:hidden}
  .chip.due,.chip.start,.chip.rep,.chip.prog{background:#f4f0ef;color:#6b655c}
  .chip.due.over{background:#fdeeee;color:#c0392b}
  .chip.left{background:#f5f1f0;color:#8b8285;font-size:10.5px}
  .chip.left.over{background:#fdeeee;color:#c0392b;font-weight:700}
  .chip.sdate{background:#eef3ee;color:#4f8f57;cursor:pointer;font-size:10px;flex:0 0 auto}
  .chip.sdate:hover{filter:brightness(.95)}
  .chip.tag{cursor:pointer}
  .chip.tag:hover{filter:brightness(.96)}
  .chip.when{cursor:pointer;font-weight:700}
  .chip.when:hover{filter:brightness(.96)}
  .chip.when.none{font-weight:400;background:#f5f1f0;color:#b0aba2}
  .card.pending{opacity:.62}
  .add{width:100%;padding:9px;border:1px dashed #dbd3d4;border-radius:11px;color:var(--muted);font-size:13px}
  .add:hover{background:var(--panel);color:var(--ink);border-color:#c8bec0}

  /* ---------- popover ---------- */
  .pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    box-shadow:0 10px 32px rgba(30,25,15,.16);padding:5px;min-width:172px}
  .pop button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    padding:7px 10px;border-radius:7px;font-size:13px}
  .pop button:hover{background:#f5f1f0}
  .pop .ic{width:17px;flex:0 0 17px;display:inline-flex;align-items:center;justify-content:center;
    font-style:normal;font-size:12.5px;line-height:1;color:#8b8285}
  .pop button:hover .ic{color:inherit}
  .pop hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
  .swatches{display:flex;gap:6px;padding:6px 10px 8px}
  .sw{width:19px;height:19px;border-radius:50%;border:1px solid rgba(0,0,0,.08);flex:0 0 19px}
  .sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
  /* カラー凡例（カテゴリ） */
  .cats{padding:2px}
  .cat{display:flex;align-items:center;gap:9px;width:100%;padding:6px 9px;border-radius:7px;font-size:13px}
  .cat:hover{background:#f5f1f0}
  .cat.on{background:var(--accent-soft);font-weight:700}
  .cat .tick{margin-left:auto;color:var(--accent);font-size:11px}
  .chip.cat2{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .chip.cat2 i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .chip.cat2.ghost,.chip.tag.ghost{background:#f4f0ef;color:#a7a0a2;transition:opacity .1s;
    padding:0 8px;height:20px}
  /* Status は最初から表示、Tag はカーソルを合わせたときだけ */
  .chip.tag.ghost{opacity:0}
  .card:hover .chip.tag.ghost,.rwrap:hover .chip.tag.ghost{opacity:1}
  .chip.cat2.ghost:hover,.chip.tag.ghost:hover{background:var(--accent-soft);color:var(--accent)}
  /* ボードの色 */
  .bdot{width:11px;height:11px;border-radius:3.5px;border:1px solid rgba(0,0,0,.1);
    flex:0 0 11px;cursor:pointer;background:#cdb4bb}
  .btn.dot{display:flex;align-items:center;gap:7px}
  .grp-h .bdot{width:9px;height:9px;border-radius:3px}
  .legend{display:flex;flex-wrap:wrap;gap:4px 8px;padding:2px 8px 6px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:#6b655c}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  /* date / repeat panel */
  .dpanel{padding:8px 10px 10px;width:286px}
  .dpanel h4{margin:0 0 8px;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
  .drow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .drow label{font-size:12.5px;color:#6e6668;width:52px;flex:0 0 52px}

    flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12.5px;
    background:var(--panel);outline:none}
  .drow input:focus,.drow select:focus{border-color:var(--accent)}
  .drow input[type=number]{flex:0 0 54px}
  .allday{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#6e6668;
    margin:0 0 8px 60px;cursor:pointer;user-select:none}
  .allday input{width:14px;height:14px;accent-color:var(--brown);cursor:pointer}
  .drow input[type=password]{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel);font-size:17px;letter-spacing:.35em;
    text-align:center;outline:none;color:var(--ink)}
  .drow input[type=password]:focus{border-color:var(--brown);box-shadow:0 0 0 2px #ece4da}
  .drow input[type=time]{flex:0 0 92px;padding:5px 6px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel);font-size:12.5px}
  .drow input[type=time]:focus{border-color:var(--accent);outline:none}
  .quick{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 9px 60px}
  .quick button{font-size:11.5px;padding:3px 8px;border-radius:6px;background:#f4f0ef;color:#6e6668;width:auto}
  .quick button:hover{background:var(--accent-soft);color:var(--accent)}
  .wdays{display:flex;gap:4px;margin:0 0 8px 60px}
  .wdays button{width:26px;height:26px;padding:0;border-radius:50%;font-size:11.5px;
    background:#f4f0ef;color:#6e6668;display:flex;align-items:center;justify-content:center}
  .wdays button.on{background:var(--accent);color:#fff}
  .wdays button.sun{color:#c0392b}.wdays button.sat{color:#3d6fe0}
  .wdays button.on.sun,.wdays button.on.sat{color:#fff}
  .hint{font-size:11.5px;color:var(--muted);margin:0 0 8px 60px;line-height:1.5}
  .dfoot{display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--line2);padding-top:8px;margin-top:2px}
  .dfoot button{font-size:12px;padding:4px 9px;border-radius:7px;color:var(--muted);width:auto}
  .dfoot button:hover{background:#f5f1f0;color:var(--ink)}
  /* tag panel */
  .tpanel{padding:9px 10px;width:222px}
  .tlist{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .tlist .chip{display:flex;align-items:center;gap:5px}
  .tlist .chip b{cursor:pointer;color:#9aa2ae;font-weight:400}
  .tinput{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;outline:none}
  .tinput:focus{border-color:var(--accent)}
  .tsug{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .pop .tsug button{font-size:11.5px;padding:0 9px;height:21px;line-height:1;border-radius:20px;
    background:#f4f0ef;color:#6b655c;width:auto;display:inline-flex;align-items:center}
  .pop .tsug button:hover{filter:brightness(.95)}
  .tlist .chip{height:22px;gap:6px}
  .tlist .dot{width:11px;height:11px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.12);flex:0 0 11px}
  .tswatch{display:flex;gap:6px;flex-wrap:wrap;padding:6px 2px 8px;border-top:1px solid var(--line2);margin-top:4px}
  .tswatch .sw{width:17px;height:17px;flex:0 0 17px}

  /* ---------- rich text toolbar ---------- */
  .rtbar{position:fixed;z-index:90;display:none;gap:2px;background:#2f2c28;border-radius:9px;
    padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.24);align-items:center}
  .rtbar button{color:#fff;font-size:13px;width:28px;height:26px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;padding:0}
  .rtbar button:hover{background:#4b463f}
  .rtbar .sep{width:1px;height:18px;background:#4b463f;margin:0 3px}
  .rtbar .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
  .rtbar button.w{width:auto;padding:0 8px;font-size:12px}
  /* 文字サイズ（選択範囲に適用） */
  .fs-s{font-size:12px}
  .fs-n{font-size:14.5px}
  .fs-l{font-size:19px;line-height:1.5}

  /* ---------- task page ---------- */
  .tools{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .search{border:1px solid var(--line);border-radius:9px;padding:7px 11px;width:240px;
    background:var(--panel);outline:none;font-size:13px}
  .search:focus{border-color:var(--brown);box-shadow:0 0 0 2px #ece4da}
  .clsel{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel);
    outline:none;font-size:13px;color:var(--ink);max-width:190px}
  .clsel:focus{border-color:var(--brown);box-shadow:0 0 0 2px #ece4da}
  .clsel.on{border-color:var(--brown);background:#fbf6ef}
  .seg{display:flex;background:#eae5e4;border-radius:9px;padding:2px}
  .seg button{padding:5px 12px;border-radius:7px;font-size:12.5px;color:#6e6668}
  .seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
  .grp{margin-bottom:26px}
  .gsel{display:flex;align-items:center;gap:6px}
  .gsel label{font-size:11.5px;color:var(--muted)}
  .gsel select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;
    background:var(--panel);outline:none;color:#5f585a}
  .gsel select:focus{border-color:var(--brown)}
  .gdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
  .grp-h{display:flex;align-items:baseline;gap:9px;padding:0 0 9px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .grp-h b{font-size:14px;font-weight:600}
  .grp-h span{font-size:11.5px;color:var(--muted)}
  .rwrap{border:1px solid var(--line);border-radius:11px;background:var(--panel);
    margin-bottom:8px;box-shadow:0 1px 1px rgba(30,25,15,.03)}
  .rwrap:hover{border-color:#dcd8d0;box-shadow:var(--shadow)}
  .row{display:flex;align-items:flex-start;gap:9px;padding:10px 12px}
  .row .tw{flex:1;min-width:0}
  .row .bdline{font-size:11px;display:flex;gap:5px;margin-bottom:2px;cursor:pointer;
    color:var(--muted);letter-spacing:.02em}
  .row .bdline:hover{text-decoration:underline}
  .row .tline{display:flex;align-items:flex-start;gap:9px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
  .row .tline .ck{margin-top:3px}
  .row .tt{color:#1f1a1c;font-size:14px;word-break:break-word;flex:0 1 auto;min-width:0}
  .row .bdrow{display:flex;align-items:center;gap:16px;margin-bottom:2px}
  .row .bdrow .bdline{margin-bottom:0}

<script>
(() => {
/* このファイルの役割：'note'（メモ用）／'task'（Task用） */
const APP = 'note';
const KEY = APP === 'task' ? 'boards.tasks.task.v1' : 'boards.tasks.v1';
const APP_TITLE = APP === 'task' ? 'Tasks' : 'Notes';
/* Task 用は初回だけ、これまでのデータを引き継ぐ */
if(APP === 'task' && !localStorage.getItem(KEY)){
  try{
    const old = localStorage.getItem('boards.tasks.v1');
    if(old) localStorage.setItem(KEY, old);
  }catch(e){ console.warn('copy failed', e); }
}
/* 左端のカラー = 種類の注釈 */
const CATS_DEF = [
  ['#3d6fe0', '作業'],
  ['#c9899a', '連絡'],          // くすんだピンク
  ['#e8973a', '待ち'],
  ['#e5c33c', '契約・支払い'],
  ['#9161d6', '約束・予約'],
  ['#8fb84a', 'プライベート'],  // 黄緑
];
/* Status は編集できる（S.cats に保存） */
const catList = () => (S.cats ||= CATS_DEF.map(([c, n]) => ({c, n})));
const CATS = () => [['', 'なし'], ...catList().map(x => [x.c, x.n])];
/* いつやるか */
const WHENS = [
  ['',      'いつやる？',     '#a7a0a2'],
  ['now',   '今日必ず',       '#c0392b'],
  ['maybe', '今日できれば',   '#4f8f57'],
  ['later', '明日以降でよい', '#8b8285'],
];
const whenOf = v => WHENS.find(x => x[0] === (v || '')) || WHENS[0];
const whenChip = k => {
  const [v, n, c] = whenOf(k.when);
  return `<span class="chip when ${v?'':'none'}" data-when="${k.id}" title="いつやるか"
    ${v ? `style="background:${c};color:#fff"` : ''}>${n}</span>`;
};

/* 日付ボタン（未設定なら「Date」と薄いグレーで出す） */
const dateChip = k => (k.start || k.due || (k.repeat && k.repeat.unit))
  ? '' : `<span class="chip when none" data-date="${k.id}" title="日付・繰り返しを設定">Date</span>`;

const catName = c => (CATS().find(x => x[0] === c) || ['', ''])[1];
/* Status チップ（クリックで変更） */
const catChip = k => k.color && catName(k.color)
  ? `<span class="chip cat2" data-status="${k.id}" title="Status を変更"
      style="background:${k.color}1f;color:${k.color}"><i style="background:${k.color}"></i>${catName(k.color)}</span>`
  : `<span class="chip cat2 ghost" data-status="${k.id}" title="Status を設定">＋ Status</span>`;
/* タグの色（タグ名ごとに保存） */
const TAGC = ['#5b6577', '#c0392b', '#d98324', '#c9a227', '#4f8f57', '#3d6fe0', '#7b52c0', '#c9899a'];
const tagColor = t => (S.tagColors && S.tagColors[t]) || '#5b6577';
const tagChip = (t, cid) => {
  const c = tagColor(t);
  return `<span class="chip tag" data-tagedit="${cid}" title="Tag を編集"
    style="background:${c}1a;color:${c}">#${esc(t)}</span>`;
};
const tagChips = k => `${(k.tags || []).map(t => tagChip(t, k.id)).join('')}
  ${(k.tags || []).length ? '' : `<span class="chip tag ghost" data-tagedit="${k.id}" title="Tag を追加">＋ Tag</span>`}`;
/* ボード名の色 */
const BOARDC = ['', '#c0392b', '#e08a2a', '#c9a227', '#84a05a', '#1ca5b8', '#6f9ad8',
  '#24407a', '#7b52c0', '#c9899a', '#8b8285'];
/* 最初に用意しておくボード */
const PRESET_BOARDS = [
  ['CSYS', '#1ca5b8'], ['Blue', '#6f9ad8'], ['LG', '#e08a2a'],
  ['Axxis', '#24407a'], ['IRO', '#c9899a'], ['CVTH', '#c9a227'],
];
/* Time Log で報告が必要なボード */
const REPORT_BOARDS = ['CSYS', 'LG', 'IRO'];
const needsReport = b => REPORT_BOARDS.includes((b.name || '').trim());
const TEXTC = [['既定','#2b2426'],['赤','#c0392b'],['橙','#c47f1a'],['緑','#3f8046'],['青','#3d6fe0'],['紫','#7b52c0'],['灰','#8b8285']];
const WD = ['日','月','火','水','木','金','土'];
const PINSMALL = '<svg class="pinico" viewBox="0 0 16 16"><path d="M9.6 1.9l4.5 4.5-1.6.5-1 1-.4 3.1-4.7-4.7 3.1-.4 1-1z"/><path d="M6.4 6.3L2.2 13.8l7.5-4.2"/></svg>';
const FICON = '<svg class="fico" viewBox="0 0 16 16"><path d="M1.7 12.8V3.7h4.1l1.4 1.7h7.1v7.4z"/></svg>';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- state ---------------- */
let S, view = {type:'board', id:null}, filter = 'today', q = '', folded = {}, tagFilter = '';

/* ---------------- dates & repeat ---------------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => iso(new Date());
function todayPlus(n){ const d = new Date(); d.setDate(d.getDate()+n); return iso(d); }
const parse = s => new Date(s + 'T00:00:00');
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return iso(d); }
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const weekStart = d => { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); x.setHours(0,0,0,0); return x; };

const REPEATS = [['','なし'],['day','日ごと'],['weekday','平日（月〜金）'],['week','週ごと'],['month','か月ごと'],['eom','月最終日'],['year','年ごと']];
function repLabel(r){
  if(!r || !r.unit) return '';
  const n = r.n || 1;
  if(r.unit === 'weekday') return '平日毎日';
  if(r.unit === 'eom') return n === 1 ? '毎月末' : `${n}か月ごとの月末`;
  if(r.unit === 'week'){
    const days = (r.days || []).slice().sort();
    const head = n === 1 ? '毎週' : `${n}週ごと`;
    return days.length ? `${head} ${days.map(i => WD[i]).join('・')}` : head;
  }
  if(n === 1) return {day:'毎日', month:'毎月', year:'毎年'}[r.unit];
  return {day:`${n}日ごと`, month:`${n}か月ごと`, year:`${n}年ごと`}[r.unit];
}
function nextDate(d, r){
  const n = Math.max(1, r.n || 1), dt = parse(d);
  if(r.unit === 'week' && (r.days || []).length){
    const set = new Set(r.days), base = weekStart(parse(d));
    for(let i = 0; i < 800; i++){
      dt.setDate(dt.getDate() + 1);
      if(!set.has(dt.getDay())) continue;
      if(n === 1) return iso(dt);
      const wk = Math.round((weekStart(dt) - base) / 604800000);
      if(wk % n === 0) return iso(dt);
    }
    return iso(dt);
  }
  if(r.unit === 'eom'){                       // 月の最終日
    dt.setDate(1);
    dt.setMonth(dt.getMonth() + n + 1);
    dt.setDate(0);                            // 前月の末日 ＝ n か月後の月末
    return iso(dt);
  }
  if(r.unit === 'day') dt.setDate(dt.getDate() + n);
  else if(r.unit === 'week') dt.setDate(dt.getDate() + 7 * n);
  else if(r.unit === 'month' || r.unit === 'year'){
    const day = dt.getDate();
    dt.setDate(1);
    if(r.unit === 'month') dt.setMonth(dt.getMonth() + n); else dt.setFullYear(dt.getFullYear() + n);
    const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate(); // 月末で丸める
    dt.setDate(Math.min(day, last));
  }
  else if(r.unit === 'weekday'){
    let i = 0;
    while(i < n){ dt.setDate(dt.getDate() + 1); const w = dt.getDay(); if(w !== 0 && w !== 6) i++; }
  }
  return iso(dt);
}
/* ---------------- 時間計測 ---------------- */
const pad2 = n => String(n).padStart(2, '0');
const nowHM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const hm2min = s => { const [h, m] = (s || '0:0').split(':').map(Number); return h * 60 + m; };
function spanSec(e){ let d = hm2min(e.end) - hm2min(e.start); if(d < 0) d += 1440; return d * 60; }
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  const min = Math.floor(sec / 60);
  if(!min) return `${sec} s`;
  const hr = Math.round(sec / 36) / 100;            // 0.01時間まで
  return `${min} m / ${hr} h`;
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
}
const totalSec = k => (k.times || []).reduce((a, e) => a + (e.sec || 0), 0);
const runSec = k => k.timer ? (Date.now() - k.timer.t0) / 1000 : 0;
const runningCard = () => allCards().find(x => x.card.timer);
function toggleTimer(cid){
  const k = findCard(cid)?.card; if(!k) return;
  if(k.timer){ stopTimer(k); }
  else {
    const r = runningCard();
    if(r && r.card !== k) stopTimer(r.card);   // 同時にひとつだけ計測する
    k.times ||= [];
    k.timer = {date:today(), start:nowHM(), t0:Date.now()};
    if(k.fold) k.fold.time = false;
  }
  save(); render();
}
function stopTimer(k){
  if(!k.timer) return;
  const sec = Math.max(1, Math.round(runSec(k)));
  (k.times ||= []).push({id:uid(), date:k.timer.date, start:k.timer.start, end:nowHM(), sec});
  delete k.timer;
}
const allTimes = () => allCards().flatMap(x => (x.card.times || []).map(e => ({...x, e})));
/* 計測中の表示を毎秒更新（再描画はしない） */
setInterval(() => {
  const r = runningCard(); if(!r) return;
  document.querySelectorAll(`[data-elapsed="${r.card.id}"]`).forEach(el => el.textContent = fmtClock(runSec(r.card)));
  document.querySelectorAll(`[data-runtot="${r.card.id}"]`).forEach(el =>
    el.textContent = fmtDur(totalSec(r.card) + runSec(r.card)));
}, 1000);

/* 完了時: 繰り返しなら次回へ送る。なければ done にする */
function setDone(cid, checked){
  const f = findCard(cid); if(!f) return;
  const k = f.card;
  touch(k);

  /* 繰り返しタスク: 今回の分は完了として残し、次回分を新しく作る */
  if(checked && k.repeat && k.repeat.unit){
    const nk = JSON.parse(JSON.stringify(k));
    nk.id = uid();
    nk.done = false; delete nk.doneAt;
    nk.when = '';                                   // 「いつやる？」を既定に戻す
    (nk.subs || []).forEach(s => { s.id = uid(); s.done = false; delete s.doneAt; });
    (nk.logs || []).forEach(g => g.id = uid());
    delete nk.times; delete nk.timer;                // 時間ログは今回の分に残す
    nk.created = today(); nk.updated = today();
    nk.doneCount = (k.doneCount || 0) + 1;
    if(nk.memoReg){ nk.memoNo = nextNo('memoNo'); nk.memoDate = today(); }
    if(nk.quote && nk.quote.registered){ nk.quote.no = nextQuoteNo(); nk.quote.date = today(); }
    if(nk.read && nk.read.registered){
      nk.read.no = Math.max(0, ...allCards().map(x => +((x.card.read && x.card.read.no) || 0))) + 1;
      nk.read.date = today();
    }
    /* 日付を次回へ（基準は開始日、開始〜期限の日数はそのまま） */
    const anchor = nk.start || nk.due || today();
    let nx = nextDate(anchor, nk.repeat), guard = 0;
    while(nx <= today() && guard++ < 800) nx = nextDate(nx, nk.repeat);
    if(nk.start){
      const span = nk.due ? diffDays(nk.start, nk.due) : null;
      nk.start = nx;
      if(span !== null) nk.due = addDays(nx, span);
    } else if(nk.due) nk.due = nx;

    /* 今回の分は完了記録として残す（繰り返しは外す） */
    if(k.timer) stopTimer(k);
    k.done = true;
    k.doneAt = today();
    k.doneCount = (k.doneCount || 0) + 1;
    delete k.repeat;

    f.col.cards.splice(f.idx, 0, nk);               // 次回分を同じ位置に差し込む
    save(); render();
    return;
  }

  k.done = checked;
  if(checked){ k.doneAt = today(); if(k.timer) stopTimer(k); }
  else delete k.doneAt;
  save(); render();
}

/* 今日: 期限が今日以前、または開始日が今日以前（＝もう着手できる） */
function isToday(k){
  if(k.done) return false;
  const t = today();
  return (!!k.due && k.due <= t) || (!!k.start && k.start <= t);

/* 期限までの残り日数の表示 */
function leftLabel(due){
  const d = diffDays(today(), due);
  if(d === 0) return '今日まで';
  return d > 0 ? `あと${d}日` : `${-d}日超過`;
}
const notStarted = k => !k.done && k.start && k.start > today();
function isOver(d){ return d < today(); }
/* 今日以前が期限なら赤 */
const dueHot = d => !!d && d <= today();
const fmtHM = t => (t || '').slice(0, 5);
/* 日付＋時刻（時刻がなければ日付だけ） */
function fmtDT(d, t){ return fmtDue(d) + (t ? ' ' + fmtHM(t) : ''); }
function fmtDue(d){
  if(d === today()) return '今日';
  if(d === todayPlus(1)) return '明日';
  if(d === todayPlus(-1)) return '昨日';
  const [y, m, dd] = d.split('-');
  return `${(+y !== new Date().getFullYear()) ? y + '-' : ''}${m}-${dd}`;
}

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) S = JSON.parse(raw); }catch(e){}
  if(!S || !S.boards) S = seed();
  S.contacts ||= [];
  S.tagColors ||= {};
  /* 以前の文字色が中に残っているメモを、現在の色に合わせる（一度だけ） */
  if(!S.inkFix2){
    const OLD = ['#4e4749','#3c3638','#4f4941','#57514a','#575052','#5f5951','#5f585a',
                 '#22201d','#241f17','#2b2426','#4a453e','#4a4446','#5c564c','#5c5456'];
    const toHex = c => {
      const m = (c || '').match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
      if(!m) return (c || '').toLowerCase();
      return '#' + [1,2,3].map(i => (+m[i]).toString(16).padStart(2,'0')).join('');
    };
    const strip = html => {
      if(!html || !/color/i.test(html)) return html;
      const d = document.createElement('div');
      d.innerHTML = html;
      d.querySelectorAll('[style*="color"]').forEach(n => {
        if(OLD.includes(toHex(n.style.color))){
          n.style.removeProperty('color');
          if(!n.getAttribute('style')) n.removeAttribute('style');
        }
      });
      d.querySelectorAll('font[color]').forEach(n => {
        if(OLD.includes((n.getAttribute('color') || '').toLowerCase())) n.removeAttribute('color');
      });
      return d.innerHTML;
    };
    S.boards.forEach(b => {
      Object.keys(b.days || {}).forEach(dd => b.days[dd] = strip(b.days[dd]));
      (b.cols || []).forEach(c => c.cards.forEach(k => {
        ['title','body','note','head'].forEach(f => { if(k[f]) k[f] = strip(k[f]); });
        (k.subs || []).forEach(s => ['title','head','note'].forEach(f => { if(s[f]) s[f] = strip(s[f]); }));
        if(k.quote){ ['text','memo'].forEach(f => { if(k.quote[f]) k.quote[f] = strip(k.quote[f]); }); }
        if(k.read && k.read.memo) k.read.memo = strip(k.read.memo);
        (k.logs || []).forEach(g => { if(g.text) g.text = strip(g.text); });
      }));
    });
    S.inkFix2 = true;
    save();
  }
  /* Private フォルダと Daily Memo ボードを一度だけ用意する */
  if(!S.dailySetup){
    S.folders ||= [];
    let pf = S.folders.find(f => f.name === 'Private');
    if(!pf){ pf = {id:uid(), name:'Private', open:true}; S.folders.push(pf); }
    if(!S.boards.some(b => b.daily)){
      S.boards.push({id:uid(), name:'Daily Memo', color:'#7b52c0', folder:pf.id,
        daily:true, days:{}, cols:[]});
    }
    S.dailySetup = true;
  }
  /* ボードカラーのブルーを淡く（一度だけ） */
  if(!S.blueFix){
    S.boards.forEach(b => { if(b.color === '#2f6fe0') b.color = '#6f9ad8'; });
    S.blueFix = true;
  }
  /* WORK / Private / その他 の3フォルダを用意する（足りないものだけ） */
  S.folders ||= [];
  ['WORK', 'Private', 'その他'].forEach(n => {
    if(!S.folders.some(f => f.name === n)) S.folders.push({id:uid(), name:n, open:true});
  });
  /* 中身のない Quote / Read を掃除する（Card ボタンの不具合で付いたもの）*/
  if(!S.emptyQFix2){
    /* registered が付いていても、中身が空なら消す */
    const blank = o => !o
      || (!plain(o.text || '').trim() && !(o.author || '').trim() && !(o.source || '').trim()
      && !(o.page || '').trim() && !plain(o.memo || '').trim() && !(o.media || '').trim()
      && !(o.flags || []).length);
    S.boards.forEach(b => (b.cols || []).forEach(c => c.cards.forEach(k => {
      if(k.type !== 'quote' && blank(k.quote)) delete k.quote;
      if(k.type !== 'read' && blank(k.read)) delete k.read;
    })));
    S.emptyQFix2 = true;
  }
  /* Read の「買った」を「購入した」に（一度だけ） */
  if(!S.rflagFix){
    S.boards.forEach(b => (b.cols || []).forEach(c => c.cards.forEach(k => {
      if(k.read && Array.isArray(k.read.flags))
        k.read.flags = k.read.flags.map(f => f === '買った' ? '購入した' : f);
    })));
    S.rflagFix = true;
  }
  /* ボードカラーのグリーンを黄緑寄りのくすんだ色に（一度だけ） */
  if(!S.greenFix){
    S.boards.forEach(b => { if(b.color === '#4f8f57') b.color = '#84a05a'; });
    S.greenFix = true;
  }
  /* メモカードのタイトルを Memo のタイトル欄へ移す（一度だけ） */
  if(!S.noteTitleFix){
    S.boards.forEach(b => b.cols.forEach(c => c.cards.forEach(k => {
      if(k.type === 'note' && plain(k.title).trim() && !(k.bodyTitle || '').trim()){
        k.bodyTitle = plain(k.title).trim();
        k.title = '';
      }
    })));
    S.noteTitleFix = true;
  }
  /* 作成日がないカードを一度だけ補完する */
  if(!S.createdFix){
    S.boards.forEach(b => b.cols.forEach(c => c.cards.forEach(k => {
      k.created ||= k.start || k.doneAt || today();
      k.updated ||= k.created;
    })));
    S.createdFix = true;
  }
  /* 完了済みで日付がないものを一度だけ補完する */
  if(!S.doneAtFix){
    let changed = false;
    S.boards.forEach(b => b.cols.forEach(c => c.cards.forEach(k => {
      if(k.type === 'task'){
        if(k.done && !k.doneAt){ k.doneAt = today(); changed = true; }
        (k.subs || []).forEach(s => { if(s.done && !s.doneAt){ s.doneAt = k.doneAt || today(); changed = true; } });
      }
    })));
    S.doneAtFix = true;
    if(changed) save();
  }
  /* 既存データにもプリセットのボードを一度だけ追加する */
  if(!S.presetBoards){
    PRESET_BOARDS.forEach(([n, c]) => {
      if(!S.boards.some(b => (b.name || '').trim() === n))
        S.boards.push({id:uid(), name:n, color:c, cols:[
          {id:uid(), title:'ToDo', w:288, cards:[]},
          {id:uid(), title:'進行中', w:288, cards:[]},
          {id:uid(), title:'完了', w:288, cards:[]},
        ]});
    });
    S.presetBoards = true;
    save();
  }
}

/* HTML本文の簡易サニタイズ */
function clean(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  d.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n => n.remove());
  d.querySelectorAll('img').forEach(n => {
    const src = n.getAttribute('src') || '';
    if(!/^(data:image\/|https?:)/i.test(src)) n.remove();
  });
  d.querySelectorAll('a').forEach(n => {
    const href = n.getAttribute('href') || '';
    if(!/^https?:/i.test(href)) n.removeAttribute('href');
    else { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener'); }
  });
  d.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => {
    if(/^on/i.test(a.name) || (a.name === 'href' && /javascript:/i.test(a.value))) n.removeAttribute(a.name);
  }));
  return d.innerHTML;
}

const NAVALL = ['search','tasks','times','done','read','quote','cards'];
let dragNav = null;
/* サイドバー上部メニューの並び替え */
function renderNavOrder(){
  const box = document.getElementById('navList');
  if(!box) return;
  /* このアプリで使わないメニューは隠す */
  NAVALL.forEach(k => {
    const el = box.querySelector(`[data-nav="${k}"]`);
    if(el) el.style.display = NAVKEYS.includes(k) ? '' : 'none';
  });
  S.navOrder = (S.navOrder || []).filter(k => NAVKEYS.includes(k));
  NAVKEYS.forEach(k => { if(!S.navOrder.includes(k)) S.navOrder.push(k); });
  S.navOrder.forEach(k => {
    const el = box.querySelector(`[data-nav="${k}"]`);
    if(el) box.appendChild(el);
  });
  box.querySelectorAll('[data-nav]').forEach(el => {
    const key = el.dataset.nav;
    el.ondragstart = ev => {
      dragNav = key;
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', key);
      ev.stopPropagation();
      setTimeout(() => el.classList.add('dragging'), 0);
    };
    el.ondragend = () => { dragNav = null; renderNavOrder(); };
    el.ondragover = ev => {
      if(!dragNav || dragNav === key) return;
      ev.preventDefault(); ev.stopPropagation();
      const r = el.getBoundingClientRect();
      const after = ev.clientY > r.top + r.height / 2;
      el.classList.toggle('dropn', !after);
      el.classList.toggle('dropn-b', after);
    };
    el.ondragleave = () => el.classList.remove('dropn', 'dropn-b');
    el.ondrop = ev => {
      ev.preventDefault(); ev.stopPropagation();
      el.classList.remove('dropn', 'dropn-b');
      const src = dragNav || ev.dataTransfer.getData('text/plain');
      dragNav = null;
      if(!src || src === key || !NAVKEYS.includes(src)) return;
      const r = el.getBoundingClientRect();
      const after = ev.clientY > r.top + r.height / 2;
      const o = S.navOrder.filter(x => x !== src);
      const at = o.indexOf(key);
      o.splice(after ? at + 1 : at, 0, src);
      S.navOrder = o;
      save(); renderNavOrder();
    };
  });
}

  const list = document.getElementById('boardList');

  [...list.querySelectorAll('[data-board]'), ...pinBox.querySelectorAll('[data-board]')].forEach(el => {

    el.ondragover = ev => {

      ev.preventDefault(); ev.stopPropagation(); el.classList.add('dropb');
    };
    el.ondragleave = () => el.classList.remove('dropb');
