/* ---------------- 時間ログ ---------------- */
const PIEC = ['#3d6fe0', '#4f8f57', '#d98324', '#7b52c0', '#c9899a', '#c9a227', '#5b6577', '#c0392b'];
let timeSel = null;      // 表示中の日（null = 今日）
let timeAll = false;     // すべての記録を表示
let pieRange = 'day';    // day | week | month | year
let calMonth = null;     // 'YYYY-MM'

/* ボード別に合計する */
function byBoard(list){
  const m = [];
  list.forEach(i => {
    /* Notes では出典（本のタイトル）ごとにまとめる */
    const R = (APP === 'note' && i.card.read) ? i.card.read : null;
    const id = R ? ((R.source || '').trim() || '—') : i.board.id;
    const nm = R ? ((R.source || '').trim() || plain(i.card.title).trim() || '無題') : i.board.name;
    let g = m.find(x => x.id === id);
    if(!g) m.push(g = {id, name:nm, color:R ? '' : (i.board.color || ''), sec:0});
    g.sec += i.e.sec || 0;
  });
  m.forEach((g, n) => g.color = g.color || PIEC[n % PIEC.length]);
  return m.sort((a, b) => b.sec - a.sec);
}
/* ドーナツ円グラフ（依存なしのSVG） */
function donut(data, size){
  const total = data.reduce((a, d) => a + d.sec, 0);
  const r = size / 2, ir = r * 0.6, cx = r, cy = r;
  if(!total) return '';
  if(data.length === 1) return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${(r+ir)/2}" fill="none"
      stroke="${data[0].color}" stroke-width="${r-ir}"><title>${esc(data[0].name)}</title></circle></svg>`;
  let a0 = -Math.PI / 2;
  const arcs = data.map(d => {
    const a1 = a0 + 2 * Math.PI * d.sec / total;
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const P = (a, rad) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
    const path = `M${P(a0, r)}A${r} ${r} 0 ${big} 1 ${P(a1, r)}L${P(a1, ir)}A${ir} ${ir} 0 ${big} 0 ${P(a0, ir)}Z`;
    a0 = a1;
    return `<path d="${path}" fill="${d.color}"><title>${esc(d.name)} ${fmtDur(d.sec)}</title></path>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}
/* 期間の判定とラベル */
function inRange(date, sel, range){
  if(!date) return false;
  if(range === 'day') return date === sel;
  if(range === 'month') return date.slice(0, 7) === sel.slice(0, 7);
  if(range === 'year') return date.slice(0, 4) === sel.slice(0, 4);
  const s = iso(weekStart(parse(sel)));
  return date >= s && date <= addDays(s, 6);
}
function rangeLabel(sel, range){
  const [y, m, d] = sel.split('-');
  if(range === 'day') return `${+m}/${+d}（${WD[parse(sel).getDay()]}）`;
  if(range === 'month') return `${y}年${+m}月`;
  if(range === 'year') return `${y}年`;
  const s = iso(weekStart(parse(sel))), e = addDays(s, 6);
  return `${+s.slice(5,7)}/${+s.slice(8)} 〜 ${+e.slice(5,7)}/${+e.slice(8)}`;
}
/* 積み上げ棒グラフ用のデータ */
function barCols(all, sel, range){
  let keys = [];
  if(range === 'year'){
    const y = sel.slice(0, 4);
    for(let m = 1; m <= 12; m++){
      const k = `${y}-${pad2(m)}`;
      keys.push({label:`${m}`, pick:d => (d || '').slice(0, 7) === k});
    }
  } else {
    let days = [];
    if(range === 'month'){
      const [y, m] = sel.split('-').map(Number);
      const last = new Date(y, m, 0).getDate();
      for(let i = 1; i <= last; i++) days.push(`${sel.slice(0,7)}-${pad2(i)}`);
    } else if(range === 'week'){
      const s = iso(weekStart(parse(sel)));
      for(let i = 0; i < 7; i++) days.push(addDays(s, i));
    } else {
      for(let i = 6; i >= 0; i--) days.push(addDays(sel, -i));
    }
    keys = days.map(dd => ({label:String(+dd.slice(8)), day:dd, pick:d => d === dd}));
  }
  const rowsIn = all.filter(i => keys.some(k => k.pick(i.e.date)));
  const boards = byBoard(rowsIn);
  const cols = keys.map(k => {
    const rows = all.filter(i => k.pick(i.e.date));
    const parts = boards.map(b => ({
      color:b.color, name:b.name,
      sec:rows.filter(r => r.board.id === b.id).reduce((a, r) => a + (r.e.sec || 0), 0),
    })).filter(p => p.sec);
    return {label:k.label, day:k.day, parts, total:parts.reduce((a, p) => a + p.sec, 0)};
  });
  return {cols, boards};
}
const axisLabel = v => !v ? '0' : (v % 3600 ? `${Math.round(v/60)}分` : `${v/3600}h`);
/* 積み上げ棒グラフ */
function barChart(cols, sel){
  const n = cols.length;
  const max = Math.max(1, ...cols.map(c => c.total));
  const step = max <= 1800 ? 600 : max <= 3600 ? 900 : max <= 4*3600 ? 3600 : Math.ceil(max/4/3600)*3600;
  const top = Math.ceil(max / step) * step;
  const padL = 54, padR = 10, padT = 16, padB = 26;
  const bw = n > 20 ? 14 : n > 10 ? 22 : 30, gap = n > 20 ? 6 : 12;
  const W = Math.max(560, padL + padR + n * (bw + gap));
  const H = 216, innerH = H - padT - padB;
  const X = i => padL + i * (bw + gap) + gap / 2;
  let grid = '';
  for(let v = 0; v <= top; v += step){
    const y = padT + innerH - (v / top) * innerH;
    grid += `<line x1="${padL-4}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eeeae9"/>
      <text x="${padL-8}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#a7a0a2">${axisLabel(v)}</text>`;
  }
  const bars = cols.map((c, i) => {
    let y = padT + innerH, s = '';
    c.parts.forEach(p => {
      const h = (p.sec / top) * innerH; y -= h;
      s += `<rect x="${X(i)}" y="${y.toFixed(1)}" width="${bw}" height="${Math.max(1,h).toFixed(1)}"
        fill="${p.color}" rx="2"><title>${esc(p.name)} ${fmtDur(p.sec)}</title></rect>`;
    });
    const isSel = c.day && c.day === sel;
    s += `<text x="${X(i)+bw/2}" y="${H-8}" text-anchor="middle" font-size="10"
      fill="${isSel?'var(--accent)':'#8b8285'}" font-weight="${isSel?'700':'400'}">${esc(c.label)}</text>`;
    if(c.total) s += `<text x="${X(i)+bw/2}" y="${(y-5).toFixed(1)}" text-anchor="middle"
      font-size="9" fill="#a7a0a2">${fmtDur(c.total)}</text>`;
    if(c.day) s = `<g style="cursor:pointer" data-barday="${c.day}">${s}</g>`;
    return s;
  }).join('');
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMid meet"
    style="max-width:${W}px">${grid}${bars}</svg>`;
}
/* カレンダー（marks: {日付: ツールチップ}／allLabel: すべて表示ボタンの文言） */
/* ---------------- 日本の祝日 ---------------- */
const holCache = {};
function jpHolidays(y){
  if(holCache[y]) return holCache[y];
  const H = {};
  const set = (m, d, n) => { if(d >= 1) H[`${y}-${pad2(m)}-${pad2(d)}`] = n; };
  /* ○月の第 n 月曜 */
  const nthMon = (m, n) => {
    const first = new Date(y, m - 1, 1).getDay();
    return 1 + ((8 - first) % 7) + (n - 1) * 7;
  };
  set(1, 1, '元日');
  set(1, nthMon(1, 2), '成人の日');
  set(2, 11, '建国記念の日');
  if(y >= 2020) set(2, 23, '天皇誕生日');
  /* 春分・秋分（1980〜2099 の近似式） */
  set(3, Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), '春分の日');
  set(4, 29, y >= 2007 ? '昭和の日' : 'みどりの日');
  set(5, 3, '憲法記念日');
  set(5, 4, y >= 2007 ? 'みどりの日' : '国民の休日');
  set(5, 5, 'こどもの日');
  if(y >= 2003) set(7, nthMon(7, 3), '海の日'); else set(7, 20, '海の日');
  if(y >= 2016) set(8, 11, '山の日');
  set(9, nthMon(9, 3), '敬老の日');
  set(9, Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4)), '秋分の日');
  set(10, nthMon(10, 2), y >= 2020 ? 'スポーツの日' : '体育の日');
  set(11, 3, '文化の日');
  set(11, 23, '勤労感謝の日');
  if(y <= 2018) set(12, 23, '天皇誕生日');
  /* 国民の休日（前後を祝日に挟まれた平日） */
  Object.keys(H).slice().forEach(k => {
    const d2 = addDays(k, 2);
    if(H[d2] && !H[addDays(k, 1)] && parse(addDays(k, 1)).getDay() !== 0)
      H[addDays(k, 1)] = '国民の休日';
  });
  /* 振替休日（日曜と重なったら次の平日） */
  Object.keys(H).slice().forEach(k => {
    if(parse(k).getDay() !== 0) return;
    let n2 = addDays(k, 1);
    while(H[n2]) n2 = addDays(n2, 1);
    H[n2] = '振替休日';
  });
  return holCache[y] = H;
}
const holName = d => d ? (jpHolidays(+d.slice(0, 4))[d] || '') : '';

function calendarHTML(marks, sel, cm, allOn, allLabel){
  const [y, m] = cm.split('-').map(Number);
  const lead = new Date(y, m - 1, 1).getDay(), last = new Date(y, m, 0).getDate();
  let cells = '';
  for(let i = 0; i < lead; i++) cells += `<span class="cd out"></span>`;
  for(let dd = 1; dd <= last; dd++){
    const key = `${cm}-${pad2(dd)}`;
    const wd = (lead + dd - 1) % 7;
    const hn = holName(key);
    const cls = hn || wd === 0 ? 'sun' : wd === 6 ? 'sat' : '';
    cells += `<button class="cd ${cls} ${key===sel?'sel':''} ${key===today()?'tdy':''}" data-cal="${key}"
      title="${hn ? esc(hn) + (marks[key] ? ' ・ ' : '') : ''}${marks[key] ? esc(marks[key]) : (hn ? '' : 'なし')}"
      >${dd}${marks[key]?'<i></i>':''}</button>`;
  }
  return `<div class="cal">
    <div class="cal-h"><button data-cm="-1">‹</button><b>${y}年${m}月</b><button data-cm="1">›</button></div>
    <div class="cal-w">${WD.map((x, i) =>
      `<span class="${i===0?'sun':i===6?'sat':''}">${x}</span>`).join('')}</div>
    <div class="cal-g">${cells}</div>
    <div class="cal-f"><button data-cal="${today()}">今日</button>
      ${allLabel ? `<button id="calAll" class="${allOn?'on':''}">${allLabel}</button>` : ''}</div>
  </div>`;
}

/* 計測記録をあとから直す */
function timeEdit(rect, cid, eid){
  const k = findCard(cid)?.card; if(!k) return;
  const e = (k.times || []).find(x => x.id === eid); if(!e) return;
  const mins = Math.round((e.sec || 0) / 60);
  const p = popup(Math.max(20, rect.left - 40), rect.bottom + 6, `<div class="dpanel" style="width:252px">
    <h4>記録を編集</h4>
    <div class="drow"><label>日にち</label><input type="date" id="teD" value="${e.date || ''}"></div>
    <div class="drow"><label>開始</label><input type="time" id="teS" value="${e.start || ''}"></div>
    <div class="drow"><label>終了</label><input type="time" id="teE" value="${e.end || ''}"></div>
    <div class="drow"><label>合計(分)</label><input type="number" id="teM" min="0" step="1" value="${mins}"></div>
    <div class="hint">開始・終了を変えると合計を計算します。<br>合計だけを直接入れることもできます。</div>
    <div class="dfoot"><button id="teDel" style="color:#c0392b">削除</button>
      <button id="teOK">OK</button></div>
  </div>`);
  const $ = id => p.querySelector('#' + id);
  const calc = () => {
    const s = $('teS').value, t = $('teE').value;
    if(!s || !t) return;
    const [sh, sm] = s.split(':').map(Number), [eh, em] = t.split(':').map(Number);
    let d = (eh * 60 + em) - (sh * 60 + sm);
    if(d < 0) d += 24 * 60;
    $('teM').value = d;
  };
  $('teS').onchange = calc;
  $('teE').onchange = calc;
  $('teDel').onclick = () => {
    if(!confirm('この記録を削除しますか？')) return;
    k.times = (k.times || []).filter(x => x.id !== eid);
    save(); p.remove(); render();
  };
  $('teOK').onclick = () => {
    e.date = $('teD').value || e.date;
    e.start = $('teS').value;
    e.end = $('teE').value;
    e.sec = Math.max(0, Math.round((+$('teM').value || 0) * 60));
    touch(k); save(); p.remove(); render();
  };
}

function renderTimes(){
  const t = document.getElementById('pageTitle');
  t.disabled = true; t.oninput = null; t.style.color = '';
  const sel = timeSel || today();
  calMonth ||= sel.slice(0, 7);
  t.value = timeAll ? `${TIMELB}（すべて）` : `${TIMELB} ${sel === today() ? '｜今日' : '｜' + sel}`;

  let all = allTimes();
  if(timeClient && !S.boards.some(b => b.id === timeClient)) timeClient = '';
  if(timeClient) all = all.filter(i => i.board.id === timeClient);
  if(q){
    const s = q.toLowerCase();
    all = all.filter(i => {
      const R = i.card.read || {};
      return (plain(i.card.title) + ' ' + i.board.name + ' ' +
        (R.author || '') + ' ' + (R.source || '') + ' ' + (R.media || ''))
        .toLowerCase().includes(s);
    });
  }
  let items = timeAll ? all.slice() : all.filter(i => i.e.date === sel);
  items.sort((a, b) => APP === 'note'
    ? ((a.e.date || '').localeCompare(b.e.date || '') || (a.e.start || '').localeCompare(b.e.start || ''))
    : ((b.e.date || '').localeCompare(a.e.date || '') || (b.e.start || '').localeCompare(a.e.start || '')));

  const grand = all.reduce((a, i) => a + (i.e.sec || 0), 0);
  const selSec = all.filter(i => i.e.date === sel).reduce((a, i) => a + (i.e.sec || 0), 0);
  const pieList = all.filter(i => inRange(i.e.date, sel, pieRange));
  const pieData = byBoard(pieList);
  const pieTotal = pieData.reduce((a, d) => a + d.sec, 0);
  const {cols} = barCols(all, sel, pieRange);

  const isNote = APP === 'note';
  if(isNote){
    S.timeColsN ||= [104, 130, 190, 84, 74, 74, 96];
  } else {
    S.timeCols ||= [104, 150, 74, 74, 96, 62, 240];
  }
  const W = isNote ? S.timeColsN : S.timeCols;
  if(!isNote){
    if(W.length < 6) W[5] = 62;
    if(W.length < 7) W[6] = 240;
  }
  const tcOf = () => isNote
    ? `${W[0]}px ${W[1]}px ${W[2]}px ${W[3]}px ${W[4]}px ${W[5]}px ${W[6]}px 1fr 26px`
    : `${W[0]}px ${W[1]}px ${W[6]}px ${W[2]}px ${W[3]}px ${W[4]}px ${W[5]}px 1fr 26px`;
  /* Read メモの情報 */
  const rInfo = k => {
    if(k.book){
      const B = k.book;
      return {author:(B.author || '').trim(), source:(B.title || '').trim(),
        media:(B.media || '').trim()};
    }
    const R = k.read || {};
    const M = readMeta(k);
    return {author:M.author, source:M.source, media:(R.media || '').trim()};
  };
  document.getElementById('topActions').innerHTML = '';

  document.getElementById('view').innerHTML = `
    <div class="tools">
      <input class="search" id="q" placeholder="${isNote ? '著者・出典で絞り込み…' : 'タスク名・Client 名で絞り込み…'}" value="${esc(q)}">
      ${isNote ? '' : clientSelect('timeCl', timeClient)}
      <div class="seg">${[['day','日'],['week','週'],['month','月'],['year','年']]
        .map(([k, l]) => `<button data-pr="${k}" class="${pieRange===k?'on':''}">${l}</button>`).join('')}</div>
      <span style="color:var(--muted);font-size:12.5px">${rangeLabel(sel, pieRange)}</span>
    </div>
    <div class="tlrow">
      ${calendarHTML(Object.fromEntries(Object.entries(all.reduce((o, i) => {
          o[i.e.date] = (o[i.e.date] || 0) + (i.e.sec || 0); return o;
        }, {})).map(([k2, v]) => [k2, fmtDur(v)])), sel, calMonth, timeAll, 'すべての記録')}
      <div class="chartbox" style="flex:1 1 340px;margin:0">
        <h5>${pieRange === 'year' ? '月ごと' : '日ごと'}の積み上げ ・ ${esc(rangeLabel(sel, pieRange))}
          ${pieRange === 'day' ? '（直近7日）' : ''}</h5>
        ${barChart(cols, sel)}
      </div>
      <div class="pie" style="flex:0 1 330px;margin:0;flex-wrap:wrap">
        ${pieTotal ? donut(pieData, 128) : ''}
        <div style="flex:1;min-width:130px">
          <h5>${isNote ? '出典 別' : 'Client 別'} ・ 計 ${fmtDur(pieTotal)}</h5>
          ${pieTotal ? `<div class="lg">${pieData.map(dd => `<div>
              <i style="background:${dd.color}"></i>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(dd.name)}</span>
              <b>${fmtDur(dd.sec)}</b><small>${Math.round(dd.sec / pieTotal * 100)}%</small>
            </div>`).join('')}</div>`
          : `<div class="nodata">この期間の記録はありません</div>`}
        </div>
      </div>
    </div>
    <div class="sum">
      <span>${sel === today() ? '今日' : sel} <b>${fmtDur(selSec)}</b></span>
      <span>${esc(rangeLabel(sel, pieRange))} <b>${fmtDur(pieTotal)}</b></span>
      <span>合計 <b>${fmtDur(grand)}</b>（${all.length}件）</span>
    </div>
    ${(() => {
      const dayB = byBoard(all.filter(i => i.e.date === sel));
      return dayB.length ? `<div class="daysum">
        <span class="ds-lb">${sel === today() ? '今日' : sel} の ${isNote ? '出典' : 'Client'} 別</span>
        ${dayB.map(g => `<span class="ds-i"><i style="background:${g.color}"></i>
          ${esc(g.name)} <b>${fmtDur(g.sec)}</b></span>`).join('')}
      </div>` : '';
    })()}
    ${items.length ? `<div class="ttable" style="--tc:${tcOf()}">
      ${isNote
        ? `<div class="trow head"><span>日にち<i class="rz" data-rzc="0" title="ドラッグで幅を変更"></i></span>
            <span>著者<i class="rz" data-rzc="1" title="ドラッグで幅を変更"></i></span>
            <span>出典<i class="rz" data-rzc="2" title="ドラッグで幅を変更"></i></span>
            <span>媒体<i class="rz" data-rzc="3" title="ドラッグで幅を変更"></i></span>
            <span>開始<i class="rz" data-rzc="4" title="ドラッグで幅を変更"></i></span>
            <span>終了<i class="rz" data-rzc="5" title="ドラッグで幅を変更"></i></span>
            <span style="text-align:right">合計<i class="rz" data-rzc="6" title="ドラッグで幅を変更"></i></span>
            <span></span><span></span></div>`
        : `<div class="trow head"><span>日にち<i class="rz" data-rzc="0" title="ドラッグで幅を変更"></i></span>
            <span>Client<i class="rz" data-rzc="1" title="ドラッグで幅を変更"></i></span>
            <span>タスク<i class="rz" data-rzc="6" title="ドラッグで幅を変更"></i></span>
            <span>開始<i class="rz" data-rzc="2" title="ドラッグで幅を変更"></i></span>
            <span>終了<i class="rz" data-rzc="3" title="ドラッグで幅を変更"></i></span>
            <span style="text-align:right">合計<i class="rz" data-rzc="4" title="ドラッグで幅を変更"></i></span>
            <span style="text-align:center">報告<i class="rz" data-rzc="5" title="ドラッグで幅を変更"></i></span>
            <span></span><span></span></div>`}
      ${items.map((i, n) => {
        const prev = items[n - 1];
        const newDay = timeAll && (!prev || prev.e.date !== i.e.date);
        const dayRows = all.filter(x => x.e.date === i.e.date);
        const daySec = dayRows.reduce((a, x) => a + (x.e.sec || 0), 0);
        const bs = byBoard(dayRows);
        return `${newDay ? `<div class="trow sub"><span>${i.e.date ? fmtDue(i.e.date) : '日付なし'}</span>
          <span style="grid-column:2/7">${i.e.date ? i.e.date + ' ' + WD[parse(i.e.date).getDay()] + '曜' : ''}
            ${bs.map(g => `<span class="bsum"><i style="background:${g.color}"></i>${esc(g.name)} <b>${fmtDur(g.sec)}</b></span>`).join('')}</span>
          <span class="d">${fmtDur(daySec)}</span><span style="grid-column:8/10"></span></div>` : ''}
        ${isNote ? (() => {
          const r = rInfo(i.card);
          const ttl = plain(i.card.title).trim();
          return `<div class="trow">
            <span class="dt">${i.e.date ? i.e.date : '—'}</span>
            <span class="nm" title="${esc(r.author)}">${esc(r.author) || '<span style="color:#c4bcbe">—</span>'}</span>
            <span class="nm" data-goto="${i.board.id}" title="${esc(r.source || ttl)}">${
              r.source ? '『' + esc(r.source) + '』' : (esc(ttl) || '<span style="color:#c4bcbe">—</span>')}</span>
            <span class="tm" style="text-align:left">${esc(r.media) || '—'}</span>
            <span class="tm" data-tmedit="${i.card.id}|${i.e.id}" style="cursor:pointer">${i.e.start || '--:--'}</span>
            <span class="tm" data-tmedit="${i.card.id}|${i.e.id}" style="cursor:pointer">${i.e.end || '--:--'}</span>
            <span class="d" data-tmedit="${i.card.id}|${i.e.id}" style="cursor:pointer" title="タップで編集">${fmtDur(i.e.sec)}</span>
            <span></span>
            <button class="x" data-tmdel="${i.card.id}|${i.e.id}">×</button>
          </div>`;
        })() : `<div class="trow">
          <span class="dt">${i.e.date ? i.e.date : '—'}</span>
          <span class="bd"><span style="${i.board.color?`color:${i.board.color}`:''}">▦</span> ${esc(i.board.name)}</span>
          <span class="nm" data-goto="${i.board.id}" title="${esc(plain(i.card.title))}">${clean(i.card.title) || '無題'}</span>
          <span class="tm" data-tmedit="${i.card.id}|${i.e.id}" style="cursor:pointer">${i.e.start || '--:--'}</span>
          <span class="tm" data-tmedit="${i.card.id}|${i.e.id}" style="cursor:pointer">${i.e.end || '--:--'}</span>
          <span class="d" data-tmedit="${i.card.id}|${i.e.id}" style="cursor:pointer" title="クリックで編集">${fmtDur(i.e.sec)}</span>
          ${needsReport(i.board)
            ? `<button class="repbtn ${i.e.report==='check'?'ok':''}" data-rep="${i.card.id}|${i.e.id}"
                title="${i.e.report==='check'?'報告済み（クリックで戻す）':'要報告（クリックで報告済みに）'}">${i.e.report==='check'?'✓':'🕐'}</button>`
            : `<span class="repnone">-</span>`}
          <span></span>
          <button class="x" data-tmdel="${i.card.id}|${i.e.id}">×</button>
        </div>`}`;
      }).join('')}
    </div>` : `<div class="empty">${timeAll ? 'まだ計測した記録がありません' : 'この日の記録はありません'}<br>
      <span style="font-size:12px">タスクの「▶」を押すと時間の記録が始まります</span></div>`}`;

  const v = document.getElementById('view');
  const qi = document.getElementById('q');
  wireSearchInput(qi, (val, p) => { q = val; renderTimes();
    const nn = document.getElementById('q'); if(nn){ nn.focus(); nn.setSelectionRange(p, p); } });
  const tcl = document.getElementById('timeCl');
  if(tcl) tcl.onchange = e => { timeClient = e.target.value; renderTimes(); };
  v.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { pieRange = b.dataset.pr; renderTimes(); });
  v.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    timeSel = b.dataset.cal; calMonth = timeSel.slice(0, 7); timeAll = false; renderTimes(); });
  v.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => {
    const [y, m] = calMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + (+b.dataset.cm), 1);
    calMonth = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; renderTimes(); });
  const ca = document.getElementById('calAll');
  if(ca) ca.onclick = () => { timeAll = !timeAll; renderTimes(); };
  v.querySelectorAll('[data-barday]').forEach(g => g.onclick = () => {
    timeSel = g.dataset.barday; calMonth = timeSel.slice(0, 7); timeAll = false; renderTimes(); });
  /* 列幅ドラッグ */
  const table = v.querySelector('.ttable');
  v.querySelectorAll('[data-rzc]').forEach(h => h.onmousedown = ev => {
    ev.preventDefault(); ev.stopPropagation();
    if(!table) return;
    const i = +h.dataset.rzc, x0 = ev.clientX, w0 = W[i];
    h.classList.add('act'); document.body.style.cursor = 'col-resize';
    const move = e => {
      W[i] = Math.min(520, Math.max(52, Math.round(w0 + e.clientX - x0)));
      table.style.setProperty('--tc', tcOf());
    };
    const up = () => {
      document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
      h.classList.remove('act'); document.body.style.cursor = ''; save();
    };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });
  v.querySelectorAll('[data-tmedit]').forEach(el => el.onclick = () => {
    const [cid, eid] = el.dataset.tmedit.split('|');
    timeEdit(el.getBoundingClientRect(), cid, eid);
  });
  v.querySelectorAll('[data-rep]').forEach(el => el.onclick = () => {
    const [cid, eid] = el.dataset.rep.split('|');
    const e = findCard(cid).card.times.find(x => x.id === eid);
    e.report = e.report === 'check' ? '' : 'check';
    save(); renderTimes();
  });
  v.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => { view = {type:'board', id:el.dataset.goto}; render(); });
  v.querySelectorAll('[data-tmdel]').forEach(el => el.onclick = () => {
    const [cid, eid] = el.dataset.tmdel.split('|');
    const k = findCard(cid).card;
    k.times = k.times.filter(x => x.id !== eid); save(); render();
  });
}

/* ---------------- Daily Memo（日付ごとのメモ） ---------------- */
let dailySel = null, dailyMonth = null;
let dailyAll = false;
function renderDaily(b){
  b.days ||= {};
  const sel = dailySel || today();
  dailyMonth ||= sel.slice(0, 7);
  const marks = {};
  Object.entries(b.days).forEach(([dd, v]) => {
    const t = plain(v).trim();
    if(t) marks[dd] = t.slice(0, 40);
  });
  (b.cols && b.cols[0] ? b.cols[0].cards : []).forEach(k => {
    if(k.day) marks[k.day] = (marks[k.day] || '') || `${plain(k.title).trim() || 'カード'}`;
  });
  /* カードは1つの列にまとめ、日付で振り分ける */
  if(!b.cols || !b.cols.length) b.cols = [{id:uid(), title:'Daily', w:288, cards:[]}];
  const col = b.cols[0];
  const dayCards = col.cards.filter(k => (k.day || '') === sel
    && !(k.type === 'task' && k.done) && !k.parent);
  const cardDays = new Set(col.cards.map(k => k.day).filter(Boolean));
  const allDays = [...new Set([
    ...Object.keys(b.days).filter(dd => plain(b.days[dd]).trim() || (b.days[dd] || '').includes('<img')),
    ...cardDays])].sort((x, y) => y.localeCompare(x));
  const recent = allDays.slice(0, 14);

  document.getElementById('view').innerHTML = `
    <div class="dailywrap">
      <div class="dailyside">
        ${calendarHTML(marks, sel, dailyMonth, false, '')}
        ${pinListHTML(b.id)}
      </div>
      <div class="dailymain">
        ${dailyAll ? `
        <div class="daily-h">
          <b>All</b><span>すべての記録</span>
          <button class="btn" id="dailyOne" style="margin-left:auto;padding:4px 12px;font-size:12px">今日へ</button>
        </div>
        ${allDays.length ? allDays.map(dd => `
          <div class="dayblock">
            <div class="db-h"><b>${dd}</b><span>${WD[parse(dd).getDay()]}曜</span>
              ${dd === today() ? '<span class="dl-today">今日</span>' : ''}
              ${weatherHTML(b, dd)}
              <button class="btn db-open" data-cal="${dd}">開く</button></div>
            ${plain(b.days[dd] || '').trim() || (b.days[dd] || '').includes('<img')
              ? `<div class="body dailybody" contenteditable="true" data-daily="${dd}"
                   data-ph="今日のこと…">${clean(b.days[dd] || '')}</div>` : ''}
            ${col.cards.filter(k => (k.day || '') === dd && !(k.type === 'task' && k.done)).length
              ? `<div class="dailycards"><div class="drop">${col.cards
                  .filter(k => (k.day || '') === dd && !(k.type === 'task' && k.done))
                  .map(cardHTML).join('')}</div></div>` : ''}
          </div>`).join('') : `<div class="empty">まだ記録がありません</div>`}
        ` : `
        <div class="daily-h">
          <b>${sel}</b><span>${WD[parse(sel).getDay()]}曜</span>
          ${sel === today() ? '<span class="dl-today">今日</span>' : ''}
          ${weatherHTML(b, sel)}
          <button class="btn" id="dailyAllBtn" style="margin-left:auto;padding:4px 12px;font-size:12px">All</button>
          <button class="btn" id="dailyToday" style="padding:4px 12px;font-size:12px">今日へ</button>
        </div>
        <div class="dailycards">
          <button class="add" data-add="${col.id}" style="margin-bottom:10px">＋ New</button>
          <div class="drop" data-drop="${col.id}">${dayCards.map(cardHTML).join('')}</div>
        </div>
        `}
      </div>
    </div>`;

  const v = document.getElementById('view');
  v.querySelectorAll('[data-cal]').forEach(el => el.onclick = () => {
    dailySel = el.dataset.cal; dailyMonth = dailySel.slice(0, 7); dailyAll = false; renderDaily(b); });
  v.querySelectorAll('[data-cm]').forEach(el => el.onclick = () => {
    const [y, m] = dailyMonth.split('-').map(Number);
    const dd = new Date(y, m - 1 + (+el.dataset.cm), 1);
    dailyMonth = `${dd.getFullYear()}-${pad2(dd.getMonth()+1)}`; renderDaily(b); });
  v.querySelectorAll('[data-wx]').forEach(el => el.onclick = () => {
    const [k, dd] = el.dataset.wx.split('|');
    const cur = wxOf(b, dd);
    const i = cur.indexOf(k);
    if(i >= 0) cur.splice(i, 1); else cur.push(k);
    if(!cur.length) delete b.weather[dd];
    save(); el.classList.toggle('on', i < 0);
  });
  const dt = document.getElementById('dailyToday');
  if(dt) dt.onclick = () => { dailySel = today(); dailyMonth = dailySel.slice(0, 7); renderDaily(b); };
  const da = document.getElementById('dailyAllBtn');
  if(da) da.onclick = () => { dailyAll = true; renderDaily(b); };
  const d1 = document.getElementById('dailyOne');
  if(d1) d1.onclick = () => {
    dailyAll = false; dailySel = today(); dailyMonth = dailySel.slice(0, 7); renderDaily(b);
  };
  v.querySelectorAll('[data-daily]').forEach(ed => {
    wireRich(ed);
    ed.onblur = () => { saveBody(ed); hideRT(); };
  });
  v.querySelectorAll('[data-add]').forEach(el => el.onclick = e => addMenu(e, el.dataset.add));
  wireCards(v); wireDnD(v);
}

/* ---------------- Quote / Read の一覧ページ ---------------- */
let readSel = null, readAll = true, readMonth = null, qRandId = null;
let colFilter = {quote:{author:'', source:''}, read:{author:'', source:''}};
function renderCollection(kind){
  const t = document.getElementById('pageTitle');
  t.disabled = true; t.oninput = null; t.style.color = '';
  document.getElementById('topActions').innerHTML = '';

  const notEmpty = x => {
    const o = kind === 'quote' ? x.card.quote : x.card.read;
    return !!o && !!(plain(o.text || '').trim() || (o.author || '').trim()
      || (o.source || '').trim() || plain(o.memo || '').trim() || (o.media || '').trim()
      || (o.flags || []).length);
  };
  const has = kind === 'quote' ? hasQuote : hasRead;
  const dOf = x => (kind === 'quote' ? x.card.quote.date : x.card.read.date) || x.card.created || '';
  let all = allCards().filter(x => has(x.card) && notEmpty(x));
  if(q){
    const s = q.toLowerCase();
    all = all.filter(x => {
      const k = x.card, o = kind === 'quote' ? k.quote : k.read;
      return [plain(o.text), o.author, o.source, o.media, plain(o.memo),
        plain(k.title), x.board.name, (o.flags || []).join(' ')]
        .join(' ').toLowerCase().includes(s);
    });
  }

  /* 著者・出典での絞り込み */
  const cf = colFilter[kind];
  const metaOf = x => kind === 'quote' ? quoteMeta(x.card) : readMeta(x.card);
  const authors = [...new Set(all.map(x => metaOf(x).author).filter(Boolean))].sort();
  const sources = [...new Set(all.map(x => metaOf(x).source).filter(Boolean))].sort();
  if(cf.author) all = all.filter(x => metaOf(x).author === cf.author);
  if(cf.source) all = all.filter(x => metaOf(x).source === cf.source);

  /* Read Log は日付で絞り込める */
  let items = all.slice(), cal = '';
  if(kind === 'read'){
    const sel = readSel || today();
    readMonth ||= sel.slice(0, 7);
    const marks = {};
    all.forEach(x => { const dd = dOf(x); if(dd) marks[dd] = ((+(marks[dd] || '0').replace('件','')) + 1) + '件'; });
    cal = calendarHTML(marks, sel, readMonth, readAll, 'すべて表示');
    if(!readAll) items = all.filter(x => dOf(x) === sel);
    t.value = readAll ? 'Read Memo' : `Read Memo ｜${sel}`;
  } else {
    t.value = 'Quotes';
  }
  items.sort((a, b) => dOf(b).localeCompare(dOf(a)));

  /* Quotes は左にランダム1枚 */
  let rand = '';
  if(kind === 'quote' && items.length){
    let cur = items.find(x => x.card.id === qRandId);
    if(!cur){ cur = items[Math.floor(Math.random() * items.length)]; qRandId = cur.card.id; }
    rand = `<div class="qrand">
      <h5>Random</h5>
      <div class="dcard">
        <div class="dcard-h">${cardTgl('quote', cur.card, cur.card.quote && cur.card.quote.card)}</div>
        ${quoteCardHTML(cur.card)}
      </div>
      <div class="dsrc" style="margin-top:10px">
        <span style="${cur.board.color?`color:${cur.board.color}`:''}">▦</span>
        <b data-goto="${cur.board.id}">${esc(cur.board.name)}</b>
      </div>
      <div class="dbtn" style="margin-top:12px">
        <button class="btn" id="qRandNext">Next Quote</button>
      </div>
    </div>`;
  }

  document.getElementById('view').innerHTML = `
    <div class="tools">
      <input class="search" id="q" placeholder="${kind === 'quote' ? '引用文・著者・出典' : '本のタイトル・著者・感想'}で検索…" value="${esc(q)}">
      <span class="gsel"><label>著者</label>
        <select id="fAuthor"><option value="">すべて</option>
          ${authors.map(a2 => `<option ${cf.author===a2?'selected':''}>${esc(a2)}</option>`).join('')}</select></span>
      <span class="gsel"><label>出典</label>
        <select id="fSource"><option value="">すべて</option>
          ${sources.map(s2 => `<option ${cf.source===s2?'selected':''}>${esc(s2)}</option>`).join('')}</select></span>
      <span style="color:var(--muted);font-size:12.5px">${items.length} 件</span>
      ${cf.author || cf.source ? `<button class="btn" id="fClear" style="padding:4px 10px;font-size:12px">絞り込みを解除</button>` : ''}
    </div>
    ${rand ? `${rand}<div class="qlist">${listHTML(items, kind)}</div>`
      : cal ? `<div class="tlrow readrow">${cal}
          <div class="rdmain">${listHTML(items, kind)}</div></div>`
      : listHTML(items, kind)}`;

  const qi = document.getElementById('q');
  wireSearchInput(qi, (val, p) => { q = val; renderCollection(kind);
    const n = document.getElementById('q'); if(n){ n.focus(); n.setSelectionRange(p, p); } });
  const v = document.getElementById('view');
  v.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    readSel = b.dataset.cal; readMonth = readSel.slice(0, 7); readAll = false; renderCollection(kind); });
  v.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => {
    const [y, m] = readMonth.split('-').map(Number);
    const dd = new Date(y, m - 1 + (+b.dataset.cm), 1);
    readMonth = `${dd.getFullYear()}-${pad2(dd.getMonth()+1)}`; renderCollection(kind); });
  const ca = document.getElementById('calAll');
  if(ca) ca.onclick = () => { readAll = !readAll; renderCollection(kind); };
  const fa = document.getElementById('fAuthor'), fs2 = document.getElementById('fSource');
  if(fa) fa.onchange = e => { cf.author = e.target.value; qRandId = null; renderCollection(kind); };
  if(fs2) fs2.onchange = e => { cf.source = e.target.value; qRandId = null; renderCollection(kind); };
  const fc = document.getElementById('fClear');
  if(fc) fc.onclick = () => { cf.author = ''; cf.source = ''; qRandId = null; renderCollection(kind); };
  const rn = document.getElementById('qRandNext');
  if(rn) rn.onclick = () => {
    if(items.length > 1){
      let n; do { n = items[Math.floor(Math.random() * items.length)]; } while(n.card.id === qRandId);
      qRandId = n.card.id;
    }
    renderCollection(kind);
  };
  wireCards(v);
  v.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
    view = {type:'board', id:el.dataset.goto}; render(); });
}
function listHTML(items, kind){

    <span style="font-size:12px">ボードの「＋ New」から作れます</span></div>`;

        <span style="margin-left:auto">${cardTgl(kind, k,
          kind === 'quote' ? (k.quote && k.quote.card) : (k.read && k.read.card))}</span>
      </div>
      ${citeLine(k)}
      ${canTime(k) ? `<div class="meta meta2">${timerChip(k)}</div>` : ''}

    </div>`;

/* 検索欄: 日本語変換中は再描画しない */
function wireSearchInput(el, onChange){
  let composing = false, timer = null;
  const fire = () => {
    clearTimeout(timer);
    timer = setTimeout(() => onChange(el.value, el.selectionStart), 200);
  };
  el.addEventListener('compositionstart', () => { composing = true; clearTimeout(timer); });
  el.addEventListener('compositionend', () => { composing = false; fire(); });
  el.addEventListener('input', () => { if(!composing) fire(); });
  el.addEventListener('keydown', e => { if(e.key === 'Enter' && !composing){ clearTimeout(timer); onChange(el.value, el.selectionStart); } });
}

/* ---------------- Search（横断検索） ---------------- */
let searchQ = '', searchAuthor = '', searchSource = '';
function cardHay(k){
  const Q = k.quote || {}, R = k.read || {};
  return [plain(k.title), k.bodyTitle, plain(k.body), plain(k.note), plain(k.head),
    ...(k.subs || []).map(s => [plain(s.title), plain(s.head), plain(s.note)].join(' ')),
    ...(k.tags || []).map(t => '#' + t),
    plain(Q.text), Q.author, Q.source, plain(Q.memo),
    R.author, R.source, R.media, plain(R.memo), (R.flags || []).join(' '),
    ...(k.logs || []).map(g => (g.who || '') + ' ' + plain(g.text)),
  ].filter(Boolean).join(' ').toLowerCase();
}
function excerpt(text, s, len){
  const t = (text || '').replace(/\s+/g, ' ').trim();
  const i = t.toLowerCase().indexOf(s);
  if(i < 0) return esc(t.slice(0, len));
  const from = Math.max(0, i - 24), to = Math.min(t.length, i + s.length + len);
  return (from ? '…' : '') + esc(t.slice(from, i)) +
    `<mark>${esc(t.slice(i, i + s.length))}</mark>` + esc(t.slice(i + s.length, to)) + (to < t.length ? '…' : '');
}
function renderSearch(){
  const t = document.getElementById('pageTitle');
  t.value = 'Search'; t.disabled = true; t.oninput = null; t.style.color = '';
  document.getElementById('topActions').innerHTML = '';
  const s = searchQ.trim().toLowerCase();
  const authors = usedList('author'), sources = usedList('source');
  const aOf = k => [(k.quote && k.quote.author) || '', (k.read && k.read.author) || ''].map(v => v.trim());
  const sOf = k => [(k.quote && k.quote.source) || '', (k.read && k.read.source) || ''].map(v => v.trim());
  const active = s || searchAuthor || searchSource;

  let cards = [], days = [];
  if(active){
    cards = allCards().filter(x => !s || cardHay(x.card).includes(s));
    if(searchAuthor) cards = cards.filter(x => aOf(x.card).includes(searchAuthor));
    if(searchSource) cards = cards.filter(x => sOf(x.card).includes(searchSource));
    if(s && !searchAuthor && !searchSource){
      S.boards.filter(b => b.daily).forEach(b => {
        Object.entries(b.days || {}).forEach(([dd, v]) => {
          if(plain(v).toLowerCase().includes(s)) days.push({board:b, date:dd, text:plain(v)});
        });
      });
    }
    days.sort((a, b) => b.date.localeCompare(a.date));
  }

  document.getElementById('view').innerHTML = `
    <div class="searchbox">
      <input id="sq" class="bigsearch" placeholder="すべてのメモ・タスク・引用・本から探す…" value="${esc(searchQ)}">
      <div class="sfilters">
        <span class="gsel"><label>著者</label>
          <select id="sAuthor"><option value="">すべて</option>
            ${authors.map(a2 => `<option ${searchAuthor===a2?'selected':''}>${esc(a2)}</option>`).join('')}</select></span>
        <span class="gsel"><label>出典</label>
          <select id="sSource"><option value="">すべて</option>
            ${sources.map(s2 => `<option ${searchSource===s2?'selected':''}>${esc(s2)}</option>`).join('')}</select></span>
        ${searchAuthor || searchSource || searchQ ? `<button class="btn" id="sClear"
          style="padding:4px 12px;font-size:12px">条件をクリア</button>` : ''}
        ${active ? `<span class="shits">${cards.length + days.length} 件</span>` : ''}
      </div>
    </div>
    ${!active ? `<div class="empty">タイトル・本文・Memo・Quote・Read・Message Log・サブタスク・タグ、<br>
      Daily Memo の本文まで、すべてを対象に探します</div>`
    : (cards.length + days.length) ? `
      ${days.length ? `<div class="sgrp"><div class="sgrp-h">Daily Memo</div>
        ${days.map(dy => `<div class="sday" data-openday="${dy.board.id}|${dy.date}">
          <b>${dy.date} ${WD[parse(dy.date).getDay()]}</b>
          <span>${excerpt(dy.text, s, 120)}</span></div>`).join('')}</div>` : ''}
      ${cards.length ? `<div class="sgrp"><div class="sgrp-h">カード</div>
        <div class="colwrap">${cards.map(x => `<div class="card ${x.card.type} colitem">
          <div class="col-src">
            <span data-goto="${x.board.id}" style="cursor:pointer">
              <span style="${x.board.color?`color:${x.board.color}`:''}">▦</span> ${esc(x.board.name)}</span>
            <span>／ ${esc(x.col.title)}</span>
            ${x.card.day ? `<span>／ ${x.card.day}</span>` : ''}
          </div>
          ${cardBodyHTML(x.card)}
        </div>`).join('')}</div></div>` : ''}`
    : `<div class="empty">みつかりませんでした</div>`}`;

  const si = document.getElementById('sq');
  wireSearchInput(si, (val, p) => {
    searchQ = val;
    renderSearch();
    const n = document.getElementById('sq'); if(n){ n.focus(); n.setSelectionRange(p, p); }
  });
  si.focus();
  si.setSelectionRange(si.value.length, si.value.length);
  const sa = document.getElementById('sAuthor'), ss = document.getElementById('sSource');
  if(sa) sa.onchange = e => { searchAuthor = e.target.value; renderSearch(); };
  if(ss) ss.onchange = e => { searchSource = e.target.value; renderSearch(); };
  const sc = document.getElementById('sClear');
  if(sc) sc.onclick = () => { searchQ = ''; searchAuthor = ''; searchSource = ''; renderSearch(); };
  const v = document.getElementById('view');
  wireCards(v);
  v.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
    view = {type:'board', id:el.dataset.goto}; render(); });
  v.querySelectorAll('[data-openday]').forEach(el => el.onclick = () => {
    const [bid, dd] = el.dataset.openday.split('|');
    dailySel = dd; dailyMonth = dd.slice(0, 7);
    view = {type:'board', id:bid}; render();
  });
}

/* ---------------- 画像とURLカード ---------------- */
/* 貼り付けた画像は縮小して埋め込む（保存容量を抑えるため） */
function insertImage(file, el){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1200;
      let { width: w, height: hh } = img;
      if(w > max){ hh = Math.round(hh * max / w); w = max; }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = hh;
      cv.getContext('2d').drawImage(img, 0, 0, w, hh);
      const url = cv.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.82);
      el.focus();
      document.execCommand('insertHTML', false, `<img src="${url}" style="width:60%"><br>`);
      /* 画像の下（次の行）にカーソルを置く */
      const imgs = el.querySelectorAll('img');
      const last = imgs[imgs.length - 1];
      if(last){
        const r2 = document.createRange();
        let after = last.nextSibling;
        if(!after || after.nodeName === 'BR'){
          const holder = document.createTextNode('');
          last.parentNode.insertBefore(holder, after ? after.nextSibling : null);
          after = holder;
        }
        r2.setStart(after, 0); r2.collapse(true);
        const s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(r2);
      }
      saveBody(el);
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
/* URL を貼ったらリンクカードにする */
function urlCardHTML(url){
  let host = url;
  try{ host = new URL(url).hostname.replace(/^www\./, ''); }catch(e){}
  const fav = `https://icons.duckduckgo.com/ip3/${host}.ico`;
  return `<a class="ulink" href="${esc(url)}" target="_blank" rel="noopener" contenteditable="false">` +
    `<img class="ufav" src="${fav}" alt="">` +
    `<span class="uinfo"><b>${esc(host)}</b><small>${esc(url)}</small></span></a>`;
}

/* ボタンから画像を挿入する */
let pendingImg = null;
document.getElementById('imgFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if(f && pendingImg){
    const el = pendingImg;
    el.focus();
    const r = document.createRange();
    r.selectNodeContents(el); r.collapse(false);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    insertImage(f, el);
  }
  pendingImg = null;
};

/* 画像の右下をドラッグしてサイズ変更 */
let ihImg = null, ihEl = null, ihDrag = false;
function imgHandle(){
  let hd = document.getElementById('imgHandle');
  if(hd) return hd;
  hd = document.createElement('div');
  hd.id = 'imgHandle';
  hd.title = 'ドラッグでサイズ変更';
  document.body.appendChild(hd);
  hd.onmousedown = ev => {
    if(!ihImg) return;
    ev.preventDefault(); ev.stopPropagation();
    ihDrag = true;
    document.body.style.cursor = 'nwse-resize';
    const box = ihImg.parentElement.getBoundingClientRect();
    const left = ihImg.getBoundingClientRect().left;
    const move = e => {
      const wpx = Math.max(40, e.clientX - left);
      const pct = Math.max(10, Math.min(100, Math.round(wpx / box.width * 100)));
      ihImg.style.width = pct + '%';
      placeHandle();
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      ihDrag = false; document.body.style.cursor = '';
      if(ihEl) saveBody(ihEl);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
  return hd;
}
function placeHandle(){
  const hd = imgHandle();
  if(!ihImg){ hd.style.display = 'none'; return; }
  const r = ihImg.getBoundingClientRect();
  hd.style.left = (r.right - 8) + 'px';
  hd.style.top = (r.bottom - 8) + 'px';
  hd.style.display = 'block';
}
function showImgHandle(img, el){ ihImg = img; ihEl = el; placeHandle(); }
function hideImgHandle(){ if(ihDrag) return; ihImg = null; ihEl = null; placeHandle(); }
document.addEventListener('scroll', () => { if(!ihDrag) hideImgHandle(); }, true);
window.addEventListener('resize', () => hideImgHandle());

}

/* ---------------- カード同士のリンク ---------------- */
const LINKICON = '<svg class="mico" viewBox="0 0 16 16"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.9.3l2-2a2.6 2.6 0 0 0-3.7-3.7l-1.1 1.1"/><path d="M9.4 6.6a2.6 2.6 0 0 0-3.9-.3l-2 2a2.6 2.6 0 0 0 3.7 3.7l1.1-1.1"/></svg>';
function cardLabel(k){
  const t = plain(k.title).trim() || (k.bodyTitle || '').trim()
    || (k.read && k.read.source ? `『${k.read.source}』` : '')
    || (k.quote && plain(k.quote.text).trim().slice(0, 20))
    || plain(k.body).trim().slice(0, 20);
  return t || '無題';
}
const linksOf = k => (k.links || []).map(id => findCard(id)).filter(Boolean);
const backlinksOf = k => allCards().filter(x => (x.card.links || []).includes(k.id));
function linkKind(k){
  if(k.type === 'quote' || (hasQuote(k) && !hasMemo(k))) return 'Quote';
  if(k.type === 'read' || hasRead(k)) return 'Read';
  if(k.type === 'task') return 'Task';
  return 'Memo';
}
function linkPreviewText(k, kind){
  if(kind === 'Quote') return plain(k.quote && k.quote.text);
  if(kind === 'Read'){
    const R = k.read || {};
    const head = [R.author, R.source ? `『${R.source}』` : ''].filter(Boolean).join(' ');
    return [head, plain(R.memo)].filter(x => (x || '').trim()).join('\n');
  }
  if(kind === 'Task'){
    const subs = (k.subs || []).map(s => '・' + plain(s.title)).join('\n');
    return [plain(k.note), plain(k.body), subs].filter(x => (x || '').trim()).join('\n');
  }
  return plain(k.body);
}
function linkCardHTML(f, back, ownerId){
  const k = f.card, kind = linkKind(k);
  const body = (linkPreviewText(k, kind) || '').trim();
  const ttl = cardLabel(k);
  return `<div class="lcard" data-jumpcard="${k.id}">
    <div class="lc-h">
      <span class="lc-kind ${kind.toLowerCase()}">${kind}</span>
      ${back ? '' : `<button class="lc-x" data-unlink="${ownerId}|${k.id}" title="リンクを外す">×</button>`}
    </div>
    <div class="lc-t">${esc(ttl)}</div>
    ${body ? `<div class="lc-p">${esc(body)}</div>` : ''}
    <div class="lc-b">▦ ${esc(f.board.name)}${k.day ? '　' + k.day : ''}</div>
  </div>`;
}
function linkSection(k){
  const outs = linksOf(k), backs = backlinksOf(k);
  if(!outs.length && !backs.length) return '';
  return `<div class="linkbox">
    ${outs.length ? `<div class="lk-h">${LINKICON} リンク</div>
      <div class="lgrid">${outs.map(f => linkCardHTML(f, false, k.id)).join('')}</div>` : ''}
    ${backs.length ? `<div class="lk-h back">← リンク元</div>
      <div class="lgrid">${backs.map(f => linkCardHTML(f, true, k.id)).join('')}</div>` : ''}
  </div>`;
}
/* リンク先を選ぶ */
function linkMenu(rect, cid){
  const k = findCard(cid)?.card; if(!k) return;
  k.links ||= [];
  let word = '';
  const draw = () => {
    document.querySelectorAll('.pop').forEach(p => p.remove());
    const s = word.trim().toLowerCase();
    let list = allCards().filter(x => x.card.id !== cid && !k.links.includes(x.card.id));
    if(s) list = list.filter(x => (cardLabel(x.card) + ' ' + cardHay(x.card)).toLowerCase().includes(s));
    list = list.slice(0, 40);
    const p = popup(rect.left - 40, rect.bottom + 6, `<div class="lpanel">
      <h4>リンクするカードを選ぶ</h4>
      <input class="tinput" id="lq" placeholder="カードを検索…" value="${esc(word)}">
      <div class="llist">${list.length ? list.map(x => `<button data-pick="${x.card.id}">
        <span>${esc(cardLabel(x.card))}</span>
        <small>▦ ${esc(x.board.name)}</small></button>`).join('')
        : '<div class="lempty">みつかりません</div>'}</div>
      ${k.links.length ? `<div class="lnow">リンク中: ${k.links.length} 件</div>` : ''}
    </div>`);
    const inp = p.querySelector('#lq');
    wireSearchInput(inp, val => { word = val; draw(); setTimeout(() => {
      const n = document.getElementById('lq'); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 0); });
    inp.focus();
    p.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      k.links = [...k.links, b.dataset.pick];
      touch(k); save(); p.remove(); render();
    });
  };
  draw();
}

/* ---------------- Cards（ランダム表示） ---------------- */
let deckId = null;
function deck(){
  const out = [];
  for(const x of allCards()){
    const k = x.card;
    if(k.memoCard) out.push({key:k.id + ':memo', kind:'memo', ...x});
    if(k.quote && k.quote.card){
      const m = quoteMeta(k);
      if(plain(k.quote.text).trim() || m.author || m.source)
        out.push({key:k.id + ':quote', kind:'quote', ...x});
    }
    if(k.read && k.read.card){
      const m = readMeta(k);
      if(m.source || m.author || plain(k.read.memo).trim())
        out.push({key:k.id + ':read', kind:'read', ...x});
    }
  }
  return out;
}
function renderCards(){
  const t = document.getElementById('pageTitle');
  t.value = 'Cards'; t.disabled = true; t.oninput = null; t.style.color = '';
  const D = deck();
  document.getElementById('topActions').innerHTML = D.length
    ? `<span style="color:var(--muted);font-size:12.5px">${D.length} 枚</span>` : '';

  if(!D.length){
    document.getElementById('view').innerHTML = `<div class="empty">
      Cards に入れたメモ・Quote がありません<br>
      <span style="font-size:12px">メモや Quote の見出しにある「🃏 Card」を押すと、ここでランダムに表示されます</span></div>`;
    return;
  }
  let cur = D.find(x => x.key === deckId);
  if(!cur){ cur = D[Math.floor(Math.random() * D.length)]; deckId = cur.key; }
  const k = cur.card;

  document.getElementById('view').innerHTML = `<div class="deck">
    <div class="dcard">
      <div class="dcard-h">${cardTgl(cur.kind, k, true)}</div>
      ${cur.kind === 'read'
        ? readCardHTML(k)
        : cur.kind === 'quote'
        ? quoteCardHTML(k)
        : k.memoReg ? memoCardHTML(k) : `<div class="qcard">
            <div class="qc-h"><span>No. ―　・　${esc(noteDate(k) || today())}　・　Memo</span></div>
            ${(k.bodyTitle || '').trim() ? `<div class="qc-ttl">${esc(k.bodyTitle)}</div>` : ''}
            <div class="qc-body">${clean(k.body) || '<span style="color:#c4bcbe">（本文なし）</span>'}</div>
          </div>`}
    </div>
    <div class="dsrc">
      <span style="${cur.board.color?`color:${cur.board.color};font-weight:700`:''}">▦ ${esc(cur.board.name)}</span>
      <b data-goto="${cur.board.id}">${esc(plain(k.title)) || '無題'}</b>
    </div>
    <div class="dbtn">
      <button class="btn" id="deckNext">Next Card</button>
    </div>
  </div>`;

  document.getElementById('deckNext').onclick = () => {
    if(D.length > 1){
      let n; do { n = D[Math.floor(Math.random() * D.length)]; } while(n.key === deckId);
      deckId = n.key;

  wireCards(document.getElementById('view'));

    el.onclick = () => { view = {type:'board', id:el.dataset.goto}; render(); });
}

/* ---------------- ファイルへ保存（Export / 自動バックアップ） ---------------- */
/* 保存先フォルダを一度選べば、以後そこへ自動で書き出します。
   ・notes-data.json          … 常に最新（上書き）
   ・notes-YYYY-MM-DD.json    … その日のスナップショット           */
let dirHandle = null, fileHandle = null, backupT = null;

function idb(){
  return new Promise(res => {
    if(!window.indexedDB) return res(null);
    let r;
    try{ r = indexedDB.open('notes-fs', 1); }catch(e){ return res(null); }
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result);
    r.onerror = () => res(null);
  });
}
/* 保存先の記憶は Notes / Tasks で別々にする */
const hkey = k => APP === 'task' ? k + '.task' : k;
async function keepH(key, val){
  key = hkey(key);
  const db = await idb(); if(!db) return;
  const st = db.transaction('h', 'readwrite').objectStore('h');
  if(val) st.put(val, key); else st.delete(key);
}
async function loadH(key){
  key = hkey(key);
  const db = await idb(); if(!db) return null;
  return new Promise(res => {
    const q = db.transaction('h', 'readonly').objectStore('h').get(key);
    q.onsuccess = () => res(q.result || null);
    q.onerror = () => res(null);
  });
}
async function ensurePerm(hd){
  if(!hd || !hd.queryPermission) return !!hd;
  let st = await hd.queryPermission({mode:'readwrite'});
  if(st !== 'granted') st = await hd.requestPermission({mode:'readwrite'});
  return st === 'granted';
}
function fileTag(){
  const el = document.getElementById('fileTag');
  if(!el) return;
  const label = dirHandle ? `→ ${dirHandle.name} フォルダ` : fileHandle ? `→ ${fileHandle.name}` : '';
  el.textContent = label;
  el.style.display = label ? '' : 'none';
}
async function writeTo(handle){
  const w = await handle.createWritable();
  await w.write(JSON.stringify(S, null, 2));
  await w.close();
}
/* 中身の量（空っぽの上書き事故を防ぐための目安） */
function dataSize(d){
  if(!d || !d.boards) return 0;
  let n = 0;
  d.boards.forEach(b => {
    (b.cols || []).forEach(c => n += (c.cards || []).length);
    Object.values(b.days || {}).forEach(v => { if(plain(v).trim()) n++; });
  });
  return n;
}
/* 保存先にある notes-data.json を読む */
async function readBackup(){
  try{
    if(!dirHandle) return null;
    if(!(await ensurePerm(dirHandle))) return null;
    const fh = await dirHandle.getFileHandle('notes-data.json');
    const txt = await (await fh.getFile()).text();
    return JSON.parse(txt);
  }catch(e){ return null; }
}
/* 保存先フォルダを選ぶ */
async function pickFolder(){
  if(window.showDirectoryPicker){
    try{
      dirHandle = await window.showDirectoryPicker({mode:'readwrite', id:'notes-export'});
      fileHandle = null;
      await keepH('dir', dirHandle); await keepH('file', null);
      fileTag();
      return true;
    }catch(e){ return false; }
  }
  if(window.showSaveFilePicker){
    try{
      fileHandle = await window.showSaveFilePicker({
        suggestedName:`notes-data.json`,
        types:[{description:'Notes データ (JSON)', accept:{'application/json':['.json']}}],
      });
      dirHandle = null;
      await keepH('file', fileHandle); await keepH('dir', null);
      fileTag();
      return true;
    }catch(e){ return false; }
  }
  return false;
}
/* 静かに最新版だけ書き戻す */
async function backupNow(force){
  try{
    if(dirHandle){
      if(!(await ensurePerm(dirHandle))) return false;
      /* いまの中身が、保存済みより極端に少ないときは書かない */
      const prev = await readBackup();
      const now = dataSize(S), was = dataSize(prev);
      if(!force && was > 0 && now < was * 0.5){
        const t = document.getElementById('savedTag');
        if(t){ t.textContent = '⚠ 中身が減っているため自動書き出しを中止しました';
               t.classList.add('on', 'err'); }
        console.warn('backup skipped:', now, '<', was);
        return false;
      }
      /* 直前の内容を notes-prev.json に退避してから上書き */
      if(prev){
        try{
          const ph = await dirHandle.getFileHandle('notes-prev.json', {create:true});
          const pw = await ph.createWritable();
          await pw.write(JSON.stringify(prev, null, 2));
          await pw.close();
        }catch(e){}
      }
      await writeTo(await dirHandle.getFileHandle('notes-data.json', {create:true}));
    } else if(fileHandle){
      if(!(await ensurePerm(fileHandle))) return false;
      await writeTo(fileHandle);
    } else return false;
    S.lastExport = today(); save(); renderSide();
    return true;
  }catch(e){ return false; }
}
/* Export ボタン: 最新版＋その日のスナップショット */
async function exportNow(){
  if(!dirHandle && !fileHandle){
    if(!(await pickFolder())) { downloadJSON(); return; }
  }
  const ok = await backupNow(true);
  if(!ok){ downloadJSON(); return; }
  let name = fileHandle ? fileHandle.name : 'notes-data.json';
  if(dirHandle){
    try{
      await writeTo(await dirHandle.getFileHandle(`notes-${today()}.json`, {create:true}));
      name = `${dirHandle.name} / notes-data.json ＋ notes-${today()}.json`;
    }catch(e){}
  }
  const tag = document.getElementById('savedTag');
  tag.textContent = `✓ ${name} に保存しました`;
  tag.classList.add('on');
  clearTimeout(savedT);
  savedT = setTimeout(() => { tag.textContent = '✓ 保存しました'; tag.classList.remove('on'); }, 2600);
}
function scheduleBackup(){
  if(!dirHandle && !fileHandle) return;
  clearTimeout(backupT);
  backupT = setTimeout(() => backupNow(), 30000);
}
function downloadJSON(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `notes-${today()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  S.lastExport = today(); save(); renderSide();
}

let rsSel = null, rsMonth = null;
function renderRight(){
  const box = document.getElementById('rsideBody');
  const sel = rsSel || today();
  rsMonth ||= sel.slice(0, 7);

  const notes = allCards().filter(x => noteLike(x.card));
  const marks = {};
  notes.forEach(x => {
    const dd = noteDate(x.card);               // No. の横の日付で紐づける
    if(dd) marks[dd] = (marks[dd] || 0) + 1;
  });
  const mk = {};
  Object.entries(marks).forEach(([k2, v]) => mk[k2] = `${v} 件`);

  const hit = notes.filter(x => noteDate(x.card) === sel);
  const label = k => esc((k.read && k.read.source ? `『${k.read.source}』` : '')
    || (k.bodyTitle || '').trim() || plain(k.title).trim());
  const preview = (k, kind) => {
    const t = kind === 'Read' ? [k.read.author, k.read.media].filter(Boolean).join('　・　') + '\n' + plain(k.read.memo)
      : kind === 'Quote' ? plain(k.quote && k.quote.text) : plain(k.body);
    return esc((t || '').trim());
  };

  box.innerHTML = `
    ${calendarHTML(mk, sel, rsMonth, false, '')}
    <div class="rs-list">
      <div class="rs-lb">${sel} ${WD[parse(sel).getDay()]}曜 に作成　${hit.length} 件</div>
      ${hit.length ? hit.map(x => {
        const k = x.card;
        const kind = k.type === 'read' || (hasRead(k) && !hasMemo(k) && !hasQuote(k)) ? 'Read'
          : k.type === 'quote' || (hasQuote(k) && !hasMemo(k)) ? 'Quote' : 'Memo';
        const ttl = label(k), pv = preview(k, kind);
        return `<div class="rs-item" data-jump="${x.board.id}|${k.id}">
          ${ttl ? `<div class="rs-t">${ttl}</div>` : ''}
          ${pv ? `<div class="rs-p">${pv}</div>` : (ttl ? '' : '<div class="rs-p" style="color:#c4bcbe">（本文なし）</div>')}
          <div class="rs-m">
            <span class="rs-kind">${kind}</span>
            <span style="${x.board.color?`color:${x.board.color}`:''}">▦</span> ${esc(x.board.name)}
          </div>
          <div class="rs-d">${noteDate(k) || '—'}${
            k.updated && k.updated !== noteDate(k) ? ` ・ Updated ${k.updated}` : ''}</div>
        </div>`;
      }).join('') : `<div class="rs-empty">この日のメモはありません</div>`}
    </div>`;

  box.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    rsSel = b.dataset.cal; rsMonth = rsSel.slice(0, 7); renderRight(); });
  box.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => {
    const [y, m] = rsMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + (+b.dataset.cm), 1);
    rsMonth = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; renderRight(); });
  box.querySelectorAll('[data-jump]').forEach(el => el.onclick = () => {
    const [bid, cid] = el.dataset.jump.split('|');
    view = {type:'board', id:bid}; render();
    setTimeout(() => {
      const card = document.querySelector(`[data-card="${cid}"]`);
      if(card){
        card.scrollIntoView({block:'center', behavior:'smooth'});
        card.classList.add('flash');
        setTimeout(() => card.classList.remove('flash'), 1600);
      }
    }, 30);
  });
}

/* 大きなデータでも安全な base64 変換 */
function toB64(buf){
  const u8 = new Uint8Array(buf); let s = '';
  for(let i = 0; i < u8.length; i += 0x8000)
    s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(s){
  const bin = atob(s), u8 = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
const subtleOK = () => !!(window.crypto && window.crypto.subtle);
async function aesKey(pass){
  if(!subtleOK()) throw new Error('この開き方では暗号化が使えません（合言葉を空にするか、https で開いてください）');
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:enc.encode('notes.sync.salt.v1'), iterations:120000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function encPack(obj){
  const json = JSON.stringify(obj);
  if(!syncCfg.pass) return {enc:false, body:json};
  if(!subtleOK()) throw new Error('この開き方では暗号化が使えません（合言葉を空にするか、https で開いてください）');
  const k = await aesKey(syncCfg.pass);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(json));
  return {enc:true, iv:toB64(iv), body:toB64(ct)};
}
async function decPack(p){
  if(!p || typeof p !== 'object') throw new Error('置き場所のデータが読めません');
  if(!p.enc) return JSON.parse(p.body || '{}');
  if(!syncCfg.pass) throw new Error('合言葉が設定されていません');
  let pt;
  try{
    const k = await aesKey(syncCfg.pass);
    pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(p.iv)}, k, fromB64(p.body));
  }catch(e){
    throw new Error(subtleOK() ? '合言葉が違います' : e.message);
  }
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---- GitHub Gist ---- */
const GH = 'https://api.github.com';
const GHFILE = 'notes-sync.json';
const ghHead = () => ({
  'authorization': 'Bearer ' + syncCfg.token,
  'accept': 'application/vnd.github+json',
  'content-type': 'application/json',
});
async function ghGet(){
  const r = await fetch(`${GH}/gists/${syncCfg.gist}`, {headers:ghHead(), cache:'no-store'});
  if(r.status === 404) throw new Error('Gist が見つかりません');
  if(r.status === 401) throw new Error('トークンが違います');
  if(!r.ok) throw new Error('取得できません（' + r.status + '）');
  const g = await r.json();
  const f = g.files && g.files[GHFILE];
  if(!f) return null;
  let txt = f.content;
  if(f.truncated && f.raw_url) txt = await (await fetch(f.raw_url, {cache:'no-store'})).text();
  try{ const d = JSON.parse(txt); return d && d.payload ? d : null; }catch(e){ return null; }
}
async function ghMsg(r){
  try{
    const j = await r.json();
    return j && j.message ? j.message : '';
  }catch(e){ return ''; }
}
async function ghPut(at, payload, ifAt){
  const cur = await ghGet();
  if(typeof ifAt === 'number' && cur && cur.at && cur.at !== ifAt) return 'conflict';
  const r = await fetch(`${GH}/gists/${syncCfg.gist}`, {method:'PATCH', headers:ghHead(),
    body:JSON.stringify({files:{[GHFILE]:{content:JSON.stringify({at, payload})}}})});
  if(r.ok) return 'ok';
  const m = await ghMsg(r);
  if(r.status === 401) throw new Error('トークンが違います');
  if(r.status === 403){
    if(/rate limit/i.test(m))
      throw new Error('GitHub の回数制限です。数分待ってからもう一度お試しください');
    throw new Error('権限がありません。トークンに gist の権限があるか確認してください' + (m ? '（' + m + '）' : ''));
  }
  if(r.status === 404) throw new Error('Gist が見つかりません（ID を確認してください）');
  throw new Error('保存できません（' + r.status + (m ? '：' + m : '') + '）');
}
async function ghCreate(){
  const r = await fetch(`${GH}/gists`, {method:'POST', headers:ghHead(),
    body:JSON.stringify({description:'Notes sync', public:false,
      files:{[GHFILE]:{content:JSON.stringify({at:0, payload:{enc:false, body:'{}'}})}}})});
  if(r.status === 401) throw new Error('トークンが違います（gist の権限が要ります）');
  if(!r.ok) throw new Error('作成できません（' + r.status + '）');
  return (await r.json()).id;
}

async function syncGet(){
  if(syncCfg.mode === 'gist') return ghGet();
  const r = await fetch(syncURL(), {headers:{'x-notes-key':syncCfg.key}, cache:'no-store'});
  if(r.status === 404) return null;
  if(r.status === 401) throw new Error('キーが違います');
  if(!r.ok) throw new Error('取得できません（' + r.status + '）');
  return r.json();
}
async function syncPut(at, payload, ifAt){
  if(syncCfg.mode === 'gist') return ghPut(at, payload, ifAt);
  const r = await fetch(syncURL(), {method:'PUT',
    headers:{'x-notes-key':syncCfg.key, 'content-type':'application/json'},
    body:JSON.stringify({at, ifAt, payload})});
  if(r.status === 409) return 'conflict';
  if(r.status === 401) throw new Error('キーが違います');
  if(!r.ok) throw new Error('保存できません（' + r.status + '）');
  return 'ok';
}

/* 置き場所から取り込む */
async function syncPull(force){
  if(!syncOn()) return false;
  const rec = await syncGet();
  if(!rec) return false;
  if(!force && rec.at <= (syncCfg.at || 0)) return false;
  const data = await decPack(rec.payload);
  if(!data || !data.boards) throw new Error('データを読めません');
  localStorage.setItem(KEY, JSON.stringify(data));
  load();                       // 足りない項目を補う（通常の読み込みと同じ処理）
  syncCfg.at = rec.at; saveSync();
  syncDirty = false;
  return true;
}
/* 置き場所へ送る */
async function syncPush(loud, force){
  if(!syncOn()){ if(loud) throw new Error('トークンと Gist ID を入れてください'); return; }
  if(syncBusy) return;
  syncBusy = true;
  try{
    const at = Date.now();
    let res = await syncPut(at, await encPack(S), syncCfg.at || 0);
    if(res === 'conflict'){
      if(!syncDirty){
        /* こちらに未送信の変更が無いので、静かに取り込む */
        await syncPull(true);
        syncBusy = false; render(); syncTag('取り込みました');
        return;
      }
      if(!loud && !force){
        /* 自動同期では何も聞かない。次の操作まで待つ */
        syncPaused = true;
        syncBusy = false;
        syncTag('ほかの端末に新しい内容があります（同期メニューで選べます）', true);
        return;
      }
      const rec = await syncGet();
      const at2 = Date.now();
      res = await syncPut(at2, await encPack(S), rec ? rec.at : 0);
      syncCfg.at = at2; saveSync();
    } else {
      syncCfg.at = at; saveSync();
    }
    syncDirty = false;
    syncTag('✓ 同期しました');
  }catch(e){
    syncBusy = false;
    syncTag('同期できません：' + errText(e), true);
    console.error('sync', e);
    if(loud) throw e;
    return;
  }
  syncBusy = false;
}
const syncLater = () => {
  if(!syncOn()) return;
  syncDirty = true;
  if(syncPaused) return;
  clearTimeout(syncT);
  syncT = setTimeout(() => { if(syncDirty) syncPush(); }, 15000);
};

/* ---------------- データ復旧 ---------------- */
function storeInfo(){
  const out = [];
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(!/^boards\.tasks/.test(k)) continue;
    const raw = localStorage.getItem(k) || '';
    let n = 0, ok = false;
    try{
      const d = JSON.parse(raw);
      ok = !!(d && d.boards);
      if(ok) d.boards.forEach(b => {
        (b.cols || []).forEach(c => n += (c.cards || []).length);
        Object.values(b.days || {}).forEach(v => { if(plain(v).trim()) n++; });
      });
    }catch(e){}
    let up = '';
    try{ const d2 = JSON.parse(raw); up = d2 && d2.lastExport ? d2.lastExport : ''; }catch(e){}
    out.push({key:k, bytes:raw.length, n, ok, cur:k === KEY, up});
  }
  return out.sort((a, b) => b.n - a.n);
}

/* ---------------- 暗証番号ロック ---------------- */
const pinHash = s => {
  let x = 5381; const t = 'notes.' + s;
  for(let i = 0; i < t.length; i++) x = ((x * 33) ^ t.charCodeAt(i)) >>> 0;
  return x.toString(36);
};
function showLock(done){
  const w = document.getElementById('lockwrap');
  const inp = document.getElementById('lockPin');
  const err = document.getElementById('lockErr');
  w.classList.add('on');
  document.body.classList.add('locked');
  setTimeout(() => inp.focus(), 60);
  const check = () => {
    if(inp.value.length < 4) return;
    if(pinHash(inp.value) === S.pin){
      w.classList.remove('on');
      document.body.classList.remove('locked');
      inp.value = ''; err.textContent = '';
      done();
    } else {
      err.textContent = '番号が違います';
      const bx = w.querySelector('.lockbox');
      bx.classList.add('shake');
      setTimeout(() => bx.classList.remove('shake'), 400);
      inp.value = ''; inp.focus();
    }
  };
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 4); check(); };
  inp.onkeydown = e => { if(e.key === 'Enter') check(); };
}

      alert('設定しました。次にこのファイルを開くときから聞かれます。');
    } else {
      if(pinHash($('pA').value) !== S.pin) return msg('番号が違います');
      delete S.pin; save(); p.remove();
      alert('ロックを解除しました。');
    }
  };
  $('pClose').onclick = () => p.remove();
}
document.getElementById('lockBtn').onclick = e =>
  pinDialog(e.currentTarget.getBoundingClientRect());
if(APP === 'task') document.getElementById('syncBtn').style.display = 'none';
document.getElementById('syncBtn').onclick = e =>
  syncDialog(e.currentTarget.getBoundingClientRect());
document.getElementById('recBtn').onclick = e =>
  recoverDialog(e.currentTarget.getBoundingClientRect());
/* 最新版を読み込み直す（スマホのキャッシュ対策） */
const hardReload = () =>
  location.replace(location.pathname + '?v=' + Date.now() + location.hash);
document.getElementById('reloadBtn').onclick = hardReload;
/* 起動して少ししたら、新しい版が出ていないか確かめる */
async function checkUpdate(){
  if(location.protocol === 'file:') return;
  try{
    const r = await fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const txt = await r.text();
    const m = txt.match(/const APPVER = '([^']+)'/);
    if(!m || m[1] === APPVER) return;
    const b = document.createElement('div');
    b.className = 'updbar';
    b.innerHTML = '新しい版があります　<button>更新する</button>';
    b.querySelector('button').onclick = hardReload;
    document.body.appendChild(b);
  }catch(e){}
}

window.addEventListener('pagehide', () => {
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
});
load();
const boot = () => {
  if(window.matchMedia('(max-width: 860px)').matches){
    S.sideHidden = true; S.rsideHidden = true;
  }
  document.title = APP_TITLE;
  const bn = document.getElementById('brandName');
  if(bn) bn.textContent = APP_TITLE;
  const tl = document.getElementById('navTimesLb');
  if(tl) tl.textContent = TIMELB;
  const kl = document.getElementById('navTasksLb');
  if(kl) kl.textContent = TASKLB;
  applySide();
  renderBanner();
  applyRight();
  if(APP === 'task'){
    view = {type:'tasks'}; filter = 'all';
  } else {
    /* 起動時は Daily Memo を開く */
    const startB = S.boards.find(b2 => b2.daily) || S.boards.find(b2 => b2.name === 'Daily Memo') || S.boards[0];
    view = {type:'board', id:startB?.id};
  }
  render();
};
loadSync();
/* ブラウザ内のデータが消えていたら、保存先のファイルから戻す */
async function rescue(){
  try{
    if(dataSize(S) > 0) return;
    const prev = await readBackup();
    if(!prev || dataSize(prev) === 0) return;
    if(confirm('ブラウザ内のデータが空でした。\n' +
      '保存先の notes-data.json（' + dataSize(prev) + ' 件）から戻しますか？')){
      S = prev; save(); render();
      alert('戻しました。');
    }
  }catch(e){}
}
const boot2 = () => {
  boot();
  setTimeout(rescue, 800);
  setTimeout(checkUpdate, 2500);
  if(syncOn()) syncPull().then(ok => { if(ok){ render(); syncTag('取り込みました'); } })
    .catch(e => syncTag('同期できません：' + e.message, true));
};
if(S.pin) showLock(boot2); else boot2();
})();
</script>
